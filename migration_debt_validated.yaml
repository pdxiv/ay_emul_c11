  - id: MIG-0032
    title: "STP (SoundTrackerPro) module format port"
    subsystem: engine/stp_file
    state: validated
    summary: >
      engine/src/stp_file.c ports Players.pas's FT.STP tracker format
      (STP_Get_Registers, Players.pas:9517-9702; InitTrackerModule's
      shared FT.STP/FT.STF branch, Players.pas:3439-3488;
      LoadTrackerModule's FT.STP branch, Players.pas:2359-2382) - fifth
      of the 13 tracker formats needed for MIG-0028's "make all 76 corpus
      files playable" effort. Only FT.STP itself is ported: FT.STF is an
      older on-disk variant that LoadTrackerModule converts to FT.STP's
      layout at load time (STFDepack/STF2STP) before ever reaching
      STP_Get_Registers, and test_corpus_76/ contains no .stf files -
      that converter is real, tracked incompleteness (not silently
      dropped). LoadTrackerModule's FT.STP branch relocates the on-disk
      pattern-pointer table by the load address (MAddr); this project's
      oracle-harness convention (and ay_player's headless loading) always
      passes MAddr=0, so that relocation is a byte-for-byte no-op here -
      confirmed by reading the Pascal source (Dec(pwrd^, 0) does nothing)
      rather than assumed; only the bounds-validation half
      (`(MLen-STP_PatternsPointer) div 2 in [0..255]`) is replicated,
      since the value it computes (STP_Init_Id) is never read by
      STP_Get_Registers or InitTrackerModule's FT.STP branch. Notable
      per-format behavior distinct from STC/FLS/GTR: STP has a persistent
      per-channel signed 16-bit portamento accumulator
      (Current_Ton_Sliding, fed by a per-tick signed Glissade value set
      via opcode $F0) that keeps sliding across ticks until reset by a
      new note, and its envelope opcode ($C0-$CF) has a sub-case ($C0
      exactly) that re-triggers the envelope WITHOUT reading a new
      envelope-lo byte - unlike STC's every-envelope-opcode-reads-a-byte
      rule. Reuses ST_Table (duplicated per this project's per-file
      convention, same table FLS/STC use).
      tools/ay_player wires STP in via the same extension-based fallback
      detection used for PT1/GTR/FLS/STC (`.stp`).
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt - verified against the literal
      Pascal source (including the MAddr=0 no-op relocation and the $C0
      envelope sub-case) rather than assumed from STC/FLS/GTR's
      precedent, per this workspace's porting-invariant to verify rather
      than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's stp_file gate: OracleHarness.pas's
      RunSTPFileTest (real Pascal, via LoadTrackerModule/STP_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_stp_file (this port,
      via stp_file_load/stp_file_make_buffer), both driving
      test_corpus_76/Girls_of_Meladze.stp for 400 buffers of 512 frames
      each (819200 bytes stereo16 PCM total) - `cmp` confirms
      byte-identical output. Also smoke-tested end-to-end through
      tools/ay_player/smoke_test.sh (extension-based detection, WAV
      export, audible content).

  - id: MIG-0033
    title: "PT2 (Pro Tracker 2) module format port"
    subsystem: engine/pt2_file
    state: validated
    summary: >
      engine/src/pt2_file.c ports Players.pas's FT.PT2 tracker format
      (PT2_Get_Registers, Players.pas:9091-9323; InitTrackerModule's
      FT.PT2 branch, Players.pas:3622-3708ish; LoadTrackerModule's FT.PT2
      branch, Players.pas:2313-2358) - sixth of the 13 tracker formats
      needed for MIG-0028's "make all 76 corpus files playable" effort.
      In this project's headless-loading convention (PPLItem=nil,
      MAddr=0 always), LoadTrackerModule's FT.PT2 branch is ALWAYS taken
      and it re-derives PT2_NumberOfPositions itself (scanning
      PT2_PositionList for the run of values <128), overwriting whatever
      byte was on disk at that header field - confirmed by reading the
      literal Pascal condition (`(PPLItem<>nil AND ext<>'.pt2') OR
      (PPLItem=nil)`, which is unconditionally true when PPLItem=nil)
      rather than assumed; its pointer-relocation half is separately
      gated on MAddr<>0 and is therefore a no-op. Notable per-format
      behavior: PT2 has real portamento/glissade machinery not present in
      STC/FLS/GTR/STP in this exact form - a signed 16-bit
      Current_Ton_Sliding accumulator fed by a per-tick Glissade value,
      with two distinct glissade modes (GlissType 1: direct semitone
      slide-to-note; GlissType 2: a computed Ton_Delta distance that
      counts down each tick until the target note is reached, with an
      "alternative Ton_Delta calc" comment in the Pascal marking a
      deliberate late-binding of Ton_Delta to avoid an error on a
      pattern's first note). Reuses PT3NoteTable_ST (same table PT1/GTR
      use) and the same round-half-to-even amplitude rounding PT1 uses
      (round_div256, duplicated per this project's per-file convention).
      tools/ay_player wires PT2 in via the same extension-based fallback
      detection used for PT1/GTR/FLS/STC/STP (`.pt2`).
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt, including the load-time
      PT2_NumberOfPositions recomputation and the two-mode portamento
      machinery - verified against the literal Pascal source rather than
      assumed from prior formats' precedent, per this workspace's
      porting-invariant to verify rather than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's pt2_file gate: OracleHarness.pas's
      RunPT2FileTest (real Pascal, via LoadTrackerModule/PT2_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_pt2_file (this port,
      via pt2_file_load/pt2_file_make_buffer), both driving
      test_corpus_76/NOR.MUS..pt2 for 400 buffers of 512 frames each
      (819200 bytes stereo16 PCM total) - `cmp` confirms byte-identical
