  - id: MIG-0028
    title: "Pro Tracker 1 (PT1) module format port"
    subsystem: engine/pt1_file
    state: validated
    summary: >
      engine/src/pt1_file.c ports Players.pas's FT.PT1 tracker format
      (InitTrackerModule's PT1 branch, PT1_Get_Registers, and the
      pattern/ornament/sample interpreter it drives) - first of 13 tracker
      formats needed to make all 76 test_corpus_76 files playable
      identically to the real Pascal codebase (only AY/YM/PT3/SNDH/VTX,
      58 of 76 files, were supported before this). Ported using PT3's
      already-validated code (engine/src/pt3_file.c) as a structural
      template (rd16() LE helper, pattern_interpreter, get_registers,
      make_buffer's SynthesizerZX50-style fixed-tick-budget loop), but
      PT1's actual byte-level semantics were independently verified
      against Players.pas's literal source text, not assumed from PT3's
      similarity - three real divergences from the PT3 template were
      found this way: (1) PT1's envelope value is a genuine native
      little-endian word read (`PWord(@Index[Address_In_Pattern])^`,
      Players.pas:11220), unlike PT3's explicit big-endian-style two-step
      hi/lo construction (Players.pas:12396-12398); (2) PT1's ornament
      offset arithmetic (`Note + Index[OrnamentPointer + Position]`) reads
      `Index` as unsigned with no signed cast, unlike the very next line's
      explicit `shortint(b) < 0` cast; (3) PT1's amplitude computation
      (`round((Volume*17+byte(Volume>7))*(b and 15)/256)`) uses FreePascal's
      round() on a real division, i.e. round-half-to-even (banker's
      rounding), not truncating integer division - replicated in C via a
      round_div256() helper using integer div/mod to reproduce tie-to-even
      exactly without floating point.
      tools/ay_player wires PT1 in via extension-based fallback detection
      (`.pt1`, format.c's detect_by_extension()) since PT1 (like most of
      the remaining 12 formats) has no Ay_Emul.fmt byte signature at all -
      real Pascal recognizes it purely via a trusted file extension
      (Players.pas:8100-8103's Tier A), so ay_player's player_load() gained
      a `path` parameter to support the same fallback.
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file, after the round-half-to-even rounding bug (found via
      this exact gate, at byte 69125/frame 17281) was root-caused and
      fixed - not assumed correct from template similarity alone.
    verification: >
      tests/oracle_diff/run_diff.sh's pt1_file gate: OracleHarness.pas's
      RunPT1FileTest (real Pascal, via LoadTrackerModule/PT1_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_pt1_file (this port,
      via pt1_file_load/pt1_file_make_buffer), both driving
      test_corpus_76/DEMON.pt1 for 400 buffers of 512 frames each (819200
      bytes stereo16 PCM total) - `cmp` confirms byte-identical output.
      Also smoke-tested end-to-end through tools/ay_player/smoke_test.sh
      (extension-based detection, WAV export, audible content).

  - id: MIG-0029
    title: "GTR (Globe Tracker) module format port"
    subsystem: engine/gtr_file
    state: validated
    summary: >
      engine/src/gtr_file.c ports Players.pas's FT.GTR tracker format
      (GTR_Get_Registers, Players.pas:11523-11698; InitTrackerModule's
      FT.GTR branch, Players.pas:3090-3157; LoadTrackerModule's FT.GTR
      pointer-normalization branch, Players.pas:2534-2546) - second of the
      13 tracker formats needed for MIG-0028's "make all 76 corpus files
      playable" effort. Ported using pt1_file.c's structure as a template
      (rd16() LE helper, pattern_interpreter/get_registers split,
      make_buffer's fixed-tick-budget loop) but GTR's own opcode stream
      and register semantics were read and implemented directly from its
      literal Pascal source rather than assumed from PT1/PT3's precedent -
      notable real differences from those formats: (1) GTR's envelope
      opcode ($C0-$CF) writes only a single byte (reg 11, envelope lo) -
      unlike PT1's genuine 16-bit envelope word - GTR never touches
      envelope hi (reg 12) at all; (2) GTR's noise register is
      accumulated via bitwise OR across all 3 channels each tick
      (`Noise := (Noise or b) and $1F`), requiring an explicit reg[6]=0
      reset before the 3 channel calls, unlike PT1's direct conditional
      overwrite; (3) several opcode ranges ($60-$6F sample-select, $70-$7F
      ornament-select, $80-$BF note-skip-count, $E1-$EF volume-set) fall
      through to a shared trailing address-increment and continue
      interpreting more opcodes in the same call, whereas others (note-set
      0..$5F, $D0-$DF, and $E0 conditionally) perform their own single
      increment and terminate immediately - this fall-through-vs-terminate
      split is data-driven per opcode range and was replicated exactly by
      tracing each Pascal branch's Inc()/exit placement; (4) the file's
      own GTR_ID[3] byte (0x10 sentinel) selects an alternate variant
      behavior in two branches (ornament-select's envelope-disable, and
      note-off's early-exit) - the validated test file
      (test_corpus_76/L.Boy_broken.gtr) has GTR_ID[3]=0x10, so this
      alternate path is exercised, not just the default one; (5) the
      ornament-offset byte computation (`j := Note + Index[...]`) is
      declared as Pascal `byte` (mod-256 wraparound), unlike PT1's
      wider-typed equivalent - replicated with explicit uint8_t arithmetic
      before the 0x5F clamp.
      tools/ay_player wires GTR in via the same extension-based fallback
      detection added for PT1 (`.gtr`, format.c's detect_by_extension()),
      since GTR has no Ay_Emul.fmt byte signature either.
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt (no divergence found this time,
      unlike PT1's rounding bug) - each of the behavioral differences from
      PT1/PT3 noted above was identified and implemented correctly before
      running the gate, by reading GTR's literal Pascal source directly
      rather than assuming template similarity, per this workspace's
      porting-invariant to verify rather than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's gtr_file gate: OracleHarness.pas's
      RunGTRFileTest (real Pascal, via LoadTrackerModule/GTR_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_gtr_file (this port,
      via gtr_file_load/gtr_file_make_buffer), both driving
      test_corpus_76/L.Boy_broken.gtr (a GTR_ID[3]=0x10 variant file) for
      400 buffers of 512 frames each (819200 bytes stereo16 PCM total) -
      `cmp` confirms byte-identical output. Also smoke-tested end-to-end
      through tools/ay_player/smoke_test.sh (extension-based detection,
      WAV export, audible content).

  - id: MIG-0030
    title: "FLS (Flash Tracker) module format port"
    subsystem: engine/fls_file
    state: validated
    summary: >
      engine/src/fls_file.c ports Players.pas's FT.FLS tracker format
      (FLS_Get_Registers, Players.pas:11337-11521; InitTrackerModule's
      FT.FLS branch, Players.pas:3216-3260; LoadTrackerModule's FT.FLS
      branch, Players.pas:2463-2532) - third of the 13 tracker formats
      needed for MIG-0028's "make all 76 corpus files playable" effort.
      Unlike PT1/GTR, FLS carries no on-disk load-address field at all, so
      LoadTrackerModule's FT.FLS branch brute-force searches for the base
      offset ("i") that makes the header's internal pointer relationships
      self-consistent: it decrements a candidate address starting from
      `FLS_OrnamentsPointer - 16`, at each candidate validating (a) the
      samples/ornaments-table geometry (a fixed $20 relationship between
      two derived offsets) and (b) that walking pattern 1's actual opcode
      stream (replicating PatternInterpreter's own note/rest-vs-envelope
      opcode-width rules) lands exactly one byte before pattern 2's
      start - only once both hold is "i" accepted and applied to fix up
      the header's on-disk pointer words in place. This heuristic (not
      merely a stored value to subtract, unlike GTR_Address) was
      transcribed byte-for-byte from the literal Pascal rather than
      reverse-engineered from first principles, since getting the search
      bounds/order wrong would silently accept a wrong base address.
      Also uses ST_Table (Players.pas:973-984), a note-frequency table
      distinct from PT3/PT1/GTR's PT3NoteTable_ST (differs at several
      entries, e.g. index 23 is 0x3F0 vs PT3's 0x3FD) - confirmed by
      direct comparison before use, not assumed shared. Notable per-format
      behavior: FLS's noise register is a direct unconditional overwrite
      per channel (`Noise := b1 and 31`), not GTR's OR-accumulate, so
      (correctly) no reg[6] reset precedes the 3 channel calls.
      tools/ay_player wires FLS in via the same extension-based fallback
      detection used for PT1/GTR (`.fls`).
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt, including exercising the
      heuristic address-detection path (not just the simpler direct-field
      case GTR needed) - verified against the literal Pascal source
      rather than assumed from PT1/GTR's precedent, per this workspace's
      porting-invariant to verify rather than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's fls_file gate: OracleHarness.pas's
      RunFLSFileTest (real Pascal, via LoadTrackerModule/FLS_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_fls_file (this port,
      via fls_file_load/fls_file_make_buffer), both driving
      test_corpus_76/SimpletonGift1.fls for 400 buffers of 512 frames each
      (819200 bytes stereo16 PCM total) - `cmp` confirms byte-identical
      output. Also smoke-tested end-to-end through
      tools/ay_player/smoke_test.sh (extension-based detection, WAV
      export, audible content).

  - id: MIG-0031
    title: "STC (SoundTracker Compiled) module format port"
    subsystem: engine/stc_file
    state: validated
    summary: >
      engine/src/stc_file.c ports Players.pas's FT.STC tracker format
      (STC_Get_Registers, Players.pas:9325-9515; InitTrackerModule's
      shared FT.STC/ST1/ST3 branch, Players.pas:3160-3214) - fourth of
