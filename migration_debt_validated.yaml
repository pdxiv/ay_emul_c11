  - id: MIG-0055
    title: "engine/mfp.c: mfp_init never seeded the four timers' DR/Cnt to 256, unlike atari.pas's Atari_InitEmu - a timer started before its data register is ever written would compute a zero delay instead of a real one"
    subsystem: engine/mfp
    state: validated
    summary: >
      Continuing the docs/mfp_reference.md line-by-line compliance check
      requested for MIG-0054, this time focused on §8's Reset Behavior
      and §5.3's timer data-register semantics, cross-checked against
      atari.pas's own Atari_InitEmu (atari.pas:1333-1382) rather than
      inferred from the hardware doc alone (since the port's job is to
      match atari.pas, which itself already departs from raw MC68901
      reset behavior in a documented, intentional way - e.g. VCR is
      seeded to $40, matching a booted-TOS state, not the hardware
      spec's raw power-on $0F). Atari_InitEmu FillChar-zeroes all four
      MFP_DT records, then explicitly sets MFP_DTA/B/C/D.DR := 256 and
      .Cnt := 256 for all four timers - not left at the FillChar'd zero.
      This mirrors expand_timer_dr's "a raw data-register byte of 0
      expands to 256" rule (itself matching real hardware's documented
      "00 reloads as 256" behavior, §5.2) applied to the STARTING state,
      before the 68000 program has ever written a data register at all.
      engine/mfp.c's mfp_init memset-zeroes the whole mfp struct and
      never seeded dr/cnt afterward, leaving both at 0 - a state
      get_mfp_delay/calc_timer_cnt never otherwise produce once any real
      write happens (expand_timer_dr guarantees a nonzero result on every
      write path), so this bug was reachable only in the narrow window
      before a timer's data register is ever explicitly written, but a
      genuine, provable divergence from atari.pas regardless: a timer
      started (via TAC/TBC/TDC) before its own data register is written
      would compute get_mfp_delay(dm, 0) = 0 on this port (an instantly-
      expiring, degenerate timer) versus atari.pas's real, nonzero
      get_mfp_delay(dm, 256).
    rationale: >
      Fixed: mfp_init now sets dr=256 and cnt=256 for all four timers
      after the existing per-timer field initialization, matching
      Atari_InitEmu's explicit values exactly. Temple_of_Asherah.sndh
      (the file this whole investigation has centered on) always writes
      its data registers before starting a timer, so this produced no
      measurable difference for it: AY register write counts (reg8/9/10)
      and level-6 assert/coalesce counts by vector are bit-for-bit
      identical before and after this fix, and the exported WAV is
      byte-identical (verified via md5sum). Kept anyway as a genuine,
      source-verified correctness fix - not every SNDH file necessarily
      configures every timer before enabling it, and this closes a real,
      provable gap regardless of whether any file in the current test
      corpus happens to exercise it. Closed as validated: the fix itself
      is narrow, source-verified against atari.pas's exact initialization
      values, and confirmed to cause zero regression via byte-identical
      WAV output and unchanged register/IRQ counts - there is nothing
      further this specific entry's own concern needs.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0 (after
      `make clean && make` in engine/, per MIG-0051's stale-object-file
      lesson).
      tools/ay_player/smoke_test.sh: 21/21 pass, all formats audible=yes
      including SNDH.
      Render performance: unchanged, ~0.33s wall-clock for a 30-second
      Temple_of_Asherah.sndh render.
      Before/after this fix, for Temple_of_Asherah.sndh (30s): AY write
      counts by register (write_apply) identical - reg8=114550,
      reg9=6394, reg10=8070 (and all others unchanged). Level-6 by
      vector identical - assert 68=5360/72=7036/77=113915, coalesce
      68=4743/72=4759/77=110453. Exported WAV confirmed byte-identical
      via md5sum before vs after. No regression, no measurable change
      for this specific file - the fix protects a code path this file
      doesn't happen to exercise.

  - id: MIG-0045
    title: "engine/src/sndh_file.c: fixed systematically byte-swapped hand-assembled 16-bit opcodes (was producing garbage/CPU runaway, not just silence)"
    subsystem: engine/sndh_file
    state: validated
    summary: >
      Root-caused MIG-0021's "SNDH never writes AY registers" symptom to a
      real, previously undiscovered bug, found by restoring the original
      test fixture (Temple_of_Asherah.sndh, confirmed by the user to play
      correctly - "great...catchy melody" - in the real interactive
      Ay_Emul GUI) and tracing both implementations directly against it.
      atari.pas's hand-assembled VBL-interrupt-handler/TRAP#1-emulation/
      startup-trampoline code writes 16-bit instruction words via a raw
      native-pointer assignment (WPtr(@bank0[addr])^:=$XXXX, no conversion
      helper) - since bank0 must end up holding genuine big-endian 68000
      bytes, and a native x86 pointer write is little-endian, every such
      literal in the Pascal source is deliberately pre-byte-swapped by the
      original author (confirmed directly: WPtr(@bank0[$1076])^:=$734E is
      labelled {RTE} in the source; Musashi's own opcode table
      (m68kdasm.c/m68kops.c) confirms the REAL RTE opcode is 0x4e73, the
      byte-swap of 0x734e). engine/src/sndh_file.c's put16() is an
      explicit, correct big-endian writer (mem[addr]=v>>8; mem[addr+1]=v) -
      the opposite convention - so every constant transcribed literally
      from a Pascal WPtr(...)^:=$XXXX assignment needed to be un-swapped
      before use, and none of them were. This corrupted essentially the
      entire hand-assembled bootstrap (20 separate 16-bit words across the
      VBL handler, TRAP#1 handler, and startup trampoline, plus 3 more at
      $448/$452/$454) - confirmed NOT a subtle issue: with the bug present,
      a from-scratch C-side trace (new engine debugging tool, not part of
      the shipped test suite) showed the CPU eventually writing exactly
      ONE AY register after ~728 million cycles and then the PC running
      away into unmapped memory ($24054318, far beyond the file's 0x80000
      mem_size) - a fetch-0xFF-as-opcode/illegal-instruction/RTE-into-
      garbage-return-address cascade, not merely "takes a long time to
      start". Fixed by un-swapping all 20 affected put16() constants
      (each now carries a comment citing this entry). Also fixed, found
      while investigating: OracleHarness.pas's RunSNDHTraceTest/
      RunSNDHWAVExportTest never called Atari_SetDefault (unlike every
      other WAV-export/file-test scenario, which explicitly sets
      AY_Freq/equivalent before use) - Atari_PrepMem's
      VBLPeriod:=round(MC68000Freq/VBLFreq) was computing round(0/200)=0 in
      this specific harness path, a real (if separate) bug in the TEST
      HARNESS, not the engine.
    rationale: >
      NOT closed as validated - the catastrophic bug (garbage/CPU runaway)
      is fixed and confirmed (full oracle-diff regression suite re-run
      clean, 52/52 pass, zero regressions in any other format; ay_player
      now renders substantial, plausible, non-clipping audio for both
      Temple_of_Asherah.sndh - 90.6% nonzero samples, max amplitude 13237/
      32768, RMS~3700 - and test_corpus_76/More_Short_Demos.sndh - 76.3%
      nonzero), but a real, still-open SECOND divergence remains: compared
      directly against RunSNDHWAVExportTest's now-correctly-initialized
      Pascal output for Temple_of_Asherah.sndh (480256 frames, matched
      frame count), the two are NOT byte-identical - the real Pascal
      engine stays silent until frame 2223, while the fixed C11 port's
      audio starts at frame 334, roughly 1889 frames earlier - and this is
      NOT a simple fixed time-shift (aligning the two start points by
      shifting the C11 stream 1889 frames later only raises the match rate
      to ~17%, not full agreement), so real CONTENT differs too, not just
      timing. Root cause of this second, smaller divergence not yet
      identified - possible candidates not yet checked: the digidrum
      sample-format-conversion gap already known-absent (see
      sndh_file.h's existing "not ported" list, shared with ym_file.c's
      equivalent YMizeSample gap), a rounding difference in
      FrqAyByFrqMC68000-equivalent fixed-point tick accumulation, or a
      genuinely different code path taken by the SNDH's own INIT routine
      this early (worth a step-by-step PC-trace diff between the two
      implementations for the first ~2223 frames specifically, not yet
      done in this session). UPDATE: that second divergence was chased at
      length across MIG-0046 through MIG-0055, culminating in correct
      melody/percussion timing (user-confirmed by ear) with a small,
      precisely-characterized residual now tracked entirely under
      MIG-0054 - no longer an open question within THIS entry. Closed as
      validated for this entry's own specific, narrow claim (the byte-
      swap fix itself), which remains real, unchanged, and fully
      verified since.
    verification: >
      Confirmed via a new standalone C trace tool (not committed to the
      repo - scratch diagnostic) driving engine/src/sndh_file.c +
      atari_emulate_step directly, watching all 14 AY registers and the
      PC's relationship to sndh_file's own mem_size: before the fix, PC
      first exceeded mem_size at cycle ~76M (one run) / the CPU wrote
      exactly one register around cycle ~728M then ran away to PC=
      0x24054318 (another run/budget) - after the fix, the first register
      write happens at cycle ~400000 (step ~2750), values are realistic
      (tone/mixer/volume registers), and PC stays within sensible, small,
      in-range addresses through the full traced range. tools/ay_player
      manually verified against both real SNDH files (Temple_of_Asherah.sndh,
      restored to the repo root by the user specifically to unblock this
      investigation, and test_corpus_76/More_Short_Demos.sndh) via WAV
      export + a Python nonzero-sample/amplitude check. Full
      tests/oracle_diff/run_diff.sh re-run clean (52/52 pass) - this fix
      is isolated to engine/src/sndh_file.c's own bootstrap-memory-image
      construction and touches no other format. tests/engine_smoke/
      test_sndh_file.c NOT yet updated to assert audible output (still
      prints the old "not yet confirmed" message) - left as-is pending the
      second divergence's resolution, so as not to overclaim `validated`
      while a real, confirmed byte-level mismatch against the oracle
      remains open.


  - id: MIG-0047
    title: "engine/src/sndh_file.c: sample-generation rate was driven by call count, not elapsed hardware cycles (SynthesizerSNDH's tick-accumulation step was never ported) - the 'song plays way too fast' bug"
    subsystem: engine/sndh_file
    state: validated
    summary: >
      After MIG-0046's atari_emulate_step fixes made cycle_count track
      real elapsed 68000 time correctly, the user reported
      Temple_of_Asherah.sndh now audibly played back far too fast through
      tools/ay_player. Measured directly (new scratch tool comparing
      tick_count growth against rendered sample count): ~1600-1900 VBL
      ticks/rendered-second instead of the correct 200Hz (TC200 tag) -
      confirmed via the SAME measurement against the oracle
      (OracleHarness.pas's RunSNDHWAVExportTest, temporarily instrumented)
      that the REAL Pascal engine renders at the exactly correct ~200
      ticks/second, ruling out "this was always this fast, just newly
      audible" and confirming a genuine, C11-port-specific regression.
      Root cause: atari.pas's SynthesizerSNDH (1717-1748) is a SNDH-
      specific WRAPPER around the generic Synthesizer_Stereo16 - before
      calling it, SynthesizerSNDH accumulates `Number_Of_Tiks.Re +=
      Odometer * FrqAyByFrqMC68000` (converting elapsed 68000 cycles into
      AY-chip ticks). engine/src/sndh_file.c's sndh_file_make_buffer
      called ay_synthesizer_stereo16 directly instead, skipping that
      accumulation step entirely - meaning `ay->number_of_tiks` (hence how
      many audio samples get emitted) was driven purely by HOW MANY TIMES
      sndh_file_make_buffer's render loop happened to call the
      synthesizer, not by how much simulated hardware time had actually
      elapsed. This bug is NOT new (it existed since SNDH was first
      ported) but was silently, coincidentally masked by MIG-0046's OTHER
      bug (Musashi's STOP early-return undercounting cycles) - that bug
      forced MANY MORE atari_emulate_step calls per unit of song-time
      (since each call covered less real cycle-time), which happened to
      also mean many more synthesizer calls (hence roughly-plausible
      sample counts) purely by accident. Fixing MIG-0046's cycle-accounting
      bug reduced the call count needed per unit of song-time, fully
      exposing this separate, pre-existing bug as audibly "way too fast"
      playback. Fixed by (1) setting f->ay.frq_ay_by_frq_z80 (a generically-
      named field already shared with the Z80/AY milestone, already
      documented in atari_emulate.h as needing this exact reuse) to
      round(ay_freq/mc68000_freq/8*4294967296) at load time, matching
      Atari_SetDefault's FrqAyByFrqMC68000 formula, and (2) changing the
      main render loop's synthesizer call from ay_synthesizer_stereo16(ay)
      to ay_synthesizer_ay(ay, f->atari.cycle_count) - the latter already
      implements SynthesizerSNDH's exact accumulation formula (it's the
      same function driving the Z80/AY DMA-sound path's on_mix_dma hook,
      MIG-0046's atari_emulate_step already calls it correctly for the
      DMA-active case) and internally calls ay_synthesizer_stereo16 itself
      once enough ticks have accumulated. The OTHER ay_synthesizer_stereo16
      call (the int_flag branch at the top of sndh_file_make_buffer) was
      already correct as-is - it mirrors MakeBufferSNDH's own top-of-
      function `Synthesizer(Buf)` call, which really is the raw,
      unwrapped Synthesizer, not SynthesizerSNDH.
    rationale: >
      NOT closed as validated - confirmed hugely improved (tick_count now
      2018 vs the oracle-matching expected 2001.1 for a 10.01s render,
      versus 15644-16777 before this fix; cycle_count growth now tracks
      ~8.08M/s, matching mc68000_freq's 8MHz almost exactly) and the
      audio-onset timing divergence narrowed dramatically (first WAV
      sample divergence vs the oracle moved from frame 334 to frame 2148,
      close to the oracle's own frame 2223 onset - MIG-0045's original
      ~1889-frame gap is now ~75 frames). But NOT byte-identical yet: 696081
      of 960512 samples (72%) still differ in a 480256-frame comparison
      against RunSNDHWAVExportTest's oracle output for
      Temple_of_Asherah.sndh - MIG-0045's residual "small, constant
      +4-cycles-per-iteration drift in one named 68000 wait loop" is still
      unresolved and likely still the dominant remaining cause, now that
      the two much larger bugs (MIG-0046's cycle-accounting, this entry's
      sample-rate-vs-cycle-count decoupling) are fixed. Full oracle-diff
      suite re-run clean (52/52 pass) and tools/ay_player's full smoke
      test re-run clean (21/21 pass, all formats "audible=yes" including
      SNDH) - zero regressions elsewhere; this bug's fix is isolated to
      engine/src/sndh_file.c and doesn't touch any other format's code
      path (ay_synthesizer_ay itself was already correct and shared/
      exercised by other tests). Closed as validated for this entry's
      own specific fix (the tick-rate/cycle-count decoupling bug), which
      remains real, unchanged, and correct since - the broader "not yet
      byte-identical" investigation continued across MIG-0048 through
      MIG-0055, now tracked under MIG-0054/MIG-0021.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0.
      tools/ay_player/smoke_test.sh: 21/21 pass (19 format checks + 2
      error-path checks), SNDH shows audible=yes. Direct tick-rate
      measurement (uncommitted scratch tool) before/after: 15644-16777
      ticks per 480256 rendered frames (10.01s) before this fix, 2018
      after (oracle: 2001.1 expected at the file's own 200Hz TC200 tag) -
      confirmed via the SAME measurement methodology applied to the real
      Pascal oracle (temporarily instrumented RunSNDHWAVExportTest,
      reverted after use) that 200Hz is genuinely correct, not an
      assumption. WAV-level comparison against the oracle for
      Temple_of_Asherah.sndh (480256 frames): first divergent sample moved
      from index 668 (frame 334) to index 4296 (frame 2148), much closer
      to the oracle's own audio onset at frame 2223, though still not
      exact and still 72% of samples differing overall past that point -
      MIG-0045's named residual drift is the most likely next lead.


  - id: MIG-0048
    title: "engine/atari_emulate.c: corrected the VBL interrupt-acceptance model - MIG-0046's synchronous mask check was based on a wrong reading of s68000interrupt; per-instruction cycle costs cleared as a suspect"
    subsystem: engine/atari_emulate
    state: validated
    summary: >
      After MIG-0047 fixed the "way too fast" tempo bug, the user reported
      playback was audibly closer but still garbled - "possibly the
      timing is still off". Continued investigating MIG-0046's residual
      gap and discovered MIG-0046's own "synchronous mask check" model was
      built on an incorrect assumption about what atari.pas:1466's
      s68000interrupt(4,-1) call actually does. This repo includes
      Starscream's real assembly source (ay_emul/star027b/Starcpu32.asm,
      previously not consulted) - reading s68000interrupt's actual
      implementation directly shows it does NOT check the CPU's interrupt
      mask at all: it only tests-and-sets a per-level PENDING bit in
      ctx(interrupts), returning 0 if this is a fresh request (bit was
      clear) or 1 if that level was already pending from an earlier,
      not-yet-serviced request. The real mask-based servicing decision
      happens entirely later, inside exec()'s own dispatch loop - exactly
      matching Musashi's natural level-triggered IRQ model. MIG-0046's
      mask-check-then-probe-execute approach was therefore modeling the
      wrong thing (confirmed empirically too: instrumented both the real
      engine, via new Debug_GetBaseVBL/Debug_GetDMASndPlay/Debug_GetDReg
      accessors added to atari.pas's interface section for this
      investigation, and the C11 port, and found BaseVBL/TickCount
      advancing in the oracle even while SR showed a fully-masked ($2700,
      mask=7) CPU - impossible under the old "accept iff mask<4" model).
      Replaced with a `vbl_irq_pending` flag on atari_emulate mirroring
      Starscream's real ctx(interrupts) pending bit: set when a *new*
      (not already-pending) VBL request is raised at a vbl_due boundary
      (advancing BaseVBL/TickCount at that point, matching
      s68000interrupt's "0 returned" case), left asserted on the m68k_bus
      IRQ line for as long as it stays pending (letting Musashi service it
      naturally whenever the mask permits, exactly like before MIG-0046's
      probe/de-assert dance - which is now removed), and cleared by
      int_ack once Musashi actually dispatches it - matching Starscream's
      own bit-clear-on-flush_interrupts. Also used this session's new
      Starscream-assembly access to directly verify (not merely assume)
      the actual per-instruction cycle costs of every opcode in the real
      DBRA-based wait loop this investigation has been centered on
      (MOVE.B (An),Dn=8, MOVE.B d16(PC),Dn=12, DBcc taken=10/not-taken=14)
      against Musashi's own tables (m68kops.c) - all match exactly,
      cleanly ruling out a per-opcode cycle-cost table mismatch as the
      cause of any remaining divergence, contrary to earlier speculation
      in MIG-0046.
    rationale: >
      NOT closed as validated. The corrected interrupt model is a genuine,
      verified accuracy improvement (matches Starscream's real semantics,
      confirmed from its own assembly source rather than inferred from the
      Pascal call site) and per-instruction cycle-cost tables are now
      positively cleared as a suspect (previously only assumed likely
      correct). Zero regressions (full oracle-diff suite 52/52,
      tools/ay_player smoke test 21/21). However this fix did NOT move
      MIG-0047's measured divergence point (still first differs at WAV
      sample index 4296 / frame 2148, ~75 frames before the oracle's
      frame-2223 onset) - deeper investigation (comparing D1, the wait
      loop's counter register, at matching TickCount boundaries between
      the real engine and the C11 port via the new Debug_GetDReg
      accessor) shows the two sides reach measurably different D1 values
      at the same tick number (e.g. tick 2: oracle D1=3534 vs C11 D1=767)
      - not a simple constant drift, but the two implementations landing
      at different points within what looks like a sequence of several
      distinct reload-and-countdown wait loops in the SNDH's own code.
      This means the remaining divergence is about precisely which
      instruction boundary the VBL interrupt lands on relative to that
      loop sequence, not a cycle-accounting or interrupt-model bug of the
      kind found and fixed so far - a substantially harder, finer-grained
      scheduling-fidelity question that would likely require replicating
      Starscream's exact instruction-by-instruction dispatch/interrupt-
      check ordering (not just its net cycle-accounting behavior) to
      close fully.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0.
      tools/ay_player/smoke_test.sh: 21/21 pass. Confirmed via direct SR
      inspection (added to a temporary trace, since removed) that the
      real engine advances BaseVBL/TickCount while SR shows a fully-masked
      CPU (mask=7), which is definitive evidence against MIG-0046's mask-
      check model and for this entry's pending-bit model. Confirmed via
      Musashi's own opcode tables (m68kops.c) cross-referenced against
      Starscream's real assembly (star027b/Starcpu32.asm) that all three
      opcodes in the wait loop under investigation ($1414/MOVE.B (A4),D2;
      $18F5.../MOVE.B d16(PC),D4; $51C9.../DBRA D1) have identical cycle
      costs in both cores. WAV-level comparison against the oracle
      unchanged from MIG-0047's measurement (first diff still at frame
      2148) - this entry is a real correctness fix and a real narrowing of
      the remaining-suspects list, not (yet) a fix for the audible
      "garbled" symptom itself. Closed as validated for this entry's own
      specific fix (the vbl_irq_pending model, and clearing per-
      instruction cycle costs as a suspect), which remains real,
      unchanged, and correct since - the broader investigation continued
      across MIG-0049 through MIG-0055, now tracked under MIG-0054/
      MIG-0021.


  - id: MIG-0049
    title: "engine/atari_emulate.c: two more real scheduling bugs found via direct per-call od/BaseVBL/D1 comparison against the oracle - VBL bookkeeping ordering, and MIG-0046's STOP-padding fix was itself wrong"
    subsystem: engine/atari_emulate
    state: validated
    summary: >
      Continued MIG-0048's investigation per the user's explicit request
      to keep going, on the working assumption that Musashi and
      Starscream are each individually correct and any remaining
      divergence must be in this port's own interfacing code - a
      hypothesis this entry's findings support. Added temporary
      Debug_GetBaseVBL/Debug_GetDReg-driven per-call (not just per-PC-
      change) tracing on both sides to directly compare od/BaseVBL/D1
      call-by-call rather than only at coarser PC-change or tick
      boundaries. Found two real bugs:
      (1) atari.pas:1466-1475 checks BOTH the "fresh request" and
      "already-pending-but-slack-exceeded" conditions in the SAME place,
      using the SAME od captured once at function entry, BEFORE `min` is
      computed - so a step where slack is already exceeded at entry
      advances BaseVBL immediately and computes that SAME step's `min`
      from the new value. This port's slack fallback instead ran AFTER
      m68k_bus_exec using post-execution od, a full step later than the
      original - confirmed via matched per-call traces: both sides agreed
      exactly for ~335 consecutive min=1 "crawl" steps, then diverged
      sharply at the exact step slack was first exceeded (oracle: od
      jumps 84000->120004 in ONE step once BaseVBL advances to 80000
      before min is computed; this port advanced BaseVBL only on the
      NEXT step). Fixed by moving the slack check to run alongside the
      fresh-request check, before min, exactly mirroring the Pascal
      structure - confirmed this closed the gap to a 2-cycle rounding
      difference (120002 vs oracle's 120004).
      (2) MIG-0046's STOP-padding fix ("pad `used` up to `min` whenever
      Musashi's STOP handler returns early") turned out to be WRONG in
      general, discovered by extending the per-call comparison much
      further (step ~1673, a large-shortfall STOP hit: requested
      min=35994, real work before STOP was only ~4380 cycles). The oracle
      reports the HONEST short count here (od advances by ~4380, NOT
      padded to the full budget) - it only reaches something padding-
      shaped on a SEPARATE, SUBSEQUENT call once the CPU naturally
      re-reaches STOP again with a smaller remaining budget. MIG-0046's
      fix over-generalized from the tiny 38-cycle first-VBL gap (which
      may just be ordinary last-instruction overshoot, not STOP-related
      padding at all) into always padding, which silently over-credited
      cycle_count on every large-shortfall STOP hit thereafter - this was
      the actual mechanism inflating cycle_count relative to real
      executed work at these later points, a subtler cause of the same
      class of problem MIG-0047 fixed differently (the sample-rate/
      call-count decoupling) elsewhere. Removed entirely - Musashi's own
      `used` is now applied directly, unpadded.
    rationale: >
      NOT closed as validated. Both fixes are real, confirmed via direct
      per-step comparison against the oracle (not inferred), and fix (1)
      demonstrably closes a large, previously-unexplained gap down to a
      2-cycle rounding difference. Zero regressions (oracle-diff 52/52,
      ay_player smoke test 21/21). However, after both fixes, the
      WAV-level comparison against the oracle for Temple_of_Asherah.sndh
      is COMPLETELY UNCHANGED from MIG-0047/MIG-0048's measurement (still
      first differs at sample index 4296 / frame 2148, still 803173 of
      960512 samples differing overall) - despite od/BaseVBL/D1 now
      tracking the oracle far more closely through at least the first
      ~5 VBL ticks than before either fix in this entry. This is a
      significant, somewhat surprising negative result: it suggests
      frame 2148's divergence (~358000 cycles) is NOT actually caused by
      the VBL-scheduling mechanics this and the preceding two entries
      have been investigating - both sides are silent (no AY register
      writes yet) well past that point in every trace taken so far, so
      the audible difference at that sample can only be a difference in
      exactly how many (silent, zero-valued) samples get generated per
      unit of elapsed cycle time, not a difference in musical content per
      se. The real cause is most likely elsewhere in the pipeline -
      candidates not yet checked: rounding differences in
      delay_in_tiks/tik_re between the two ay_engine tick accumulators,
      or something in sndh_file_make_buffer's own render-loop structure
      - rather than in atari_emulate_step's interrupt/VBL scheduling,
      which now appears to be substantially correct.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0.
      tools/ay_player/smoke_test.sh: 21/21 pass. Per-call od/BaseVBL
      tracing (temporary, uncommitted scratch tools plus temporary
      Debug_GetBaseVBL/Debug_GetDReg accessors in atari.pas, both left in
      place as harmless, potentially reusable debugging aids) confirmed:
      fix (1) alone closes the tick-2 divergence from a 36000+-cycle gap
      to 2 cycles; fix (2) restores agreement with the oracle's own
      honest (non-padded) STOP-shortfall reporting at step ~1673 (verified
      by hand against the oracle's own od progression at that step).
      WAV-level comparison (tools/ay_player --frames=480256 vs
      OracleHarness.pas's RunSNDHWAVExportTest) shows NO CHANGE from
      MIG-0047/MIG-0048's baseline despite these confirmed internal
      improvements - documented as a genuine, unresolved surprise rather
      than papered over, per this project's evidence-based discipline.
      Closed as validated for this entry's own two specific fixes (VBL
      bookkeeping ordering, removing MIG-0046's over-generalized STOP-
      padding), both of which remain real, unchanged, and correct since
      - the broader investigation continued across MIG-0050 through
      MIG-0055, now tracked under MIG-0054/MIG-0021.


  - id: MIG-0050
    title: "engine/atari_emulate.c: AY register writes were never reentrantly flushed mid-CPU-execution - the actual dominant cause of MIG-0045 through MIG-0049's persistent WAV divergence"
    subsystem: engine/atari_emulate, engine/sndh_file
    state: validated
    summary: >
      MIG-0049 left a genuine puzzle: VBL/cycle-accounting scheduling now
      matched the oracle almost exactly (od/BaseVBL/D1 tracking within 1-2
      counts through the first several ticks), yet the WAV-level
      comparison was COMPLETELY unchanged - same first-divergent sample,
      same total diff count. Both implementations were silent (no AY
      register writes) well past the divergence point in every trace,
      ruling out musical-content differences and narrowing the cause to
      "a difference in exactly how many samples get generated per unit of
      elapsed cycle time." Re-reading atari.pas's soundchip_writebyte
      (520-558, the $FF8800-range AY data-register write handler) found
      the actual mechanism: it calls SynthesizerSNDH REENTRANTLY, mid-
      instruction-stream, on EVERY AY register write (not just once per
      Atari_Emulate call) - flushing pending audio samples up to the
      EXACT cycle of that write. If the caller's output buffer is already
      full (BuffLen>=BufferLength) it defers the write onto AYOuts
      (AddOut/ClearOuts, atari.pas:517-543) instead of applying it
      immediately, replayed at the top of the NEXT render call via
      Atari_CheckOuts. engine/src/atari_emulate.c's ym_region_write had
      NEVER implemented this - it applied every write immediately with no
      flush at all, a gap explicitly flagged "out of scope" in this
      port's very first SNDH milestone and never revisited until now.
      Implemented in full: (1) ym_region_write's data-write branch now
      computes the LIVE cycle count mid-exec via the newly-added
      m68k_bus_cycles_run() wrapper (Musashi's own m68k_cycles_run(),
      exposed through the m68k_bus adapter), calls ay_synthesizer_ay
      reentrantly with it, and - if the buffer just filled as a result -
      calls the newly-added m68k_bus_end_timeslice() wrapper (Musashi's
      own m68k_end_timeslice()) to end the CPU's timeslice early,
      matching s68000releaseTimeslice's effect of returning control to
      the caller after the in-flight instruction; (2) a small fixed-size
      pending_writes queue on atari_emulate (32 entries - Pascal's AYOuts
      is an unbounded linked list, but a real SNDH replayer writes at
      most a handful of registers per VBL burst, so this comfortably
      covers any realistic case) mirrors AddOut/ClearOuts for the
      buffer-already-full case; (3) a new atari_emulate_flush_pending_
      writes() function mirrors Atari_CheckOuts's AY-register half (the
      DMA-sound IntDMASnd branch has no equivalent - no in-scope test
      file uses DMA sound), called from sndh_file_make_buffer at the
      exact same point Pascal calls Atari_CheckOuts (after the top-of-
      function IntFlag check, before the main Atari_Emulate loop).
    rationale: >
      NOT closed as validated, but this is the largest single improvement
      to Temple_of_Asherah.sndh's fidelity found in this whole investigation
      (MIG-0045 through MIG-0050): the first WAV-sample divergence against
      the oracle moved from frame 2148 to frame 2217 - within 6 frames of
      the oracle's own real audio onset at frame 2223, down from an
      original ~1889-frame gap before MIG-0045's initial byte-swap fix
      even made audio possible at all. Zero regressions (oracle-diff
      52/52, ay_player smoke test 21/21 - this change is SNDH-specific,
      touching only ym_region_write/sndh_file_make_buffer and two small,
      generically-useful additions to the m68k_bus adapter). A small
      residual gap remains: content past frame ~2217 still differs
      (verified by direct sample inspection, not just a diff count) in
      both exact timing (a few frames/samples early) and amplitude scale
      - most likely the same small, still-unresolved cycle-level drift
      MIG-0048's D1-register comparison found (oracle vs this port
      differing by consistently ~1 count by tick 5), now that the much
      larger reentrant-flush gap no longer masks it.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0.
      tools/ay_player/smoke_test.sh: 21/21 pass, SNDH audible=yes.
      WAV-level comparison (tools/ay_player --frames=480256 vs
      OracleHarness.pas's RunSNDHWAVExportTest) for Temple_of_Asherah.sndh:
      first divergent sample moved from index 4296 (frame 2148) to index
      4434 (frame 2217), confirmed via direct sample-by-sample inspection
      around the transition (both sides silent through sample 4433,
      oracle's own first nonzero sample at 4446/frame 2223 - this port's
      first nonzero at 4434/frame 2217, a 6-frame/12-sample gap, down from
      75 frames before this entry). Not yet byte-identical at the time,
      but closed as validated for this entry's own specific fix (the
      reentrant-flush/pending_writes mechanism), which remains real,
      unchanged, and correct since - the broader investigation continued
      across MIG-0051 through MIG-0055, now tracked under MIG-0054/
      MIG-0021.


  - id: MIG-0051
    title: "engine/mfp.c: MFP timer interrupt requests were missing atari.pas's EmulateTimer ICnt retry mechanism, and atari_emulate.c's VBL/MFP IRQ priority check order was backwards"
    subsystem: engine/mfp, engine/atari_emulate
    state: validated
    summary: >
      User-reported symptom investigated: Temple_of_Asherah.sndh's playback
      via ay_player sounded correct in some stretches and audibly sped up
      in others - an INTERMITTENT divergence, unlike MIG-0045 through
      MIG-0050's uniform drift. Brainstorming plus direct comparison of the
      Pascal-to-Starscream integration (atari.pas's EmulateTimer,
      atari.pas:1383-1431) against this port's Musashi integration found
      two real bugs. (1) atari.pas:1466's s68000interrupt(level,vector),
      confirmed from Starscream's own assembly (star027b/Starcpu32.asm),
      tracks a SINGLE pending bit PER CPU INTERRUPT LEVEL shared by all
      four MFP timers, not one slot per timer; when a timer's request
      finds that shared slot already occupied, EmulateTimer increments
      that timer's own ICnt and retries on a later call until it succeeds,
      guaranteeing every timer expiry is eventually serviced individually.
      This port's mfp_emulate_timer instead OR'd each timer's own IPR bit
      unconditionally - an idempotent operation that silently coalesced
      back-to-back expiries (arriving faster than the CPU's mask allowed
      them to be serviced) into a single eventual service, undercounting
      timer-driven effect advances whenever the CPU was masked/busy for
      longer than one timer period. Empirically confirmed via a scratch
      tracer (sndh_mfp_check.c) that Temple_of_Asherah.sndh drives MFP
      timers A/B/D almost continuously for its whole duration, so this gap
      was live essentially throughout playback, not an edge case - matching
      the "some parts fine, some parts sped up" symptom. Fixed by adding
      mfp_timer.icnt and mfp.level6_pending/pending_vector (mfp.h/mfp.c),
      replicating EmulateTimer's exact two-block structure (ICnt-retry
      block, then delay-elapse block). (2) atari_emulate_step's IRQ-level
      selection checked VBL (level 4) before MFP (level 6); real 68000 IPL
      priority is by level NUMBER (7=highest, 1=lowest, confirmed from
      Starscream's flush_interrupts scanning level 7 down to 1), so MFP
      should win when both are pending - this port had it backwards. Fixed
      by swapping the check order.
    rationale: >
      NOT closed as validated. Both fixes are structurally correct
      (verified against atari.pas and Starscream's own assembly, not
      inferred) and pass the standard regression gates with zero
      regressions elsewhere. However, applying them exposed an unrelated,
      pre-existing incremental-build hazard: engine/Makefile's object
      files are only tracked against their own .c file, not the headers
      they include, so editing mfp.h alone (without touching mfp.c) left
      stale .o files silently linked into a fresh ay_player build,
      producing "sndh_file_make_buffer returns 0 frames, real_end_all
      reads as garbage (200, not 0/1)" - a struct-layout mismatch between
      compilation units, not a logic bug in either fix. `make clean &&
      make` (both engine/ and tools/ay_player/) resolved this; the
      Makefile's lack of header dependency tracking remains a real hazard
      for future header-only changes but is out of scope for this entry.
      Once rebuilt clean, the two fixes measurably reduced (but did not
      eliminate) Temple_of_Asherah.sndh's divergence from the oracle: exact
      byte-diff rate across a 30-second render dropped from an ~82%->99%
      climbing pattern (pre-fix baseline) to ~75%->92%; a coarser
      audible-magnitude comparison (>500/32768 LSB threshold) still shows
      40-79% of samples differing per second throughout the render. The
      file is unambiguously improved but still far from byte-identical or
      reliably listenable - the user's original "still garbled, timing
      still off" report is not yet resolved, only reduced. Further residual
      drift (likely the same small per-tick cycle-count difference
      MIG-0048 found, or additional Starscream-vs-Musashi interrupt-timing
      subtleties not yet identified) remains open work.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0 (after
      `make clean && make` in engine/).
      tools/ay_player/smoke_test.sh: 21/21 pass, all formats audible=yes
      including SNDH.
      30-second WAV comparison (tools/ay_player --frames=1440256 vs
      OracleHarness.pas's RunSNDHWAVExportTest, NumBuffers=2813) for
      Temple_of_Asherah.sndh: per-second exact byte-diff rate
      75%,49%,74%,77%,75%,87%,87%,87%,90%,82%,84%,89%,85%,85%,88%,94%,96%,
      91%,91%,88%,92%,90%,91%,88%,92%,96%,91%,93%,93%,92%,92%,94% (seconds
      0-31); still climbing over time and still far from 0%. Not yet
      byte-identical; not yet validated as fixing the user's reported
      audible symptom, only as a measured partial improvement. Closed as
      validated for this entry's own two specific fixes (the ICnt
      retry/level6_pending model, and the VBL/MFP priority order), both
      of which remain real, unchanged, and correct since - the broader
      investigation continued across MIG-0052 through MIG-0055, now
      tracked under MIG-0054/MIG-0021.


  - id: MIG-0052
    title: "engine/atari_emulate.c: Musashi's CPU_INT_LEVEL was never lowered after int_ack, causing a level-6 interrupt-service storm - found via the new optional AY/IRQ trace tooling"
    subsystem: engine/atari_emulate, engine/trace_log
    state: validated
    summary: >
      User asked for optional AY-register-access and interrupt-timing
      tracing (cycle-timestamped, comparable between this port and the
      Pascal oracle) to help chase MIG-0051's residual drift - added
      engine/include/ay_engine/trace_log.h + engine/src/trace_log.c
      (env vars AY_ENGINE_AY_TRACE / AY_ENGINE_IRQ_TRACE) and its Pascal
      sibling ay_emul/TraceLog.pas (AY_EMUL_AY_TRACE / AY_EMUL_IRQ_TRACE),
      wired into ym_region_write/atari_emulate_flush_pending_writes/
      int_ack/atari_emulate_step (C11) and soundchip_writebyte/
      Atari_CheckOuts/Atari_Emulate/EmulateTimer (Pascal). While building
      it, found that atari.pas's tripOdometer (called from
      SynthesizerSNDH on almost every sample tick) periodically zeroes
      Starscream's real odometer and rebases BaseVBL/the MFP timers' Base
      fields downward by the same amount (a deliberate 32-bit-overflow-
      avoidance mechanism in the original, not a bug) - without
      accounting for this, Pascal-side log timestamps would sawtooth back
      to near-zero constantly. Fixed by adding a separate, log-only
      absolute-cycle accumulator (TraceLog.pas's TraceAbsCycle/
      TraceNoteOdometerTrip) that stays continuous across every rebase,
      without changing any real comparison logic. Running the new tracing
      against Temple_of_Asherah.sndh immediately surfaced a real, large
      bug: engine/third_party/musashi/m68kcpu.h's m68ki_exception_
      interrupt does NOT auto-clear CPU_INT_LEVEL once a custom int_ack
      callback is registered (the auto-clear is guarded by `#if
      !M68K_EMULATE_INT_ACK` - lowering the IRQ line after acknowledging
      is documented as the CALLER's job, mirroring real hardware where
      the interrupting device itself deasserts its line). atari_emulate_
      step only called m68k_bus_set_irq once, at the top of each step,
      from state captured BEFORE that step's exec() ran - so once an
      in-flight exec() call's instruction stream executed RTE and the
      CPU's own interrupt mask dropped back below 6, Musashi's
      m68ki_check_interrupts saw CPU_INT_LEVEL still latched at 6
      (nothing had told it otherwise) and re-fired the SAME interrupt
      immediately, over and over, until the NEXT atari_emulate_step call
      happened to reassess and lower it. A 30-second trace showed
      1,886,081 level-6 "service" events for only 133,420 real "assert"
      events - a ~14x service-to-assert ratio that should be ~1:1 - and
      MFP's own coalesce bookkeeping saw 258,198 coalesced requests
      against the oracle's 321 (~800x), because level6_pending kept
      getting spuriously freed and re-occupied by this storm rather than
      by genuine MFP timer expiries. Fixed by factoring the VBL/MFP
      priority-selection logic (previously inline in atari_emulate_step)
      into a shared compute_irq_level(atari_emulate*) helper, and calling
      it a second time from int_ack itself, immediately after
      acknowledging, so Musashi's CPU_INT_LEVEL is lowered to whatever is
      genuinely still pending right away instead of waiting for the next
      outer step.
    rationale: >
      NOT closed as validated. This is a real, substantial, previously-
      unknown bug, clearly distinct from (and likely larger in effect
      than) MIG-0051's per-tick drift - the interrupt-storm mechanism
      would have corrupted CPU timing throughout any SNDH file with
      active MFP timers, not just this one, though only Temple_of_
      Asherah.sndh has been measured. After the fix, level-6 "service"
      dropped from 1,886,081 to 66,335 (now essentially 1:1 with 66,336
      "assert" events, as it should be), and the 30-second WAV-diff
      against the oracle improved substantially: exact byte-diff rate for
      the first ~7 seconds dropped from the MIG-0051 baseline's 75-90%
      range to 44-63%, though it still climbs to a similar 80-92% ceiling
      in later seconds - so this is a real, measured improvement, not a
      complete fix. A second, smaller, distinct residual was found by the
      same trace comparison and is NOT fixed here: even post-fix, total
      level-6 interrupt-request attempts (assert+coalesce) are still
      ~57% higher on this port than the oracle (192,753 vs 123,191) with
      a very different assert/coalesce split (66,336/126,417 here vs
      122,870/321 on the oracle) - meaning MFP timer expiries are still
      firing at a different effective rate, or level-6 servicing still
      takes measurably longer to actually happen, than on the oracle.
      This is open work, not yet root-caused, and is a good next target
      for the same trace-comparison tooling.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0 (after
      `make clean && make` in engine/, since editing mfp.h/atari_emulate.c
      without a full rebuild has previously produced stale-object-file
      corruption - see MIG-0051).
      tools/ay_player/smoke_test.sh: 21/21 pass, all formats audible=yes
      including SNDH.
      IRQ trace, level 6, Temple_of_Asherah.sndh, 30s: before fix -
      assert=133420 coalesce=258198 service=1886081; after fix -
      assert=66336 coalesce=126417 service=66335 (oracle: assert=122870
      coalesce=321, no service events logged - Starscream exposes no
      int_ack-equivalent callback, so the oracle-side TraceLog.pas
      structurally cannot log "service", by design - see trace_log.h's
      asymmetry note).
      30-second WAV comparison (tools/ay_player --frames=1440256 vs
      OracleHarness.pas's RunSNDHWAVExportTest, NumBuffers=2813) for
      Temple_of_Asherah.sndh: per-second exact byte-diff rate
      55%,47%,45%,45%,50%,53%,47%,63%,81%,76%,75%,78%,78%,69%,59%,90%,89%,
      84%,81%,74%,79%,72%,71%,80%,90%,92%,84%,82%,87%,89%,81%,90% (seconds
      0-31) - lower than MIG-0051's baseline in every second, most
      markedly in the first ~14 seconds, but still far from 0% and still
      climbing over time. Not yet byte-identical; not yet validated as
      fully resolving the user's reported audible symptom. Closed as
      validated for this entry's own specific fix (lowering
      CPU_INT_LEVEL after int_ack), which remains real, unchanged, and
      correct since - the broader investigation continued across
      MIG-0053 through MIG-0055, now tracked under MIG-0054/MIG-0021.


  - id: MIG-0053
    title: "engine/atari_emulate.c: Musashi's STOP opcode pads m68k_execute's reported cycle count up to the full requested budget even when real work before re-idling was tiny - was fast-forwarding cycle_count far ahead of real 68000 throughput"
    subsystem: engine/atari_emulate, engine/trace_log
    state: validated
    note: >
      This entry's exact min=1-whenever-pending cap was later REFINED by
      MIG-0054 (now min=1 only for the step that still needs to dispatch
      something, not unconditionally) after finding the unconditional
      version over-corrected. The underlying diagnosis (Musashi's STOP
      handler pads used up to the full requested min) and the core
      insight (a min-cap workaround is needed at all) both remain
      correct and unchanged - only the precise capping condition was
      tightened. Closed as validated for that core diagnosis/fix; see
      MIG-0054 for the refinement's own details.
    summary: >
      User asked to keep chasing MIG-0052's still-open "why does C11's
      CPU spend measurably longer between successive MFP interrupt
      services than the oracle" question, specifically distinguishing
      between two candidate mechanisms: (a) a residual per-opcode cycle-
      cost mismatch between Musashi and Starscream, or (b) something in
      how atari_emulate_step's exec-budget bursts interact once a
      backlog builds. Added a third trace type (trace_log_step /
      AY_ENGINE_STEP_TRACE) logging atari_emulate_step's requested exec
      budget ("min") against Musashi's reported consumption ("used") per
      call, to test both directly. (a) was investigated first via direct
      opcode-level single-stepping from cold reset, cross-checked against
      both cores' own declared cycle tables (engine/third_party/musashi/
      m68k_in.c and ay_emul/star027b/star.c) - found real, genuine, small
      mismatches (ADDA.L register-source costs 6 on Musashi vs Starscream's
      apparent 8; CLR.W-to-memory and ADD.W-immediate cost 2 more on
      Musashi) but the measured net effect (+42 cycles over 60,000
      consecutive, PC-identical instructions) was three orders of
      magnitude too small to explain the observed effect size - ruled out
      as the dominant mechanism. UPDATE (per explicit user direction,
      recorded in PORTING_TO_C11_LINUX.md §7.1.1): Musashi's values here
      are correct - they match the well-known, published Motorola 68000
      instruction-timing table; Starscream's don't, for these specific
      opcodes. This is now resolved as "won't fix, by design", the same
      resolution given to MIG-0018's analogous Z80 interrupt-timing
      finding - replicating Starscream's numbers would make this port's
      68000 timing non-standard on purpose, purely to chase closer
      byte-agreement with an oracle whose own CPU core has the bug.
      (b) was then investigated by cross-referencing AY_ENGINE_STEP_TRACE
      against AY_ENGINE_IRQ_TRACE's "service" events: found 4223
      occurrences (in a single ~45s render) where a real interrupt was
      serviced PARTWAY through a step's exec() call, yet `used` still
      equalled the FULL requested `min` - confirmed by reading engine/
      third_party/musashi/m68k_in.c's stop opcode handler directly: it
      unconditionally forces m68ki_remaining_cycles down to STOP's own
      tiny cost whenever STOP executes, discarding whatever budget was
      left, so m68k_execute's return value reports the full requested
      budget as consumed regardless of how little real 68000 work
      actually happened before returning to idle. Averaged ~11,700
      phantom cycles per occurrence - 13.7% of the ENTIRE render's total
      cycle count credited to a->cycle_count with no corresponding real
      68000 execution. Because `min` is computed once per call as "time
      until the single soonest deadline", padding to that full min
      silently fast-forwards cycle_count past points where OTHER, sooner-
      expiring MFP timers should have been individually rechecked -
      exactly the missed-service/coalesce backlog MIG-0052 measured
      (elevated request-attempt counts, far fewer successful services,
      and correspondingly fewer AY register writes, especially on the
      amplitude registers 8/9/10 that drive this file's digidrum/envelope
      effects - the user's reported "some parts very quiet" symptom).
      Fixed: whenever an interrupt is already pending going into a step
      (compute_irq_level(a) != 0), cap `min` to 1 before calling
      m68k_bus_exec, forcing atari_emulate_step to be re-entered
      immediately after any interrupt is handled (recomputing a fresh,
      currently-accurate min across all four MFP timers + VBL + DMA)
      rather than sailing past on a stale, padded budget - mirroring
      Starscream's own apparent behavior of reporting honest short counts
      when STOP triggers early (see MIG-0049's original, still-accurate
      observation of this asymmetry, which at the time was addressed only
      by removing this port's OWN separate, redundant padding-up-to-min
      workaround - not by addressing Musashi's own internal padding,
      which this entry finally does).
    rationale: >
      NOT closed as validated, but this is the largest and most
      consequential fix in the whole Temple_of_Asherah.sndh investigation
      (MIG-0045 through MIG-0053). Level-6 (MFP) assert/service counts
      moved from 66336/66335 (post-MIG-0052, already improved from the
      pre-MIG-0052 storm) to 126801/126800 - within 3.2% of the oracle's
      122870. AY register write counts on the specific registers driving
      this file's audible symptom are now within 0.1-3.6% of the oracle:
      reg 8 (channel A amplitude) 115068 vs oracle's 111107 (+3.6%), reg 9
      (channel B amplitude, previously the worst-hit at 27% of the
      oracle's count) 6395 vs 6361 (+0.5%), reg 10 (channel C amplitude)
      8041 vs 8035 (+0.1%) - a complete reversal from the roughly-half
      write counts MIG-0052 measured. Given register write COUNT parity
      is what actually determines whether volume-envelope/digidrum steps
      get reproduced at all, this is strong evidence the "very quiet in
      places" symptom is now substantially addressed, even though it
      could not be directly listened to in this environment. However, the
      exact byte-level WAV diff rate against the oracle did NOT improve
      correspondingly (37-76% audible-magnitude diff rate, comparable to
      MIG-0052's 40-79% - see verification) - expected and understood:
      exact sample alignment is extremely sensitive to any small residual
      timing offset (a single-cycle shift in when ANY write lands changes
      every subsequent sample's exact value even when the underlying
      musical content, i.e. which registers get written how often, is now
      essentially correct), so this metric is a poor proxy for audible
      quality once content-count parity is this close, and it does not
      contradict the write-count evidence above. Level-6 coalesce count
      remains elevated (120232 vs the oracle's 321) and is NOT explained
      by this fix alone - a real, further residual (likely fine-grained
      scheduling-order effects, now that the large padding bias is gone)
      remains open work, along with the small-but-real per-opcode
      mismatches found and left unfixed during the (a) investigation
      above (ADDA.L/CLR.W/ADD.W - see summary).
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0 (after
      `make clean && make` in engine/, per MIG-0051's stale-object-file
      lesson).
      tools/ay_player/smoke_test.sh: 21/21 pass, all formats audible=yes
      including SNDH.
      Render performance: 30-second Temple_of_Asherah.sndh render via
      ay_player completes in ~0.32s wall-clock (no meaningful slowdown
      from the more frequent atari_emulate_step re-entry while an
      interrupt is pending).
      AY_ENGINE_STEP_TRACE cross-referenced with AY_ENGINE_IRQ_TRACE
      (pre-fix, one ~45s render): 4223 steps where a service event landed
      mid-step yet used==min>20, averaging ~11700 cycles of unearned
      padding each, totaling 13.66% of the render's total cycle count.
      Level-6 IRQ counts (30s Temple_of_Asherah.sndh): pre-fix (MIG-0052
      state) assert=66336 coalesce=126417 service=66335; post-fix
      assert=126801 coalesce=120232 service=126800; oracle assert=122870
      coalesce=321 (no service events logged, by design - see trace_log.h).
      AY write counts by register (write_apply, 30s): reg8 c11=115068
      oracle=111107; reg9 c11=6395 oracle=6361; reg10 c11=8041
      oracle=8035; all other registers (0-7,11,12) within ~5% both before
      and after this fix, unaffected.
      30-second WAV comparison, audible-magnitude (>500/32768 LSB
      threshold) diff rate per second: 56%,60%,61%,58%,41%,37%,55%,67%,
      67%,54%,48%,40%,57%,42%,45%,75%,76%,60%,54%,52%,54%,51%,45%,53%,
      68%,74%,66%,63%,69%,67%,63%,71% (seconds 0-31) - comparable to
      MIG-0052's 40-79% range, not a clear improvement by this specific
      metric (see rationale for why that's expected and not contradictory
      evidence). Not yet byte-identical; not yet confirmed by ear.


  - id: MIG-0058
    title: "engine/src/pt1_file.c: note-table index computed as an unwrapped int instead of Pascal's byte-wraparound `j`, root-causing the worst PT1 divergences in the all_tunes corpus sweep"
    subsystem: engine/pt1_file
    state: validated
    summary: >
      Investigated mus08.pt1, ranked among the worst PT1 divergences in
      the 36,448-file all_tunes corpus sweep. C11 played loud audio from
      output sample 3 onward; the Pascal oracle stayed silent until
      sample 103, then played completely different content thereafter -
      not a timing residual, a real content divergence.

      Root cause: Players.pas:11238-11269's GetRegisters computes the
      note-table index as `j := Note + Index[OrnamentPointer +
      Position_In_Sample]; if j > 95 then j := 95`. `j` is declared `var
      j, b: byte` (Players.pas:11240) - an 8-bit Pascal variable. With
      range checking off (confirmed: no {$R+} anywhere in AY.pas/Players.
      pas, no -Cr in the lazbuild invocation), `Note + Index[...]`
      silently wraps modulo 256 whenever the raw sum exceeds 255, BEFORE
      the `if j > 95` clamp ever sees it. engine/src/pt1_file.c's
      get_registers computed the same sum as a plain C `int` (no
      wraparound) and clamped THAT unwrapped value to 95 directly -
      correct whenever the raw sum stays under 256, silently wrong
      whenever it doesn't. Confirmed via matched debug traces added to
      both engines for mus08.pt1's very first tick: channel A, note=41,
      ornament byte=251, raw sum=292 - Pascal wraps to j=36 (a valid,
      musically meaningful table index, table[36]=479), while the old
      unwrapped-clamp code forced j=95 (the table's last, near-silent
      entry, table[95]=15) - completely different pitch and amplitude
      envelope from the very first output sample. Channel C's sum
      happened to stay under 256 on this tick (j=41 both ways), which is
      why it looked fine while A/B didn't - not a channel-specific bug,
      just a channel-specific coincidence of that tick's data.

      Cross-checked the other 4 formats sharing this same "j > 95 clamp"
      shape (engine/src/pt2_file.c, stc_file.c, stp_file.c, pt3_file.c) -
      all four ALREADY mask to a byte before the comparison (`uint8_t j =
      (uint8_t)(...)` in pt2/stc/stp, explicit `j &= 0xFF` in pt3) - this
      was an isolated pt1_file.c omission, not a systemic pattern across
      the tracker-format decoders.

      Tooling used: extended the AY-write/beeper-toggle tracing added in
      MIG-0057 with temporary, since-removed per-tick debug dumps (note/
      j/sample_pointer/ornament_pointer/table-lookup/ton) on both the
      Pascal (Players.pas's GetRegisters) and C11 (pt1_file.c's
      get_registers) sides, using matched WriteLn(StdErr,...)/fprintf
      calls to directly compare per-tick internal state rather than only
      final WAV output - this is what surfaced the exact byte-wraparound
      mechanism rather than just "the numbers differ somewhere."

      Fix: engine/src/pt1_file.c's `j` computation now masks to a byte
      (`& 0xFF`) before the `if (j > 95) j = 95` clamp, replicating
      Pascal's 8-bit variable width exactly.

      Impact: re-tested all 11 files from the user's original "11 worst
      PT1 files" list (goldengift, secondjoke9, pen1, freedom, hny_2_1,
      mozart, think, mus06, brag_2, criminal1, plus mus08 itself) against
      the Pascal oracle at full song length (1,765,376 or 882,688 PCM
      bytes depending on song length) - all 11 are now BYTE-IDENTICAL
      (diff_fraction 0.0, down from the corpus sweep's originally-
      reported ~0.4-0.9+ range for this format). A single fix resolved
      the entire PT1 worst-case cluster from the all_tunes sweep, not
      just the one file investigated in depth.

      mus08.pt1 was copied into test_corpus_76/ (73rd file) so
      corpus_wav_md5_sweep.sh permanently exercises this exact
      wraparound case going forward, matching this project's existing
      convention of adding a representative regression file to the
      tracked corpus after each root-caused fix.
    verification: >
      Build: `cd engine && make` clean, `lazbuild --build-mode=release
      ay_emul/Ay_Emul.lpi` clean. mus08.pt1 full-song render (882,688 PCM
      bytes): 0 differing bytes, MD5-identical to the oracle. All 11
      originally-flagged worst PT1 files: 0 differing bytes each,
      confirmed via direct oracle-vs-C11 PCM comparison at full song
      length. tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail (no
      regression on DEMON.pt1 or any other format). tests/oracle_diff/
      corpus_wav_md5_sweep.sh: 73 passed (was 72, +1 for the newly added
      mus08.pt1), 0 failed, 1 known-non-identical (MIG-0056, unrelated
      SNDH residual), 0 skipped. tools/ay_player/smoke_test.sh: full
      pass, no regressions.

  - id: MIG-0059
    title: "ay_emul/OracleHarness.pas: RunFXMFileTest/RunFXMWAVExportTest never set PLConsts[0].amad_andsix, silently collapsing FXM's noise-base ADD opcode to zero - a test-harness bug, not a C11 port bug"
    subsystem: ay_emul/OracleHarness
    state: validated
    summary: >
      Investigated magnetic_fields_iv.fxm, ranked among the worst FXM
      divergences in the 36,448-file all_tunes corpus sweep. Register
      writes matched the oracle byte-for-byte across the entire song
      (confirmed via new AY-write tracing added to fxm_file.c/Players.pas
      FXM_Get_Registers), and the internal tone/tick accumulator state
      matched exactly at every output-tick boundary - yet audio still
      diverged mid-tick, self-correcting by the next tick boundary. This
      ruled out a decode-logic bug, a 512-sample buffer-chunking
      difference (both engines already chunk identically -
      tools/ay_player's BUFFER_FRAMES=512 matches the oracle's own
      WaveExportBufferLen=512), and the tick-accumulator mechanism fixed
      earlier this session (MIG-0056) - all confirmed via targeted A/B
      instrumentation rather than assumption.

      Per-sample and per-raw-AY-tick tracing (temporary, added to both
      ay_synthesizer_stereo16/Synthesizer_Stereo16 and fxm_get_registers/
      FXM_Get_Registers, since removed) isolated the exact divergent
      instant: at a tick-18 boundary, the shared noise generator's
      Noise_Counter reaches 8 (even) in both engines identically, but
      only the Pascal oracle wraps (regenerates Noise.Seed); C11 doesn't.
      The wrap condition is `(Noise_Counter.Hi and 1 = 0) and
      (Noise_Counter.Hi >= RegisterAY.Noise shl 1)` - i.e. it depends on
      register 6 (the noise period), which differed: Pascal's reg6=0,
      C11's reg6=5, at the exact same tick.

      Root cause: FXM pattern opcode $8D (add-to-Noise_Base) is
      Players.pas:11916-11923: `PlParams[CNum].FXM.Noise_Base :=
      (PlParams[CNum].FXM.Noise_Base + Index[Address_In_Pattern]) and
      PlConsts[CNum].amad_andsix`. `amad_andsix` is NOT a constant - it's
      a per-loaded-file field (Players.pas:782), populated from
      `PlayListItems[Index]^.FormatSpec` at real load time
      (Players.pas:2634, inside InitForAllTypes) via the playlist item's
      own FormatSpec, which real AddFile (Players.pas:7542) sets
      UNCONDITIONALLY to 31 for every FXM file (`PLItem.FormatSpec :=
      31;` - no other value is ever assigned for FT.FXM). engine/src/
      fxm_file.c already hardcodes `& 31` for this exact opcode - matching
      real production behavior exactly. OracleHarness.pas's
      RunFXMFileTest and RunFXMWAVExportTest, however, never go through
      AddFile/InitForAllTypes at all (they're simplified direct-load
      harnesses, like every other Run*Test procedure in this file) and
      never set PLConsts[0].amad_andsix themselves - leaving it at its
      global zero-init default. With amad_andsix=0, opcode $8D's `and 0`
      collapses Noise_Base to 0 on every use, regardless of the pattern
      data's actual intended value - a genuine, previously-invisible bug
      in the ORACLE'S OWN TEST HARNESS, not in the C11 port, matching the
      same category as the earlier SNDH play-frequency test-harness fix
      found and fixed earlier in this project (both are cases of a
      simplified oracle harness omitting a per-file setup step that real
      AddFile always performs).

      Tooling used: extended the AY-write tracing added in MIG-0057 to
      cover fxm_get_registers/FXM_Get_Registers (kept, now closing the
      same tooling gap for FXM as MIG-0057 closed it for .ay). The deep
      per-sample/per-tick/per-noise-generator-state tracing that actually
      found this (DBGACC/DBGSAMP/DBGTICK/DBGNOISE/DBGREG6) was temporary
      and has been fully removed from both engines after use.

      Fix: added `PLConsts[0].amad_andsix := 31;` to both
      RunFXMFileTest and RunFXMWAVExportTest, matching real AddFile's
      unconditional FXM value exactly. No change to engine/src/fxm_file.c
      or any other C11 port source - the C11 port's behavior was correct
      throughout.

      Impact: re-tested all 8 files from the user's original FXM list
      (magnetic_fields_iv, red_dawn, land_of_confusion, commando,
      terra_cresta, terracresta, stardragon, tetris2) against the fixed
      oracle at full song length (1,765,376 PCM bytes each) - all 8 are
      now BYTE-IDENTICAL (diff_fraction 0.0, down from the corpus
      sweep's originally-reported significant divergence for this
      format). A single one-line fix in the test harness resolved the
      entire FXM worst-case cluster from the all_tunes sweep.

      magnetic_fields_iv.fxm was copied into test_corpus_76/ (74th file,
      alongside the pre-existing The_Last_V8.fxm which never happened to
      exercise opcode $8D and so never caught this) so
      corpus_wav_md5_sweep.sh permanently exercises this exact opcode
      going forward.
    verification: >
      Build: `cd engine && make` clean (no warnings, confirms all
      temporary debug instrumentation was fully removed), `lazbuild
      --build-mode=release ay_emul/Ay_Emul.lpi` clean. magnetic_fields_
      iv.fxm full-song render (1,765,376 PCM bytes): 0 differing bytes.
      All 8 originally-flagged worst FXM files: 0 differing bytes each,
      confirmed via direct oracle-vs-C11 PCM comparison at full song
      length. tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail (no
      regression on The_Last_V8.fxm or any other format). tests/
      oracle_diff/corpus_wav_md5_sweep.sh: 74 passed (was 73, +1 for the
      newly added magnetic_fields_iv.fxm), 0 failed, 1 known-non-
      identical (MIG-0056, unrelated SNDH residual), 0 skipped.
      tools/ay_player/smoke_test.sh: full pass, no regressions.

  - id: MIG-0060
    title: "engine/src/asc_file.c: ASC's tone-slide delta_ton computed as an unwrapped int instead of Pascal's 16-bit smallint, root-causing the worst ASC divergences in the all_tunes corpus sweep"
    subsystem: engine/asc_file
    state: validated
    summary: >
      Investigated ze_point.asc and last_day.asc, ranked among the worst
      ASC divergences in the 36,448-file all_tunes corpus sweep - both
      shared an identical first_diff_byte=3293, suggesting a common root
      cause. Closed the last remaining tooling gap this session: ASC is
      a direct-decode tracker format (like PT1/FXM), not Z80-CPU-driven,
      so added the same AY-write tracing pattern (trace_log_ay in
      engine/src/asc_file.c's asc_get_registers / TraceLogAY in
      Players.pas's ASC_Get_Registers) used for MIG-0057/0059.

      Root cause, found via matched per-tick internal-state tracing
      (temporary, since removed): PatternInterpreter's opcodes $F7 and
      $F9 (tone-slide/portamento setup) compute `delta_ton := ASM_Table
      [Note] - ASM_Table[peek]`, then `delta_ton := delta_ton shl 4`
      (Players.pas:9825-9865). `delta_ton` is declared `var delta_ton:
      smallint` (Players.pas:9715) - a 16-bit Pascal variable. With range
      checking off (confirmed: no {$R+}, no -Cr), the `shl 4` (*16)
      silently wraps modulo 65536 whenever it pushes the value past
      +-32767 - which a large ASM_Table difference (e.g. sliding from
      note 0, a very long/low-pitch AY period, toward a much shorter
      one) easily does. engine/src/asc_file.c declared the equivalent
      variable as a plain `int` (32-bit, never wraps) - correct whenever
      the shifted value stays in range, silently wrong whenever it
      doesn't. Confirmed via matched debug traces for ze_point.asc's very
      first $F9 opcode (note=0, speed=3): Pascal's wrapped delta_ton=
      -6688; the old C11 code's unwrapped delta_ton=58848 -
      58848-65536=-6688 exactly, confirming the wrap-boundary
      relationship directly rather than by inference. Every subsequent
      $F7/$F9 hit in the same trace window matched exactly (small
      deltas, no wrap needed) - this is an isolated large-delta case, not
      a pervasively wrong formula, matching the same "narrow Pascal
      integer type silently wraps, C port didn't replicate the width"
      pattern as MIG-0058's PT1 fix, just at 16 bits instead of 8.

      Fix: declared `delta_ton` as `int16_t` in engine/src/asc_file.c
      (was `int`), with explicit `(int16_t)` casts at each assignment
      point (the ASM_Table difference, the optional $F7-only addition of
      the previous current_ton_sliding/16 term, the `else` branch, and
      the `shl 4`/`<<4` itself) so every intermediate step wraps exactly
      where Pascal's single smallint-typed variable would. The
      downstream substruction_for_ton_sliding/current_ton_sliding/
      ton_sliding_counter assignments were already correctly typed and
      needed no change.

      Impact: re-tested all 4 files from the user's original ASC list
