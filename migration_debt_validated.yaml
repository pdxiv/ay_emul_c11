  - id: MIG-0061
    title: "engine/src/ay_file.c/z80_bus.c: on_ay_read was declared but never wired up - every AY register read-back (IN A,(C)) silently returned 0xFF instead of the real value, root-causing T21.ay's phantom beeper-toggle regression"
    subsystem: engine/ay_file, engine/z80_bus
    state: validated
    summary: >
      Root-caused MIG-0057's deferred T21.ay followup: enabling the
      beeper_on_level fix there exposed a spurious beeper-port toggle in
      C11 (a brief ON/OFF pulse at cycle=4517) that Z80.pas's own core
      never produces for the same file/scenario. Traced via new,
      temporary single-instruction tracing added to both Z80 cores'
      natural per-instruction step functions (z80_bus_step's call to
      z80_step, and Z80.pas's live Z80_Step's call to Z80_ExecuteCommand
      - both already execute exactly one instruction per invocation, so
      no new stepping infrastructure was needed, just a debug print at
      each call site, since removed): dumped PC/registers/opcode bytes
      for both engines over T21.ay's opening ~400 T-states side by side.
      PC and all registers matched exactly (once accounting for one
      trace using decimal, the other hex) all the way through
      tact=4498 - then diverged sharply at the very next instruction:
      register A went to 0x00 in Pascal, 0xFF in C11, from the identical
      starting state (A=0x0C, same PC=0x84AC, same opcode bytes ED 78).

      ED 78 is `IN A,(C)` - a register-read-back instruction reading
      the AY chip's currently-selected register via port B:C (0xF600,
      matching the $FFFD port-mask pattern Z80.pas's live ZXInProc uses
      for both register-select-on-write and data-on-read). Z80.pas's
      ZXInProc: `Dat := SoundChip[0].RegisterAY.Index[AY_CurReg]` when
      AY_CurReg < 14 - a plain read of the last stored register value.
      engine/src/z80_bus.c's zx_in already gates this correctly
      (`ay_cur_reg < 14 && on_ay_read != NULL`) and falls through to
      `return 255` otherwise - but `on_ay_read`/`ay_read_userdata` were
      declared in z80_bus.h (documented as "caller-supplied", same
      pattern as on_ay_write/on_beeper_change/on_chip_freq_change) and
      NEVER ASSIGNED anywhere in engine/src/ay_file.c. Confirmed via
      grep: ay_file.c wires up on_ay_write, on_beeper_change, and
      on_chip_freq_change, but never on_ay_read - a straightforward
      omission, not a logic bug in the read path itself. Every `IN
      A,(C)` in every .ay file has always silently returned 0xFF
      instead of the real register value; T21.ay's music routine
      happens to read back a register and use the (garbage) result in
      a way that eventually produces a spurious beeper-port write.

      Fix: added `on_ay_read` (engine/src/ay_file.c, new static function
      mirroring on_ay_write's pattern - reads `f->ay.chip.reg[reg]`
      directly, no synthesizer flush needed since reading doesn't change
      chip state, matching Z80.pas's read having no SynthesizerAY call
      either) and wired it up alongside `ay_read_userdata` in
      ay_file_load, next to the existing on_ay_write assignment.

      With this fixed, MIG-0057's beeper_on_level fix (previously left
      disabled/commented out pending this exact root cause) was enabled.
      Impact: T21.ay now byte-identical (was the one file this whole
      beeper investigation regressed). Of the two beeper-driven files
      flagged in MIG-0057's follow-up characterization pass,
      cjs_elephant_antics_titus_intro.ay is now BYTE-IDENTICAL (was
      completely silent/wrong); follin_tdm.ay dropped from ~82%
      divergence to the same small, already-accepted cycle-timing
      residual as every other AY-register-driven file checked this
      session (confirmed via AY-write trace: all 24 register events
      match structurally). digitune1.ay's own amplitude-scale mystery
      (MIG-0057's other open followup) remains unresolved - it's AY-
      register-driven, not beeper-driven, and this fix doesn't touch
      that code path; still needs the single-instruction Z80 tracing
      this entry's methodology now makes straightforward to redo.
    verification: >
      Build: `cd engine && make` clean (no warnings), `lazbuild
      --build-mode=release ay_emul/Ay_Emul.lpi` clean (confirms all
      temporary single-instruction trace instrumentation was fully
      removed from both z80_bus.c and Z80.pas). T21.ay (already in
      test_corpus_76/ from MIG-0057's investigation): 0 differing bytes,
      MD5-identical - the specific regression this entry fixes.
      cjs_elephant_antics_titus_intro.ay: 0 differing bytes (was
      completely wrong). follin_tdm.ay: confirmed AY-write-trace-
      identical (24/24 events match), remaining diff is the accepted
      residual, not a new issue. tests/oracle_diff/run_diff.sh: 60/60
      pass, 0 fail. tests/oracle_diff/corpus_wav_md5_sweep.sh: 75 passed,
      0 failed, 1 known-non-identical (MIG-0056, unrelated SNDH
      residual), 0 skipped - beeper_on_level now enabled with zero
      regressions across the full tracked corpus. tools/ay_player/
      smoke_test.sh: full pass. tests/engine_smoke/test_ay: full pass.
