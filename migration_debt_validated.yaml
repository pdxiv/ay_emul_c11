      13385) as a new ym6i_get_registers() function, sibling to the
      already-ported ym5i_get_registers - structurally similar (same 14
      register-plane layout) but NOT a small diff of it, verified against
      the literal Pascal source rather than assumed symmetric: (1)
      register-1/3's top 2 bits are the effect TYPE (SE1Typ/SE2Typ:
      0=square,1=digidrum,2=sinus,3=explicit-envelope) here, not YM5's
      single "reset timer counter" flag bit - no timer-reset check exists
      in YM6i at all; (2) AtariSE1Type/AtariSE2Type are reassigned from
      SE1Typ/SE2Typ every frame (YM6's actual "switch effect type
      mid-song" feature) instead of being fixed at load; (3) per-type
      setup dispatch differs (types 0/2 both just capture a 4-bit param
      and set Envelope_En{A,B,C}; type 3 captures the same param AND
      immediately calls SetAmplX(x and 16); the digidrum/type-1 case
      captures a 5-bit param and ALSO sets Envelope_En{A,B,C}, replicated
      literally even though that looks odd for a digidrum channel); (4)
      the mixer force-open logic is gated on type=1 per slot
      independently (two separate checks), unlike YM5i's unconditional
      per-channel force. ym6_extra_get_registers (the shared per-sub-tick
      dispatcher) needed zero changes - it already reads
      atari_se1_type/se2_type generically. ym_file_load's
      is_ym6-unconditional-rejection was removed; ym_file_make_buffer now
      branches ym5i_get_registers vs ym6i_get_registers on f->is_ym6,
      mirroring Players.pas's own MakeBufferYM5/MakeBufferYM6 split. Also
      fixed: PrepareToPlay's AtariSE1Type/AtariSE2Type=0/1 fixed defaults
      only apply to FT.YM5 in the real Pascal (Players.pas:4009-4025) -
      FT.YM6 leaves them at their real Pascal-global zero default,
      replicated by only setting those two fields in ym_file_load when
      !f->is_ym6.
      OracleHarness.pas's RunYMFileTest previously only supported
      LHA-wrapped YM5! files; extended it to detect -lh5- vs plain
      byte-sourcing generically (mirroring ym_file.c's own orthogonal
      LHA-vs-magic handling) and to recognize YM6! and dispatch to
      MakeBufferYM6 accordingly. Note: AtariSE1Type/AtariSE2Type and
      related Atari* globals are declared in Players.pas's
      IMPLEMENTATION section (line 1175), not its interface, so
      OracleHarness.pas cannot set them explicitly at all (a real,
      structural limit, not a shortcut) - both new test files have
      Num_of_Dig=0, so no frame ever assigns a real SE1/SE2 channel,
      meaning these globals' un-set value is never actually read; this
      was the same (undocumented until now) situation the pre-existing
      Batman_Journey.ym scenario already relied on successfully.
    rationale: >
      Closed as validated: oracle-diff byte-identical for Block_Us.ym
      (plain/non-LHA YM6!, the actual new capability) against the real
      Pascal codebase, verified against the literal Pascal source
      (including the type-dispatch differences and the FT.YM5-only
      PrepareToPlay defaults) rather than assumed from YM5i's precedent.
      Also added 3D-Fight_Fort.ym (plain/non-LHA extended YM5!) to the
      gate - the C port's non-LHA byte-sourcing path already worked
      correctly but had never been oracle-diff-tested before this
      milestone touched the file.
    verification: >
      tests/oracle_diff/run_diff.sh's ym_file section now loops over 3
      files (up from 1): the pre-existing Batman_Journey.ym (LHA-wrapped
      extended YM5!), plus 3D-Fight_Fort.ym (plain extended YM5!) and
      Block_Us.ym (plain extended YM6!) - all byte-identical via `cmp`
      against OracleHarness.pas's RunYMFileTest (extended to handle both
      LHA-or-not and YM5!-or-YM6! generically, matching ym_file.c's own
      structure).

  - id: MIG-0042
    title: "ay_player PT3 detection: fall back to extension for corrupted title text"
    subsystem: tools/ay_player
    state: validated
    summary: >
      tools/ay_player/src/format.c's content-sniffing detect() matched
      PT3 files solely via a literal byte-position string check
      ("ProTracker 3." at offset 0, " compilation of " at 14, " by " at
      62). test_corpus_76/DIABOLIS_IN_MUSICA.pt3 has a single corrupted
      byte at offset 0 (")" instead of "P" - the rest of the title text
      is intact), which caused this check to reject the file entirely,
      previously misreported as "genuinely corrupted" and unplayable.
      Investigation of the real Pascal detector, FoundPT3
      (Players.pas:5880-5967), showed it never inspects this title text
      at all - it validates structural pointer/position-list/pattern-
      table consistency starting from byte offset 202 onward. Confirmed
      via tests/oracle_diff (RunPT3FileTest / run_pt3_file, which call
      LoadTrackerModule/pt3_file_load directly, bypassing any
      detection layer) that this file's PCM output is byte-identical
      between the real Pascal engine and the C port - the file was never
      a decoding problem, only an ay_player detection false-negative.
      Fixed by adding ".pt3" to detect_by_extension() (format.c), the
      same Tier-A-trusted-extension fallback already used for PT1/GTR/
      FLS/STC/STP/PT2/FXM/PSM/ASC/ASC0/FTC/PSC/SQT - the content
      signature still fires first for well-formed files (no behavior
      change for any other file), and the extension fallback now catches
      this one when the signature fails on cosmetic title corruption.
    rationale: >
      Closed as validated: DIABOLIS_IN_MUSICA.pt3 now detected as PT3 and
      plays (confirmed audible via smoke_test.sh), matching the real
      Pascal codebase's own behavior (which was independently verified
      via oracle-diff, not assumed). Zero regressions - full
      tests/oracle_diff/run_diff.sh and tools/ay_player/smoke_test.sh
      both pass unchanged for every other format.
    verification: >
      tools/ay_player/smoke_test.sh: added a check_format line for
      DIABOLIS_IN_MUSICA.pt3, confirming "detected as PT3, audible=yes".
      tests/oracle_diff/run_diff.sh: full suite re-run, all pre-existing
      gates still pass byte-identical (no changes needed there - this
      was an ay_player-only fix, not a decoder change).

  - id: MIG-0043
    title: "WAV-snippet oracle-diff coverage for all remaining tracker formats"
    subsystem: ay_emul/OracleHarness.pas, tests/oracle_diff
    state: validated
    summary: >
      Before this entry, only 5 of the 17 formats tools/ay_player supports
      (VTX, AY, YM, PT3, and a not-gated SNDH) had a Pascal-side WAV-export
      oracle scenario to compare byte-for-byte against ay_player's own
      --wav= output - the other 12 tracker-family formats (PT1, GTR, FLS,
      STC, STP, PT2, FXM, PSM, ASC, ASC0, FTC, PSC, SQT) only had the
      lower-level raw-PCM gates (RunXFileTest vs dump_engine_state),
      leaving no way to verify the actual WAV container tools/ay_player
      writes for those formats matches the real codebase end-to-end. Added
      Run<X>WAVExportTest for all 12 (OracleHarness.pas), each reusing the
      exact same LoadTrackerModule/InitTrackerModule setup already verified
      in the corresponding RunXFileTest, but writing through a new shared
      WriteTrackerWAV helper (the 44-byte RIFF/WAVE header populate -> loop
      MakeBufferTracker bounded by Real_End_All -> seek back and rewrite
      header with the real frame count, i.e. Convs.pas's WAV_Converter core
      logic, same approach RunVTXWAVExportTest/RunPT3WAVExportTest already
      established) instead of duplicating that header logic 12 times.
      WaveExportBufferLen=512/WaveExportNumBuffers=862 (441344 frames,
      ~10.01s at the default 44100Hz) was chosen to render a "first ~10
      seconds" snippet, matching the request that prompted this entry.
      Wired all 12 into RunOracleHarness's scenario dispatch
      (wav_export_pt1/gtr/fls/stc/stp/pt2/fxm/psm/asc/asc0/ftc/psc/sqt) and
      into tests/oracle_diff/run_diff.sh's automated gate, each driving
      tools/ay_player's existing --wav=/--frames= CLI flags against the
      same 441344-frame count for an exact `cmp`.
    rationale: >
      Closed as validated: all 12 new wav_export_<fmt> scenarios produce
      WAV output byte-identical (via cmp, not just a hash comparison) to
      tools/ay_player's own --wav= output for one real corpus file per
      format, run alongside the 5 pre-existing WAV-export gates (VTX/AY/
      YM/PT3) with zero regressions. This closes the last remaining gap in
      end-to-end (container-level, not just raw-PCM) verification that the
      C11 port is a behaviorally accurate port of the Pascal codebase for
      every one of the 17 ay_player-supported formats (SNDH remains
      deliberately excluded from automation - MIG-0021/MIG-0026 - its
      Pascal-side MakeBufferSNDH is minutes-per-call slow and produces zero
      frames within any practical render window in this environment,
      unrelated to this entry).
    verification: >
      tests/oracle_diff/run_diff.sh: full suite re-run (52 [PASS] lines,
      zero [FAIL], exit 0), including the new "wav_export (<fmt>,
      <filename>)" lines for pt1/gtr/fls/stc/stp/pt2/fxm/psm/asc/asc0/ftc/
      psc/sqt, each byte-identical between OracleHarness.pas's
      wav_export_<fmt> scenario and tools/ay_player --wav=...
      --frames=441344 for one real test_corpus_76/ file per format
      (DEMON.pt1, L.Boy_broken.gtr, SimpletonGift1.fls, AWAY.stc,
      Girls_of_Meladze.stp, NOR.MUS..pt2, The_Last_V8.fxm, m16.psm,
      NEWDANCE.asc, MISTERS_BOX.as0, RE-TRIGG.ftc, Inbetween_remix.psc,
      MotorAnimation.sqt). lazbuild --build-mode=release Ay_Emul.lpi
      compiles clean (only the pre-existing benign "Comment level 2 found"
      warning, unrelated).

