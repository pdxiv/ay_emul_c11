  - id: MIG-0034
    title: "FXM (Fuxoft AY Music) module format port"
    subsystem: engine/fxm_file
    state: validated
    summary: >
      engine/src/fxm_file.c ports Players.pas's FT.FXM tracker format
      (FXM_Get_Registers, Players.pas:11700-11972; InitTrackerModule's
      FT.FXM branch, Players.pas:3041-3088) - seventh of the 13 tracker
      formats needed for MIG-0028's "make all 76 corpus files playable"
      effort, and structurally the most complex ported so far. Unlike
      every prior format: (1) FXM has no per-file Delay/DelayCounter
      tempo gate at all - each channel's PatternInterpreter is a small
      bytecode VM (jumps $80, calls $81/$89, loop-counters $82/$83,
      register-set opcodes, a push/pop stack "Stek" shared between calls
      and loops and even transposition save/restore $8F/$90) invoked
      once per tick, running an unbounded number of VM instructions until
      it consumes an actual note opcode (0-$7F) and returns - modeled
      here with a fixed-size per-channel stack (FXM_STEK_MAX=256 words)
      rather than Pascal's unbounded dynamic array, since real pattern
      data nests only a few levels deep (a deliberate, documented bound,
      not a silent behavioral gap: overflow is guarded against rather
      than causing memory corruption, and no corpus file approaches it);
      (2) its on-disk layout is unique - the first 6 file bytes are NOT
      part of the module RAM at all, bytes 4-5 hold a little-endian load
      address that is BOTH the skip-past offset on the input side AND the
      destination offset for the copy into Index[] (confirmed via
      Players.pas:2237-2240,2249,2257-2261 read together - most other
      relocated formats only adjust on-disk pointer VALUES, not the copy
      destination itself); (3) FXM's own FormatSpec
      (PlConsts[CNum].amad_andsix, used by opcode $8D's noise-base mask)
      is hardcoded to 31 for every real FXM file (Players.pas:7542 sets
      PLItem.FormatSpec:=31 unconditionally when identifying .fxm files -
      not a variable read from the file header), so this port hardcodes
      the mask to 31 rather than threading a parameter through; (4) the
      final AY mixer register is assembled from 3 independent per-channel
      FXM_Mixer bytes (`A or B shl 1 or C shl 2, and $3F`), not a single
      shared TempMixer accumulator like every prior format.
      tools/ay_player wires FXM in via extension-based fallback detection
      only (`.fxm`) - FXM actually has a real Ay_Emul.fmt byte signature
      ("FXSM"@0, confirmed in tools/identify_ay_file's
      detect_signature_trackers.c), but real Pascal's own Module_Detector
      never checks for it (only Tier A's .fxm extension or a ZXAY+AMAD
      container reaches FXM), so this port deliberately does NOT
      content-sniff it either, to avoid being more permissive than real
      playback behavior.
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt, despite this format's VM-style
      PatternInterpreter and unique file-layout mechanics being
      genuinely novel among the formats ported so far - verified against
      the literal Pascal source (including every opcode's exact
      byte-consumption count, since this repeat-loop has no common
      trailing increment unlike FLS/STP/GTR/PT2, and the file's real
      6-byte-skip/address mechanics) rather than assumed from any prior
      format's precedent, per this workspace's porting-invariant to
      verify rather than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's fxm_file gate: OracleHarness.pas's
      RunFXMFileTest (real Pascal, via LoadTrackerModule/FXM_Get_Registers/
      MakeBufferTracker, replicating the real 6-byte-skip/address-as-copy-
      destination mechanics directly since PPLItem=nil bypasses AddFile)
      vs dump_engine_state's run_fxm_file (this port, via
      fxm_file_load/fxm_file_make_buffer - fxm_file_load takes the RAW
      file bytes and does its own 6-byte-skip/address handling
      internally, unlike every other X_file_load in this project), both
      driving test_corpus_76/The_Last_V8.fxm for 400 buffers of 512
      frames each (819200 bytes stereo16 PCM total) - `cmp` confirms
      byte-identical output. Also smoke-tested end-to-end through
      tools/ay_player/smoke_test.sh (extension-based detection, WAV
      export, audible content).

  - id: MIG-0035
    title: "PSM (Pro Sound Maker) module format port"
    subsystem: engine/psm_file
    state: validated
    summary: >
      engine/src/psm_file.c ports Players.pas's FT.PSM tracker format
      (PSM_Get_Registers, Players.pas:11974-12281; InitTrackerModule's
      FT.PSM branch, Players.pas:3845-3871) - eighth of the 13 tracker
      formats needed for MIG-0028's "make all 76 corpus files playable"
      effort. LoadTrackerModule has no FT.PSM-specific branch (its
      on-disk pointers need no load-time relocation, like STC). Notable
      per-format behavior distinct from every prior format: (1) channels
      are processed C, B, A (not A, B, C) - PSM_C alone drives the shared
      position-advance logic, confirmed by reading the literal Pascal
      order rather than assumed from precedent; (2) it has a genuine
      single-level call/return mechanism (RetCnt/RetAddress, opcode $F9)
      distinct from FXM's full stack-based one; (3) its `Note_Skip_Counter`
      field is byte-typed (wraps mod 256) and gates pattern advance on
      exact-zero, unlike every prior format's shortint-typed
      Note_Skip_Counter gating on `<0`; (4) it has real sample/ornament
      loop-counter machinery (LoopCnt/VolCnt interacting with per-sample
      loop-point and volume-slide data) and an envelope subsystem with two
      distinct encodings (a direct AY envelope-period write when
      EnvType>=$B1, vs. a PSM_Table-driven table lookup below that
      threshold); (5) it has a genuine natural-end condition
      (PSM_Parameters.Finished, set when the position list's double-255
      terminator is reached) that halts all further register updates
      (amplitudes zeroed, tone/mixer left at their last value) - unlike
      every other tracker format ported so far in this project, which
      loop forever by design. Reuses PSM_Table (Players.pas:1014-1022,
      confirmed distinct from PT3NoteTable_ST and ST_Table).
      tools/ay_player wires PSM in via extension-based fallback detection
      only (`.psm`) - like FXM, PSM has a real Ay_Emul.fmt byte signature
      ("psm1"@8) that real Pascal's Module_Detector never actually checks
      (same identify_ay_file citation as FXM's MIG-0034 entry), so this
      port doesn't content-sniff it either. player_real_end_all() for PSM
      returns the real PSM_Parameters.Finished flag (not a hardcoded
      false like every other format wired in so far), since it's a
      genuine natural-end signal.
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt, including the C-B-A channel
      order, the byte-typed exact-zero Note_Skip_Counter gate, and the
      loop-counter/envelope machinery - verified against the literal
      Pascal source rather than assumed from prior formats' precedent,
      per this workspace's porting-invariant to verify rather than
      assume.
    verification: >
      tests/oracle_diff/run_diff.sh's psm_file gate: OracleHarness.pas's
      RunPSMFileTest (real Pascal, via LoadTrackerModule/PSM_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_psm_file (this port,
      via psm_file_load/psm_file_make_buffer), both driving
      test_corpus_76/m16.psm for 400 buffers of 512 frames each (819200
      bytes stereo16 PCM total) - `cmp` confirms byte-identical output.
      Also smoke-tested end-to-end through tools/ay_player/smoke_test.sh
      (extension-based detection, WAV export, audible content).

  - id: MIG-0036
    title: "ASC (ASC Sound Master) module format port, ASC1 and ASC0"
    subsystem: engine/asc_file
    state: validated
    summary: >
      engine/src/asc_file.c ports Players.pas's FT.ASC/FT.ASC0 tracker
      format (ASC_Get_Registers, Players.pas:9709-10051;
      InitTrackerModule's shared FT.ASC/FT.ASC0 branch, Players.pas:3262-
      3367, almost entirely FillChar-redundant comments) - ninth of the
      13 tracker formats needed for MIG-0028's "make all 76 corpus files
      playable" effort, and the first to need TWO real corpus files
      (NEWDANCE.asc and MISTERS_BOX.as0) since ASC0 is a genuinely
      different on-disk layout, not just a variant flag. ASC0 lacks
      ASC1's LoopingPosition byte, so LoadTrackerModule's FT.ASC0 branch
      (Players.pas:2383-2392) shifts the file's bytes right by one
      starting at offset 1 (an in-place, overlapping move) to open up
      that slot, zeroes it, then increments the 3 (now-shifted) pointer
      fields' VALUES by 1 to compensate - asc_file_load replicates this
      exact shift+fixup (via memmove, confirmed correct for the
      overlapping/forward-shift direction) before treating ASC/ASC0
      identically as ASC1's layout.
    rationale: >
      Closed as validated: oracle-diff byte-identical for both ASC and
      ASC0 against the real Pascal codebase, after a real bug was caught
      and fixed via this exact gate - not assumed correct from template
      similarity. The bug: PatternInterpreter's 4 terminal ("break")
      opcodes (note-set 0-$55, $56-$5D, $5E, $5F) got a spurious EXTRA
      address-pattern increment. Every other format ported in this
      project (FLS/STP/GTR/PT2/PSM) uses a "common trailing increment
      always fires each loop iteration" structure where terminal branches
      correctly do ZERO of their own increments, relying entirely on that
      common increment for their net +1 displacement - because Pascal's
      `break` (which those formats' real source also uses) skips the
      statement after the case block entirely. For ASC, the initial port
      mistakenly ALSO included each terminal branch's own explicit inner
      increment (mirroring the Pascal source's `Inc(Address_In_Pattern);
      break;` literally) while the C loop's common trailing increment
      still fired unconditionally regardless of the `quit` flag - double-
      counting the displacement and silently desyncing the pattern
      pointer by 1 extra byte per terminal opcode. This was invisible for
      416 frames' worth of channel A (the pattern only mis-decodes when
      the extra desync eventually crosses an opcode-boundary and repeats
      a byte or skips one), which is why oracle-diff caught it via a
      failure ~6 tracker ticks (frame 26881) into playback rather than
      immediately. Found via a temporary per-tick register/state trace
      hook added to both engine/src/asc_file.c (asc_get_registers_test_
      hook, removed after diagnosis) and a matching OracleHarness.pas
      scenario (RunASCRegTraceTest, removed after diagnosis) dumping
      channel-B's Address_In_Pattern/Point_In_Sample/Sample_Finished
      alongside AY registers tick-by-tick; the two traces matched exactly
      for the file's LOAD-time state (ruling out a load bug) but diverged
      starting at tick 1's very first PatternInterpreter call, isolating
      the bug to the interpreter's address-advance logic specifically.
      Fix: removed the note branch's initial "note byte" increment and
      the three simple terminal branches' single increments entirely,
      keeping only the note branch's conditional "envelope byte" inner
      increment (still needed, since Pascal's own source does two
      increments there) - now correctly relying solely on the common
      trailing increment for the base +1, matching this project's own
      established (and previously correct) convention from FLS/STP/GTR/
      PT2/PSM exactly.
    verification: >
      tests/oracle_diff/run_diff.sh's asc_file and asc0_file gates:
      OracleHarness.pas's RunASCFileTest (real Pascal, via
      LoadTrackerModule/ASC_Get_Registers/MakeBufferTracker, parameterized
      by FT.ASC vs FT.ASC0) vs dump_engine_state's run_asc_file (this
      port, via asc_file_load/asc_file_make_buffer, parameterized by
      is_asc0), driving test_corpus_76/NEWDANCE.asc and
      test_corpus_76/MISTERS_BOX.as0 respectively for 400 buffers of 512
      frames each (819200 bytes stereo16 PCM total per file) - `cmp`
      confirms byte-identical output for BOTH files. Also smoke-tested
      end-to-end through tools/ay_player/smoke_test.sh (extension-based
      detection for both `.asc` and `.as0`, WAV export, audible content).

  - id: MIG-0037
    title: "FTC (Fasttracker Compiled) module format port"
    subsystem: engine/ftc_file
    state: validated
    summary: >
      engine/src/ftc_file.c ports Players.pas's FT.FTC tracker format
      (FTC_Get_Registers, Players.pas:10845-11174; InitTrackerModule's
      FT.FTC branch, Players.pas:3368-3420ish; the Version-selection
      logic gating GetNoteFreq's choice of note table, Players.pas:2611-
      2617) - tenth of the 13 tracker formats needed for MIG-0028's "make
      all 76 corpus files playable" effort. Structurally simpler in one
      respect than ASC/GTR/STC: FTC's PatternInterpreter repeat-loop uses
      a literal `until quit` condition (no `break` anywhere), so the
      common trailing address increment always fires unconditionally and
      every branch's own inner increments are additive on top of it with
      no double-counting risk (the exact class of bug MIG-0036/ASC hit
      was structurally impossible here) - confirmed by reading the full
      opcode set with no exceptions. Notable per-format behavior: (1) a
      GetNoteFreq() dispatcher chooses between 3 different note tables
      (PT3NoteTable_ST for Version<7; FTCNoteTable2 or ST_Table for
      Version>=7, selected by a byte in the module's own embedded name
      string) - Version itself derived once at load time from two ASCII-
      digit-checked bytes in FTC_MusicName, folded into ftc_file_load
      rather than recomputed per tick; (2) a persistent tone-slide
      accumulator (Current_Ton_Sliding/Ton_Slide_Step/Ton_Slide_Direction)
      auto-configured from the difference between consecutive notes'
      frequencies when a specific pattern-local flag (EXXAF) ends a
      PatternInterpreter call at exactly 0; (3) a real hardware-quirk
      workaround at the top level - the AY's envelope-shape register
      (reg 13) is only rewritten when the desired shape actually differs
      from its last-written value (real AY hardware restarts the
      envelope on every write to R13, even same-value writes), except
      when a "Retrig" imitation is active, which also directly resets a
      channel's internal tone counter (ay_chip's ton_counter_a/b/c,
      documented in ay.h as modeling only the real record's ".Hi" half)
      to force an immediate tone-phase reset next tick.
      tools/ay_player wires FTC in via extension-based fallback detection
      (`.ftc`) rather than content-sniffing: real Pascal actually reaches
      FTC through a structural heuristic validator (FoundFTC,
      Players.pas:6973), not a simple byte signature, and
      tools/identify_ay_file's own approximate "Module: "+";Fast Tracker
      v1.00" signature was confirmed (empirically, against
      test_corpus_76/RE-TRIGG.ftc) to NOT match every real file - porting
      FoundFTC itself is out of scope here, so the reliable
      extension-based path is used instead of an approximate,
      sometimes-wrong content signature.
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file (RE-TRIGG.ftc, chosen specifically to exercise the
      retrig imitation path its name references) on the first attempt -
      verified against the literal Pascal source (including the
      no-`break`/always-fires-common-increment control flow, the
      Version-gated note table selection, and the envelope-rewrite-
      avoidance quirk) rather than assumed from prior formats'
      precedent, per this workspace's porting-invariant to verify rather
      than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's ftc_file gate: OracleHarness.pas's
      RunFTCFileTest (real Pascal, via LoadTrackerModule/FTC_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_ftc_file (this port,
      via ftc_file_load/ftc_file_make_buffer), both driving
      test_corpus_76/RE-TRIGG.ftc for 400 buffers of 512 frames each
      (819200 bytes stereo16 PCM total) - `cmp` confirms byte-identical
      output. Also smoke-tested end-to-end through
      tools/ay_player/smoke_test.sh (extension-based detection, WAV
      export, audible content).

  - id: MIG-0038
    title: "PSC module format port"
    subsystem: engine/psc_file
    state: validated
    summary: >
      engine/src/psc_file.c ports Players.pas's FT.PSC tracker format
      (PSC_Get_Registers, Players.pas:10053-10423; InitTrackerModule's
      FT.PSC branch, Players.pas:3516-3569; the Version-selection logic,
      Players.pas:2600-2606) - eleventh of the 13 tracker formats needed
      for MIG-0028's "make all 76 corpus files playable" effort. Like
      FTC, its PatternInterpreter uses a literal `until quit` loop
      condition (no `break`), so the common trailing address increment
      always fires safely with no double-counting risk. Two behaviors
      distinct from every format ported so far: (1) two opcodes ($7A
      envelope-set, $7B noise-base-set) only take effect when processed
      by channel B specifically (`if @Chan = @PlParams[CNum].PSC_B` in
      the real source) - replicated via an explicit chan_id parameter to
      pattern_interpreter rather than pointer-identity comparison; for
      $7A specifically, channel B's pattern pointer ALSO advances two
      bytes further than A/C would for the exact same opcode byte - a
      real, literal asymmetry in the Pascal source (not a porting
      simplification), safe in practice only because real pattern data
      places $7A exclusively in channel B's own stream; (2) the note-set
      opcode (0..$56) does NOT set `quit` (unlike every other tracker
      format ported so far, where setting a note always terminates the
      opcode loop) - PatternInterpreter keeps consuming more opcodes
      after a note until it hits the $C0-$FF "note skip count" opcode,
      confirmed by reading the literal case statement (no `quit := True`
      in that branch) rather than assumed from other formats' precedent.
      Also notable: the envelope-period adjustment (opcode-driven, inside
      GetRegisters) is a direct read-modify-write on the actual AY
      envelope register (reg 11/12) rather than a per-channel accumulator
      field like PT1/GTR/STC use - `Envelope := Envelope + delta`
      operates on SoundChip.RegisterAY.Envelope itself. Reuses ASM_Table
      (same table ASC uses, duplicated per this project's per-file
      convention).
      tools/ay_player wires PSC in via extension-based fallback detection
      only (`.psc`): real Pascal reaches PSC purely via FoundPSC (a
      structural heuristic validator, Players.pas:5969, same class of
      detection as FTC's FoundFTC), and tools/identify_ay_file doesn't
      even attempt an approximate byte signature for PSC (unlike its
      FTC attempt, which MIG-0037 already found to be unreliable) - so
      extension-only detection is the correct choice here, not a
      shortcut.
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt - verified against the literal
      Pascal source (including the channel-B-only opcodes' asymmetric
      pointer advance and the non-terminating note-set opcode) rather
      than assumed from prior formats' precedent, per this workspace's
      porting-invariant to verify rather than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's psc_file gate: OracleHarness.pas's
      RunPSCFileTest (real Pascal, via LoadTrackerModule/PSC_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_psc_file (this port,
      via psc_file_load/psc_file_make_buffer), both driving
      test_corpus_76/Inbetween_remix.psc for 400 buffers of 512 frames
      each (819200 bytes stereo16 PCM total) - `cmp` confirms
      byte-identical output. Also smoke-tested end-to-end through
      tools/ay_player/smoke_test.sh (extension-based detection, WAV
      export, audible content).

  - id: MIG-0039
    title: "SQT (SQ-Tracker) module format port - last of the 13"
    subsystem: engine/sqt_file
    state: validated
    summary: >
      engine/src/sqt_file.c ports Players.pas's FT.SQT tracker format
      (SQT_Get_Registers, Players.pas:10425-10843; InitTrackerModule's
      FT.SQT branch, Players.pas:3809-3842; LoadTrackerModule's FT.SQT
      branch, Players.pas:2393-2423) - the thirteenth and last tracker
      format needed for MIG-0028's "make all 76 corpus files playable"
      effort, now complete: all 76 test_corpus_76 files are playable
      identically to the real Pascal codebase. Structurally the most
      complex format ported in this whole effort: its PatternInterpreter
      is written as a small tree of named subroutines (Call_LC1D1,
      Call_LC2A8, Call_LC2D9, Call_LC283, Call_LC191 - names reading like
      disassembly labels, suggesting the original Pascal player was
      itself reverse-engineered from real Z80 SQ-Tracker replay code)
      sharing a local "Ptr" cursor via Pascal nested-procedure closure -
      modeled here with plain C functions taking an explicit `uint16_t*
      ptr` parameter. Unlike this project's other tracker ports (which
      flatten opcode handling into if/elseif chains with a `quit` flag),
      this port uses real C `break` statements mirroring the Pascal
      source's own `break` placement 1:1, because SQT's break placement
      is genuinely irregular: inside the $80-$BF opcode, one sub-branch
      conditionally breaks BEFORE reaching code (Call_LC191) that every
      other path through that same opcode falls through to - a flattened
      quit-flag translation would risk silently losing that early exit,
      so exact control-flow fidelity was prioritized over consistency
      with sibling ports' style.
      Also unlike every other port so far: (1) load-time relocation is a
      genuine heuristic unconditionally applied (no MAddr/PPLItem
      gating like FTC's) - the base offset is `SQT_SamplesPointer - 10`
      (a fixed constant, not a stored address like GTR's, and not
      brute-force-searched like FLS's), then the position-list data is
      scanned to size a bulk word-relocation covering
      SamplesPointer/OrnamentsPointer/PatternsPointer/PositionsPointer/
      LoopPointer and the immediately-following pattern-index table, all
      as one contiguous run of words; (2) channel processing order is C,
      B, A (matching PSM, not the A-B-C every other format uses); (3)
      GetRegisters has NO trailing "TempMixer shr 1" - only a LEADING
      "TempMixer shl 1" - a genuinely different mixer-accumulation scheme
      finalized via `TempMixer := (-(TempMixer+1)) and $3F` at the top
      level, confirmed by reading the literal source rather than assumed
      from the shr-based pattern every other format uses.
      tools/ay_player wires SQT in via extension-based fallback detection
      only (`.sqt`): real Pascal reaches SQT purely via FoundSQT (a
      structural heuristic, same class of detection as FTC/PSC's
      FoundFTC/FoundPSC), and tools/identify_ay_file's own
      detect_sqt_structural reimplements that heuristic rather than using
      a simple byte signature - porting FoundSQT itself is out of scope,
      so extension-only detection is used, consistent with FTC/PSC/GTR/
      FLS/PSM/FXM/ASC's own precedent.
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt, despite this being the most
      structurally complex format in the entire 13-format effort (a
      genuine subroutine-call tree with irregular break placement, plus
      a heuristic load-time relocation) - verified against the literal
      Pascal source (including the exact break-vs-fall-through control
      flow in the $80-$BF opcode, the C-B-A channel order, and the
      shl-only/no-shr mixer scheme) rather than assumed from any prior
      format's precedent, per this workspace's porting-invariant to
      verify rather than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's sqt_file gate: OracleHarness.pas's
      RunSQTFileTest (real Pascal, via LoadTrackerModule/SQT_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_sqt_file (this port,
      via sqt_file_load/sqt_file_make_buffer), both driving
      test_corpus_76/MotorAnimation.sqt for 400 buffers of 512 frames
      each (819200 bytes stereo16 PCM total) - `cmp` confirms
      byte-identical output. Also smoke-tested end-to-end through
      tools/ay_player/smoke_test.sh (extension-based detection, WAV
      export, audible content). With this format done, all 13 tracker
      formats needed by test_corpus_76/ (PT1, GTR, FLS, STC, STP, PT2,
      FXM, PSM, ASC/ASC0, FTC, PSC, SQT) are ported and oracle-validated -
      MIG-0028's "make all 76 corpus files playable" effort is complete.

  - id: MIG-0040
    title: "PT3 full note-table support (5 remaining PT3NoteTable_* variants)"
    subsystem: engine/pt3_file
    state: validated
    summary: >
      engine/src/pt3_file.c's get_note_freq() previously always returned
      PT3_NOTE_TABLE_ST, and pt3_file_load() hard-rejected any file whose
      PT3_TonTableId byte (offset 99) wasn't 1 (PT3_FILE_ERR_BAD_HEADER) -
      an honestly-tracked gap from MIG-0020, since both real test files
      at the time happened to use TonTableId=1. This closes that gap:
      added the 5 remaining PT3NoteTable_* tables (PT_33_34r/PT_34_35/
      ASM_34r/ASM_34_35/REAL_34r/REAL_34_35, Players.pas:1041-1115, each
      transcribed directly from the literal source - confirmed
      REAL_34r/REAL_34_35 differ at exactly one entry, index 43
      (0x0113 vs 0x0112), not assumed identical) and rewrote get_note_freq
      to replicate GetNoteFreq's real 4-way dispatch (Players.pas:12304-
      12322): TonTableId 0/1/2/else, with 0/2/else each further gated on
      PlConsts[CNum].Version<=3 (already computed/stored as f->version) -
      TonTableId=1 (ST) is the only version-independent case. TonTableId
      is NOT a 6-value enum: any id >=3 (the real corpus has
      3,4,5,7,12,16,128,201,240,241,248, all legitimately routed to the
      REAL family) falls into the Pascal `else` branch - not clamped or
      treated as an error. pt3_file_load's rejection was removed entirely;
      every TonTableId value is now valid input.
    rationale: >
      Closed as validated: oracle-diff byte-identical for all 4 TonTableId
      buckets x both version splits (7 of 8 combinations distinct from
      the pre-existing ST-bucket coverage; TonTableId=1 is version-
      independent so only needs the one bucket already covered) against
      real corpus files, chosen specifically per-bucket (not assumed from
      research) via a direct header-byte read (offset 99=TonTableId,
      offset 13=version digit) before wiring each into the oracle-diff
      gate.
    verification: >
      tests/oracle_diff/run_diff.sh's pt3_file loop now iterates 8 files
      (up from 2): the pre-existing ZAGON_07_remixDJ_EchoMAKROSS.pt3 (v4)
      and ZELiNAPI.pt3 (v7), both TonTableId=1/ST, plus InSpace.pt3
      (TonTableId=0,v3), UUUUU.pt3 (TonTableId=0,v4), KETTARYs.pt3
      (TonTableId=2,v3), ChRiStmA.pt3 (TonTableId=2,v4), LoveBlue.pt3
      (TonTableId=3/else,v3), CKA4KU.pt3 (TonTableId=3/else,v6) - all 8
      byte-identical via `cmp` against OracleHarness.pas's RunPT3FileTest
      (unchanged - a generic filename-parameterized scenario, no harness
      code changes needed for this gap).

  - id: MIG-0041
    title: "YM6 (extended) register-reader support"
    subsystem: engine/ym_file
    state: validated
    summary: >
      engine/src/ym_file.c previously unconditionally rejected any
      YM6!-magic file (YM_FILE_ERR_UNSUPPORTED_TYPE), regardless of
      whether it arrived LHA-wrapped or plain - an honestly-tracked gap
