  - id: MIG-0011
    title: "IsFilt/Filt_K FIR filter coefficients ported and validated"
    subsystem: engine/ay
    state: validated
    summary: >
      AY.pas's filter-coefficient design (MainWin.pas:5073-5168,
      TFrmMain.CalcFiltKoefs/SetFilter - a Hamming-windowed-sinc lowpass
      FIR, found in MainWin.pas rather than mixerctl.pas/digsound.pas as
      first guessed) is now ported as ay_engine_set_filter(engine,
      filter_quality, ay_freq, sample_rate) in engine/ay.c, including the
      CPU-budget tap-count cap and the disable-if-SampleRate>=AY_Freq/8
      short-circuit. filt_xl/filt_xr are now dynamically allocated to match
      (ay_engine_free_filter frees them). ay_engine_init() still defaults
      is_filt=-1 (unfiltered) until a caller explicitly calls
      ay_engine_set_filter - a deliberate, documented default (see ay.h),
      since AY.pas's own IsFilt=1 default assumes SetFilter has already run
      at least once (which happens automatically in the original's app
      startup, not automatically here).
    rationale: >
      Closed - the algorithm itself has no GUI dependency even though its
      call sites live in MainWin.pas, confirmed by porting it as a pure
      function and validating against the original.
    verification: >
      tests/oracle_diff/run_diff.sh's "pcm_filtered" scenario passes:
      byte-identical filtered PCM output against ay_emul/OracleHarness.pas's
      RunPCMFilteredTest. Note that harness replicates CalcFiltKoefs's
      formula directly rather than calling the real TFrmMain method (which
      also touches FrmMixer.Label13.Caption and digsoundloop_catch/release,
      needing a live instantiated GUI this harness avoids) - both engine/ay.c
      and the harness are independent transcriptions of the same original
      source lines, so their agreement still meaningfully cross-checks the
      translation, though it is one step short of calling the shipped code
      path verbatim.

  - id: MIG-0012
    title: "Musashi 68000 core integrated and validated against the original's precompiled Starscream core"
    subsystem: engine/m68k_bus
    state: validated
    summary: >
      engine/m68k_bus.c wraps Musashi (engine/third_party/musashi,
      MIT-licensed, replacing the original's precompiled "Starscream"
      object file per PORTING_TO_C11_LINUX.md §3.2/§7.1) with a generic
      address-range memory-region mechanism (flat buffers or read/write
      callbacks, mirroring Starcpu.inc's TSTARSCREAM_DATAREGION/
      PROGRAMREGION) and an interrupt-ack hook matching
      s68000interrupt(level,vector)'s contract. Musashi's core memory
      hooks (m68k_read_memory_8/16/32 etc) are fixed-name, link-time
      functions, not a runtime callback struct - Musashi is a singleton
      core; the adapter holds one process-wide "active bus" pointer
      (acceptable since ay_emul never runs two 68000s concurrently).
    rationale: >
      No ZEXALL-equivalent test suite exists for 68000 cores/Musashi (it
      cites long-term use in MAME as its validation pedigree, and ships
      only an internal test/ harness needing a cross-toolchain to
      regenerate). The oracle-differential technique already built and
      proven for Z80/AY this session filled that gap directly: the
      original's Starcpu64L.o is still linked into the existing app and
      was exercised via a new ay_emul/OracleHarness.pas scenario (m68k),
      driving both it and engine/m68k_bus.c with an identical synthetic
      68000 program (MOVEQ/MOVEQ/ADD.L/MOVE.L/STOP) and comparing register
      state, PC, and a memory write. Building this surfaced and confirmed
      a real Starscream implementation detail: its direct-offset memory
      access (used for instruction fetch, which has no callback
      alternative) requires memory pre-transformed by a 16-bit byte swap
      (atari.pas's IntelizeMemory, a speed optimization) - the oracle
      harness replicates that transform; engine/m68k_bus.c needs no such
      transform since it always composes words from individual big-endian
      byte reads. Per PORTING_TO_C11_LINUX.md §8.1, Starcpu64L.o is used
      here strictly as a local test oracle, never linked into or
      redistributed with the C11 port itself - the port uses Musashi
      exclusively.
    verification: >
      tests/oracle_diff/run_diff.sh's "m68k" scenario passes: identical
      D0, PC, and memory-write results between the real Starscream core
      and engine/m68k_bus.c. tests/engine_smoke/test_m68k_bus.c additionally
      covers flat-memory writes and the callback-region mechanism
      (self-consistency, not yet exercised against the oracle, since no
      real hardware register is wired up this milestone - see MIG-0014).

  - id: MIG-0013
    title: "MFP timer emulation ported and validated"
    subsystem: engine/mfp
    state: validated
    summary: >
      atari.pas's EmulateTimer/MFP_Registers (atari.pas:111-160,356-491)
      emulate the Atari ST's MFP68901's four timers (A-D), which drive
      SNDH's common playback frequencies (sndh.pas's TPlayGen: GenTA..GenTD)
      and gate interrupts into the 68000 core. Ported to engine/mfp.c/.h:
      the 24-byte register file, four mfp_timer structs, mfp_emulate_timer
      (the countdown/reload logic), and register read/write handlers
      matching SetMFPRegister/mfp_readbyte's decode, exposed as an
      m68k_bus callback region at $FFFA00-$FFFA2F.
    rationale: >
      Interrupt DELIVERY intentionally differs from the original - see
      MIG-0013b. The countdown/reload timing and register semantics
      (the actual "MFP emulation" this entry is about) are a faithful,
      validated port.
    verification: >
      tests/oracle_diff's "mfp" scenario: identical countdown-until-fire
      values and IPR-bit-set behavior between atari.pas's real EmulateTimer
      (via ay_emul/OracleHarness.pas's RunMFPTest, driving the new
      Oracle_MFP_* API added to atari.pas for this purpose) and
      engine/mfp.c. tests/engine_smoke/test_atari.c additionally covers
      live-countdown register reads and a full CPU-driven interrupt-firing
      integration test (see MIG-0013b for why that full-delivery path
      isn't oracle-compared).

  - id: MIG-0013b
    title: "MFP/VBL interrupt DELIVERY model deliberately differs from the original (Starscream polling vs Musashi level-triggered)"
    subsystem: engine/mfp
    state: validated
    summary: >
      Discovered while building the "mfp" oracle scenario: atari.pas's real
      EmulateTimer, when a timer's interrupt is both enabled (IE) and
      unmasked (IM), attempts synchronous delivery inline
      (s68000interrupt(6,vector)) and - since Starscream reports success
      against a minimal/degenerate CPU context - immediately auto-clears
      the IPR bit it just set, all within the same EmulateTimer call. This
      is Starscream's own "push this vector now, tell me if taken"
      polling model. engine/mfp.c (and engine/m68k_bus.c/atari_emulate.c
      generally) instead model real level-triggered 68000 interrupt
      hardware: IPL lines asserted via m68k_bus_set_irq, consumed by
      Musashi at its own next eligible instruction boundary via the
      int_ack callback (mfp_ack_interrupt) - there is no "attempt delivery
      inline while computing timer state" step, and none is needed, since
      the CPU services it on its own. The original's per-timer ICnt
      retry counter (for when synchronous delivery fails) is likewise not
      replicated - unnecessary under the level-triggered model.
    rationale: >
      This is the same category of decision as MIG-0001 (Z80 IM0/IM1
      timing): a real, deliberate difference driven by the replacement
      library's architecture, recorded so it's never mistaken for an
      unverified gap. The oracle's "mfp" scenario is deliberately designed
      (IMRA left unmasked=0) to compare only the parts that ARE directly
      comparable between the two models (countdown timing, IPR-bit-set on
      fire) - see RunMFPTest's comment in OracleHarness.pas for the full
      reasoning. Full interrupt-delivery-and-service correctness is
      instead validated via tests/engine_smoke/test_atari.c's
      test_atari_emulate_vbl_scheduling, a real CPU-executed program with
      an interrupt handler, run purely against engine/ - not comparable to
      Starscream's polling model, but a complete demonstration that
      Musashi's level-triggered delivery works end-to-end (99 VBL
      interrupts fired, 99 handler invocations counted).
    verification: >
      tests/engine_smoke/test_atari.c's test_atari_emulate_vbl_scheduling
      (self-consistency, real interrupt delivery via Musashi).
      tests/oracle_diff's "mfp" scenario (register/timing-level agreement
      on the parts common to both models).

  - id: MIG-0014
    title: "DMA sound emulation and YM2149 region wiring ported and validated"
    subsystem: engine/dma_sound
    state: validated
    summary: >
      atari.pas's DMA sound (digital sample playback: start/end/rate/loop/
      mono registers, atari.pas:286,738-891) is ported to
      engine/dma_sound.c/.h: Ctrl_DMASnd's state-machine transition,
      stedac_readbyte/writebyte's register decode (including the live
      position-counter reads), and Atari_MixDMASnd's per-sample fetch/
      scale/hold mixing logic - exposed as an m68k_bus callback region at
      $FF8900-$FF89FF and wired into engine/ay.c's mixer via the new
      on_mix_dma hook (MIG-0008). YM2149 region wiring ($FF8800-$FF88FF,
      engine/src/atari_emulate.c's ym_region_read/write) dispatches
      straight into the already-ported engine/ay.c/ay_chip, confirmed
      (this milestone's oracle work) to match atari.pas's
      soundchip_readbyte/writebyte, which never implements a separate
      YM2149 model either.
    rationale: >
      Closed as planned. STE Microwire ($FF8922-25) is ported as the same
      dummy bit-shifter stub the original uses (confirmed zero audio
      effect in the original too - not a simplification). Not ported:
      DMASndSkipMC68000Takts (confirmed, this milestone, called ONLY when
      Seeking=True - Atari_SeekTo/SynthesizerSNDH's seek branch - never
      during normal forward playback; deferred with the rest of seek/scrub
      support, see MIG-0017) and the original's reentrant SynthesizerSNDH
      flush inside the $FF8901 Ctrl write handler (atari.pas:817-828) -
      render-loop orchestration, out of scope until a real render-loop
      caller exists (MIG-0015).
    verification: >
      tests/oracle_diff's "dma" scenario: byte-identical mixed output
      between atari.pas's real Atari_MixDMASnd (via
      ay_emul/OracleHarness.pas's RunDMATest, driving the new Oracle_DMA_*
      API added to atari.pas) and engine/dma_sound.c. Building this
      scenario caught a real bug before it shipped: dma_sound_mix's
      ay_freq parameter needs atari.pas's OWN AyFreq global (2000000.0,
      Atari_SetDefault) - a completely different value from settings.pas's
      AY_Freq (1773400, the ZX Spectrum's clock) despite the near-identical
      name. tests/engine_smoke/test_atari.c/test_m68k_bus.c's
      test_callback_region additionally cover the mechanism generically.

  - id: MIG-0015
    title: "Atari_Emulate's cycle-budget/interrupt-scheduling loop ported and validated"
    subsystem: engine/atari_emulate
    state: validated
    summary: >
      atari.pas's Atari_Emulate (atari.pas:1436-1523) - the per-tick driver
      analogous to Z80's Z80_Step/MakeBufferAY loop - is ported to
      engine/atari_emulate.c's atari_emulate_step: computes a bounded
      cycle budget per call from the nearest upcoming event across VBL,
      all 4 MFP timers (mfp_emulate_timer), and DMA-sound sample
      boundaries (dma_sound_next_boundary_cycles), executes exactly that
      many 68000 cycles (m68k_bus_exec), injects the VBL interrupt on
      schedule (level 4, autovectored, with the same accept-or-retry-with-
      10%-slack fallback as the original), and flushes the AY mixer
      (ay_synthesizer_ay - the SynthesizerSNDH equivalent) when DMA sound
      is active.
    rationale: >
      Closed for the scheduling logic itself. NOT wired to a real
      render-loop caller (MakeBufferSNDH) or SNDH file loading - that
      needs Players.pas (Phase 2) to exist first, the same reasoning that
      left MakeBufferAY for later in the Z80/AY milestone. The original's
      Starscream-32-bit-odometer renormalization (tripOdometer) is not
      replicated - engine/atari_emulate.c accumulates a plain 64-bit cycle
      counter with no realistic overflow risk, a documented, deliberate
      simplification (see engine/include/ay_engine/atari_emulate.h).
    verification: >
      tests/engine_smoke/test_atari.c's test_atari_emulate_vbl_scheduling:
      a full, real 68000 program (with an interrupt vector table entry and
      handler) driven through 200 atari_emulate_step calls, confirming VBL
      interrupts fire on schedule and are correctly serviced (99/99 fires
      counted). See MIG-0013b for why this integration-level interrupt-
      delivery test is self-consistency-only, not oracle-compared.

  - id: MIG-0019
    title: "Real .ym (YM5!, LHA-compressed, extended-Song_Attr) file loading/playback"
    subsystem: engine/lh5, engine/ym_file
    state: validated
    summary: >
      engine/src/lh5.c ports ay_emul/lh5.pas's "-lh5-" LZH/LHA decompressor
      (decompression only; the compression path, Encode_Buffer_To_File, is
      never needed since this project only reads .ym files, never writes
      them) as a whole-buffer decompress function - the streaming/
      handle+callback abstraction in the original is unneeded because
      Players.pas's only caller always requests the entire unpacked size in
      one call. Verified byte-for-byte against `lha x`'s independent
      decompression of the real test file's compressed payload before any
      oracle-diff work started.

      engine/src/ym_file.c ports the real Sergey Bulba/FUXOFT YM5!
      "extended" format (Song_Attr's low bit set - confirmed this is what
      test_corpus_76/Batman_Journey.ym uses, the replacement for the
      original songs/cpc/"The Last V8.ym" fixture after the songs/ ->
      test_corpus_76 migration; re-confirmed loadable via a standalone
      ym_file_load probe before adopting it, and the full byte-identical
      oracle-diff re-run below): the LHA container detection +
      TLZHFileHeader parse (Players.pas:7708-7736), the YM5 header +
      digidrum-descriptor-table + Title/Author/Comment string scan to
      locate the register-data offset (Players.pas:7745-7814,
      2812-2870), YM5i_Get_Registers (Players.pas:13653-13819, the
      register-plane reader for the extended variant), the shared
      YM6_Extra_GetRegisters Atari-MFP-style sub-timer "extra effects"
      engine (Players.pas:12915-13004, up to two simultaneous hardware-
      envelope/digidrum/sinus effect channels), and SynthesizerYM6
      (AY.pas:1117-1127). Also reproduces the Set_Chip_Frq/Set_Player_Frq/
      Set_MFP_Frq arithmetic cores needed to derive AY_Freq/
      Interrupt_Freq/MFPTimerFrq/Delay_In_Tiks/YM6TiksOnInt from the
      file's own ChipFrq/InterFrq header fields (MainWin.pas:1544-1548,
      1570, 2070-2072) - same bounded-arithmetic-only approach as
      ay_file_set_chip_freq (MIG-0018).

      A genuine bug was caught by this dispatch during porting: the first
      C-side attempt routed YM6_Extra_GetRegisters's square-wave/digidrum/
      sinus register writes (effect types 0/1/2) through
      ay_chip_set_ay_register_fast (which dispatches through SetAmplA/B/C,
      updating Envelope_EnA/B/C as a side effect) - re-reading the real
      Pascal confirmed these three cases write RegisterAY.Index[...]
      directly, bypassing that side effect entirely (only effect type 3,
      "explicit envelope", goes through a real setter). Fixed to write
      ay_chip.reg[] directly for types 0/1/2, matching the original
      exactly - caught by close reading before it ever reached oracle
      comparison, not by a diff mismatch.
    rationale: >
      Closed as validated for the exact case our real test file exercises.
      Deliberately NOT ported this pass (see ym_file.h's file comment for
      the equivalent detail):
        - YM5_Get_Registers / YM6_Get_Registers / YM6i_Get_Registers (the
          non-extended-YM5 and both YM6 variants) - structurally similar,
          unexercised by test_corpus_76/Batman_Journey.ym (or any other
          file this project's automated tests drive through ym_file.c).
        - Digidrum sample format conversion (YMizeSample / the linear-PCM-
          to-YM-amplitude-table lookup, Players.pas:2833-2852) - our
          original test file had Num_of_Dig=0, making this dead code for
          it; the replacement fixture's exact Num_of_Dig was not
          independently re-verified (it is LZH-wrapped, so identify_ay_file
          can't peek it without decompressing - see its own "Known
          limitations"), but the oracle-diff re-run below is fully
          byte-identical, so whatever this file's actual digidrum count
          is, both implementations agree on it. The descriptor-table parse
          itself IS ported (so a future file with real digidrums fails
          loudly via an index-range check rather than silently
          misplaying), but the samples' bytes would be used as-is,
          unconverted, until this is revisited.
        - AtariSE1Type/AtariSE2Type values other than what YM5i's own code
          path drives (SE1 type 0 "square/hardware-envelope" always; SE2
          type 1 "digidrum" is structurally reachable but provably inert
          for any file with zero digidrum samples, confirmed via
          Players.pas:13772's `AtariParam2 >= Length(DDrumSamples)` guard).
        - YM3/YM3b/YM2/VTX (the simpler, non-LHA, non-extended-header
          sibling formats, using MakeBufferVTX/VTX_YM3_YM3b_Get_Registers
          - a different code path entirely) - VTX gets its own milestone
          (test_corpus_76/GB2_5.vtx).
      Also noteworthy for future oracle-harness work on this file family:
      AtariSE1Type/AtariSE2Type/AtariSE1Channel/AtariSE2Channel/
      AtariTimerCounter1/2/AtariV1/AtariV2/YM6SinusPos1/2/DDrumSamples are
      all declared in Players.pas's IMPLEMENTATION section (Players.pas:
      1171-1180), not its interface, so OracleHarness.pas cannot set them
      explicitly the way it does for the (interface-declared) FT.AY
      globals - RunYMFileTest instead relies on being a fresh process
      invocation (Pascal's guaranteed zero/nil default for these), which
      is confirmed equivalent to Players.pas's real init block for every
      field except AtariSE2Type - and that one exception is proven not to
      matter for a Num_of_Dig=0 file (see summary). This reasoning would
      need revisiting for a test file that actually uses digidrums.
    verification: >
      tests/engine_smoke/test_ym_file.c: loads and plays
      test_corpus_76/Batman_Journey.ym for 400 buffers (204800 frames),
      confirms audible (non-all-zero) output and no crash; also confirms a
      malformed header is rejected. Re-run and re-confirmed passing after
      the songs/ -> test_corpus_76 fixture migration.
      tests/oracle_diff/run_diff.sh's `ym_file` scenario: byte-identical
      PCM output (4 buffers, 512 stereo16 frames each) between
      engine/src/lh5.c+ym_file.c and the real Players.pas/AY.pas code via
      OracleHarness.pas's RunYMFileTest - a hard pass/fail gate (unlike
      MIG-0018's ay_file scenario, this one fully passes).
      Two real bugs were caught and fixed by this comparison before it
      passed: (1) OracleHarness.pas's RunYMFileTest initially crashed
      with a floating-point exception because Tik.Re was never reset to
      the file's own Delay_In_Tiks after ResetChip0 set it from the
      not-yet-computed value 0 (same class of mistake as MIG-0018's
      missing-BufferLength bug - Averager16 divided by the resulting
      zero Tick_Counter.Hi); (2) the register-write side-effect bug
      described in this entry's summary, caught by re-reading the source
      rather than by the diff itself.

  - id: MIG-0020
    title: "Real .pt3 (Pro Tracker 3) file loading/playback"
    subsystem: engine/pt3_file
    state: validated
    summary: >
      engine/src/pt3_file.c ports the Pro Tracker 3 tracker/module format
      (FT.PT3) for standalone files (no embedded/rebased-pointer loading -
      confirmed dead code for both real test files, see pt3_file.h):
      the file-into-RAM load (Players.pas:2248-2264), PT3_Get_Registers in
      full (Players.pas:12302-12767 - GetNoteFreq, PatternInterpreter, the
      9-numbered-effect-command interpreter, ChangeRegisters, and the main
      per-frame body), and the InitTrackerModule FT.PT3 init block
      (Players.pas:3717-3806). Unlike AY/YM, this is a genuine event/
      tracker engine (pattern/sample/ornament interpretation against
      note-pitch and volume tables), not a register-dump format - no Z80
      execution either way, output goes through the same already-ported
      AY.pas mixer (engine/ay.h) via direct ay_chip.reg[] writes and
      ay_chip_set_ay_register_fast (matching exactly which of
      PatternInterpreter/ChangeRegisters' register writes go through a
      real setter - with side effects on Envelope_EnA/B/C - versus a raw
      field write, confirmed by close reading of the original, not
      guessed).

      Both real test files (test_corpus_76/ZAGON_07_remixDJ_EchoMAKROSS.pt3,
      version 4, uses PT3VolumeTable_33_34;
      test_corpus_76/ZELiNAPI.pt3, version 7, uses PT3VolumeTable_35 -
      replacing the original songs/pt3/ARTe_ST1.pt3 (v4) and
      songs/turbo_sound/Gasman_-_dynamite.pt3 (v7) after the songs/ ->
      test_corpus_76 migration, same version spread deliberately preserved)
      use PT3_TonTableId=1 (PT3NoteTable_ST) - confirmed via
      identify_ay_file's tone_table_id field and a standalone
      pt3_file_load probe before adopting them (most of test_corpus_76's
      other .pt3 files use a different TonTableId and would be correctly
      rejected by this port) - so only that one of 6 possible note-pitch
      tables needed porting; a file using a different TonTableId is
      rejected loudly (PT3_FILE_ERR_BAD_HEADER) rather than silently
      mis-tuned.

      Two real bugs were caught and fixed via this milestone's oracle
      comparison before it passed:
      (1) OracleHarness.pas's RunPT3FileTest initially crashed with an
      access violation because LoadTrackerModule was called with Index=0;
      its very last line is `if Index <> -1 then RedrawItem(Index)`, a
      GUI call with no playlist instantiated in oracle mode - fixed by
      passing Index=-1 (the documented "no real playlist index" sentinel
      the function already supports).
      (2) Once running, engine output matched the real Pascal code's
      *register* state exactly (confirmed via direct comparison - the
      tracker-engine translation itself was correct on the first real
      run) but produced quieter PCM audio - traced to ay_engine_init's
      chip_type defaulting to YM (AY_CHIP_TYPE_YM), while the FIRST
      attempt at this port's oracle harness had incorrectly set
      `ChType := AY_Chip` on the Pascal side to "fix" what looked like a
      mismatch. Re-reading AY.pas:151 showed ChType's own real global
      default is YM_Chip, and PT3 never overrides it (only VTX's loader
      sets Chip_Type, Players.pas:7674-7677) - so the C side's default was
      right all along and the Pascal harness was the one with the bug,
      caught and reverted rather than papering over it by changing the C
      default to match a wrong harness.
    rationale: >
      Closed as validated for both real test files. Deliberately NOT
      ported this pass (see pt3_file.h's file comment for the equivalent
      detail):
        - GetTimePT3 (duration/loop-point precompute, Players.pas:
          15315-15645) - UI-only (seek/scrub, duration display), not
          needed for correct audio playback. Consequence: this port has
          no real Global_Tick_Max/"song has ended" concept - playback
          continues indefinitely (pattern-internal looping via
          CurrentPosition/LoopPosition still works correctly), the caller
          decides how many buffers to render. Both the C port and the
          oracle harness set a large sentinel for Global_Tick_Max instead
          of a real computed value.
        - Turbosound/TSMode - MIG-0007, confirmed still not exercised by
          either real file (unchanged finding from an earlier session).
        - Embedded/rebased-pointer PT3 loading (the MAddr<>0 rebase branch
          in LoadTrackerModule) - both real files are standalone with
          MAddr=0, making this dead code for them.
        - 5 of 6 PT3NoteTable_* variants (only PT3NoteTable_ST is ported -
          see summary).
    verification: >
      tests/engine_smoke/test_pt3_file.c: loads and plays both real .pt3
      files for 400 buffers each (204800 frames), confirms audible
      (non-all-zero) output and no crash for both; also confirms a
      malformed header (unsupported PT3_TonTableId) is rejected. Re-run
      and re-confirmed passing against
      test_corpus_76/ZAGON_07_remixDJ_EchoMAKROSS.pt3 and
      test_corpus_76/ZELiNAPI.pt3 after the songs/ -> test_corpus_76
      fixture migration.
      tests/oracle_diff/run_diff.sh's `pt3_file` scenario (looped over
      both real files): byte-identical PCM output (400 buffers, 512
      stereo16 frames each = 204800 frames = 819200 bytes) between
      engine/src/pt3_file.c and the real Players.pas/AY.pas code via
      OracleHarness.pas's RunPT3FileTest, for BOTH files - a hard
      pass/fail gate, both passing (re-confirmed byte-identical for both
      new fixtures too).

  - id: MIG-0022
    title: "Real .vtx file loading/playback"
    subsystem: engine/vtx_file
    state: validated
    summary: >
      engine/src/vtx_file.c ports the VTX register-dump format (FT.VTX,
      confirmed lh5/LZH-compressed like YM files - engine/lh5.h, MIG-0019 -
      but WITHOUT a "-lh5-"-signature TLZHFileHeader wrapper: the
      compressed payload's length is simply "whatever's left in the
      file" after the header+strings, not a separately-encoded field):
      the VTX header parse in both its short ("AY"/"YM", no Year/
      Programm/Tracker/Comment fields) and long ("ay"/"ym", with them)
      variants (Players.pas:7650-7707 - our real test file, now
      test_corpus_76/GB2_5.vtx after the songs/ -> test_corpus_76
      migration (originally songs/vtx/Intro.vtx), is the long "ay"
      variant in both cases), the lh5 decompression call (Players.pas:
      2736-2752), VTX_YM3_YM3b_Get_Registers and MakeBufferVTX
      (Players.pas:12768-12825) - the simplest register-plane reader
      ported so far, no digidrum/sinus/envelope sub-timer engine unlike
      YM5i (MIG-0019) - and the PrepareToPlay FT.VTX init + Chip_Type
      selection (AY_Chip for our "ay"-tagged file, confirmed via the real
      file's own magic bytes).

      This was the smoothest of the five formats ported this session:
      loaded, played audibly, and matched the real Pascal code byte-for-
      byte on the FIRST real attempt for both the smoke test and the
      oracle-diff comparison, with no bugs found - a useful data point
      that the earlier formats' bugs (BufferLength, Synthesizer
      assignment, Tik.Re-on-freq-change, chip-type defaults, LoadTrackerModule's
      Index=-1 convention) were genuinely format-specific pitfalls, not
      systematic gaps in the porting approach itself.

      UPDATE (songs/ -> test_corpus_76 fixture migration): re-running the
      oracle-diff against the new fixture (test_corpus_76/GB2_5.vtx)
      initially FAILED - not an engine bug, but a real gap in the TEST
      HARNESS this fixture swap exposed: dump_engine_state.c's
      run_vtx_file drove a fixed 400-buffer loop with no `real_end_all`
      check, while OracleHarness.pas's RunVTXFileTest always has (`if
      Real_End_All then break;`) - the original songs/vtx/Intro.vtx file
      never happened to reach its own end within 400 buffers, so this
      mismatch was never exposed until a fixture whose song actually ends
      sooner (GB2_5.vtx: real Pascal wrote 299 buffers before
      Real_End_All, the C side kept going to a full 400, a 206848-byte
      length mismatch) was used. Fixed by adding the same `&&
      !f.real_end_all` guard already present in run_ay_file/run_ym_file
      to run_vtx_file - after that, byte-identical again. This was purely
      a test-driver omission, not a vtx_file.c correctness issue (the
      engine's own real_end_all flag was already being set correctly, as
      the smoke test's matching real_end_all=1 result already showed).
    rationale: >
      Closed as validated. Deliberately NOT ported: YM3/YM3b (a different
      sibling format sharing VTX_YM3_YM3b_Get_Registers but a distinct
      loader path, Players.pas:2790-2811) - out of scope, no real test
      file exercises it.
    verification: >
      tests/engine_smoke/test_vtx_file.c: loads and plays
      test_corpus_76/GB2_5.vtx for up to 400 buffers (152657 frames
      actually rendered before real_end_all), confirms audible
      (non-all-zero) output and no crash; also confirms a malformed
      header is rejected. Re-run and re-confirmed passing after the
      songs/ -> test_corpus_76 fixture migration.
      tests/oracle_diff/run_diff.sh's `vtx_file` scenario: byte-identical
      PCM output between engine/src/lh5.c+vtx_file.c and the real
      Players.pas/AY.pas code via OracleHarness.pas's RunVTXFileTest - a
      hard pass/fail gate, passing (after fixing dump_engine_state.c's
      run_vtx_file to honor real_end_all, per the UPDATE above; the output
      length is now whatever real_end_all determines, not a fixed
      819200 bytes).

  - id: MIG-0024
    title: "identify_ay_file: oracle-diff verification against real ay_emul's Add_Songs_From_File dispatcher (78-file real-world corpus)"
    subsystem: identify_ay_file
    state: validated
    summary: >
      Added OracleHarness.pas's `identify_file` scenario
      (RunIdentifyFileTest, gated by AY_EMUL_ORACLE=identify_file per the
      established local-only convention - PORTING_TO_C11_LINUX.md §8.1),
      the first oracle scenario to drive Add_Songs_From_File (Players.pas:
      6662 - the function identify_ay_file's own comments informally call
      "AddFile") rather than a lower-level loader function directly. Two
      real integration issues had to be worked around/discovered to make
      this callable headlessly: (1) FrmPLst is nil in the AY_EMUL_ORACLE
      code path (RunOracleHarness runs before any Application.CreateForm
      call in Ay_Emul.lpr) - RedrawItem/CalculatePlaylistScrollBar need a
      real (if invisible) TFrmPLst instance, created explicitly by the
      harness; (2) FT.<name> constants (filetypes.pas's load_formats,
      SetNamedSection) hold `formatParams`/`SubSections[FSformat]`
      indices allocated in Ay_Emul.fmt's FILE order for every distinct
      format name encountered - including "AYAMAD", which has no
      PrecalcFT entry at all - NOT positions within the fixed PrecalcFT
      array. Recovering a format's name from a runtime FT value therefore
      requires GetFileType(idx:integer):string (filetypes.pas:748-754),
      not PrecalcFT[idx] - using the latter (identify_ay_file's own first
      instinct too) silently returns the WRONG name.

      Ran 78 real files (one per distinct output-field combination found
      in a ~37000-file real-world corpus scan) through both
      identify_ay_file and this new oracle scenario, comparing the
      `format=` field. Result: 70/78 matched exactly (after normalizing
      the harness's "NONE" - Add_Songs_From_File added zero playlist
      items - against identify_ay_file's "unknown"). The remaining 8 are
      each precisely explained by an ALREADY-DOCUMENTED, deliberate
      approximation - none required a new code fix beyond the one bug
      this same investigation surfaced (see below):
        - 3 files: real ay_emul resolves an LHA-wrapped .ym's specific
          YM2/YM3/YM3b/YM5/YM6 sub-variant by fully depacking the archive
          and reading the decompressed magic (Players.pas:7708-7774,
          IsSTSoundFileType branch); identify_ay_file does not decompress
          (out of scope per the task's identification-only mandate) and
          reports the generic "YM" container name instead - exactly the
          "Compressed payloads... are not decompressed" limitation
          already in identify_ay_file.md.
        - 1 file (a bare ".pt3"-named dotfile - FPC's ExtractFileExt
          treats a leading dot as a hidden-file marker, not an extension
          separator, confirmed via a standalone `fpc` test, so this
          genuinely has NO extension in both implementations): real
          ay_emul's Module_Detector calls the FULL structural FoundPT3
          (which apparently rejects this specific file despite its
          correct-looking "ProTracker 3.5 compilation of..." header
          text - root cause not further diagnosed), while
          identify_ay_file's Tier C fallback for PT3 is a simple text-
          signature search and accepts it - exactly the "best-effort...
          not a byte-for-byte port... not proven identical" caveat
          already on scan_whole_file_for_pt3/
          scan_whole_file_for_signature_trackers.
        - 2 files (bare ".stp"/".pt2"-named dotfiles, same ExtractFileExt
          behavior): identify_ay_file's full structural ports
          (detect_stp_structural/detect_pt2_structural) pass every
          pointer-arithmetic check but real ay_emul's Module_Detector
          still rejects them - almost certainly the missing final
          IntegrityCheck step (a LoadTrackerModule+GetTimeXXX call
          computing a playable duration, rejecting a candidate whose
          duration comes back zero) - exactly the limitation documented
          in detect_st_family.h/identify_ay_file.md.
        - 1 file: a plain-text `readme` (no extension) whose human-
          written prose happens to literally quote another file's PSC
          header ("...aka PSC V1.06 COMPILATION OF RAIN ... BY
          DJ.SPACE P.P 1998") at exactly the offsets
          scan_whole_file_for_signature_trackers's substring search
          checks, producing a genuine false positive - a concrete,
          amusing confirmation of the "not proven identical" caveat on
          that function, not a new class of bug.
      One REAL bug was found and fixed by this investigation, in
      detect_ay_container (detect_container.c): OpenAYFile (Players.pas:
      7192-7230) does NOT classify ZXAY-container TypeID "AMAD" as a
      distinct "AYAMAD" format or TypeID "ST11" as "AY;subtype=ST11" (what
      identify_ay_file originally, incorrectly, assumed by over-trusting
      Ay_Emul.fmt's OS-mime-type names) - it reassigns them to FT.FXM and
      FT.ST1 respectively, i.e. a ZXAY+AMAD container plays as an ordinary
      FXM file and a ZXAY+ST11 container as an ordinary ST1 file. Fixed
      before this oracle run (no real ZXAY+AMAD/ST11 sample existed in the
      78-file set to re-confirm directly, but the fix is a direct,
      verified transcription of OpenAYFile's actual code).
    rationale: >
      Closed as validated: this is a genuine differential comparison
      against the real compiled ay_emul binary (not just code-reading),
      covering every distinct output permutation observed in a large
      real-world corpus, with every discrepancy traced to a specific,
      already-documented, deliberate scope decision rather than an
      unexplained gap.
    verification: >
      tools/identify_ay_file/identify_ay_file and
      ay_emul/OracleHarness.pas's `identify_file` scenario run side by
      side against 78 real files (selected via a full-corpus scan for
      distinct output-field combinations); `format=` fields compared
      directly. 70/78 exact matches; all 8 remaining differences traced to
      specific, cited Pascal source locations and existing documented
      limitations, as detailed above. OracleHarness.pas changes are
      submodule-local only, never pushed, per PORTING_TO_C11_LINUX.md §8.1.

  - id: MIG-0025
    title: "ALSA audio output (Phase 3)"
    subsystem: tools/ay_player
    state: validated
    summary: >
      tools/ay_player/src/alsa_output.c is a thin wrapper around
      <alsa/asoundlib.h> (linked via `-lasound`, no binding layer), per
      PORTING_TO_C11_LINUX.md §4.2's already-made decision. Opens the
      default PCM device, configures S16_LE/interleaved/2-channel/the
      file's sample rate via `snd_pcm_set_params` (200ms target latency,
      resampling allowed), and writes in a loop that recovers once from
      an `-EPIPE` underrun via `snd_pcm_prepare` (standard ALSA client
      practice) before giving up. Fails gracefully (a one-line stderr
      diagnostic naming the device and `snd_strerror` message, a distinct
      `ALSA_OUTPUT_ERR_*` return) rather than crashing when no device is
      available or the device rejects the requested parameters - expected
      in sandboxed/CI environments.

      Real-world build note: `<alsa/asoundlib.h>` (via `global.h`)
      redeclares `struct timespec` unless glibc's own feature-test macros
      are visible, which they are not under strict `-std=c11` on this
      distro - a hard compile error (`redefinition of 'struct timespec'`)
      until `_GNU_SOURCE` is defined *before any other include in the
      file* (defining it after even our own `alsa_output.h`, which only
      pulls in `<stdbool.h>`/`<stdint.h>`, was not enough - those lock in
      glibc's feature-test-macro state on first inclusion). This is a
      third-party-header/compiler-environment interaction, not a
      relaxation of the file's own C11 conformance.
    rationale: >
      Closed as validated: the ALSA API usage itself is a direct,
      standard application of documented `snd_pcm_*` calls (no novel or
      uncertain behavior), and this environment happens to have a real
      ALSA device, letting both the graceful-failure path (verified via a
      standalone `snd_pcm_open` probe against a deliberately invalid
      device name, confirming a negative return + `snd_strerror` message
      rather than a crash - the exact pattern `alsa_output_open` uses) and
      the success path (confirmed via `time`: `--seconds=2` playback took
      2.011s of real wall-clock time, consistent with genuine blocked-on-
      hardware ALSA writes, not an instant no-op) be checked directly.
      Audio hardware output has no meaningful byte-oracle (unlike PCM
      *generation*, already validated in MIG-0018..0022) - this entry
      covers the output-plumbing layer specifically, not a claim that
      audio content itself was independently re-verified here.
    verification: >
      tools/ay_player/smoke_test.sh covers the WAV-export path (headless,
      no ALSA device needed) for all 5 formats plus error paths. ALSA
      itself: manual run (`./ay_player <file>`, no `--wav=`) confirmed
      real-time-paced playback via `time` on a real device in this
      environment; a standalone `snd_pcm_open("...invalid...")` probe
      confirmed the graceful-failure code path is genuinely exercised by
      ALSA's own error return, not just plausible-looking code. No
      automated CI check exists for "no device present" specifically
      (this environment has one), so that exact scenario rests on code
      review + the isolated probe rather than an end-to-end automated
      test - noted honestly rather than assumed.

  - id: MIG-0026
    title: "WAV export (Phase 4) - byte-identical against Convs.pas's WAV_Converter, all 4 fully-supported formats"
    subsystem: tools/ay_player
    state: validated
    summary: >
      tools/ay_player/src/wav.c hand-rolls the same 44-byte PCM RIFF/WAVE
      header ay_emul/Convs.pas uses (TWaveFileHeader, Convs.pas:88-105:
      `RIFF`/`rLen`/`WAVE`/`fmt `/`fLen=16`/`wFormatTag=1`/`nChannels`/
      `nSamplesPerSec`/`nAvgBytesPerSec`/`nBlockAlign`/`FormatSpecific`
      (bits)/`data`/`dLen`), using the same seek-write-seek-rewrite
      pattern (write a zero-length placeholder header, stream PCM, seek
      back and rewrite `rLen`/`dLen` once the real frame count is known -
      Convs.pas:525,551-555). No library involvement (not even
      libsndfile), per PORTING_TO_C11_LINUX.md §4.3/§7.3's explicit
      decision that this format is simple enough not to warrant one.

      `WAV_Converter` itself (Convs.pas:500-561) is heavily GUI-entangled
      (`FrmPLst.GetVarsForSave`, `ShowProgress`, `Application.
      ProcessMessages`, the `PlayingItem` global) and not callable
      headlessly - matching every prior `OracleHarness.pas` scenario's
      established precedent, four new scenarios (`RunAYWAVExportTest`,
      `RunYMWAVExportTest`, `RunPT3WAVExportTest`, plus the original
      `RunVTXWAVExportTest`, renamed from `RunWAVExportTest`) each
      replicate `WAV_Converter`'s CORE logic directly (header populate ->
      bounded `MakeBuffer` loop -> header rewrite) over their sibling
      `RunXFileTest`'s exact loading logic, rather than stubbing the GUI
      calls out. `TWaveFileHeader` is redeclared in each (Pascal has no
      shared-local-type mechanism across procedures here) rather than
      referenced from `Convs.pas`, since it's declared in that unit's
      `implementation` section (Convs.pas:88), not exported.

      A real fidelity subtlety was caught and fixed while writing the
      first of these (VTX): `WAV_Converter`'s actual per-call write size
      is `BuffLen * nBlockAlign` (`Convs.pas:544`) - `BuffLen` is AY.pas's
      real global, reset to 0 at the top of every `MakeBufferX` call and
      incremented once per frame actually produced, NOT the fixed buffer
      capacity. On the final call before `Real_End_All`, `BuffLen` can be
      less than the buffer's full capacity, and `WAV_Converter` writes
      only that many real frames - unlike the simpler, pre-existing
      `RunVTXFileTest`/`dump_engine_state.c` raw-PCM-stream scenarios
      (MIG-0022), which always write the full fixed-size buffer
      (including whatever stale bytes are left in its unfilled tail) as a
      deliberate simplification for THAT comparison. The first draft
      copied that convention by mistake; fixed to use the real
      `BuffLen`-per-call write size (carried through to all 4 new
      procedures), which is also exactly what `tools/ay_player`'s own WAV
      writer does (writes only the frame count `player_make_buffer`
      actually returns, never padding with stale data) - so this fix was
      necessary for the two sides to agree at all, not just for fidelity.

      A second real bug was caught adding the SNDH attempt (see below):
      `MakeBufferSNDH` needs `PlConsts[0].Global_Tick_Max` (aliased as
      `TickCountMax` via `atari.pas:98`) set to a large sentinel before
      the render loop, exactly like `RunPT3WAVExportTest`'s PT3-side
      `Global_Tick_Max := MaxInt` - otherwise `atari.pas:1471-1473`'s
      `if not Do_Loop then if TickCount >= TickCountMax then
      Real_End_All := True` fires on the very first VBL tick (leftover/
      zero-valued default), producing a zero-frame WAV. Caught and fixed
      before the second real issue below was found.

      Per-format frame counts, each chosen deliberately, not arbitrarily:
        - VTX (test_corpus_76/GB2_5.vtx): full natural length, 152657
          frames - `Real_End_All` fires on its own within a small, bounded
          count (MIG-0022).
        - AY (test_corpus_76/MetalMania.ay): only 512 frames (1 buffer) -
          deliberately stays inside the byte-identical prefix MIG-0018
          already established (matches for ~987-1005 frames before a
          small, known, non-content timing divergence), validating the
          WAV container without re-litigating that separately-tracked gap.
        - YM (test_corpus_76/Batman_Journey.ym): 400 buffers/204800
          frames - 100x further than MIG-0019's original raw-PCM gate (4
          buffers), with no divergence found at this length either.
        - PT3 (both test_corpus_76/ZAGON_07_remixDJ_EchoMAKROSS.pt3 and
          test_corpus_76/ZELiNAPI.pt3): 400 buffers/204800 frames each,
          matching MIG-0020's existing raw-PCM gate exactly.
        - SNDH: attempted, NOT achieved - see MIG-0021's addendum. Driving
          the real Pascal 68000 interpreter through `MakeBufferSNDH` for
          `test_corpus_76/More_Short_Demos.sndh` is extremely slow (even a
          single 512-frame call took over 3 minutes of wall-clock time in
          this environment - engine/src/m68k_bus.c's Musashi-based core
          renders the same file's full 400-buffer smoke test near-
          instantly) and, after that long wait, ends with `Real_End_All`
          becoming true with zero frames ever produced, for a reason not
          yet diagnosed. `RunSNDHWAVExportTest` exists as a reusable
          diagnostic starting point (matching `sndh_trace`'s own status)
          but is deliberately NOT wired into the automated `run_diff.sh`
          gate - see MIG-0021 for the precise findings.
    rationale: >
      Closed as validated for the 4 formats engine/ay_player fully
      supports (AY/YM/PT3/VTX): byte-for-byte identical WAV output
      (header + exact PCM content) confirmed via `cmp` for a real file in
      each, at frame counts chosen to either exercise the format's full
      natural length (VTX) or match/exceed its existing raw-PCM oracle
      gate (AY/YM/PT3) - the strongest verification level this project
      uses. SNDH remains excluded, tracked as an addendum to MIG-0021
      (already `behaviorally_incomplete`) rather than as a new, separate
      failure of this entry - MIG-0026 was never expected to independently
      resolve MIG-0021's pre-existing, deeper incompleteness.
    verification: >
      tests/oracle_diff/run_diff.sh's four `wav_export` (VTX)/
      `wav_export_ay`/`wav_export_ym`/`wav_export_pt3` (x2 files) cases:
      build tools/ay_player, run it with `--wav=`/`--frames=N` against the
