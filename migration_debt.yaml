  - id: MIG-0016
    title: "sndh.pas's ICE depacker specifically not ported - everything else in SNDH parsing/playback now is (see MIG-0021/0045-0055)"
    subsystem: engine/sndh_file
    state: behaviorally_incomplete
    summary: >
      STALE as originally written ("SNDH file parsing/depacking not
      ported" - sndh.pas's 838 lines covering sndh_UnpackFile's ICE
      depacker AND sndh_ExtractTextInfo's metadata/play-time extraction).
      Since then, engine/src/sndh_file.c has been built out extensively
      (MIG-0021 for the initial memory-layout/scheduling port, MIG-0045
      through MIG-0055 for a long series of real, fixed bugs culminating
      in correct melody/percussion timing) and now handles the "not ICE-
      compressed" path of sndh_UnpackFile in full (sndh.pas:497-509,
      confirmed via sndh_file.h's own scope comment) plus a working
      sndh_ExtractTextInfo tag scanner for every playback-relevant tag
      (VBL/TA/TB/TC/TD for PlayFreq, "##"/"!#"/"#!" for song count/
      selection - COMM/TITL/RIPP/CONV/YEAR/TIME/nSN UI-metadata tags are
