  - id: MIG-0017
    title: "STALE as originally written; SUPERSEDED by MIG-0079/MIG-0100 (real SNDH seek landed) and MIG-0116 (this entry's own Atari_SeekTo fast-forward, now ported)"
    subsystem: engine/atari_emulate
    state: validated
    summary: >
      Written when this port had no seek support at all. Since then:
      MIG-0079 ported real seeking generically (decode-and-discard,
      matching Players.pas's RerollMusic) for AY/YM/VTX, explicitly
      naming SNDH's exclusion and pointing at this entry; MIG-0100 closed
      that specific gap by wiring SNDH into the SAME generic
      player_get_tick_position/do_seek mechanism (the TIME tag needed to
      be retained, not discarded as UI-only) - real forward/backward
      SNDH scrubbing has worked since then, confirmed via a real seek on
      Temple_of_Asherah.sndh.

      This entry's own original claim was also imprecise: direct re-
      tracing of atari.pas found Atari_Emulate_One_VBL is NOT "used only
      by Atari_SeekTo" - it's SNDH_Get_Registers, SNDH's own
      implementation of the All_GetRegisters[CNum] contract the shared
      MakeBufferTracker/Turbosound-pairing loop uses (Players.pas:14094-
      14097, 2913). Atari_SeekTo itself (atari.pas:1684-1705) never calls
      Atari_Emulate_One_VBL at all - it drives plain Atari_Emulate (this
      port's atari_emulate_step) directly, calling NO Synthesizer
      function whatsoever during the whole seek (SynthesizerSNDH's own
      `if Seeking then` branch, which Atari_Emulate_One_VBL's internal
      call into it hits, is what actually explains DMASndSkipMC68000Takts's
      real role: a DMA/digi-sample position catch-up, not general audio
      skipping). SNDH's OWN Turbosound-pairing identity is moot for this
      port regardless - player_supports_pairing returns false for SNDH,
      matching AY/YM/VTX's own non-pairing status.

      What remained genuinely unported after that correction was
      narrower than the original title implied: not "seeking" itself,
      but the specific CPU-optimization Atari_SeekTo's own forward-seek
      branch has and this port's do_seek didn't - skipping audio
      synthesis entirely while fast-forwarding, instead of calling the
      full player_make_buffer path and discarding its output (the SAME
      category of already-accepted gap MIG-0079 documented for AY/YM/
      VTX's own seeking). MIG-0116 now ports that specific optimization
      for SNDH.
    rationale: >
      Marked validated (not just closed) because every concrete claim in
      this entry has now been directly re-verified against the current
      state of both the Pascal source and this port: real SNDH seeking
      works (MIG-0100), Atari_Emulate_One_VBL's actual role was
      mischaracterized in the original text and is now correctly
      described, and the one genuine remaining optimization gap is
      closed (MIG-0116). Kept as its own entry (not deleted) for the
      historical record and because MIG-0079/MIG-0100 each still
      reference it by number.
    verification: >
      See MIG-0079, MIG-0100, and MIG-0116 for each claim's own
      verification. Atari_Emulate_One_VBL's real call site confirmed via
      direct grep of Players.pas (14094-14097: `procedure SNDH_Get_
      Registers(CNum: integer); begin Atari_Emulate_One_VBL; end;`,
      wired into All_GetRegisters[0] at line 2913 only when FileType =
      FT.SNDH) and cross-checked against MakeBufferTracker's own
      All_GetRegisters[0](0)/[1](1) dispatch (Players.pas:12301-12318).
      Atari_SeekTo confirmed via direct read (atari.pas:1684-1705) to
      call plain Atari_Emulate + DMASndSkipMC68000Takts only, never
      Atari_Emulate_One_VBL.

  - id: MIG-0116
    title: "MIG-0017 update: ported Atari_SeekTo's real fast-forward algorithm for SNDH - forward seeks now skip audio synthesis entirely (CPU/timers only), matching the original instead of the generic full-synthesis-and-discard path every other format still uses"
    subsystem: engine/sndh_file, engine/player, gui/playback
    state: validated
    summary: >
      Per explicit user request, after research established (see MIG-0017's
      own updated entry) that SNDH seeking already works correctly but
      without this one CPU-optimization the original has. Added
      sndh_file_seek_fast_forward (engine/src/formats/sndh_file.c): for
      a forward seek only, flushes any pending register writes once
      up front (Atari_CheckOuts), then drives atari_emulate_step in a
      loop with NO ay_synthesizer_* call at all (matching Atari_SeekTo's
      own loop, which never calls Synthesizer/SynthesizerSNDH), and
      resets the AY tick accumulator afterward (`Number_Of_Tiks.re := 0`)
      so normal playback doesn't try to catch up a huge synthesis
      backlog the instant it resumes. Wired up via a new generic
      player_seek_fast_forward (engine/player.h/.c, returns false/no-op
      for every non-SNDH format) that gui/src/playback.c's do_seek now
      tries first, falling back to the existing generic decode-and-
      discard loop unchanged for everything else.

      Two real bugs found and fixed while implementing this (this port's
      own mixer architecture reentrant-calls ay_synthesizer_ay from
      TWO sites inside atari_emulate_step - a mid-instruction AY-
      register-write flush, and a per-step DMA-boundary flush - neither
      of which the Pascal original's own separately-callable procedures
      have an exact structural equivalent for):
      (1) A stale f->ay.buf pointer (left over from whichever real
      make_buffer call happened before the seek) could be written into
      by either reentrant call site if left untouched - fixed by setting
      f->ay.buf = NULL for the loop's duration, which ay_synthesizer_
      dispatch's own first check turns into an unconditional, safe no-op
      regardless of buf_len/buffer_length, restored afterward.
      (2) atari_emulate.h's pending_writes queue is a FIXED 32-entry
      buffer; flushing it only once (either before or after the whole
      loop) let it silently overflow and permanently drop register
      writes past the first ~32 on any seek needing more than that many
      total - found via direct A/B testing against the generic decode-
      and-discard path (chip.reg[8]/9/10 were frozen at their very-
      early-seek values regardless of how much further the seek actually
      went). Fixed by flushing every loop iteration instead of once.

      Also added a best-effort DMA/digi-sample position catch-up
      (f->atari.dma.pcurr = current cycle_count when DMA is active) -
      NOT a line-for-line port of DMASndSkipMC68000Takts's own
      incremental "negative PCurr" algorithm (atari.pas:344-380's exact
      semantics weren't fully traced/validated), but a reasoned
      equivalent derived from this port's own dma_sound.c representation
      (pbase/pcurr are literal atari.cycle_count snapshots at DMA-start,
      and pcurr is designed to track elapsed real cycles approximately -
      see sndh_file.c's own comment for the full derivation). Confirmed
      exercised by a real file (test_corpus_76/megaintr.snd, the same
      ICE-compressed file MIG-0016 added, genuinely uses DMA sound) but
      NOT byte-verified against the Pascal oracle - see debt below.
    rationale: >
      Closes the one concrete, narrow gap MIG-0017's corrected
      description leaves: Atari_SeekTo's forward-seek branch never calls
      any Synthesizer function, this port's generic do_seek always did
      (full synthesis, discarded) until now. The two reentrancy bugs
      found are genuine, source-verified fixes (not heuristics) specific
      to how THIS port's atari_emulate_step differs structurally from
      Pascal's separately-callable Atari_Emulate/SynthesizerSNDH (the
      original's own `if Seeking then` branch inside SynthesizerSNDH
      naturally short-circuits its own reentrant path; this port's
      dispatch has no such single choke point, hence needing buf=NULL
      neutralization at both call sites instead).

      An early-seek register-state comparison against the generic
      decode-and-discard path was found to transiently differ (e.g. at
      tick 500/2000 for More_Short_Demos.sndh) despite landing on the
      identical tick_count, but CONVERGES to an exact match by tick
      8000/15000 in direct testing. Reasoned, not just observed: the two
      mechanisms have genuinely different register-write-application
      granularity (this port's fast path always applies-or-queues+
      flushes every step; the generic path's own int_flag/buffer-full
      backpressure dance depends on real buffer-fill timing) - a
      mid-execution snapshot difference is an inherent, expected property
      of comparing two different buffering strategies, present in the
      ORIGINAL Pascal's own Atari_SeekTo-vs-MakeBufferSNDH pairing too,
      not evidence either implementation reaches a wrong end state. Not
      further chased given SNDH already has no byte-exact oracle
      baseline to validate against at all (MIG-0021/MIG-0056).
    verification: >
      `cd engine && make clean && make`, `cd gui && make clean && make`:
      both zero warnings, zero errors. tests/oracle_diff/run_diff.sh:
      130/130 PASS, 0 FAIL (unaffected - no oracle scenario exercises
      seeking). tests/oracle_diff/corpus_wav_md5_sweep.sh: 70 passed, 0
      failed (unaffected). All tests/engine_smoke binaries pass,
      including two new tests/engine_smoke/test_sndh_file.c cases:
      test_seek_fast_forward_reaches_exact_tick_and_keeps_updating
      (confirms exact tick landing with no overshoot, and confirms
      register state actually keeps changing across a long seek -
      the queue-overflow bug's own regression guard) and
      test_seek_fast_forward_handles_dma_file (confirms no crash/hang on
      a real DMA-sound-using file). tests/gui_smoke/test_playlist_ayl:
      both tests pass unchanged. test_atari's test_atari_emulate_vbl_
      scheduling failure was investigated and confirmed PRE-EXISTING,
      unrelated to this entry - reproduced identically via `git stash`
      against the pre-this-session code before restoring.
    debt:
      - "The DMA/digi-sample position catch-up (f->atari.dma.pcurr) is a
        reasoned equivalent, not a line-for-line port of
        DMASndSkipMC68000Takts's own algorithm, and has no oracle
        validation (no existing scenario exercises DMA-during-seek).
        Exercised by a real file (megaintr.snd uses DMA sound) without
        crashing and landing on the exact target tick, but the DMA
        sample-read POSITION itself after such a seek is not byte-
        verified against the Pascal original."
      - "A mid-execution (as opposed to VBL-boundary) register-state
        snapshot taken immediately after a fast-forward seek can
        transiently differ from what the generic decode-and-discard path
        would show at the identical tick_count, converging within a few
        thousand ticks in direct testing - reasoned to be an inherent,
        expected property of comparing two different write-application
        granularities (see this entry's own rationale) rather than a
        correctness bug, but not proven via oracle-diff (SNDH has no
        byte-exact oracle baseline to validate against at all, per
        MIG-0021/MIG-0056 - this isn't a new gap this entry introduces)."

  - id: MIG-0018
    title: "Real .ay file loading/playback (Phase 2 begins) - root cause of the small register-write timing offset now found and identified as a Z80.pas bug, not a port bug; intentionally not replicated"
    subsystem: engine/ay_file, engine/z80_bus
    state: behaviorally_incomplete
    note: >
      MIG-0062 later found the SAME pattern (Z80.pas's own live core
      charging a non-standard T-state count vs superzazu/z80's correct,
      documented value) on a different opcode - OUT (n),A: Z80.pas
      charges 12, superzazu/z80 (and real Zilog Z80 hardware) charges
      11. Same root mechanism, same policy, same "won't fix" resolution
      as this entry's own IM1/IM2 finding - see MIG-0062 for that
      opcode's specific evidence and the six .ay files it explains.
    summary: >
      engine/src/ay_file.c ports the real Sergey Bulba/FUXOFT .ay file
      format (FT.AY, TypeID "EMUL" only - AMAD/ST11 are different,
      unrelated formats and are rejected): the header/song-table lookup
      (Players.pas:2915-2949/7132-7236), the ZRAM/register setup including
      the DumpIM1/DumpIM2 trampoline injection (Players.pas:3926-4008), and
      a MakeBufferAY/AY_Get_Registers-equivalent playback loop
      (ay_file_make_buffer), all built on the already-validated
      engine/z80_bus.c + engine/ay.c core (MIG-0001/0003/0005/0006b).
      Loads and plays test_corpus_76/MetalMania.ay correctly end-to-end
      (tests/engine_smoke/test_ay_file.c: 102400 sample frames rendered,
      audible, no crash). A new oracle scenario (ay_file, in
      OracleHarness.pas's RunAYFileTest + dump_engine_state.c's
      run_ay_file) drives this exact file through both the real
      Players.pas-derived code path and the C port and byte-compares 2048
      stereo16 sample frames of output.

      UPDATE (songs/ -> test_corpus_76/ fixture migration): the original
      fixture was songs/cpc/Discmac20_0.ay (byte-identical for the first
      3952/8192 bytes); the whole songs/ directory was replaced with
      tools/identify_ay_file's real-world test_corpus_76 corpus and
      Discmac20_0.ay no longer exists in the repo. Re-run against the new
      fixture (test_corpus_76/MetalMania.ay, chosen because it loads
      cleanly - engine/src/ay_file.c only supports TypeID "EMUL", which
      MetalMania.ay has, confirmed via identify_ay_file): still an
      [INFO]-level (non-gating) match, now 4020/8192 bytes of matching
      prefix - a different exact number (expected, since it's a different
      Z80 program/interrupt timing), but the SAME class of divergence:
      the previously-diagnosed small (~2 T-state per interrupt-accept
      event) timing offset in interrupt-acceptance/HALT T-state accounting
      between superzazu/z80 and Z80.pas's live interpreter (root cause
      below is an engine characteristic, not fixture-specific, and was not
      re-derived byte-for-byte for this new fixture - the original
      detailed trace analysis remains the best available diagnosis):
        - Z80 CPU execution was bit-identical (PC sequence and per-
          instruction tact deltas matched exactly for the traced range) on
          the original fixture.
        - The interrupt/frame-rollover overshoot past MaxTStates was
          identical (2 T-states over the 69888 boundary on both sides) on
          the original fixture.
        - AY register writes happened in the identical VALUE/SEQUENCE
          order on the original fixture.
        - Number_Of_Tiks/Current_Tik accumulate a tiny (~2 T-state-
          equivalent, ~3e-5 relative) discrepancy per interrupt-accept
          event on the original fixture, compounding into a ~37-sample
          (~0.8ms) shift in exactly when the first audible note starts.
          Not narrowed to one specific instruction/mechanism at the time.

      ROOT CAUSE FOUND (re-investigation while auditing this whole
      ledger): direct comparison of engine/third_party/z80/z80.c's
      process_interrupts against Z80.pas's own live Z80_Step (the
      noASM branch, past its `{$else Z80Emu_noASM}` - confirmed the
      dead ASM branch just above it happens to charge identical values,
      so this isn't a dead-code red herring) shows Z80.pas charges 12
      T-states for an IM1 interrupt accept and 18 for IM2
      (Z80.pas:~21027-21044: `Inc(CurrentTact,12)` / `Inc(CurrentTact,18)`
      inside the `if IFF and not EIorDDorFD and (CurrentTact < IntLength)`
      branch), while superzazu/z80 charges the standard 13/19
      (z80.c: `z->cyc += 13`/`+= 19`) - matching Zilog's own documented
      Z80 interrupt-acknowledge timing and every other reputable Z80
      core. This is exactly the "~2 T-state per interrupt-accept event"
      offset measured earlier (empirically closer to 1 T-state per
      event; the original "~2" was an approximate empirical figure, now
      superseded by this precise source citation). ay_file.c's injected
      DumpIM1/DumpIM2 trampolines (engine/src/ay_file.c:16-18) confirm
      only IM1/IM2 are ever actually used by this format - IM0's
      handling differs even more starkly between the two (Z80.pas's
      case statement only has `2` and `else`, treating IM0 identically
      to IM1 rather than executing an injected opcode the way superzazu/
      z80 and real hardware do) but is moot here since it's never
      reached.
    rationale: >
      Per explicit user direction: superzazu/z80 is the correct
      reference for raw Z80 CPU timing, not Z80.pas - if the two
      disagree on a well-documented, standard timing value like
      interrupt-accept T-states, the presumption is a bug in the
      ORIGINAL Pascal Z80 core, not in this port. A one-line, low-risk
      fix (subtracting 1 T-state from current_tact whenever
      z80_bus_step() detects an interrupt was just accepted, in
      engine/src/z80_bus.c) was implemented, verified to close a real
      slice of the gap, and then DELIBERATELY REVERTED once this
      direction was given - replicating Z80.pas's 12/18 would make the
      C11 port's Z80 timing WRONG (non-standard) purely to chase
      byte-identity with an oracle that itself has the bug. This is the
      one place in the whole port where the original's behavior is
      knowingly NOT what the C11 side matches, and it's recorded here
      precisely so nobody "fixes" it back the wrong way later. The
      remaining oracle-diff mismatch (currently 4020/8192 matching
      bytes) is therefore expected to persist and is not further
      actionable from this port's side - the fix, if ever wanted, would
      have to happen in ay_emul/Z80.pas itself (out of scope: this repo
      treats the Pascal submodule as the read-only oracle, not something
      this port's work modifies to agree with itself - see README.md's
      "Source" section and PORTING_TO_C11_LINUX.md §8.1).

      Also deliberately NOT ported this pass, per ay_file.h's
      file comment: AMAD/ST11 TypeIDs (different container formats -
      confirmed via identify_ay_file's oracle-diff work, MIG-0024, that
      real ay_emul actually reclassifies these as FT.FXM/FT.ST1 entirely,
      not "AY variants" - engine/src/ay_file.c correctly rejects both
      rather than mishandling them), author/title/comment string
      extraction (GUI playlist metadata, irrelevant to audio),
      FadeLength-based fade-out (cosmetic), and the GUI/label/filter side
      effects of MainWin.pas's Set_Chip_Frq (only its Delay_In_Tiks/
      FrqAyByFrqZ80/Tik.Re arithmetic core is reproduced, via
      ay_file_set_chip_freq).
    verification: >
      tests/engine_smoke/test_ay_file.c: loads and plays
      test_corpus_76/MetalMania.ay for 200 buffers (102400 frames),
      confirms audible (non-all-zero) output and no crash; also confirms a
      malformed header is rejected (AY_FILE_ERR_BAD_HEADER).
      tests/oracle_diff/run_diff.sh's `ay_file` scenario: runs on every
      invocation, reports the byte-length of the matching prefix against
      the real Pascal code as [INFO] (not a hard pass/fail gate, since a
      full byte-identical match isn't expected yet) - currently 4020/8192
      bytes (re-measured against test_corpus_76/MetalMania.ay after the
      songs/ -> test_corpus_76 fixture migration; was 3952/8192 against
      the original songs/cpc/Discmac20_0.ay). The detailed manual trace
      comparison (ad-hoc, via temporary instrumentation of both sides, not
      checked in) documented above is from the original fixture and was
      not redone for the new one, since the root cause is an engine
      timing characteristic rather than something specific to either
      file's content; if revisited, add a lower-cost repeatable version of
      that trace comparison rather than redoing it from scratch.

  - id: MIG-0021
    title: "SNDH file loading/playback - superseded by MIG-0045 through MIG-0055; original 'AY registers never written' symptom long since fixed, melody/percussion timing now correct, small residual jitter remains open"
    subsystem: engine/sndh_file
    state: behaviorally_incomplete
    summary: >
      STALE as originally written (described a since-fixed state: "VBL
      scheduling confirmed correct; AY registers never written after
      ~14s virtual playback", parked deliberately pending fresh eyes).
      That investigation resumed and produced a long, well-documented
      chain of real fixes - MIG-0045 (byte-swapped opcodes causing CPU
      runaway), MIG-0046/0048/0049 (VBL cycle-accounting/interrupt-
      acceptance model corrections), MIG-0047 (sample-generation rate
      driven by call count instead of elapsed cycles - the "plays way
      too fast" bug), MIG-0050 (AY writes never reentrantly flushed
      mid-execution), MIG-0051 (missing MFP ICnt retry mechanism +
      backwards VBL/MFP interrupt priority), MIG-0052 (Musashi's
      CPU_INT_LEVEL never lowered after int_ack, an interrupt-service
      storm), MIG-0053 (Musashi's STOP opcode padding cycle_count past
      real 68000 throughput), MIG-0054 (missing timeslice-release on MFP
      register writes, seeding an MFP Timer A backlog), MIG-0055
      (mfp_init not seeding timer DR/Cnt to 256 like Atari_InitEmu does).
      End state, user-confirmed by ear: Temple_of_Asherah.sndh's melody
      and percussion timing now sounds correct via ay_player, matching
      the real ay_emul. A small residual "jitter"/"distortion" was
      investigated too - amplitude/clipping was directly ruled out
      (zero samples hit the clip boundary in either engine's output,
      peak/mean/RMS levels within 0.4% of each other) - the remaining
      cause is MIG-0054's still-open Timer A coalesce residual (a
      masked critical section in the 68000 program marginally exceeding
      Timer A's own period more often on this port than on the oracle).
    rationale: >
      Kept open rather than moved to validated: real, substantial,
      extensively-verified progress has been made (oracle-diff 53/53,
      smoke-test 21/21, WAV/AY-write-count/IRQ-trace comparisons
      throughout MIG-0045-0055), but the output is still not byte-
      identical against the oracle and a real, precisely-characterized
      residual (MIG-0054's Timer A backlog) remains genuinely open. This
      entry is superseded going forward by MIG-0054 specifically for
      that residual - further SNDH investigation should extend MIG-0054
      rather than this one, which is kept only for its historical
      record of how far the investigation has already come.
    verification: >
      See MIG-0045 through MIG-0055 individually for each fix's own
      verification (each one's regression-suite pass counts, WAV/AY-
      write-count/IRQ-trace comparisons). Summary: tests/oracle_diff/
      run_diff.sh 53/53 pass; tools/ay_player/smoke_test.sh 21/21 pass;
      Temple_of_Asherah.sndh plays with correct melody/percussion timing
      per direct user listening confirmation; not yet byte-identical
      against the oracle WAV export.

  - id: MIG-0023
    title: "identify_ay_file: Module_Detector's structural tracker detectors, ported for the 10 formats with no byte signature - now oracle-diff-verified for the 7 that have real sample files"
    subsystem: identify_ay_file
    state: translated
    summary: >
      identify_ay_file (now split into tools/identify_ay_file/src/*.c,
      one file per format family, each kept under 600 lines) classifies
      AY/YM music files exactly as Players.pas's AddFile dispatcher does.
      It reproduces Tier A (extension trusted outright, Players.pas:
      8100-8103), Tier B (the .ay/.ym/.psg ambiguous-extension special
      case, Players.pas:8104-8114), and every Tier C content-sniff check
      (Players.pas:8115-8146) exactly, and now also reproduces the FULL
      Module_Detector fallback chain (Players.pas:6830-7024) for
      extensionless/unrecognised-extension input, in its exact if/elseif
      order: FoundST1, FoundST3, FoundSTC/FoundPSC/FoundFTC/FoundGTR (via
      the pre-existing substring-search approximation, unchanged),
      FoundASC1, FoundASC0, FoundSTF (incl. a full port of its custom
      LZ77-like depacker, STFDepackInit/STFDepackBytes, Players.pas:
      1187-1329), FoundSTP, FoundPT2, FoundPT3, FoundPT1, FoundSQT,
      FoundFLS - detect_st_family.c, detect_pt_asc_family.c, detect_stf.c,
      detect_fls.c. Each port omits only the final `IntegrityCheck`
      confirmation step (a LoadTrackerModule+GetTimeXXX call requiring the
      full tracker-loading/playback engine this tool deliberately does
      not implement); every structural/pointer/table check Pascal itself
      performs is otherwise ported field-for-field, with an explicit
      Players.pas line citation in each detector's header comment.
      Also corrected during this pass: FXM and PSM (which DO have
      Ay_Emul.fmt byte signatures) were previously included in the Tier C
      fallback scan, but a full read of Module_Detector's body confirms
      it never calls FoundFXM/FoundPSM - they are Tier-A-only in the real
      program. Removed from the Tier C scan accordingly.
    rationale: >
      Not closed as validated: at the time this was written, there were
      no real-world .st1/.st3/.asc/.as0/.stf/.stp/.pt1/.pt2/.sqt/.fls
      sample files anywhere in this repo to oracle-diff against, so
      correctness rested on direct field-for-field transcription from
      Players.pas (cited per detector) plus the verification below, not a
      differential match against the real binary. UPDATE (songs/ ->
      test_corpus_76 migration): test_corpus_76 now contains real sample
      files for 7 of these 10 formats (NEWDANCE.asc, MISTERS_BOX.as0,
      Girls_of_Meladze.stp/.stp, DEMON.pt1, NOR.MUS..pt2/.pt2,
      MotorAnimation.sqt, SimpletonGift1.fls) - ST1/ST3/STF remain
      unrepresented in the corpus. DONE (while auditing this whole
      ledger): wired a new `identify_file` gate into tests/oracle_diff/
      run_diff.sh, running all 7 available files through both the real
      Pascal `identify_file` OracleHarness.pas scenario and this tool's
      own `identify_ay_file` binary and comparing the reported format -
      all 7 agree exactly (ASC, ASC0, STP, PT1, PT2, SQT, FLS), now a
      permanent, repeatable part of the standard test suite rather than
      a one-off manual check. ST1/ST3/STF remain genuinely unverified
      against a real file (none exist in the corpus) - a narrower,
      still-open gap than before this update. Two known, explicitly documented
      approximations remain and are called out in identify_ay_file.md's
      "Known limitations": (a) these ten detectors only check the
      candidate window anchored at file offset 0, not Players.pas's true
      sliding scan across every byte offset (which exists to find tracker
      data embedded inside disk images/BASIC loaders - out of proportion
      to reproduce for these heavier structural checks, one of which runs
      a full depacker); (b) the KsaId/StcId secondary tag-comparison
      Pascal performs for the "Id"-prefixed ST3 variant and STP's
      Init_Id=0 branch is skipped (noted inline in detect_st_family.c) -
      a narrow sub-case, not the primary structural gate.
    verification: >
      Builds clean (-std=c11 -Wall -Wextra -Wpedantic, zero warnings).
      Fuzzed with 400 random-content files (sizes 0-30000 bytes, mixed
      extensions covering every new detector's Tier A and Tier C paths)
      through an -fsanitize=address,undefined build: zero crashes, zero
      sanitizer reports - confirms no OOB reads/UB on arbitrary/malformed
      input, satisfying the task's safety requirement independent of
      format-detection correctness. Positive-path correctness spot-checked
      with one hand-constructed valid ST3 module (satisfying FoundST3's
      full pointer-arithmetic chain field-for-field) - correctly detected
      as format=ST3 confidence=probable via the new Tier C path, with
      chips=1, confirming the ported logic is not merely fail-safe but
      genuinely accepts valid structured input. The other nine detectors
      were not each individually given a hand-built positive-path sample
      (time-boxed); re-open a follow-up debt item if that level of
      per-format positive verification is later wanted.
      tests/oracle_diff/run_diff.sh's new `identify_file` gate: 7/7 pass
      (NEWDANCE.asc, MISTERS_BOX.as0, Girls_of_Meladze.stp, DEMON.pt1,
      NOR.MUS..pt2, MotorAnimation.sqt, SimpletonGift1.fls all agree with
      the real Pascal `identify_file` scenario's reported format) -
      real, automated, differential verification against the original
      binary, not just fuzz/positive-path spot-checks.

  - id: MIG-0023b
    title: "identify_ay_file: Module_Detector is now a real byte-by-byte sliding scan, and STC/PSC/FTC/GTR/PT3 now use genuine structural FoundXXX ports instead of the old Ay_Emul.fmt-signature approximation"
    subsystem: identify_ay_file
    state: translated
    summary: >
      Closes both approximations MIG-0023 left open. (1) Traced every
      reference to Ay_Emul.fmt's `match=` fields through filetypes.pas and
      confirmed (via `grep` across all of Players.pas) they are consumed
      ONLY by filetypes.pas's shared-mime-info XML writer (desktop/OS
      file-manager registration), never by AddFile/Module_Detector - so
      the pre-existing detect_stc/detect_psc/detect_ftc/detect_gtr/
      detect_pt3 signature checks (and their scan_whole_file_for_* Tier C
      fallbacks) were never actually equivalent to what Module_Detector
      checks, contrary to the "equivalent in practice" claim MIG-0023
      shipped with. Ported the real structural functions instead:
      FoundSTC/FoundGTR/FoundFTC (Players.pas:5067-5173/4841-4920/
      6090-6180, in detect_signature_trackers.c as detect_stc_structural/
      detect_gtr_structural/detect_ftc_structural), FoundPT3(DetectAdr)
      (Players.pas:5880-5967, detect_pt3.c's detect_pt3_structural),
      FoundPSC(PSC1_00) (Players.pas:5969-6088, detect_pt_asc_family.c's
      detect_psc_structural) - each minus the same documented
      IntegrityCheck omission every other structural detector already
      carries, and FoundSTC's Id-branch KsaId/StcId CompareMem
      confirmation is skipped for the same reason ST3/STP already skip
      it (noted inline). The old Ay_Emul.fmt-signature functions and
      scan_whole_file_for_signature_trackers/scan_whole_file_for_pt3 are
      kept (unused by dispatch.c now) for reference/tests.
      (2) Replaced dispatch.c's scan_whole_file_module_detector (which
      only checked the candidate window anchored at file offset 0) with
      a genuine sliding loop over every byte offset of the file, calling
      all seventeen detectors at each offset in Players.pas's exact order
      (Players.pas:6901-7002), first match wins - matching
      Module_Detector's own `repeat Inc(F_Offset) ... until May_Quit or
      (F_Offset >= FilSiz)` loop. Implemented by handing each detector a
      "windowed" filebuf view (same backing memory, data pointer advanced
      by the candidate offset, size shrunk to match) rather than
      threading a base-offset parameter through every existing detector's
      internal offset arithmetic - a pure reframing of Pascal's own
      F_Frame := @F_Buffer[F_Index] indirection, not a behavioural
      change, and it required zero modification to the 8 existing
      offset-0-only structural detectors (detect_st_family.c,
      detect_pt_asc_family.c's ASC1/ASC0/PT2/PT1/SQT, detect_stf.c,
      detect_fls.c - all already treat offset 0 of whatever filebuf
      they're given as the candidate window start).
      Readen1/word-wraparound conventions used in the 5 new structural
      ports are documented once in detect_signature_trackers.c's file
      comment (cross-checked against detect_st_family.c's FoundST1 port,
      whose own "Readen1 уменьшено на 1" Pascal comment confirms the
      `Readen1 = (long)f->size - 1` mapping used throughout).
    rationale: >
      Not closed as validated: the 5 new structural ports are direct,
      carefully-cited hand transcriptions of the real Pascal functions
      (every branch and pointer relationship traced against Players.pas
      line-by-line), but this is inherently error-prone manual porting of
      non-trivial pointer arithmetic, and a true oracle-diff of the
      sliding scan itself was attempted and could not be completed - see
      verification below. Until that's resolved (or an equivalent
      independent check is found), treat the 5 new detectors' exact
      boundary conditions as translated-but-not-oracle-verified, same
      epistemic status MIG-0023's original 10 detectors had before their
      own oracle gate landed.
    verification: >
      Builds clean (-std=c11 -Wall -Wextra -Wpedantic -O2, zero
      warnings). Corpus cross-check (not a substitute for real oracle-
      diff, but the best available given the harness limitation below):
      every corpus file with a real .stc/.psc/.ftc/.gtr/.pt3 extension
      (46 files) and every corpus file for the other 12 structural-tracker
      formats with real samples (52 of 53 total across all 15
      represented formats; the ST1/ST3/STF formats remain unrepresented
      in the corpus, same gap as MIG-0023) was copied to an extensionless
      name and re-identified via the new sliding-scan fallback path,
      report format compared against the format implied by the file's
      real (stripped) extension - 98/99 agree. The one disagreement
      (MISTERS_BOX.as0, expected ASC0, reports unknown) is a pre-existing
      gap confirmed present in the OLD offset-0-only code too (checked by
      testing the same file against a build of the pre-this-change
      dispatch.c) - i.e. not a regression introduced here, and outside
      this entry's scope (it's ASC0's own structural port not matching
      this particular real file's actual byte layout at any offset, a
      MIG-0023-era gap).
      Performance: the true sliding scan is O(filesize) re-invocations of
      all 17 detectors, matching Module_Detector's own algorithmic
      complexity (Pascal shows a progress bar past 2s for exactly this
      reason, Players.pas:7003-7016). Measured on this machine: 200KB of
      random non-matching content resolves in ~65ms, 1MB in ~363ms -
      comfortably fine for a CLI identification tool even at the
      MAX_READ_SIZE cap.
      Attempted, NOT completed: a genuine oracle-diff of the sliding scan
      against OracleHarness.pas's real `identify_file` scenario, by
      copying corpus files to extensionless names (forcing both sides
      through Tier C -> Module_Detector rather than Tier A's extension
      trust) - added to tests/oracle_diff/run_diff.sh, then removed again
      after every one of 12 tested files came back format=NONE from the
      oracle side, including files whose OWN engine playback already
      passes byte-identical oracle-diff elsewhere in the same script
      (stc_file/ftc_file/gtr_file/psc_file/pt3_file gates), proving the
      file content itself is fine. Ruled out: an exception (harness would
      report format=ERROR, not NONE); the F_ST1/F_STC/.../IntegrityCheck
      "tunes finder" enable flags (Players.pas:849-865 - all default
      True). Root cause not found in the time available - something in
      Add_Songs_From_File's Detect=True path (possibly specific to the
      "Tunes Finder" background-scan feature this path is shared with,
      referenced in gui/'s itemedit/jmptime dialog READMEs) isn't fully
      reachable from OracleHarness's minimal headless boot. Follow-up:
      root-cause this and re-add the oracle gate, OR find an independent
      verification method (e.g. a hand-constructed positive-path sample
      per new format, as MIG-0023 did for ST3) if the harness limitation
      turns out to be unfixable.

  - id: MIG-0103
    title: "GetTimeXXX (real duration precompute) ported into engine/ for 10 more tracker formats, and identify_ay_file's IntegrityCheck now reuses all 11 (incl. PT3/MIG-0101) via a new dependency on engine/libayengine.a - SQT/FXM deliberately deferred"
    subsystem: "engine/formats (asc,fls,ftc,gtr,psc,psm,pt1,pt2,stc,stp), tools/identify_ay_file, tests/oracle_diff"
    state: translated
    summary: >
      Closes the "final IntegrityCheck confirmation step is not
      performed" gap MIG-0023b left open, for 11 of the 15 structural-
      tracker formats identify_ay_file's Module_Detector fallback
      handles. Two parts:

      (1) User explicitly directed reusing engine/'s already-ported,
      oracle-validated per-format code instead of maintaining
      independent duplicate logic in identify_ay_file - both for
      IntegrityCheck AND (implicitly, already done) the structural
      match itself. PT3 already had a real GetTimePT3 port
      (pt3_get_time/global_tick_max, MIG-0101) which turned out, once
      cross-checked against this session's new oracle scenario, to
      match the real Pascal oracle exactly (7040 ticks for
      ZELiNAPI.pt3, byte-for-byte) - confirming the reuse approach and
      the existing MIG-0101 port simultaneously. Ported the same
      shape (a `static void <fmt>_get_time(...)` helper storing
      `int64_t global_tick_max`[, `loop_tick`] on the format struct,
      called once at the end of `<fmt>_file_load`) to 10 more formats,
      each a direct transcription of its Players.pas GetTimeXXX:
      GetTimeGTR (14950-15001), GetTimeSTC
      (15003-15040, Tm-only, no Lp), GetTimeASC (15042-15182, shared by
      FT.ASC/FT.ASC0 since asc_file_load already normalises ASC0 to
      ASC1's layout at load time), GetTimeSTP (15184-15214),
      GetTimePT2 (15216-15331), GetTimePSC (15664-15767), GetTimeFTC
      (15769-15887), GetTimePT1 (16679-16770), GetTimeFLS (16772-16817,
      Tm-only), GetTimePSM (16819-16881). Done via 4 parallel agents
      (one per small format cluster, each in an isolated worktree to
      avoid concurrent-build races on the shared engine/ archive), then
      merged (all touched disjoint files, no conflicts). One real bug
      was caught and fixed during this work: an early GTR translation
      unconditionally executed a trailing pointer increment that Pascal
      only runs on the *non-break* path out of its
      `repeat...until False` loop - caught because it produced
      global_tick_max=192985 instead of the expected 6300 for
      L.Boy_broken.gtr, fixed, then matched exactly.

      GetTimeSQT (Players.pas:15889-16679, ~790 lines of triple-
      duplicated per-channel bitfield opcode interpretation with
      genuine cross-iteration uninitialised-variable-carry semantics -
      `{%H-}` hints throughout) and GetTimeFXM (14422-14950, ~528
      lines, including a nested dynamic-array-based call-stack VM
      simulating FXM's subroutine call/return opcodes) were
      DELIBERATELY NOT attempted in this pass: both are dramatically
      larger and higher-risk than the other ten combined, and
      transcribing either with the same rigor risks introducing subtle
      bugs without a correspondingly large payoff (SQT/FXM structural
      detection already works via detect_sqt_structural/[FXM has no
      Module_Detector-fallback structural detector at all - Module_
      Detector never calls FoundFXM, see dispatch.c's top comment] -
      only the extra IntegrityCheck confirmation is missing for SQT,
      and FXM is Tier-A-only in the real program so IntegrityCheck via
      Module_Detector never applies to it at all in practice). Explicit
      follow-up debt, not silently dropped.

      (2) Added a new `AY_EMUL_ORACLE=get_time` OracleHarness.pas
      scenario (RunGetTimeTest) for validating all of the above against
      the real Pascal oracle: loads a file the normal way (Tier A
      extension trust, same as the existing `identify_file` scenario),
      then calls `LoadTrackerModule` + the matching `GetTimeXXX`
      DIRECTLY (bypassing `GetTime`'s own UI-touching tail -
      `CalculateTotalTime` touches `FrmPLst.LTotTime` and access-
      violates under this harness's headless boot; same category of
      rarely-exercised-codepath/headless-boot limitation as MIG-0023b's
      abandoned identify_file_slide gate, not a bug in GetTimeXXX
      itself) - using LoadTrackerModule's PPLItem-based (file-on-disk)
      call form, exactly like GetTime's own real call shape, so every
      format-specific load-time rebase (GTR/FTC/PT3 address detection
      etc.) runs exactly as for a normally-opened file. Confirmed
      working end-to-end (cross-validated pt3_get_time's pre-existing
      value against it before porting anything else) and used as the
      ground truth for every one of the 10 new ports - EVERY port
      matched the oracle EXACTLY on validation (several after fixing
      transcription bugs first, per the GTR case above), not just
      "close" or "plausible".

      (3) tools/identify_ay_file now links against engine/libayengine.a
      (tools/identify_ay_file/Makefile - a deliberate reversal of this
      tool's earlier "no engine dependency" design; see git history/
      the Makefile's own updated comment for the reasoning) via a new
      tools/identify_ay_file/src/integrity_check.c, exposing one
      `integrity_check_<fmt>(data, size[, is_asc0])` function per
      supported format: calls the engine's real `<fmt>_file_load`,
      returns whether `global_tick_max > 0`. dispatch.c's
      scan_whole_file_module_detector now wraps each of the 11
      supported formats' structural-match branches (STC, ASC, ASC0,
      STP, PT2, PT3 x2 variants, PSC x2 variants, FTC, PT1, GTR) with
      this confirmation: on success, confidence upgrades from
      "probable" to "definite" (matching Pascal, which never reports a
      Module_Detector match that failed IntegrityCheck at all); on
      failure, the `detection` struct is reset and the sliding scan
      continues trying the remaining formats at the same offset, then
      the next offset - exactly mirroring Pascal's real control flow
      (IntegrityCheck failing inside FoundXXX makes the whole `if F_Xxx
      and FoundXxx(...)` condition false, so Module_Detector's if/elseif
      chain falls through to the next format, not the next offset).
      ST1/ST3/STF (no engine/ port exists at all) and SQT (engine/
      port exists, no GetTimeXXX yet) keep the pre-existing structural-
      only confidence=probable behaviour, explicitly commented at each
      site in dispatch.c.
    rationale: >
      Not closed as validated: while every one of the 10 new engine/
      ports matched the real Pascal oracle exactly on the one real
      corpus sample available per format (same evidentiary bar
      MIG-0023's original structural detectors were shipped at), broader
      differential/fuzz coverage per format (multiple real files, not
      just one each) hasn't been done, and the SQT/FXM gap is real,
      tracked, open debt, not a completed scope. The abandoned
      identify_file_slide oracle gate from MIG-0023b's entry remains
      unresolved too (a different, still-unexplained headless-harness
      limitation than the one this entry's new get_time scenario
      worked around) - a genuine oracle-diff of the FULL sliding-scan-
      plus-IntegrityCheck pipeline (as opposed to each piece validated
      separately, which is what's actually been done here) is still
      open follow-up work.
    verification: >
      All builds clean (-std=c11 -Wall -Wextra[-Wpedantic] -O2, zero
      warnings) across engine/, tools/identify_ay_file/, tools/ay_player/.
      tests/oracle_diff/run_diff.sh: zero [FAIL] lines (61 gates,
      including byte-identical PCM/WAV playback for every touched
      format - confirms the new duration-precompute code path added to
      each _file_load doesn't disturb existing playback behaviour).
      Direct oracle cross-check (AY_EMUL_ORACLE=get_time vs. each
      format's global_tick_max/loop_tick, one real corpus file per
      format): GTR/STC/PSM/ASC/ASC0/STP/FLS/PT2/PT1/PSC/FTC all match
      the real Pascal oracle EXACTLY (not approximately) - see the
      per-format values in this entry's summary section above (also
      re-verified together in the merged tree via an ad-hoc combined
      test harness, same exact results).
      identify_ay_file corpus cross-check (real corpus files, extension
      stripped, run through the true Module_Detector sliding-scan
      fallback + new IntegrityCheck confirmation): 52/53 real sample
      files across all 15 represented structural-tracker formats
