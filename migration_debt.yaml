  - id: MIG-0016
    title: "sndh.pas's ICE depacker - RESOLVED: ported and oracle-validated once the user supplied a real ICE-compressed SNDH file (test_corpus_76/megaintr.snd)"
    subsystem: engine/sndh_file
    state: validated
    summary: >
      Direct continuation of this entry's own prior state ("everything in
      SNDH parsing/playback is ported except the ICE depacker, which is
      detected and rejected loudly rather than silently mishandled,
      because no real ICE-compressed test file existed to validate a
      port against"). The user located and added
      test_corpus_76/megaintr.snd ("Mega Intro" by Paradox, 602383 bytes
      packed / 1032158 bytes unpacked) - a real, ICE-compressed SNDH file
      confirmed via its "ICE!" magic - which removed the blocker this
      entry's own rationale named.

      Ported sndh.pas:319-496's depacker in full as sndh_ice_unpack
      (engine/src/formats/sndh_file.c) - a faithful, opcode-for-opcode
      translation of normal_bytes/get_1_bit/get_N_bits (variable names
      intentionally kept as PI/UI/CB/BitGroup to stay comparable against
      the Pascal source line-by-line), including sndh.pas:530-587's own
      post-processing transform step - which the ORIGINAL AUTHOR's own
      comment (sndh.pas:532-535) says was never exercised against any
      real file ("Not tested piece of ICE depacking code is used !!!").
      Ported it anyway (no unported/omitted opcode, per this workspace's
      invariants) rather than silently dropping it; confirmed via direct
      instrumentation that megaintr.snd does NOT trigger it either (the
      gating bit reads 0), so this one sub-path remains translated but
      genuinely unvalidated - see debt below.

      sndh_file_load's old hard rejection (SNDH_FILE_ERR_ICE_COMPRESSED)
      is now real decompression: on the "ICE!" magic, data/size are
      rebound to the freshly depacked buffer and everything downstream
      (tag parsing, Atari memory image, playback) proceeds exactly as it
      would for a naturally-uncompressed file. Renamed the status to
      SNDH_FILE_ERR_ICE_CORRUPT (only returned now for a genuinely
      malformed ICE header/stream, not "unsupported") and added defensive
      bounds checks the original doesn't have (a too-small PackedSize
      field, a PackedSize exceeding the file, a zero UnpackedSize, or a
      packed-stream underflow during decode all fail loudly with this
      status instead of underflowing/reading out of bounds - Pascal's
      own equivalent failure here would be an unhandled range-check
      exception).

      Found and fixed one real translation bug during this port: the
      untested transform's 16-bit buffer read used the wrong byte order
      on the first pass (Pascal's `PSmallInt(@SNDHBuffer[UI])^` is a
      native-LE read; the transform's own WRITE side is deliberately
      big-endian, an asymmetry easy to miss) - caught and fixed before
      landing, not left in as a latent bug (this sub-path being otherwise
      unreachable by the real test file means it wouldn't have been
      caught by the oracle-diff gate below).
    rationale: >
      The original blocker (no real ICE-compressed file to validate
      against) is gone - megaintr.snd is real, user-supplied, and
      confirmed via its own magic bytes, removing the exact condition
      this entry's own prior rationale set for revisiting it.

      Validated via a NEW, deliberately narrow oracle-diff gate
      (sndh_unpack) that calls sndh_UnpackFile/sndh_ice_unpack directly
      on both sides and byte-compares the raw depacked buffer, rather
      than running a full MakeBufferSNDH playback pass through the real
      68000 CPU emulation - the existing SNDH WAV-export harness is
      already known to be impractically slow for that (MIG-0021's own
      finding: a single 512-frame MakeBufferSNDH call took over 3 minutes
      of wall-clock time against a real file). Decompression itself is
      fast on both sides, so this gate gives direct, fast, unambiguous
      evidence of depacker correctness without inheriting that cost or
      conflating two separately-validated concerns (depacking vs.
      68000 emulation, the latter already covered by MIG-0021/0045-0055's
      own existing tests).
    verification: >
      tests/oracle_diff/run_diff.sh's new sndh_unpack gate: oracle
      (RunSNDHUnpackTest, calling the real sndh_UnpackFile) vs engine
      (dump_engine_state's run_sndh_unpack, calling sndh_ice_unpack
      directly) - BYTE-IDENTICAL depacked output, all 1,032,158 bytes,
      for test_corpus_76/megaintr.snd. Full regression suite re-run
      clean: `cd engine && make clean && make`/`cd gui && make clean &&
      make`/`cd tools/ay_player && make`/`cd tools/identify_ay_file &&
      make` all zero warnings zero errors; run_diff.sh 130/130 PASS (0
      FAIL, the new sndh_unpack gate included); corpus_wav_md5_sweep.sh
      70 passed/0 failed (megaintr.snd correctly SKIPPED by that sweep -
      it scans by "known playable extension", and this sweep's own
      full-WAV-export approach would hit the same MakeBufferSNDH slowness
      noted above; its real coverage is the sndh_unpack gate instead, not
      this sweep); tests/engine_smoke/test_sndh_file (both the existing
      test_plays and the corrupt-header-rejection test, now renamed
      test_ice_corrupt_header_rejected and pointed at
      SNDH_FILE_ERR_ICE_CORRUPT, plus a new fast test_ice_unpacks_real_file
      confirming megaintr.snd decompresses to the exact expected size
      with a real "SNDH" tag at the expected offset) all pass.
      identify_ay_file's pre-existing independent ICE-detection
      (compressed=ice) re-confirmed unaffected/still correct.
    debt:
      - "sndh.pas:530-587's post-processing transform (gated by one extra
        bit read right after the main depack loop) is ported but
        genuinely UNVALIDATED - confirmed via direct instrumentation that
        megaintr.snd's own gating bit reads 0, so this sub-path is never
        exercised by the only real ICE-compressed file in this repo.
        Notably, the ORIGINAL Pascal author's own comment says they never
        saw a file requiring it either - so this port is now at LEAST as
        validated as the reference implementation it was translated from,
        but a second, different real ICE-compressed file (one that
