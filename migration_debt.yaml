  - id: MIG-0121
    title: "GBSNDH's ST/STe radio pair (is_ste) and AtariMonoChk/AtariYMMonoChk SNDH-specific mono-output/panning fallback defaults"
    subsystem: "engine/formats/sndh_file, engine/hw/atari_emulate, engine/player, gui/playback, gui/mixer_win, gui/mainwin"
    state: translated
    summary: >
      Item 4 of the same 5-item request as MIG-0120 (see its own
      summary for the shared background/merge-provenance details).
      Mixer.pas's GBSNDH GroupBox: STRB/STeRB (a load-time-only Atari
      ST vs STe format-variant selection - a plain ST has no DMA-sound
      hardware at all, atari.pas:1078-1110) plus AtariYMMonoChk/
      AtariMonoChk (SNDH-specific fallback defaults for this port's
      existing mono-output/channel-mode-panning mechanisms,
      PlayList.pas:761,798).

      New `bool is_ste` parameter threaded load-time-only through
      sndh_file_load -> player_load_song -> player_pair_load_song (the
      pairing/secondary side always passes `true`, matching this port's
      Turbosound pairing convention of not exposing per-voice format-
      variant overrides) -> gui_playback_load_song (which also gained a
      `pb->is_ste` field so do_seek's own backward-seek reload path
      re-applies the same value) -> gui/mainwin.c's do_load_song, which
      resolves it from the new gui_mixer_win_is_ste(&mw->mixerwin)
      accessor at load time, same timing as the pre-existing
      channels/ts_pair resolution just above it. Default `true`
      everywhere (including every existing call site outside gui/ -
      the test suites and tools/ay_export - that was updated to pass a
      literal `true`) preserves this port's own pre-existing
      unconditional-DMA-sound behaviour exactly.

      apply_item_overrides gained two new SNDH-specific fallback
      defaults, applied only for a loaded SNDH file and only via
      explicit correction of the background agent's own mistaken claim
      (its worktree predates this session's player_set_number_of_
      channels work, MIG-0107/MIG-0108, so it wrongly asserted no
      mono-output mechanism existed and left AtariMonoChk undone as
      disclosed debt): AtariYMMonoChk (when no real per-item channel-
      mode override already won) applies the same mono panning preset
      (mxhelper_calc_mode_coefs(0, ...)) as Mixer.pas's own
      Set_Mode(0) call; AtariMonoChk calls the REAL, already-existing
      player_set_number_of_channels(&mw->playback.pair.primary, 1) to
      force mono OUTPUT, exactly matching PlayList.pas:761's
      Set_Stereo(1) - not left as debt.
    rationale: >
      Not validated, same basis as MIG-0120: clean build plus a full
      regression run (engine_smoke, gui_smoke, ay_export_smoke,
      ay_player smoke test, oracle_diff's 70-file WAV md5 sweep) with
      zero new failures, but is_ste's `true` default means every one of
      those gates exercises only the pre-existing (unchanged) STe
      behaviour - none of them load a real SNDH file with is_ste=false
      or either mono checkbox checked, so the actually-new behaviour
      (plain-ST DMA-region unmapping, forced mono output, forced mono
      panning) has no automated coverage yet, only a direct citation-by-
      citation code match against PlayList.pas/atari.pas and the same
      attempted-but-unreachable live-GUI verification noted in
      MIG-0120.
    verification: >
      Same build/regression evidence as MIG-0120 (engine/+gui/ build
      clean; engine_smoke/gui_smoke/ay_export_smoke/ay_player smoke
      test/oracle_diff corpus sweep all pass with zero new failures,
      test_atari's one failure confirmed pre-existing on the
      unmodified base commit). No live-GUI or automated coverage of
      is_ste=false, AtariMonoChk, or AtariYMMonoChk themselves - see
      debt below.
    debt:
      - "No automated or live-GUI coverage of is_ste=false (plain
        Atari ST, no DMA-sound region mapped) - every existing SNDH
        test/oracle-diff gate loads with the default is_ste=true and
        would not notice a regression in the is_ste=false path."
      - "No automated or live-GUI coverage of AtariMonoChk (forced
        mono output via player_set_number_of_channels) or
        AtariYMMonoChk (forced mono panning via
        mxhelper_calc_mode_coefs(0, ...)) actually taking effect for a
        real loaded SNDH file - confirmed only by code review against
        PlayList.pas:761,798 and a clean build."

