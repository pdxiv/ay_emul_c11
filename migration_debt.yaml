  - id: MIG-0074
    title: "Phase 5 continuation: single-instance CLI/IPC file forwarding wired via a Unix domain socket (WinVersion.pas: IPCServer/IPCClient) - one plain file path only, not the full CommandLineInterpreter flag set"
    subsystem: gui/ipc, gui/main
    state: validated
    summary: >
      New gui/include/gui/ipc.h + gui/src/ipc.c: a plain POSIX AF_UNIX
      SOCK_STREAM socket at $XDG_RUNTIME_DIR/ay_emul_c11.sock (via
      glib's g_get_user_runtime_dir()) replaces WinVersion.pas's
      TSimpleIPCServer/TSimpleIPCClient (itself backed by a Unix domain
      socket on Linux). gui_ipc_init() first tries connecting as a
      CLIENT; if another instance is already listening, it hands off
      the one argv file path (if any) and returns false so main() can
      exit(0) immediately, BEFORE any window is ever created (matching
      IPCSendParams's real "hand off and quit" behavior, and avoiding a
      window flash-then-vanish). If no server is reachable, this
      process becomes the SERVER (binds/listens, integrates accept via
      g_io_add_watch so it never blocks the GTK main loop) and returns
      true; gui/src/main.c then creates the GUI normally and binds the
      real per-window callback via gui_ipc_set_callback (a window
      doesn't exist yet at the point gui_ipc_init must be called, since
      that call's return value decides whether to create one at all).
      Incoming paths from later invocations are appended to the running
      instance's playlist (gui_playlist_win_add_path) and start playing
      immediately if nothing else was already loaded, then the window is
      deiconified and raised (gtk_window_present) - a practical
      improvement over just literally replaying MainWin.pas's own
      "-vshow"-flag-gated behavior, since always surfacing the window on
      a hand-off is the more useful default for this port's narrower
      command-line surface.
    rationale: >
      The real CommandLineInterpreter (MainWin.pas:1118-1200+) parses a
      large flag set (-s/-b/-z/-y/-q/-t/-a/... for sample rate, bit
      depth, Z80/AY/MFP clock overrides, chip-frequency-list toggles,
      etc.) that this port has no settings/config-file equivalent for
      yet (no settings.pas port exists) - forwarding only supports a
      single plain file/directory argument, the actual real-world use
      case ("open a file, app is already running"), not full CLI-flag
      re-parsing on the receiving end. IPCServer.Global := True (all
      users on the machine) is narrowed to the current user only
      (XDG_RUNTIME_DIR is inherently per-user) - this port has no
      multi-user deployment scenario to justify the broader original
      behavior. A stuck/misbehaving client is bounded by a 2-second
      SO_RCVTIMEO on the server's accept loop rather than an unbounded
      blocking read, to protect GTK main-loop responsiveness on a local,
      single-user, trusted socket.
    verification: >
      `cd gui && make` clean (zero new warnings; one real -Wstringop-
      truncation caught and properly fixed - not silenced - by
      explicitly checking the resolved socket path's length against
      sun_path's ~108-byte limit before copying, returning a graceful
      no-IPC fallback instead of ever risking a truncated/wrong path).
      End-to-end test against the real built binary: started instance
      1, confirmed the socket file exists and instance 1 is listening;
      launched instance 2 with a real file argument
      (test_corpus_76/NEWDANCE.asc) - instance 2 exited immediately
      (exit 0, well under its 5s timeout budget) with only instance 1's
      process still running (confirmed via `ps aux`); instance 1's
      window title changed to "ay_emul_c11 - NEWDANCE.asc" (confirmed
      via `xwininfo -tree`, since the exact-title window search that
      worked before the hand-off no longer matched afterward - itself
      confirming the title update fired) and a screenshot shows correct
      rendering. 10/10 repeat fresh-instance runs (socket file removed
      between each) completed cleanly under `timeout` with zero crashes.
      Full regression suite re-confirmed clean: run_diff.sh 60/60;
      corpus_wav_md5_sweep.sh 75/0/1-known/0; tools/ay_player/
      smoke_test.sh full pass.

