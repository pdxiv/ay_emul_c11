  - id: MIG-0131
    title: "AYEmuSheet's 4 remaining real gaps closed: Preamp slider, typed exact-value entry for all 9 amplitude sliders, GBOUTZXAY (TStates-per-frame/interrupt-offset), and clip-warning labels - found via tools/lfm_analyze/lfm_analyze.py's ground-truth dump of AYEmuSheet/WOSheet/VolumeSheet, per an explicit user-approved plan"
    subsystem: "gui/mixer_win, gui/mainwin, engine/player, engine/hw/ay"
    state: translated
    summary: >
      User asked for a full dump of AYEmuSheet/WOSheet/VolumeSheet via
      tools/lfm_analyze/lfm_analyze.py (MIG-0130-era tool), then a plan to
      "implement the correct Mixer window". WOSheet (MIG-0130) and
      VolumeSheet (MIG-0129) were confirmed already faithful - all gaps
      found were in AYEmuSheet, previously undocumented:

      1. TBPreAmp/EPreAmp ("Preamp") - a 9th channel-amplitude slider,
      completely missing from the GUI despite ay_engine::pre_amp/
      pre_amp_max (engine/include/ay_engine/hw/ay.h:157-158) already being
      fully read by ay_engine_calculate_level_tables (engine/src/hw/
      ay.c:674, `k = pre_amp/pre_amp_max*2.0`) with the correct default
      (127). Added w->scale_preamp via the existing make_channel_slider
      helper, wired into apply_and_recalc/on_sync_timer exactly like the
      other 8 sliders (AL/AR/BL/BR/CL/CR/Beeper/DMA).

      2. Typed exact-value entry (EAmpAL etc, real Pascal:
      `Val(EAmpAL.Text,A,Cde); if (Cde=0) and (A in [0..255]) then
      FrmMain.SetChan2(A,0)`) - a 120px vertical slider alone can't
      address all 256 values precisely. make_channel_slider extended to
      create a paired GtkEntry per slider (9 total); one shared
      on_amp_entry_activate handler (clamps to [0,255], looks up the
      target GtkRange via g_object_set_data rather than 9 near-identical
      trampolines) and one shared sync_amp_entries (keeps every entry
      showing its slider's current value, called from both on_scale_
      changed and on_sync_timer).

      3. GBOUTZXAY ("OUT, ZXAY, AY, AYM") - entirely missing groupbox,
      two fields: "TStates per frame" (EOUTStPerFrm -> Set_N_TactS ->
      Set_N_Tact2 -> Set_N_Tact, MainWin.pas:1670-1712) and "Interrupt
      offset" (EIntOffs, real IntOffset). Discovered mid-implementation
      that Set_N_Tact has NO `if IsPlaying then exit` guard (unlike
      Set_Z80_Frq/Set_MC68K_Frq/Set_MFP_Frq, MIG-0120) - it's a LIVE,
      mid-playback-applicable override, not load-time-only; the engine.
      player.h doc comment was written correctly reflecting this the
      first time (double-checked against the real .pas source before
      writing, avoiding a repeat of MIG-0129's own "Wave-Out" mistake).
      Added player_set_n_tact/player_get_n_tact (engine/include/
      ay_engine/player.h + engine/src/player.c), mirroring player_set_
      frq_z80's exact shape (AY-format only, (9999,200000] range guard,
      writes p->as.ay.bus.max_tstates directly - the SAME field real
      playback timing already reads, z80_bus.c:266-267's own current_
      tact wraparound check). Interrupt-offset has no backing player/
      mainwin state at all (real IntOffset only ever feeds an export/
      conversion total-time calculation this port doesn't have) - just a
      GtkEntry clamped to [0,n_tact) on edit, echoing Set_N_Tact's own
      `if IntOffset>=MaxTStates then IntOffset:=MaxTStates-1` clamp.

      4. LAYOvfl/LTSOvfl/LDMAOvfl ("AY!"/"TS!"/"DMA" clip-warning
      labels) - shown/hidden per Calculate_Level_Tables2's own 3
      conditions (MainWin.pas:1799-1816). Added ay_engine_get_max_level
      (engine/include/ay_engine/hw/ay.h + engine/src/hw/ay.c), a direct
      port of Get_Max_of_Level_Tables (AY.pas:1018-1032) scanning the
      already-public level_al/ar/bl/br/cl/cr[32] arrays - no other
      engine change needed. Computed fresh every on_sync_timer tick.

      Two real bugs found and fixed while implementing/verifying #4
      (live X11 testing, not just build-clean - see verification):
        a) The labels were stuck permanently visible before the first
           file load (gtk_widget_show_all on window-open forces all
           children visible, and on_sync_timer's early-return-when-
           unloaded path never touched them). Fixed: gtk_widget_set_no_
           show_all(TRUE) + gtk_widget_hide() at creation, and an
           explicit hide in the early-return path.
        b) The overflow threshold was computed from `w->playback->
           bits_per_sample` (the user's own REQUESTED Digital-Sound-tab
           bit depth) instead of `e->sample_bits` (the engine's ACTUAL
           active bit depth) - these can diverge: player_pair_make_
           buffer unconditionally forces `ay->sample_bits=16` for
           genuinely TS-mode/TS-paired playback regardless of the
           requested setting (a pre-existing, already-documented
           constraint from MIG-0130's own debt list, not new). Caught by
           testing against a real TS-mode .ay file (MetalMania.ay) at an
           8-bit requested setting: the mismatch made a 127-based
           threshold get compared against level tables actually scaled
           for a 32767 range, showing warnings for values nowhere near
           genuinely clipping. Root-caused via targeted stderr debug
           prints at 3 points along the load/apply chain (removed before
           finishing) rather than guessing - confirmed player_set_
           sample_bits WAS setting e->sample_bits=8 correctly at load
           time, and player_pair_make_buffer was the ONLY code touching
           sample_bits again afterward. Fixed by reading e->sample_bits
           directly, matching real Pascal's own Calculate_Level_Tables2
           reading the SAME SampleBit that Calculate_Level_Tables itself
           just used for `r` - not a separately-tracked "requested"
           value.

      Also fixed in passing: "AY"/"YM" chip-type radio captions left
      as-is (not "AY-3-8910/12"/"YM2149F") - considered and explicitly
      decided NOT to change, since this file's own established
      "idiomatic, faithful in spirit" convention already accepts
      shortened captions elsewhere and the full names add little value
      at this control's size; noted here rather than silently dropped.

      A third real bug, this one flagged directly by the user rather
