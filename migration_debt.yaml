  - id: MIG-0123
    title: "TBAmpDMA (Atari DMA-sound headroom amplitude) fully implemented, correcting a real correctness bug: engine/hw/ay.c's atari_dma_max defaulted to 0 for every caller, silently muting DMA/digi-sample audio in every SNDH file that uses it - not merely a missing GUI slider, as it was previously (incorrectly) categorized"
    subsystem: "engine/hw/ay, gui/mixer_win, gui/mainwin"
    state: translated
    summary: >
      User asked why TBAmpDMA (Mixer's Atari DMA-sound amplitude
      trackbar) was judged out of scope, given the sibling Beeper
      slider (TBAmpBpr) had already been found to be a real, easy-to-
      close gap (MIG-0106) despite an initially similar "out of scope"
      label. Investigating that question in the real Pascal source
      (AY.pas's Calculate_Level_Tables, MainWin.pas:907/1955-2027/
      4332/4603/5055-5071, settings.pas:31, mxhelper.lfm) found the
      same pattern: `atari_dma_max` (settings.pas: Atari_DMAMax) is a
      real `ay_engine` field with a real mixing effect (folded into
      Calculate_Level_Tables's own `l`/`r` normalization denominator,
      exactly like beeper_max, plus a second, DMA-specific effect via
      `atari_dma_level` -> engine/hw/dma_sound.h's dma_sound_mix,
      already wired end-to-end via atari_emulate's own on_mix_dma
      callback for every SNDH file) - but unlike beeper_max, which
      already defaulted to the correct 146 (BeeperMaxDef) in
      ay_engine_init, atari_dma_max was hardcoded to 0 with ZERO call
      sites anywhere in the codebase ever setting it to anything else.
      Confirmed via a standalone before/after buffer-level comparison
      against megaintr.snd (a real corpus file, previously cited
      elsewhere in this ledger as "genuinely uses DMA sound"): with
      atari_dma_max=0 (the pre-existing default), the first ~200,000
      rendered sample-frames are ENTIRELY silent; with atari_dma_max=
      146, the same window produces real, audible, nonzero output.
      This was a genuine, previously-undiscovered audio-correctness
      bug (DMA-sample content silently muted for every SNDH file that
      uses it), not merely an absent GUI convenience control.

      Investigated WHY the real Pascal engine-level default (146,
      MainWin.pas:907's one-time interactive-app startup assignment)
      and this port's own shared engine/ library default (0) should
      legitimately differ, rather than blindly copying 146 into
      ay_engine_init: ay_emul/OracleHarness.pas explicitly resets
      `Atari_DMAMax := 0` before EVERY SINGLE comparison scenario
      (confirmed via grep - dozens of occurrences, always paired with
      a `BeeperMax := BeeperMaxDef` re-assert), a deliberate test-
      determinism convention treating Atari_DMAMax as noise to
      suppress for byte-comparison purposes - unlike BeeperMax, whose
      harness reset (146) happens to already match the real
      interactive default, so no conflict exists there. Changing
      ay_engine_init's own shared default to 146 would have silently
      perturbed byte-identical output for every existing engine-level
      consumer (ay_player, ay_export, tests/oracle_diff, tests/
      engine_smoke) that currently matches the oracle's own 0-reset
      convention, without those consumers necessarily even loading a
      DMA-using file.

      Resolution: engine/hw/ay.c's ay_engine_init keeps `atari_dma_max
      = 0` (matching the oracle-diff harness convention, UNCHANGED,
      byte-identical to every currently-passing engine-level gate);
      gui/src/mainwin.c's do_load_song (the one caller representing
      the REAL interactive app, not a test/CLI harness) now explicitly
      sets `atari_dma_max = 146` and forces an
      ay_engine_calculate_level_tables recalc on every fresh load
      (mirroring MainWin.pas:907's real startup default, applied per-
      load since this port's own struct-per-load architecture has no
      persistent cross-load global the way real Pascal does - same
      established precedent as every other per-load GUI-only engine-
      state push in that function, e.g. the vis-sampling/filter-
      quality re-enables right above it). gui/mixer_win.c gained the
      8th "DMA" slider in the existing GBChAmp/"Channel amplitude"
      groupbox, immediately after Beeper (MainWin.pas:3811-3814's own
      AddBitmaps order), wired into apply_and_recalc/on_sync_timer
      exactly like scale_bpr/beeper_max's own established pattern -
      live-adjustable within a session, resetting to the 146 GUI
      default on the next fresh load, same model as every other
      Mixer control.

      mxhelper.pas's own DMA-headroom-reservation nuance (the
      TSDMAChG check-group and PreAmp-search loop in Mixer.pas's
      SBHelperClick, which only reserve/optimize headroom for a
      user-chosen channel-mode preset) remains explicitly out of
      scope, as this port's own mxhelper.h already documented before
      this entry - a real, smaller, separately-scoped nicety, not the
      same gap as TBAmpDMA's own basic existence/audibility.
    rationale: >
      Not validated via the oracle-diff mechanism (no scenario in
      ay_emul/OracleHarness.pas exercises a nonzero Atari_DMAMax at
      all, by the harness's own deliberate design - see summary above -
      so there is no byte-identical oracle target this fix could be
      compared against even in principle), but the underlying
      per-format engine math (Calculate_Level_Tables's l/r/atari_dma_
      level formula, dma_sound_mix's own sample-scaling) was already
      oracle-validated as part of this port's original AY.pas/
      atari.pas ports (see MIG-0011, referenced directly in atari.pas's
      own comment on Atari_DMALevel) - what's new here is purely
      wiring a previously-inert field to its correct default and a
      live GUI control, not new mixing arithmetic. Confirmed via a
      direct standalone before/after comparison (not committed as a
      permanent test) against a real corpus file with genuine DMA
      content, proving the fix has the intended, previously-absent
      audible effect. The full existing regression suite (engine_smoke,
      gui_smoke, ay_player smoke test, oracle_diff's 70-file WAV md5
      sweep) shows zero new failures, confirming the shared engine/
      library default was correctly left untouched.
    verification: >
      engine/ and gui/ build clean (-std=c11 -Wall -Wextra[-Wpedantic],
      zero warnings). tests/engine_smoke: all 12 runnable binaries pass
      (test_atari's own pre-existing, unrelated failure - see MIG-0120's
      verification section - confirmed already present on the
      unmodified base commit, not touched by this entry).
      tests/gui_smoke/test_playlist_ayl: all 4 tests pass.
      tools/ay_player/smoke_test.sh: all 19 corpus files + 2 error
      paths pass. tests/oracle_diff/corpus_wav_md5_sweep.sh: 70 passed,
      0 failed, same 3 pre-existing known-non-identical/skip cases as
      before this entry - confirms ay_engine_init's own shared default
      staying at 0 did not perturb any existing byte-identical oracle
      comparison. Direct standalone before/after buffer comparison
      (compiled and run outside the test suite, not committed as a
      permanent test file) against test_corpus_76/megaintr.snd: with
      atari_dma_max=0, the first 50*4096=204800 rendered stereo sample-
      frames are entirely zero (silent); with atari_dma_max=146 (this
      entry's new GUI-path default) and a forced level-table recalc,
      the same window produces genuinely audible (nonzero) output -
      direct, positive proof the fix has its intended effect, not just
      a "doesn't crash" check. Also confirmed level_al/etc (the six
      regular AY-channel tables) are BYTE-IDENTICAL between the two
      runs for this file (the max() clamp in Calculate_Level_Tables
      absorbs the +146 contribution to `l` for this file's specific
      index values), so this file's own AY-tone content is provably
      unaffected by the fix - only its previously-silent DMA-sample
      content becomes audible, exactly as intended.
    debt:
      - "No live-GUI interactive verification that the new DMA slider
        in the Mixer window actually drags/displays correctly when
        driven through the real GTK event loop - only a clean build,
        the standalone before/after buffer-level proof described
        above, and code review against Mixer.pas/MainWin.pas/AY.pas's
        own real behavior. Same synthetic-X11-input environment gap
        noted in MIG-0120/MIG-0121/MIG-0122."
      - "mxhelper.pas's TSDMAChG check-group and PreAmp-search headroom-
        optimization loop (Mixer.pas's SBHelperClick) remain out of
        scope, unchanged from before this entry - a real, deliberately
        separate, smaller gap (this port's mxhelper Presets picker
        always applies a preset's channel-mode indices without any
        DMA/TS headroom reservation step)."

  - id: MIG-0124
    title: "Mixer.pas GBChFrq/GBIntFrq's own LIVE override sub-panels (RBChFrqZX/Pnt/ST/CPC/Other, RBEIntFrqZX/RBIntFrqPnt/RBIntFrqOther) - the last explicitly-flagged remaining Mixer gap, closed per explicit user request to fully implement the Mixer/Tools/Playlist windows"
    subsystem: "gui/mixer_win"
    state: translated
    summary: >
      User asked to fully implement the Mixer, Tools, and Playlist
      windows (excluding BASS/proxy/network and .cue streaming). Mixer's
      own header comment already flagged exactly one remaining gap:
      GBChFrq/GBIntFrq's read-only "current value" displays (EChFrqCur/
      EIntFrqCur, MIG-0088-era) existed, but their real override sub-
      panels did not - and that header's own "would need additional
      per-format engine plumbing" justification was stale: player_set_
      chip_freq/player_set_player_freq already exist and are already
      used by apply_item_overrides, so no new engine work was needed,
      only the GUI wiring.

      Added GBChFrq (RBChFrqZX/1773400, RBChFrqPnt/1750000, RBChFrqST/
      2000000, RBChFrqCPC/1000000, RBChFrqOther/free-entry) - a LIVE AY-
      chip clock override (MainWin.pas:1534-1552's Set_Chip_Frq via
      player_set_chip_freq), unlike the load-time-only GBZ80Frq/GBMCFrq/
