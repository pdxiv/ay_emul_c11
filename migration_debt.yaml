  - id: MIG-0071
    title: "Phase 5 continuation: PlayList.pas's core data model and window ported (gui/src/playlist.c, gui/src/playlist_win.c); ButPrev/ButNext corrected to real playlist navigation; ButList wired; Open/drag-drop now route through the playlist"
    subsystem: gui/playlist, gui/mainwin
    state: validated
    summary: >
      A first, scoped port of PlayList.pas (4,255 lines in the original)
      matching this port's existing scope boundaries (README.md's
      Scope section: playback + WAV export only, no BASS/CD/MP3/OGG/
      FLAC/streaming - which rules out almost the entire original
      TFrmPLst popup menu, itself mostly conversion-format commands).
      gui/include/gui/playlist.h + gui/src/playlist.c: a plain array-
      based `gui_playlist` model. gui_playlist_add_file() probes the
      file with the REAL player_load_song dispatch (not a separate
      guess) and expands multi-song .ay files into one entry per
      subsong (mirrors Players.pas's OpenAYFile, which iterates
      0..NumOfSongs when building playlist entries). gui_playlist_add_
      directory() recursively scans a folder for the 18 extensions
      player.h dispatches, calling an abort-checking progress callback
      per file examined. gui/include/gui/playlist_win.h + gui/src/
      playlist_win.c: the window, built with idiomatic GTK2 widgets per
      the user's explicit best-practices request - GtkTreeView/
      GtkListStore for the list (not a custom-painted list like the
      original's TPlayList/PlayListPaint), GtkVBox/GtkHBox layout (not
      GtkFixed - PlayList.pas was already scoped as hand-design work,
      not generator output, and isn't skin-rendered like MainWin, so
      there's no coordinate-fidelity reason to use GtkFixed here),
      "row-activated" for double-click-to-play, GtkFileChooserDialog
      (multi-select for Add Files, folder-select for Add Folder) - and
      "delete-event" mapped to gtk_widget_hide_on_delete so closing the
      window (like MainWin.pas's ButList Is_On toggle) hides rather than
      destroys it. gui/dialogs/progbox.c (MIG-0066's generated skeleton)
      was hand-completed with real wiring - GtkVBox layout, a real
      indeterminate progress pulse, and a working Abort button - and is
      now used as the folder-scan progress dialog.

      Once a real playlist existed, MainWin.pas's actual ButNextClick/
      ButPrevClick behavior was re-checked directly against the source
      (MainWin.pas:1876-1885: `FrmPLst.PlayNextItem`/`PlayPreviousItem`)
      and turned out to be PLAYLIST navigation, not subsong navigation -
      MIG-0068's original wiring (subsong index ± 1) was a reasonable
      stand-in given no playlist existed yet at the time, but not what
      the real buttons do. gui/src/mainwin.c's on_button_release was
      corrected to call gui_playlist_win_prev/next() instead. ButOpen
      and the MIG-0070 drag-and-drop handler were also changed to route
      through gui_playlist_win_replace_with_path() (clears the playlist,
      adds the file(s), plays entry 0) instead of loading directly -
      matching FormDropFiles's real "not a skin drop -> StopAndFreeAll +
      ClearPlayList" behavior more closely than MIG-0070's original
      version did. ButList (MainWin.pas coordinates (310,77,26,26)) now
      toggles the playlist window's visibility.
    rationale: >
      Deliberately narrower than PlayList.pas in several documented
      ways (not silent gaps): no per-item metadata display (Author/
      Title/Tracker/Computer/Date/Comment - blocked on the same
      not-yet-done per-format metadata extraction as MIG-0067's deferred
      title/author display); no per-item channel/volume overrides; no
      .ayl/.cue/.m3u playlist-file load/save; no sorting/deduplication/
      "find item"; no conversion-menu commands (already out of this
      port's scope entirely beyond WAV, and WAV conversion itself stays
      a CLI-only feature, not exposed from the playlist). A dropped
      .ays skin file is silently rejected by the playlist's own
      player_load_song probe (not a recognized playable format) rather
      than triggering FormDropFiles's real skin-switch behavior -
      runtime skin-switching was never wired in this port (MIG-0064:
      only the embedded default skin loads).
    verification: >
      `cd gui && make` clean (zero new warnings beyond the pre-existing
      harmless GTK2-on-modern-glib deprecation ones). Standalone data-
      model test (bypassing GTK): gui_playlist_add_file() against
      test_corpus_76/MetalMania.ay added 12 entries (matches MIG-0063's
      already-confirmed song_count); against NEWDANCE.asc added 1;
      against a nonexistent file added 0 (correctly rejected); gui_
      playlist_add_directory() against test_corpus_76/ added 136
      entries across the corpus with zero crashes. Standalone GTK test
      (real GtkListStore/GtkTreeView construction, no click simulation
      needed since the model/window API is exercised directly - the
      same functions the row-activated/button-clicked signal handlers
      call): gui_playlist_win_replace_with_path() on MetalMania.ay
      fired the real on_play callback for entry 0 (song_index=0);
      gui_playlist_win_add_path() appended NEWDANCE.asc (count 12->13);
      two gui_playlist_win_next() calls advanced song_index 0->1->2,
      firing on_play each time; gui_playlist_win_prev() moved back to
      song_index=1; toggle_visible() correctly flipped gtk_widget_get_
      visible() true/false/true; gui_playlist_win_clear() reset count
      to 0 and current to -1. Screenshot of the running app confirms
      the main window (all buttons including the new ButList) still
      renders correctly; the playlist window (hidden until toggled,
      confirmed by the same standalone test) uses standard GTK2 chrome,
      not a custom skin, per this entry's own scope decision. Full
      regression suite re-confirmed clean: tests/oracle_diff/run_diff.sh
      60/60; corpus_wav_md5_sweep.sh 75/0/1-known/0; tools/ay_player/
      smoke_test.sh full pass - zero regressions (all playlist code is
      new, additive, and does not alter any existing dispatch path).

  - id: MIG-0072
    title: "Phase 5 continuation: real song title/author/comment metadata extraction for .ay files (Players.pas: OpenAYFile), CP1251->UTF-8 conversion, wired into MainWin's title bar and the playlist's display strings"
    subsystem: engine/ay_file, engine/player, gui/playback, gui/playlist
    state: validated
    summary: >
      Ports Players.pas:7154-7184's OpenAYFile relative-pointer string
      walk (previously explicitly out of scope per ay_file.h's own
      comment - "GUI playlist metadata, irrelevant to correct audio
      playback" - now revised since this metadata IS needed for the
      title-bar/playlist display work landing in this milestone).
      engine/src/ay_file.c: new read_relative_pstring() reads a
      big-endian smallint pointer at a given field offset (relative to
      the pointer field's OWN file position, same convention already
      used by locate_song_data), follows it to a NUL-terminated string,
      and Trims it (strips bytes <= ' ', matching Pascal's Trim on an
      8-bit string). ay_file_load() now populates three new raw
      (untranscoded) fields - f->author (PAuthor, field offset 12),
      f->comment (PMisc, field offset 14), both read once per file
      (matching AuthorString/MiscString being computed outside
      OpenAYFile's per-song loop) - and f->title (PSongName, inside this
      song_index's TSongStructure entry, so it correctly varies per
      subsong). Promoted to the generic dispatch layer as
      player_get_metadata_raw() in engine/include/ay_engine/player.h /
      engine/src/player.c (empty strings for every non-AY format, same
      "not yet extracted" state their own headers already documented -
      unaffected by this entry).

      Bytes are stored RAW (not transcoded) at the engine layer - real
      .ay author/title/comment text is CP1251-encoded (settings.pas's
      non-Windows CodePageDef default; this port doesn't expose the
      user-configurable codepage setting, always assumes CP1251).
      Transcoding to UTF-8 (required for GTK widgets, which reject
      invalid UTF-8) happens at the GUI layer via glib's g_convert(),
      matching the existing engine-stays-audio-focused/GUI-owns-display-
      polish split (gui/src/playback.c's cp1251_to_utf8(), duplicated in
      gui/src/playlist.c - both files are small and self-contained,
      same precedent as their existing duplicated basename_of()).
      gui/include/gui/playback.h gained meta_author/meta_title/
      meta_comment (UTF-8, empty on no-metadata or failed conversion -
      never raw untranscoded bytes). gui/src/mainwin.c's do_load_song
      now sets the window title to "ay_emul_c11 - Author - Title" when
      either is non-empty (falling back to the filename otherwise, same
      as before this entry). gui/src/playlist.c's probe_song() fetches
      metadata for every subsong individually (title varies per song,
      author/comment are read once and reused, matching OpenAYFile's own
      one-read-outside-the-loop structure) and gui_playlist_entry.
      display now uses Players.pas:2475-2493's own FormatScrollString
      convention ("Author - Title", falling back to just Author, just
      Title, or the filename) with a "(song N/M)" suffix appended for
      multi-song files so same-author/different-title subsongs (and
      same-title-less multi-song files) stay distinguishable in the list.
    rationale: >
      CP1251 is hardcoded, not read from any config (this port has no
      settings.pas equivalent/config file yet) - a documented
      simplification, not a silent gap: files using a different
      encoding (the original's user-configurable CodePageDef) will show
      mojibake or an empty string (on g_convert failure) rather than
      correct text. Every non-.ay format still has zero metadata
      extraction, matching their own headers' pre-existing, still-
      accurate notes - this entry only closes the gap for .ay files
      specifically, which happen to be the format with an explicit,
      well-defined metadata block in Players.pas.
    verification: >
      `cd engine && make` and `cd gui && make` both clean (zero new
      warnings beyond the pre-existing harmless deprecation ones and one
      -Wformat-truncation false-positive on an intentionally-bounded
      display-string snprintf, explicitly silenced with a scoped
      #pragma and comment explaining why). Standalone engine-level test
      against real files: test_corpus_76/MetalMania.ay song 0 ->
      author='Ozzyoss' title='Church' comment='METAL MANIA DEMO BY
      OZZYOSS 1994'; song 1 -> title='Select' (confirms per-song title
      varies correctly, author/comment stay constant); test_corpus_76/
      Alien_Demo.ay -> author='Lukas Vlckov' title='Total Recall'
      comment='Alien Demo by KVL'; test_corpus_76/Killers.ay ->
      author='Ozzyoss' title='Killers tune 1'; test_corpus_76/T21.ay ->
      all three empty (a real .ay file with no metadata block - confirms
      the "none present" path doesn't error or return garbage). GUI-
      layer test (real gui_playback_load_song + CP1251->UTF-8, ALSA-
      backed): MetalMania.ay song_index=2 -> meta_author='Ozzyoss',
      meta_title='Purple' (matches the engine-level per-song extraction
      pattern). Playlist-level test: gui_playlist_add_file on
      MetalMania.ay produced display strings "Ozzyoss - Church (song
      1/12)", "Ozzyoss - Select (song 2/12)", "Ozzyoss - Purple (song
      3/12)" for songs 0-2. Screenshot of the running app confirms
      correct rendering (unaffected visually until a file is loaded).
      One flaky, non-reproduced SIGSEGV was observed during manual
      testing of this batch (backtrace inside glibc/gettext's
      guess_category_value, triggered from the playlist window's first
      g_object_new call) - investigated via AddressSanitizer (0/3 runs
      reproduced, no heap-corruption report) and 30 additional plain
      runs across -O0/-O2 builds (0/30 reproduced) - concluded to be a
      one-off environmental fluke (e.g. a transient X/gettext locale
      hiccup), not a deterministic defect in this entry's code; flagged
      here rather than silently ignored, per this project's own
      standing verification discipline, in case it recurs.
      tests/oracle_diff/run_diff.sh 60/60; corpus_wav_md5_sweep.sh
      75/0/1-known/0; tools/ay_player/smoke_test.sh full pass - zero
      regressions (all changes are additive new fields/functions, no
      existing dispatch path altered).

