  - id: MIG-0011
    title: "IsFilt/Filt_K FIR filter coefficients ported and validated"
    subsystem: engine/ay
    state: validated
    summary: >
      AY.pas's filter-coefficient design (MainWin.pas:5073-5168,
      TFrmMain.CalcFiltKoefs/SetFilter - a Hamming-windowed-sinc lowpass
      FIR, found in MainWin.pas rather than mixerctl.pas/digsound.pas as
