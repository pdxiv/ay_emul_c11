      Players.pas:1766/2051) before ever reaching STC_Get_Registers, and
      test_corpus_76/ contains no .st1/.st3 files - those converters are
      real, tracked incompleteness (not silently dropped): a .st1/.st3
      file added to the corpus later would fail to load until they are
      ported too. Unlike GTR/FLS, STC's on-disk pointers need no load-time
      relocation at all (LoadTrackerModule has no FT.STC-specific branch),
      making this port's loader the simplest of the four so far - the
      complexity here is instead in STC_Get_Registers's own sample/
      ornament/pattern lookups, each done via an unbounded linear scan
      for a matching ID byte spaced at a fixed stride (samples: 0x63
      bytes apart starting at 0x1B; ornaments: 0x21 bytes apart at
      ST_OrnamentsPointer; patterns: 7 bytes apart at ST_PatternsPointer)
      - replicated literally rather than reshaped into indexed arrays,
      matching the real code's trust-the-file-is-well-formed approach.
      Reuses ST_Table (Players.pas:973-984, duplicated per this project's
      per-file convention, same table FLS uses and confirmed distinct from
      PT3/PT1/GTR's PT3NoteTable_ST). Notable per-format behavior: like
      FLS, STC's noise register is a direct unconditional overwrite per
      channel, not GTR's OR-accumulate.
      tools/ay_player wires STC in via the same extension-based fallback
      detection used for PT1/GTR/FLS (`.stc`).
    rationale: >
      Closed as validated: oracle-diff byte-identical against the real
      Pascal codebase for a full 400-buffer/204800-frame render of a real
      corpus file on the first attempt - verified against the literal
      Pascal source (including the word-arithmetic operator-precedence
      rules for the tone computation, and the STC/FLS-vs-GTR noise-write
      difference) rather than assumed from prior formats' precedent, per
      this workspace's porting-invariant to verify rather than assume.
    verification: >
      tests/oracle_diff/run_diff.sh's stc_file gate: OracleHarness.pas's
      RunSTCFileTest (real Pascal, via LoadTrackerModule/STC_Get_Registers/
      MakeBufferTracker) vs dump_engine_state's run_stc_file (this port,
      via stc_file_load/stc_file_make_buffer), both driving
