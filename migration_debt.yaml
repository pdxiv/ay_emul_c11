  - id: MIG-0017
    title: "Seek/scrub support not ported (Atari_Emulate_One_VBL, DMASndSkipMC68000Takts)"
    subsystem: engine/atari_emulate
    state: behaviorally_incomplete
    summary: >
      atari.pas's Atari_Emulate_One_VBL (atari.pas:1525-1550, a fast-forward
      variant used only by Atari_SeekTo for scrubbing/seek-position UI) and
      DMASndSkipMC68000Takts (atari.pas:317-354, confirmed this milestone
