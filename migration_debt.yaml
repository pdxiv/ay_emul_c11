  - id: MIG-0119
    title: "RESOLVED: window 2x-scaling (CBDoubleSz) implemented, per explicit user request to fully implement using the original Pascal's own approach"
    subsystem: gui/mainwin, gui/regions, gui/tools_win
    state: validated
    summary: >
      Direct continuation of MIG-0095's own disclosed CBDoubleSz gap,
      researched by tracing every `* Scale` site in MainWin.pas (~40
      occurrences: Canvas.CopyRect destination rects, hit-test zone
      comparisons, the rgn.inc window-shape span table, MoveVol/
      MoveProgr region offsets) before implementing. Confirmed no other
      window (Mixer/PlayList/Tools/About) ever references Scale - it is
      genuinely main-window-only, matching MIG-0095's own title.

      Key finding that shaped the implementation: the original NEVER
      pre-scales the skin bitmap or any coordinate table itself - Scale
      is applied at DRAW/HIT-TEST TIME, on the fly, to every individual
      coordinate (`x * Scale`), with Canvas.CopyRect stretching the SAME
      1x-resolution source bitmap into a Scale-multiplied destination
      rect (Windows GDI's own stretch-blit behavior). This maps
      cleanly onto Cairo's own native `cairo_scale` transform: rather
      than hand-multiplying every one of gui/src/zones.c's/gui/src/
      mainwin.c's dozens of button/LED/slider/ticker coordinates (the
      literal translation), a single `cairo_scale(cr, scale, scale)`
      at the top of on_expose achieves the IDENTICAL rendered result,
      since every draw call in that function (and the offscreen-
      surface composites inside zones.c/ticker.c, whose own internal
      buffers stay 1x and are only ever painted onto the outer,
      now-scaled `cr`) shares the one transformed context - the same
      "idiomatic equivalent of the original mechanism, not a literal
      line-by-line translation" approach already used elsewhere in this
      port (e.g. GdkRegion for CreateRectRgn+CombineRgn).

      Four pieces, matching MainWin.pas's own four consumers of Scale:
       - Drawing: cairo_scale in on_expose (gui/src/mainwin.c) - zero
         changes needed in gui/src/zones.c/ticker.c/visualizer.c, all
         of which already draw through the same `cr`.
       - Window/drawing-area real pixel size: gui_mainwin_set_scale
         (Tools.pas: CBDoubleSzClick's `Scale := NewS`) resizes both
         via gtk_widget_set_size_request + gtk_window_resize.
       - Window shape: gui_apply_main_window_shape gained a `scale`
         parameter, multiplying every rgn.inc span exactly like
         MainWin.pas:3288-3298's own `x * Scale, y * Scale, ...`.
       - Hit-testing: mouse event coordinates (real window pixels) are
         divided by mw->scale once, in on_button_press/on_motion,
         before being compared against any zone's own 1x skin-space
         rect - zones.c itself needed no changes at all, since it
         already just compares plain ints with no scale awareness of
         its own (matching MainWin.pas's own `X >= zx * Scale`
         approach in spirit: converting one side of the comparison is
         equivalent to converting the other).
      gdk_window_begin_move_drag's own event->x_root/y_root (absolute
      screen coordinates for the window manager, not skin-space) are
      deliberately NOT scaled, matching the original (Scale never
      appears anywhere near TrayIcon/window-manager-facing coordinates
      in MainWin.pas either).

      Wired CBDoubleSz into gui/src/tools_win.c's GenTools tab as a
      "Double window size" checkbox (matching CBForceLoop's own
      established placement/pattern), calling gui_mainwin_set_scale
      directly on toggle - Tools.pas:328's own `NewS := Ord(CBDoubleSz.
      Checked) + 1` translated to `checked ? 2 : 1`, with `if NewS <>
      Scale` already built into gui_mainwin_set_scale's own guard.
      PrepareRgn's own ClueRgn half (wiring RgnPlay/etc. region HANDLES
      for hit-testing) has no equivalent step needed here, since this
      port's zones.c hit-tests plain rects directly rather than GDI
      region handles.

      Also corrected a second, unrelated stale debt bullet found while
      touching MIG-0095's own list: CBForceLoop was ALSO already marked
      "confirmed out of scope, not ported" there, but MIG-0114 (a later
      entry) had already ported it - the same class of staleness
      MIG-0091's own "ts" bullet had, caught and fixed there earlier
      this session.

      UPDATE: the user reported the exact real-world symptom this
      entry's own initial ImageMagick-`import`-based screenshot
      verification failed to catch - "doubling the window size only
      doubles the texture; the actual canvas area isn't enlarged, so
      buttons in the lower part are outside the application area."
      Root-caused two real, independent bugs, both timing/hint issues
      around resizing an already-realized, non-resizable window, not
      anything wrong with the scaling math itself:
       (1) PrepareRgn's own tail (MainWin.pas:3300-3303) was re-read
           more carefully and found to explicitly DEFER the shape-mask
           application - `Width := MWWidth*Scale; Height := MWHeight*
           Scale; Application.QueueAsyncCall(@SetRgn, 0);` - resizing
           synchronously but applying the NEW shape region only later,
           once the resize has actually been processed. The original
           implementation here called gui_apply_main_window_shape
           synchronously, immediately after gtk_window_resize, racing
           the shape-combine against GTK's own (also not-synchronous)
           resize processing. Fixed by deferring the shape reapplication
           via g_idle_add (this port's own Application.QueueAsyncCall
           equivalent) - matches the original's own timing exactly, not
           a workaround invented for this port.
       (2) A second, independent issue: gtk_window_set_resizable(FALSE)
           (set once at window creation) locks the WM-facing min/max
           size hints to whatever was in effect at that time; some
           window managers cache those hints and won't honor a later
           gtk_window_resize while a window is still marked non-
           resizable, even though GTK's own internal widget allocation
           can still eventually reach the new size regardless - the
           drawing area would then stay visually/interactively clipped
           to the old bounds while the skin painted "underneath" at the
           new scale, exactly matching the reported symptom. Fixed by
           briefly toggling resizable TRUE for the duration of the
           resize (sending a fresh, correct size hint on re-lock)
           instead of relying on a specific window manager's leniency.
      Neither bug reproduced on this session's own test display/window
      manager via screenshot comparison (both looked identical whether
      the fixes were present or not) - confirmed instead via lower-
      level, WM-independent diagnostics: gtk_widget_get_allocation on
      mw->area directly (not just the toplevel), and a small X11-Shape-
      extension query tool (XShapeQueryExtents/XShapeGetRectangles)
      confirming the actual combined shape region's real extents match
      the target scaled size. This is the reason the original
      verification pass (screenshot-only) missed it: ImageMagick's
      `import -window` captures the window's painted backing content
      directly, bypassing the X Shape extension entirely, so a window
      whose shape mask (or WM-visible size) never actually grew would
      still screenshot as if it had.
    rationale: >
      Direct continuation of MIG-0095's own explicitly disclosed scope
      boundary, closed exactly as the user asked: using the original's
      real mechanism (per-coordinate Scale multiplication against a
      never-pre-scaled bitmap, AND its own explicitly-deferred shape-
      mask timing, found only on the user's own bug report prompting a
      closer re-read of PrepareRgn's tail) translated to its natural
      Cairo/GLib equivalents, not a new design.
    verification: >
      `cd gui && make clean && make` clean (-std=c11 -Wall -Wextra
      -Wpedantic, zero new warnings). tests/oracle_diff/run_diff.sh:
      143/143 PASS, 0 FAIL (unaffected - engine/ untouched).
      tests/gui_smoke/test_playlist_ayl.c: all 4 tests still pass
      (playlist.c untouched by this entry either).

      Real, visual, running-window verification via a small standalone
      driver linking the actual gui object files, run under a real X
      display (DISPLAY=:0): confirmed via xwininfo the window/drawing-
      area reports exactly 358x123 at scale=1 and exactly 716x246
      (358*2 x 123*2) after calling gui_mainwin_set_scale(&mw, 2).
      Beyond that (see UPDATE above for why this alone wasn't
      sufficient): gtk_widget_get_allocation queried directly on
      mw->area (not just the toplevel) confirms it independently
      reaches 716x246, and a purpose-built X11 Shape-extension query
      tool confirms the actual combined window shape region's real
      extents (714x244, matching the scaled rgn.inc table) rather than
      trusting a screenshot. The Tools window's "Double window size"
      checkbox screenshot-confirmed present and correctly reflecting
      scale=1 (unchecked) at startup.
    debt: []

  - id: MIG-0096
    title: "Phase 5: user-reported bug fixes (main window wouldn't drag, visualizer bars looked too faint) plus a follow-up sweep that found two more real gaps (button press-and-drag-off-to-cancel, mouse wheel volume control)"
    subsystem: gui/mainwin, gui/dialogs/about, gui/visualizer
    state: validated
    summary: >
      User reported two observed regressions versus the real Pascal
      app: (1) the main window couldn't be dragged by clicking its
      title strip at all ("sits still"), and (2) the live spectrum/
      amplitude bars looked "very thin, only something like 1 pixel in
      width". Traced both against MainWin.pas before fixing, per the
      standing methodology, then did a further sweep (as explicitly
      requested) that found two more real, previously-unnoticed gaps
      in the same area of code.

      (1) Window drag bug (a real regression, not a fidelity gap):
      `gdk_window_begin_move_drag` sends a `_NET_WM_MOVERESIZE` client
      message the window manager expects to target the actual TOPLEVEL
      window, but `on_button_press` was passing `gtk_widget_get_window
      (widget)` where `widget` is `mw->area` - a `GtkDrawingArea` with
      its own child `GdkWindow` nested inside the toplevel's (even
      though it visually fills the whole thing) - so the request
      silently no-op'd on this sandbox's window manager. Fixed to
      target `gtk_widget_get_window(mw->window)` (the real toplevel)
      instead. Empirically verified with a real synthetic X11 drag
      (via `libXtst`'s `XTestFakeButtonEvent`/`XTestFakeMotionEvent`,
      not just re-reading source): the window moved from `+110+65` to
      `+648+583` after a scripted press-drag-release sequence inside
      the title-strip zone. The EXACT same bug existed in `gui/
      dialogs/about.c`'s own background-drag fallback (About.pas's own
      FormMouseDown BeginDrag-when-nothing-else-hit branch) - fixed the
      same way, targeting `aw->window` instead of `widget`
      (`aw->area`). Traced MainWin.pas's own FormMouseDown/WndCallback
      first to confirm the ORIGINAL doesn't actually support "drag from
      anywhere" either (MoveWin.Touche gates a specific 84,5-279,22
      title-strip zone on both Windows' WM_NCHITTEST/HTCAPTION path and
      the non-Windows BeginDrag path) - this port's existing zone
      coordinates were already correct, only the target-window bug
      prevented dragging from working AT ALL within that zone.

      (2) Visualizer bar antialiasing: MainWin.pas's TCanvas.MoveTo/
      LineTo (GDI) draws a hard, fully-opaque, non-antialiased 1px
      line; Cairo's default stroke rendering IS antialiased, so a
      nominally-identical 1px line (especially at the half-integer
      coordinates used to keep it centered on one device pixel)
      renders visibly fainter/softer than GDI's crisp line even though
      both are logically "1px wide" - this is what read as "very thin"
      to the user. Fixed by calling `cairo_set_antialias(cr,
      CAIRO_ANTIALIAS_NONE)` before drawing the amplitude/spectrum
      bars and peak markers in `gui_visualizer_draw`, reproducing
      GDI's crisp look. Verified via a cropped/enlarged real
      screenshot showing solid, sharp, fully-opaque bars (previously
      faint) during actual playback.

      Follow-up sweep (explicitly requested) found two more real gaps
      in the same click-handling code, by re-reading MainWin.pas's
      FormMouseMove/FormMouseUp/FormMouseWheelDown/Up in full rather
      than assuming the already-ported subset was complete:
       - Press-and-drag-off-to-cancel: the original's FormMouseMove
         continuously toggles each `TButtZone`'s pushed-visual state
         via `Touche(X,Y)` while the mouse button is held (`if Touche
         then Push else UnPush`), and FormMouseUp only fires a
         button's action if the release position is STILL within its
         zone. This port's `on_button_release` fired every button's
         action unconditionally on release regardless of final cursor
         position, and never visually un-pushed a button while
         dragging off it - meaning a press could never be cancelled by
         dragging away before releasing, unlike the original. Fixed by
         adding a `pressed_button` field (`gui_mainwin`/`about_win`)
         that `on_motion` uses to continuously re-run the same
         `gui_button_hit_test` each button press already used, exactly
         mirroring FormMouseMove's per-frame Push/UnPush - `on_button_
         release`'s existing `is_pushed`-gated firing then does the
         right thing automatically, no separate release-time hit-test
         needed. (About.pas's own `on_button_release` already had a
         correct release-time hit-test independently of this - only
         the live visual un-push feedback during the drag itself was
         missing there, added for consistency.)
       - Mouse wheel volume control: MainWin.pas's FormMouseWheelDown/
         Up call VolDown/VolUp unconditionally for a wheel event
         ANYWHERE on the window (no zone restriction, a plain
         TForm.OnMouseWheel handler) - this port had no scroll-event
         handling of any kind. Added a `GDK_SCROLL_MASK`-gated
         `on_scroll` handler reusing the exact same `vol_up`/`vol_down`
         logic the Up/Down keyboard shortcuts already had (extracted
         into shared functions rather than duplicated a third time).
    rationale: >
      Direct response to the user's bug report, followed by the
      explicitly requested broader sweep - re-reading the FULL
      FormMouseDown/FormMouseMove/FormMouseUp/FormMouseWheelDown/Up
      handlers in MainWin.pas end-to-end (not just the specific lines
      the original bug report pointed at) surfaced two further gaps
      that had gone unnoticed across every prior Phase 5 entry
      touching this code, showing the value of a full re-read over
      trusting a previously-ported subset was complete.
    verification: >
      `cd gui && make` clean (zero new warnings). Full regression
      suite unchanged and green (60/60, 75/0/1-known/0, full smoke
      pass - engine untouched by this entry). 10/10 repeat full-app
      runs clean under `timeout` after each of the four fixes. The
      window-drag fix was verified with a REAL synthetic X11 drag
      (libXtst), not just code review, confirming the window actually
      moved. The visualizer antialiasing fix was verified with a real
      cropped/enlarged screenshot during actual playback showing
      crisp, clearly-visible bars. The press-and-drag-off-to-cancel
      and mouse-wheel fixes were verified by code review and build/
      regression success; the About dialog's own equivalent drag test
      was attempted via the same libXtst technique but not completed
      due to sandbox timing/process-lifecycle friction reproducing a
      short-lived GTK nested-mainloop test harness across separate
      tool invocations (not a code-correctness concern - the fix is
      code-identical to the independently-verified mainwin.c fix, and
      About.pas's own struct/window relationship is the same shape).
    debt:
      - "About.pas's window-drag fix (gdk_window_begin_move_drag
        target) verified by code inspection and by analogy to the
        empirically-confirmed mainwin.c fix, not by an independent
        live drag test - see verification note above for why."
      - Mouse wheel handling only recognizes discrete GDK_SCROLL_UP/
        DOWN events, not GDK_SCROLL_SMOOTH (some modern touchpad
        drivers report smooth-scroll deltas instead) - matches the
        original's own discrete-wheel-only model exactly, but is a
        real gap for that specific class of input hardware.

  - id: MIG-0097
    title: "Phase 5: three more user-reported bugs - Play/Pause buttons not staying visibly depressed during playback, visualizer bars the wrong width/color, and no song title displayed anywhere in the actual skinned window"
    subsystem: gui/mainwin, gui/visualizer
    state: validated
    summary: >
      User reported three further issues after MIG-0096's fixes, all
      traced against MainWin.pas before fixing:

      (1) Play/Pause buttons not staying depressed: traced ButPlayClick/
      PlayCurrent/ButPauseClick/RestoreControls and found ButPlay and
      ButPause are NOT purely momentary buttons in the original -
      PlayCurrent calls `ButPlay.Switch_On` when a play session starts
      (staying visibly pushed for the WHOLE session, not just during
      the click) and only `Switch_Off`s on an actual stop
      (RestoreControls/ButStopClick); ButPauseClick separately
      `Switch_On`s/`Off`s ButPause based on the paused sub-state. This
      port previously treated both as pure momentary buttons (briefly
      pushed during the click, always released after), never reflecting
      ongoing play/pause state at all - this is what read as "don't
      stay depressed" to the user. Fixed by computing `but_play.is_on`/
      `but_pause.is_on` fresh from live state every `on_timer` tick
      (`gui_playback::thread_started` is true from Play until Stop -
      including a natural-end-triggered stop - making it the right
      proxy for "a play session is active"; deliberately NOT hooking
      every individual Play/Pause/Stop/natural-end call site the way
      the original's explicit Switch_On/Off calls do, since that's
      exactly the "miss one call site" bug class MIG-0096 already had
      to fix once in this same file).

      (2) Visualizer bar width/color: traced FormCreate more
      thoroughly (MainWin.pas:3381-3382) and found `BMP_Vis.Canvas.
      Pen.Color := $464646; BMP_Vis.Canvas.Pen.Width := 3;` - set ONCE
      at startup, well away from the actual MoveTo/LineTo drawing
      calls (RedrawVisChannels/RedrawVisSpectrum), and missed entirely
      in MIG-0094's original port and MIG-0096's antialiasing fix
      (which correctly fixed the antialiasing softness but kept the
      wrong 1px width and pure-black color). Fixed: `cairo_set_line_
      width(cr, 3)` and source color `(0x46,0x46,0x46)/255` (a neutral
      dark gray - equal RGB channels, so BGR-vs-RGB byte order is
      moot) instead of width 1 / pure black.

      (3) No song title anywhere in the visible window: this port's
      main window is undecorated (`gtk_window_set_decorated(FALSE)`,
      required for the custom skin shape), so `gtk_window_set_title`
      (already called correctly since MIG-0072) has NO VISIBLE EFFECT
      at all in the actual skinned window - only in the OS taskbar/
      alt-tab, which the user reasonably wouldn't consider part of
      "the main window". The original's real title/author display
      lives INSIDE the skin itself, in a dedicated scroll-text area
      (MainWin.pas:61-64: scr_x=108,y=48,width=197,height=24) with its
      own smooth horizontal ticker-scroll animation for text wider
      than the area (ReprepareScroll/DoVisualisation's multi-line-
      transition state machine) - entirely unported until now (not
      even a static fallback existed). Added a STATIC (non-scrolling,
      clipped) version: a new `draw_song_title` in mainwin.c draws the
      real white background rect (MainWin.pas:3396-3397) and the
      "Author - Title" text (PlayList.pas's FormatScrollString
      convention, same formula gui/src/playlist.c's own format_
      scroll_string already uses) in bold gray ($606060,
      MainWin.pas:3387-3389) inside that same area - a real, honest
      simplification (covers the common case of a title that fits the
      197px width exactly; clips rather than scrolls for longer ones)
      rather than porting the full scroll-animation state machine.
    rationale: >
      Direct response to the user's continued bug reports after
      MIG-0096. All three were found by tracing the SPECIFIC reported
      symptom back through MainWin.pas rather than assuming the
      already-landed MIG-0094/0096 work was complete - in each case a
      real, previously-missed piece of Pascal source (PlayCurrent's
      Switch_On calls; FormCreate's Pen.Width/Color; the scr_x/y/
      width/height scroll area and its FormatScrollString convention)
      turned out to explain the symptom exactly.
    verification: >
      `cd gui && make` clean (zero new warnings). Full regression
      suite unchanged and green (60/60, 75/0/1-known/0, full smoke
      pass - engine untouched). 10/10 repeat full-app runs clean under
      `timeout`. A real screenshot during actual playback of a real
      corpus file (MetalMania.ay) confirms all three fixes
      simultaneously: "Ozzyoss - Church" displayed in the scroll-text
      area (white background, bold gray text); the Play button
      visibly rendered in its pressed/pushed state while playing
      (distinctly different appearance from the neighboring un-pushed
      Prev/Pause/Stop buttons in the same screenshot); and the
      visualizer bars visibly thicker (3px) and the correct dark-gray
      color rather than the previous 1px black.
    debt:
      - Song title display is static/clipped, not the original's real
        smooth horizontal scroll-ticker animation for titles wider
        than the 197px display area - see summary for the full
        rationale (a separately-scoped animation state machine, not
        picked up here to keep this entry bounded to what the user's
        bug report actually asked about).
      - but_play/but_pause's is_on state is recomputed from live
        thread_started/is_paused state every 200ms timer tick rather
        than event-driven at the exact moment Pascal's own Switch_On/
        Off calls fire - functionally equivalent (same end state) but
        with up to one timer-tick's worth of latency (≤200ms) versus
        instantaneous in the original.

  - id: MIG-0098
    title: "Phase 5: full-fidelity scroll-text ticker - AND-mask rendering, horizontal scroll, vertical multi-line slide transition, double-click pause toggle, click-drag scrub (supersedes MIG-0097's static stand-in)"
    subsystem: gui/mainwin, gui/ticker (new)
    state: validated
    summary: >
      User explicitly asked for the real ticker behavior after MIG-0097
      landed only a static clipped-text stand-in ("Can you please make
      sure that the C11 port works exactly as the pas codebase for
      this?"), then confirmed via AskUserQuestion that full fidelity
      for BOTH the AND-mask/horizontal-scroll system and the vertical
      multi-line-transition system was in scope (not a lighter
      rendering-only fix). Traced the complete system in MainWin.pas
      before implementing:

      (1) AND-mask text rendering (MainWin.pas:3396-3397's
      `BMP_VScroll.Canvas.Brush.Color := clWhite; FillRect(...)`, text
      drawn in `Font.Color := $606060`, then RedrawScroll/
      DoVisualisation's `CopyMode := cmSrcAnd` bitwise-AND against the
      skin's own background pixels at scr_x/y). This is NOT a solid
      box with opaque text (what MIG-0097 did) - ANDing with white is
      the identity, so the skin's own art shows through everywhere
      except where letters darken it toward $606060. Cairo has no
      native bitwise-AND raster operator, so this was implemented by
      hand in `gui/src/ticker.c`'s `draw_and_masked`: render text to an
      off-screen ARGB32 surface, read back both its raw pixels and the
      skin's raw pixbuf pixels, compute the per-channel AND in a C
      loop, write the result to a third surface, then composite that
      onto the real destination.

      (2) Horizontal ticker-scroll (MainWin.pas:750-786's Scr_Left/
      HorScrl_Offset/Scr_Pause state machine) - 1px per ~30ms VisTimer
      tick, pausing 50 ticks (~1.5s) at each end before reversing;
      only active when text is wider than the 197px area, Do_Scroll is
      true, and not mid vertical-transition or being manually dragged.

      (3) Vertical multi-line slide transition (MainWin.pas:663-736,
      ReprepareScroll/SetScrollString, triggered by PlayItem's
      `Scroll_Distination := Index`) - ported as a 2-line-buffer,
      single-step animation driven by explicit `is_next`/`is_prev`
      booleans computed in do_load_song by comparing the newly-loaded
      playlist index to the last-displayed one; anything else
      (arbitrary jump, or a second transition arriving before the
      first settles) snaps immediately instead. This is a deliberate,
      disclosed narrowing of the original's fuller N-line/">16 away"
      jump-then-catch-up logic (see debt below) - the original's own
      machinery is tied to array-index bookkeeping this port's
      simpler single-song-at-a-time model doesn't mirror as directly,
      and the single-step case covers the common Prev/Next/natural-
      advance path exactly.

      (4) Double-click pause/resume toggle (MainWin.pas:2092-2098,
      `Do_Scroll := not Do_Scroll` on ssDouble, checked before any
      zone routing) - ported via GTK2's GDK_2BUTTON_PRESS on the
      existing button-press handler.

      (5) Click-drag manual scrub (MoveScr/DoMovingScroll,
      MainWin.pas:2651-2663) - adjusts HorScrl_Offset by the motion
      delta, clamped to [0, text_width-197], only when settled and
      text is wider than the display area.

      New module: gui/include/gui/ticker.h + gui/src/ticker.c (~290
      lines). Wired into gui/src/mainwin.c: on_button_press (double-
      click and drag-start branches ahead of existing zone routing),
      on_button_release (drag-end), on_motion (drag delta), on_vis_
      timer (gui_ticker_tick alongside the existing visualizer tick),
      on_expose (gui_ticker_draw replaces MIG-0097's draw_song_title,
      which is removed entirely along with its SCR_X/Y/WIDTH/HEIGHT
      #defines), do_load_song (computes is_next/is_prev against the
      new ticker_last_index field and calls gui_ticker_set_target).
    rationale: >
      Direct response to the user's explicit request for full parity
      with the Pascal ticker after MIG-0097's static stand-in, and to
      my own confirmed AskUserQuestion scope commitment ("Full
      fidelity, both A and B").
    verification: >
      `cd gui && make clean && make` from scratch: zero warnings, zero
      errors (one build-time unused-parameter warning caught and fixed
      during development, before this final clean build). Full
      regression suite green and unaffected (engine untouched):
      run_diff.sh, corpus_wav_md5_sweep.sh (75 passed, 0 failed, 1
      known-non-identical per MIG-0056, 0 skipped), smoke_test.sh.
      10/10 repeat full-app runs clean under `timeout`, no crashes.

      Real single-window screenshots (xwininfo -root -tree + import
      -window, never a root-window capture) taken during actual
      playback of a real corpus file, driven by synthetic X11 input
      via a small libXtst harness (XTestFakeButtonEvent/
      FakeMotionEvent), confirmed all five pieces working:
      - AND-mask rendering: skin's own bezel border visible unaltered
        around the ticker rect, with dark bold text over a light
        interior - the skin's real background art at that location
        (an LCD-style backdrop baked into the skin bitmap itself, a
        common Winamp-skin convention), confirming the mask is the
        identity outside letter shapes rather than an opaque box.
      - Horizontal scroll: text visibly advanced from "Ozzyoss -
        Church (s" to "Church (song 1/12)" over 3 seconds of ticks.
      - Vertical slide transition: clicking Next mid-scroll captured a
        genuine mid-animation frame showing the old line partially
        slid out above the new line partially slid in below,
        confirming the two-line composite draw and slide direction
        are both correct; settled cleanly on the new song's text
        afterward.
      - Double-click pause/resume: text held at a fixed position for
        2+ seconds after one double-click, then visibly resumed
        scrolling after a second double-click.
      All test/scratch artifacts (screenshots, the libXtst harness)
      were removed from the scratchpad directory after verification.
    debt:
      - "Vertical transition is deliberately narrowed to the single-
        step (Prev/Next-adjacent) case, snapping instead of animating
        for arbitrary jumps or a second transition arriving mid-
        animation - see summary point (3) for the full rationale. The
        original's fuller N-line-buffer/'>16 away' jump-then-catch-up
        logic (MainWin.pas:663-736) is not ported."
      - Resolves MIG-0097's first debt bullet (static/clipped title
        display) - superseded by this entry's full scroll-ticker
        implementation.

  - id: MIG-0099
    title: "Phase 5: volume/progress slider handles now the real skin bitmaps (not a plain gray rectangle), plus a real progress-drag redraw-lag bug fixed"
    subsystem: gui/zones, gui/mainwin
    state: validated
    summary: >
      User reported the volume and progress-bar "handles" don't look
      like the Pascal version, and that scrubbing on the timeline
      "doesn't work". Investigation:

      (1) Handle appearance: zones.h had always documented this as a
      deliberate M1 simplification - `gui_hslider_draw` drew a plain
      6px gray rectangle instead of compositing the real handle bitmap
      TMoveZone.AddBitmaps pulls from the skin (MainWin.pas:3813-3814:
      MoveVol's handle source rect is (317,113,18,11), MoveProgr's is
      (0,103,20,10)), color-keyed via `TransparentColor :=
      Bmp1.Canvas.Pixels[0,0]; TransparentMode := tmFixed` (the
      source rect's own top-left pixel is treated as transparent,
      giving the volume handle its triangular wedge shape and the
      progress handle its rounded-pill shape instead of a hard-edged
      box). Cairo has no color-key compositing primitive, so this was
      hand-implemented in `gui/src/zones.c`'s new
      `draw_pixbuf_region_keyed` - same raw ARGB32 pixel-manipulation
      technique gui/src/ticker.c's AND-mask rendering already
      established in this codebase (MIG-0098): build a small surface
      with alpha=0 on key-color-matching pixels, alpha=255 elsewhere,
      composite that. `gui_hslider` gained `thumb_w/h`/`thumb_src_x/y`
      fields; `gui_hslider_draw` now takes the skin pixbuf and draws
      the real handle there instead of a rectangle.

      (2) Drag/click semantics: traced FormMouseDown/FormMouseMove's
      actual MoveZoneRoot walk (MainWin.pas:2126-2164, 2285-2321) and
      found the original does NOT map click-x directly to a 0..1
      fraction (what this port's old `gui_hslider_value_from_x` did) -
      it's a two-mode system: clicking exactly on the handle
      (`ToucheBut`/`PtInRegion`) starts a relative/delta drag that
      follows the mouse from its current position; clicking anywhere
      else in the track (`Touche` only) immediately jumps the handle
      to be centered under the click point first (`OfsR := X - zx -
      bm1w div 2`), THEN starts the same delta drag. Also, travel
      range is the real `zw - Bm1w` (track width minus the real handle
      width - 52px for volume, 139px for progress), not the old code's
      assumed-6px-wide-thumb range. Replaced `gui_hslider_value_from_x`
      with `gui_hslider_press`/`gui_hslider_drag`, implementing this
      exactly (see zones.h's file comment for the one deliberate
      simplification kept - a standard delta-clamp instead of the
      original's own OldX/Delt low-clamp quirk, MainWin.pas:2294-2303,
      which only differs in an obscure drag-past-the-edge-and-back
      case).

      (3) A real, independently-found bug while investigating "doesn't
      work": `on_motion`'s `dragging_progr` branch (unlike the
      `dragging_vol` branch right below it) was missing its
      `gtk_widget_queue_draw` call - during an active progress-bar
      drag, the value/seek updated correctly on every motion event,
      but the screen only caught up on the next ~30ms visualizer-timer
      tick rather than immediately. Fixed by adding the same
      queue_draw call the volume branch already had.

      Empirically verified (via synthetic X11 drags) that dragging
      itself - value tracking, live seek requests reaching the target
      tick, engine-level correctness - was already working correctly
      before this entry; the user's "doesn't work" report is most
      directly explained by (1) (a 6px flat gray thumb blending into
      the track is very easy to mistake for "nothing happened" against
      a busy skin) and (3) (real, if minor, redraw lag during a
      progress-bar drag specifically).
    rationale: >
      Direct response to the user's bug report and explicit "make sure
      the C11 port works exactly as the pas codebase for this"
      instruction, continuing this session's established full-fidelity
      standard for user-facing skin elements (MIG-0096/0097/0098).
    verification: >
      `cd gui && make clean && make` and `cd engine && make clean &&
      make`: zero warnings, zero errors. Full regression suite green:
      run_diff.sh, corpus_wav_md5_sweep.sh (75 passed, 0 failed, 1
      known-non-identical per MIG-0056, 0 skipped), smoke_test.sh -
      engine untouched by this GUI-only change. 10/10 repeat full-app
      runs clean under `timeout`, no crashes.

      Real single-window screenshots (xwininfo -root -tree + import
      -window, driven by synthetic X11 drags via a small libXtst
      harness) confirmed: both handles now render as the real skin
      art (a triangular wedge for volume, a rounded pill for progress)
      with clean color-keyed edges, not a gray box; dragging either
      slider produces continuous, correctly-clamped visible movement
      tracking the mouse; a single click on empty track (not on the
      handle) immediately jumps the handle to be centered under the
      click, matching MainWin.pas's own behavior exactly; the
      progress-bar drag redraw-lag fix confirmed by comparing before/
      after screenshots taken well within the old ~30ms worst-case gap.
      All screenshots and the test harness were removed from the
      scratchpad after verification.
    debt:
      - "The original's own OldX/Delt low-clamp quirk (MainWin.pas:
        2294-2303) is not replicated - a standard delta-clamp is used
        instead. Behaviorally identical for normal dragging; differs
        only in an obscure edge case (dragging past the track's low
        edge and back without releasing the mouse)."
      - "TMoveZone.Touche's narrower zy1/zh1 vertical sub-band (e.g.
        MoveProgr only responds in an inner 5px band of its 10px-tall
        zone) is still not replicated - gui_hslider_hit_test uses the
        full track height, a pre-existing, more-forgiving
        simplification carried over unchanged from before this entry."

  - id: MIG-0100
    title: "Phase 5: SNDH progress-bar seeking wired up (engine-level TIME tag support), plus two Play/Pause button state bugs (pause-while-stopped and play-while-paused could restart/resume incorrectly)"
    subsystem: engine/sndh_file, engine/player, gui/mainwin
    state: validated
    summary: >
      User reported progress-bar scrubbing doesn't work for
      Temple_of_Asherah.sndh (works fine in the Pascal version), and
      that pressing Pause twice while stopped starts the song (Pascal
      does not do this). Both traced against MainWin.pas/Players.pas/
      atari.pas/sndh.pas; a third, related button-state bug was found
      auditing the same code path.

      (1) SNDH seeking: sndh_file.h's own file comment previously
      claimed SNDH's TIME tag (per-song duration) was "UI-only,
      irrelevant to correct audio playback" and could be scanned-past
      and discarded like the COMM/TITL/etc string tags - this was
      WRONG. Tracing Players.pas's RerollMusic (14281-14289) and
      atari.pas's Atari_SeekTo showed SNDH seeking is real and already
      implemented in the original, driven by exactly the same
      PlConsts[0].Global_Tick_Max total-duration mechanism AY/YM/VTX
      use - just populated differently: PlayList.pas:724-727 sets
      Global_Tick_Max from the playlist item's declared `Time`, which
      OpenSNDHFile (Players.pas:7112-7115) in turn sets from the TIME
      tag's raw per-song seconds value (sndh.pas: GetTunesTime) times
      PlayFreq (sndh.pas:819-821, "переводим в VBL" - "convert to
      VBL"), falling back to a hardcoded 5-minute default (`PlayFreq *
      300`) when the tag is absent or that song's entry is 0. Ported:
      `sndh_file.c`'s tag scanner now actually retains the TIME tag's
      per-song values (previously it correctly skipped past the right
      number of bytes but discarded their content); `sndh_file_load`
      computes the real total VBL-tick count with the same seconds*
      PlayFreq/5-minute-fallback formula and sets `f->atari.
      tick_count_max` to it (previously hardcoded to 0x7FFFFFFF -
      effectively unbounded, meaning SNDH songs never naturally ended
      via a declared duration either, a related, unnoticed gap this
      also fixes); a new `play_freq` field on `sndh_file` is exposed
      for `player_get_seconds_per_tick`. `player_get_tick_position`
      and `player_get_seconds_per_tick` (engine/src/player.c) gained
      SNDH cases reading `atari.tick_count`/`tick_count_max`/
      `play_freq` directly - no gui/src/playback.c changes were needed
      since its seek/duration logic was already generic across any
      format player_get_tick_position supports. Confirmed via a real
      forward seek on Temple_of_Asherah.sndh that this is genuinely
      slow for large jumps (tens of seconds of wall-clock CPU for a
      seek spanning most of a 5-minute song) - this is NOT a
      regression, Atari_SeekTo in the original has no fast-path either
      (just runs the full 68000 emulation forward tick-by-tick,
      identical in spirit to this port's do_seek), so this matches the
      original's own real-world seek latency for this format.

      (2) Pause-while-stopped starting playback: ButPauseClick
      (MainWin.pas:969-975) has `if not IsPlaying then begin ButPause.
      UnPush; exit; end;` as its very first line - pausing while
      stopped is a pure no-op. This port's on_button_release (and the
      'C' keyboard shortcut, MainWin.pas:3567's `Push(ButPause)` runs
      through the same ButPauseClick) had no such guard, only checking
      `file_loaded`: pressing Pause while stopped set the internal
      `paused` flag true with no playback thread running to observe
      it; the NEXT Pause press then saw `gui_playback_is_paused()`
      return that stale true and called `gui_playback_play()`,
      starting the song from a dead stop - exactly the reported bug.
      Fixed by additionally guarding on `mw->playback.thread_started`
      (this port's existing IsPlaying proxy, already used for MIG-0097's
      button is_on derivation) in both places.

      (3) Play-while-paused resuming (found auditing the above, not
      user-reported): PlayClick (MainWin.pas:952-961) is `if IsPlaying
      then Exit;` - since IsPlaying stays true across a pause (nothing
      in ButPauseClick touches it), pressing Play while paused is ALSO
      a no-op in the original; only the Pause button itself resumes.
      This port's but_play release handler and the 'X' keyboard
      shortcut called `gui_playback_play()` unconditionally whenever a
      file was loaded, which unconditionally clears the paused flag -
      meaning Play incorrectly resumed playback during a pause.
      Fixed by guarding both on `!mw->playback.thread_started`
      (mirroring PlayClick's own `if IsPlaying then Exit`).
    rationale: >
      Direct response to the user's two bug reports, continuing this
      session's full-fidelity standard; item (3) was found by auditing
      the same Play/Pause/Stop code paths for "any other underlying
      problems similar to these" per the user's own explicit request.
    verification: >
      `cd engine && make clean && make` and `cd gui && make clean &&
      make`: zero warnings, zero errors. Full regression suite green -
      run_diff.sh, corpus_wav_md5_sweep.sh (75 passed, 0 failed, 1
      known-non-identical per MIG-0056 - including More_Short_Demos.
      sndh, still correctly reported KNOWN not FAIL, confirming the
      TIME-tag/tick_count_max change didn't regress the existing SNDH
      WAV-export comparison), smoke_test.sh. Separately re-ran the
      exact byte-for-byte oracle comparison for Temple_of_Asherah.sndh
      itself (not part of the standard corpus, only present at repo
      root) at the same 1440256-frame bound the corpus sweep uses for
      other SNDH files - both oracle and player sides produced the
      full requested frame count (no early truncation from the new
      tick_count_max), confirming no regression on the user's own
      repro file. 10/10 repeat full-app runs clean under `timeout`.

      Real single-window screenshots (xwininfo -root -tree + import
      -window, driven by synthetic X11 input via a small libXtst
      harness) against Temple_of_Asherah.sndh confirmed: a modest
      forward seek click visibly advanced the progress handle over the
      following several seconds (do_seek's decode-forward is
      asynchronous and CPU-bound, so the handle creeps rather than
      jumps - confirmed correct, not a bug, per point (1) above); a
      large forward seek (~93% of the song) eventually completed
      (took over 100 seconds of wall-clock CPU, consistent with no
      fast-path existing in the original either). For the button
      fixes: Stop then Pause-Pause left the Play button correctly
      un-pushed (no restart, previously it would have started
      playing); Play-Pause-Play left the Pause button correctly still
      pushed/active (no resume-via-Play, previously this port had no
      guard against it at all); a final Pause press correctly resumed
      normal playback. All screenshots and the test harness were
      removed from the scratchpad after verification.
    debt:
      - "SNDH multi-song sub-tune TIME-tag values are stored in a
        SNDH_MAX_TIME_SONGS=64-entry fixed array in sndh_file.c's tag
        parser - a generous bound for realistic files, consistent with
        this port's existing single/few-song SNDH scope (sndh_file.h's
        own file comment), but not unbounded like the original's
        dynamic PlayTimes array."
      - "SNDHTimeDB (a separately-loaded external duration database
        used to override in-file TIME tags for known-broken headers,
        sndh.pas:823-833) remains out of scope, unchanged from before
        this entry - genuinely a separate, optional data file, not
        something encoded in the SNDH file itself."

  - id: MIG-0101
    title: "Phase 5: audit found ALL 14 remaining tracker formats support real seeking in Pascal (not just AY/YM/VTX/SNDH); PT3 ported as a full pilot (real duration + natural end-of-song), 13 more tracked as open debt. UPDATE: both halves are now done - duration/seeking via MIG-0103/MIG-0104 + later wiring, and CheckLoopAndStop/natural-end-of-song via MIG-0108 - see debt list for both resolutions. FINAL UPDATE: MIG-0111 closed the one remaining piece (oracle-validating MIG-0103/MIG-0104's own GetTimeXXX duration math, not just confirming it's wired) - this entry is now fully resolved end to end, wiring AND validation."
    subsystem: engine/pt3_file, engine/player, tools/ay_player, tests/oracle_diff
    state: validated
    summary: >
      User asked to verify seeking works identically to Pascal across
      ALL formats. Full audit of every format's RerollMusic/
      Atari_SeekTo branch (MainWin.pas/Players.pas/atari.pas), cross-
      checked against the original's own embedded FILETYPES resource
      (extracted directly from Ay_Emul.res via `strings`, not guessed):

      PT1, PT2, PT3, STC, ST1, ASC, ASC0, STF, STP, PSC, FLS, FTC, SQT,
      GTR, FXM, and PSM are ALL registered `type=AY` in that resource -
      meaning `IsAYNativeFileType` returns true for every one of them,
      and RerollMusic seeks them through the exact same branch (`(CurFileType
      = FT.PSG) or IsAYNativeFileType(CurFileType)`) as true .ay files,
      using each format's own GetTimeXXX-computed Global_Tick_Max
      (Players.pas:17001-17037's dispatch: GetTimePT3/GetTimePT2/
      GetTimeSTC/GetTimeSTP/GetTimeASC/GetTimePSC/GetTimeSQT/
      GetTimeFTC/GetTimePT1/GetTimeFLS/GetTimeGTR/GetTimeFXM/
      GetTimePSM). This directly contradicted this port's own earlier
      framing (pt3_file.h et al: "no Global_Tick_Max... UI-only") -
      that framing was a reasonable, correctly-scoped decision for the
      EARLIER engine-correctness phase (audio output doesn't need a
      declared duration) but was mistakenly carried forward as if it
      also meant "no seeking gap to worry about" for this GUI-parity
      phase, which it does not. It ALSO means these formats never
      naturally end during real playback - `CheckLoopAndStop`
      (Players.pas:8732-8746) is what makes a song stop (Real_End_All)
      once Global_Tick_Max ticks elapse with Do_Loop off (the default);
      without Global_Tick_Max, this port's tracker formats have always
      just looped their pattern data forever instead, a real playback-
      correctness gap, not merely a missing UI nicety.

      Given each GetTimeXXX is a substantial, format-specific pattern-
      opcode interpreter (GetTimePT3 alone is ~330 lines, essentially
      re-walking the same opcode space PatternInterpreter does, without
      synthesizing audio), the user chose to pilot PT3 first as a
      template before committing to the other 13. PT3 fully ported this
      entry:

      - `pt3_get_time` (engine/src/pt3_file.c) - a faithful, line-by-
        line transcription of GetTimePT3 (Players.pas:15333-15662):
        walks the known position list exactly once, summing each row's
        Delay value (matching one global_tick_counter increment per
        row, confirmed by cross-checking against pt3_get_registers's
        own increment site). Verified the opcode byte-consumption
        table against the REAL PatternInterpreter's own consumption
        (gui already has this in pattern_interpreter) to confirm
        GetTimePT3's grouped Inc(j1,N) amounts exactly match real
        per-opcode payload sizes. TSMode (turbosound) is not
        simulated, matching this port's existing single-chip PT3 scope
        (MIG-0007) - equivalent to the original's own `TS = $20` case.
        A malformed file (bounds violation, or DLCatcher's own
        256*256-row safety net tripping) degrades to "no known
        duration" (0/0) rather than failing the whole load, unlike the
        original's RaiseBadFileStructure->ErBadFileStructure - `pt3_
        file_load` has already succeeded by the time this runs, so
        audio playback should not be blocked by a duration-precompute
        failure alone.
      - `pt3_file` gained `global_tick_max`/`loop_tick`/`do_loop`/
        `real_end_all` fields (mirroring ay_file/ym_file/vtx_file/
        sndh_file's existing convention); `pt3_file_make_buffer` gained
        a CheckLoopAndStop-equivalent check (Players.pas:8732-8746,
        Force_Loop omitted - a TSMode-only concept this port's scope
        doesn't have) before each tick, guarded on `global_tick_max >
        0` so a duration-precompute failure never blocks playback
        entirely (a real, disclosed simplification vs. the original's
        own hard failure).
      - `player_get_tick_position`/`player_get_seconds_per_tick`
        (engine/src/player.c) gained a PT3 case (fixed 50Hz interrupt
        rate, `*1000`-prescaled convention matching YM/VTX);
        `player_real_end_all` was ALSO already dispatching for PT3 but
        unconditionally returning `false` with a now-stale comment -
        fixed to read the real field.
      - New `player_set_do_loop(player*, bool)` - needed because
        wiring up real_end_all for PT3 broke two EXISTING regression
        tests that were, until now, unknowingly relying on PT3 never
        stopping on its own: corpus_wav_md5_sweep.sh's wav_export_pt3
        scenario and dump_engine_state.c's pt3_file scenario both
        compare against OracleHarness.pas's RunPT3FileTest, whose own
        code comment (Players.pas-adjacent, OracleHarness.pas:964-967)
        says outright: "Global_Tick_Max is set to a large sentinel
        rather than a real computed duration (GetTimePT3 isn't ported
        on either side) - CheckLoopAndStop would otherwise trip
        immediately". That sentinel-bypass is baked into the read-only
        Pascal oracle (never edited, per this repo's standing rule),
        so this port's own SIDE now needs an equivalent bypass to keep
        comparing equivalent content: ay_player gained `--ignore-end`
        (calls the new `player_set_do_loop(&p, true)`), and dump_
        engine_state.c's run_pt3_file now sets `f.do_loop = true;`
        directly. Real interactive playback (gui/src/playback.c) never
        sets do_loop - it keeps the real default (false), so natural
        end-of-song now genuinely works in the GUI.
      - 5 of the 76 corpus PT3 files (ZZZZIID.pt3 at a genuinely tiny
        3.84s, plus Cold_Blood_1/Foggys_Quest_2/Pengo_1/Pengo_Demo_4)
        turned out to have real declared durations SHORTER than the
        76-corpus test's fixed 204800-frame (~4.27s) comparison window
        - exactly the scenario --ignore-end exists to handle; all 5
        pass again with it applied.
    rationale: >
      Direct response to "verify seeking works for all formats,
      identically to how the pas version handles it" - the audit itself
      (not code) is the primary deliverable of that request; PT3's full
      port is the user-approved pilot for estimating/de-risking the
      remaining 13, chosen over a faster-but-diverging "real-decode-
      once-at-load-time" alternative specifically to preserve the
      original's own near-instant playlist-add performance.
    verification: >
      `cd engine && make clean && make`, `cd gui && make clean && make`,
      `cd tools/ay_player && make clean && make`: zero warnings, zero
      errors throughout. Full regression suite green: run_diff.sh
      (60/60 equivalent, only the pre-existing MIG-0018 bounded-timing
      INFO line, not a failure), corpus_wav_md5_sweep.sh (75 passed, 0
      failed, 1 known-non-identical per MIG-0056 - including all 5 of
      the newly-short-relative-to-the-test-window PT3 files, confirmed
      passing again once --ignore-end was wired through), smoke_test.sh
      (all PASS). 10/10 repeat full-app runs clean under `timeout`. A
      random 40-file sample from the much larger all_tunes/ corpus (not
      part of the tracked suite, ad hoc spot-check only) all loaded and
      rendered without crash/hang, a basic robustness signal for pt3_
      get_time's own bounds-checking/DLCatcher safety net.

      Real single-window screenshots + a temporary debug trace (removed
      after use) confirmed, via synthetic X11 drags on the real GUI
      against real corpus files: forward seeking visibly moves the
      progress handle to the target position; backward seeking
      correctly triggers a full reload-from-scratch (confirmed via the
      debug trace: `counter` resets to 0 and climbs back to the
      target) - both match the exact tick target requested every time
      across a dozen+ traced seeks. A short PT3 file (ZZZZIID.pt3,
      3.84s) was confirmed to naturally stop playback (Play button
      un-pushed) at its declared duration instead of looping forever,
      confirming the CheckLoopAndStop port is genuinely active during
      real interactive playback, not just in the offline duration
      precompute.

      UPDATE: MIG-0103 (10 formats) and MIG-0104 (SQT/FXM) ported each
      of the 13 remaining formats' own GetTimeXXX duration precompute
      into engine/ (originally for tools/identify_ay_file's
      IntegrityCheck, not this entry's GUI-seeking concern); a later
      session pass wired player_get_tick_position/player_get_seconds_
      per_tick to read those same fields, which - since gui_playback_
      get_progress_fraction and the JmpTime dialog both call those two
      functions generically - means real seeking (progress-slider drag
      AND Jump-to-time) now works for all 13, closing that half of this
      entry. mainwin.c's own file-header comment and gui_playback_get_
      progress_fraction's doc comment, which both previously named only
      AY/YM/VTX/SNDH/PT3, have been corrected to match. The OTHER half
      - CheckLoopAndStop/real_end_all, i.e. these songs actually
      stopping on their own instead of looping forever - was NOT
      touched by that work and remains open; see the debt list below,
      rewritten to reflect this exact split rather than the original
      "13 more, all still open" framing.
    debt:
      - "RESOLVED (duration/seeking half only - see UPDATE note below
        this entry's verification section): the 13 formats' own
        GetTimeXXX duration precompute (Global_Tick_Max) landed in
        MIG-0103 (10 formats) and MIG-0104 (SQT/FXM), and a later
        session pass wired player_get_tick_position/player_get_
        seconds_per_tick to actually read those fields - which,
        because gui_playback_get_progress_fraction and JmpTime.pas's
        port both call those same two functions generically with no
        format-specific gating, means the draggable progress slider
        (MIG-0079) and Jump-to-time dialog now both support real
        seeking for all 13, not just AY/YM/VTX/SNDH/PT3. This was NOT
        a dedicated pass for this entry - it fell out of unrelated
        ItemEdit/JmpTime work and wasn't recognized as closing part of
        this entry until a later research pass caught it; recorded
        here now so this entry stops overstating what's still missing."
      - "RESOLVED (MIG-0108): CheckLoopAndStop/real_end_all (natural
        end-of-song stopping, the OTHER half of what PT3's own MIG-0101
        pilot ported) is now wired for all 12 of the remaining formats
        (PT1, PT2, GTR, FLS, STC, STP, FXM, PSM, ASC, ASC0, FTC, PSC,
        SQT - 12 struct/file pairs since ASC/ASC0 share one), following
        PT3's exact template. See MIG-0108 for the full trace,
        including a real, previously-unknown Pascal control-flow nuance
        found for PSM (CheckLoopAndStop and its own separate `Finished`
        flag are independent mechanisms - real_end_all is now driven
        purely by CheckLoopAndStop, matching every other format, not by
        Finished as this port's earlier, pre-MIG-0108 wiring did)."
      - "PT3's own GetTimePT3 port omits TSMode (turbosound - the
        original's `vars[1]`/second-chip half), matching this port's
        pre-existing single-chip PT3 scope (MIG-0007) - not a new gap,
        just newly-relevant now that duration/seeking depends on the
        same opcode walk."
      - "A malformed PT3 file that trips pt3_get_time's bounds-check or
        DLCatcher safety net degrades to 'no known duration' (seeking/
        natural-end unavailable, audio still plays) rather than failing
        the whole load like the original's own RaiseBadFileStructure -
        a deliberate, disclosed divergence favoring 'audio still
        works' over exact error-path fidelity for this specific
        failure mode."

  - id: MIG-0102
    title: "GUI: real per-pixel alpha channel support for skin bitmaps - a deliberate C11-only enhancement beyond the original (which has no true alpha, only fixed-color-key transparency), fully backwards compatible with existing skins"
    subsystem: gui/zones
    state: validated
    summary: >
      User-requested enhancement, not a porting gap: the original
      Delphi `TBitmap` has no real alpha channel at all - the only
      transparency it supports is `TransparentMode := tmFixed`, a
      single fixed color key treated as fully transparent
      (TMoveZone.AddBitmaps, MainWin.pas:2676-2681, already ported as
      `draw_pixbuf_region_keyed`'s color-key path). This entry adds
      genuine per-pixel alpha compositing on top of that, entirely
      opt-in and additive.

      Investigated before implementing: (1) confirmed empirically that
      GdkPixbuf's own BMP loader (already used unconditionally by
      gui/src/skin.c and gui/src/dialogs/about.c) correctly parses
      32-bit alpha BMPs with no code changes needed - a synthetic
      4x4 32bpp alpha-BMP test file loaded with `has_alpha=1`,
      `n_channels=4`, and correct per-pixel alpha values. (2) Found
      that every "plain" blit in this codebase (every button,
      both LEDs, and About's whole base image, all via
      `gdk_cairo_set_source_pixbuf`+`cairo_fill`) is ALREADY alpha-
      correct for free - Cairo composites a pixbuf's real alpha
      channel automatically, no changes needed there either. (3) The
      only hand-rolled compositing in the whole GUI is
      `draw_pixbuf_region_keyed` (zones.c, used exclusively by the
      volume/progress slider handles), which read only 3 (R/G/B)
      channels and ignored a 4th if present - the one real code change
      needed.

      Fix: `draw_pixbuf_region_keyed` now checks `gdk_pixbuf_get_has_
      alpha()`; if true, it uses the source's real per-pixel alpha
      directly (color-keying is skipped entirely - the artist already
      expressed transparency explicitly) instead of the color-key
      test, premultiplying into Cairo's required ARGB32 format. If
      false (every existing skin, including the bundled default,
      which is a plain 24-bit BMP), the function takes the exact same
      branch and does the exact same math as before this entry -
      confirmed byte-for-byte via a dedicated pixel-level test (see
      verification).

      `.ays` container parsing (gui/src/skin.c) needed NO changes at
      all - it already hands the embedded BMP's raw bytes straight to
      GdkPixbufLoader regardless of bit depth, so an alpha-channel BMP
      just works once embedded the same way a 24-bit one is.
    rationale: >
      Explicit user request, scoped down from a broader "add alpha
      support" ask to the one place that actually needed code (per the
      investigation above) rather than speculatively touching paths
      that were already correct - avoids unnecessary churn in
      already-working, oracle-adjacent rendering code.
    verification: >
      `cd gui && make clean && make` (full clean rebuild, including
      `rm -rf build`): zero warnings, zero errors. Full regression
      suite green and unaffected (engine untouched by this GUI-only
      change): run_diff.sh, corpus_wav_md5_sweep.sh (75/0/1-known/0),
      smoke_test.sh, engine_smoke (9/9).

      A dedicated standalone pixel-level test (#including zones.c
      directly to reach the static function, matching this project's
      existing test_about_bmp.c-style harness convention; not checked
      in, scratch verification only) constructed synthetic GdkPixbufs
      in memory and asserted exact output pixels: an opaque alpha
      pixel composites unchanged (0xFFFF0000 for pure red, confirming
