# Machine-checkable migration-debt ledger for the ay_emul -> C11 port.
#
# Per this workspace's global LLM-porting invariants: every stub, TODO,
# omitted branch, or approximated behavior must be recorded here with a
# MIG-#### id, not silently implied. States:
#   translated             - mechanically ported and compiles
#   behaviorally_incomplete - runs, but known behavior is missing/approximated
#   validated               - behavior checked with tests, differential
#                             checks, or documented manual verification
#
# This file should be updated as work proceeds. An item may only move to
# `validated` with a concrete verification method recorded against it.

schema_version: 1

entries:
  - id: MIG-0004
    title: "AY.pas DAC table alternates (V_Soft, Lion17 YM tables) not carried over"
    subsystem: engine/ay
    state: behaviorally_incomplete
    summary: >
      AY.pas:19-33 defines the live Amplitudes_AY table (Hacker KAY, 16
      entries, used) plus several alternate/commented-out tables from other
      authors (V_Soft, Lion17 32-entry YM variants) that are dead code in
      the original (never selected by any code path). engine/ay.c ports only
      the live table, verbatim.
    rationale: >
      Matches original behavior exactly (the alternates are unreachable in
      the Pascal source too) - not a fidelity gap against the original. Kept
      as an open entry only because if a later milestone wants to expose a
      user-selectable DAC-table option (a new feature, not present in the
      original), the alternate tables would need to be ported at that point.
    verification: >
      Confirmed via direct read of AY.pas:19-33 - alternate tables are
      commented out or unreferenced by any live code path.

  - id: MIG-0006b
    title: "Immediate OUT (n),A and IN A,(n) port reconstruction both now validated; only real-file usage confirmation still open"
    subsystem: engine/z80_bus
    state: behaviorally_incomplete
    summary: >
      reconstruct_port()'s use of z->a as the high byte for the immediate
      form is differentially validated for BOTH immediate-form port
      opcodes now. OUT (n),A (tests/oracle_diff's "immediate" scenario):
      select register 9 via the BC-indirect form, then write it via
      `LD A,$BF: OUT ($FD),A` hitting port $BFFD - oracle and engine agree
      byte-for-byte, register 9 ends up 31 (0x1F) in both, i.e. AY.pas's
      own SetAmplB 5-bit register mask applied to $BF. Writing this test
      also confirmed by direct construction why the immediate form can't
      select an arbitrary register via $FFFD (A supplies both the port
      high byte and the written data simultaneously - $FF is not a valid
      0..13 register index) - a structural property of the hardware/
      protocol, not an engine limitation. IN A,(n) (new "immediate_in"
      scenario, added to close this entry's remaining test gap): select
      register 9 and write $2A to it via the BC-indirect form (avoiding
      the immediate OUT form's own structural limitation above), then
      read it back via `LD A,$FF: IN A,($FD)` -> port $FFFD, the real AY
      read/select port confirmed from Z80.pas:220's ZXInProc port-mask
      check - oracle and engine agree byte-for-byte: register 9 reads
      back as 10 (0x0A, i.e. $2A masked to 5 bits) in both, and the
      resulting A register value matches too. The read-side
      implementation itself (zx_in/initial_in in engine/src/z80_bus.c)
      turned out to already be a complete, correct port of Z80.pas's
      ZXInProc/InitialInProc - this was purely a missing-test gap, not a
      missing-feature one. Still open: confirming no real in-scope
      chiptune file ever actually uses either immediate form (still needs
      a real-file corpus scan - Players.pas milestone; ay_file.c is
      currently the only format that drives real Z80 execution at all,
      so this only matters once other Z80-tracker formats gain their own
      CPU-driven playback path).
    rationale: >
      Both immediate-form port opcodes are now verified byte-for-byte
      against the oracle - the only remaining piece is confirming real
      chiptune content actually exercises them, which needs a broader
      real-file differential corpus this port doesn't have yet (the
      Players.pas tracker-format milestone's territory, not something
      fixable from this side alone).
    verification: >
      tests/oracle_diff/run_diff.sh: both "immediate" and "immediate_in"
      scenarios pass (oracle and engine registers, and the read-back A
      value, byte-identical) - 53/53 total gates pass, 0 fail.

  - id: MIG-0007
    title: "Turbosound / dual-chip (TSMode) support - redirected to the future tracker-format-player milestone"
    subsystem: engine/ay
    state: behaviorally_incomplete
    summary: >
      AY.pas's SoundChip is a 2-element array and Synthesizer_Stereo16 etc.
      conditionally mix a second chip when TSMode is set (dual-AY
      "Turbosound" hardware support). engine/ay.c ports only SoundChip[0]
      (single chip) - see ay.h. Investigated this milestone to see whether
      it could be closed alongside the other AY.pas gaps; it cannot be, for
      a structural reason, not a scoping choice: TSMode is set ONLY by
      Players.pas's tracker/module-replayer subsystem (PT3 dual-file
      detection, Players.pas:2665-2686) - confirmed zero references to
      TSMode or SoundChip[1] anywhere in Z80.pas. The real hardware/
      Z80-OUT-port path this milestone's engine/ covers never drives a
      second chip, in the original either.
    rationale: >
      Adding a second ay_chip + mixer-loop flag to engine/ay.c now would be
      unvalidatable busywork - nothing in this milestone's scope could ever
      set ts_mode, so there would be no way to test it against the oracle.
      Genuine Turbosound support belongs entirely to the future
      tracker-format-player milestone, alongside the register-feed logic
      (PT3_Get_Registers et al.) it's inseparable from - tracked here so
      that milestone's plan picks it up rather than rediscovering this.
    verification: >
      Re-confirmed via grep across the whole ay_emul submodule: TSMode
      and SoundChip[1] also appear in Convs.pas (export converters) and
      MainWin.pas (GUI) - both already out of this port's scope for
      other, separately-tracked reasons (MIG-0010, Phase 5) - but zero
      references in Z80.pas specifically, which is what the rationale
      actually depends on: TSMode is never SET anywhere reachable from
      the Z80-OUT-port hardware layer this port's engine/z80_bus.c
      covers, only consumed/set by code this port doesn't build at all.

      UPDATE (MIG-0109): the premise above ("nothing in this milestone's
      scope could ever set ts_mode") is now stale - it was true only
      because PT3's tracker-format player hadn't been ported yet at the
      time this entry was written. PT3 is now fully ported (MIG-0020/
      0040/0101) and DOES reach TSMode via its own self-pairing tag
      (Players.pas's TrModLoaded, PT3_MusicName[98]), with zero
      Z80-OUT-port/playlist/GUI involvement needed - exactly the
      "genuine Turbosound support belongs to the future tracker-format-
      player milestone" this entry itself predicted. MIG-0109 closes
      that reachable slice in full, with real oracle-diffed (not
      formula-derived) validation: engine/ay.c's mixer (SoundChip[1]
      equivalent) and PT3's own single-file self-pairing (engine/
      pt3_file.c). Genuinely still open, deliberately out of MIG-0109's
      scope: playlist/.ayl Next-chain pairing of two SEPARATE files
      (TrModLoaded's own `else if (TSMode = False) and
      (PlayListItems[Index]^.Next <> nil) then ...` branch) and any GUI
      pairing UI - both require this port's playlist subsystem, tracked
      as MIG-0109's own explicit Phase B follow-up rather than folded in
      here. This entry (MIG-0007) is left as-is otherwise (historical
      record of the original investigation), not rewritten.

  - id: MIG-0010
    title: "RESOLVED: PSG/VTX register-write-log export ported (Convs.pas's PSG_Converter/VTX_Converter, VBL2PSG/VBL2VTX branches) - OutZXConverter/OutCPCConverter themselves genuinely never needed porting (see rationale)"
    subsystem: engine/psg_export, tools/ay_export, engine/third_party/lhassa
    state: validated
    summary: >
      Per explicit user request, after an investigation (see this
      entry's own prior text, preserved in git history) established that
      porting the register-write export hooks was feasible once VTX's
      LZH-compression risk was resolved. Investigated OutZXConverter/
      OutCPCConverter directly (Z80.pas:389-457, not 11141-11183 as this
      entry originally cited - that range is the SAME code duplicated
      inside the dead {$ifdef Z80Emu_ASM} branch, see z80_bus.h's own
      established finding that this whole branch never compiles) and
      found they are NOT actually part of what needed porting: they are
      near-duplicate copies of the normal ZXOutProc/CPCOutProc register-
      decode logic, writing directly into SoundChip[0].RegisterAY.Index[]
      with a WasOuting marker instead of calling SetAYRegister - existing
      purely so Convs.pas can detect "a register changed" while driving
      the CPU WITHOUT the normal AY-chip-emulation object in the loop at
      all. This port's own player_step_registers (built for MIG-0112's
      Turbosound pairing) already writes into an explicit external
      ay_chip* the exact same way, for the exact same underlying reason
      (a lighter register-generation path than full playback) - so the
      REAL Convs.pas logic worth porting was PSG_Converter/VTX_Converter
      themselves (Convs.pas:672-1064), reusing player_step_registers as
      their register source, not a separate OutZXConverter/OutCPCConverter
      equivalent.

      Ported PSG_Converter's VBL2PSG branch (778-809) as engine/src/
      psg_export.c (psg_export_write/psg_export_write_pair) - no
      external dependency, added to libayengine.a. Faithfully replicates
      PSG_Save_Registers/Psg_Save_Ostatok's exact register-diff + run-
      length "idle frames" ($FE/$FF) encoding. TSMode is honored
      (psg_export_write_pair writes two independent files, matching
      VBL2PSG's own dual PSG_Save_Registers(0)/(1) calls and Force_Loop
      semantics) using player_pair, already built for MIG-0112.

      Ported VTX_Converter's VBL2VTX branch (958-969) plus its header/
      string-write setup (1003-1039) as tools/ay_export/src/vtx_export.c
      (vtx_export_write/vtx_export_write_pair) - kept OUT of
      libayengine.a since it needs LZH ("-lh5-") compression, which the
      core engine has no dependency on. VTX_Save_Registers' column-major/
      transposed register layout (`p[bpos + k]`, k += ProgrMax per
      register) is replicated exactly, cross-checked against this port's
      OWN pre-existing vtx_file.c loader's identical `k += number_of_vbls`
      indexing convention. VTX_Converter itself has no TSMode branch at
      all (confirmed by direct reading - unlike PSG_Converter), so
      vtx_export_write_pair writes only the primary voice, matching the
      original exactly rather than a simplification this port introduced.

      LZH compression: per this entry's own prior investigation, vendored
      amigazen/Lhassa (BSD 2-Clause, C89, github.com/amigazen/Lhassa) as
      a new git submodule (engine/third_party/lhassa) instead of hand-
      porting lh5.pas's own Encode_Buffer_To_File (a ~700-line LZSS
      binary-tree-match-finder + Huffman encoder) - same policy already
      applied to Musashi/superzazu-z80 for CPU timing (a well-tested
      reference implementation over replicating the original's own
      quirks, when byte-exact matching isn't the actual requirement -
      compression has no single "correct" output for a given input,
      unlike playback). Round-trip-validated BEFORE being wired in for
      real: LhASsA's lh_compress_lh5 output, decompressed by this port's
      OWN already-oracle-validated lh5_decompress, reproduced the
      original data exactly for realistic (AY-register-log-shaped) test
      buffers.

      Built tools/ay_export, a new CLI tool (mirroring tools/ay_player's
      structure) - `ay_export <file> --psg=<path> | --vtx=<path>
      [--ay-freq=N] [--loop-vbl=N] [--title=S] [--author=S] [--programm=S]
      [--tracker=S] [--comment=S] [--force-loop=0|1]`.

      UPDATE (per explicit user follow-up request to close all four
      items this entry originally disclosed as out of scope): closed
      three of the four for real, and replaced the fourth's disclosure
      with a corrected, more accurate one after investigating it in
      Convs.pas directly and finding the original framing was wrong
      about WHY it couldn't be done.

      (1) AY/YM/VTX SOURCES - added ay_file_step_registers/
      ym_file_step_registers/vtx_file_step_registers (one per format,
      each independently archaeologized against Players.pas - see
      engine/src/formats/{ay,ym,vtx}_file.c's own header comments for
      the exact Players.pas line citations) plus a new generic
      player_step_registers_any dispatcher (player.c) covering all 18
      loadable formats, not just the 14 player_supports_pairing reaches.
      psg_export.c and vtx_export.c both switched to it. Building AY's
      own oracle scenario caught a genuine Pascal harness bug (wrong
      OutProc - OutInitialConverter, not InitialOutProc, since the
      latter's reentrant SynthesizerAY call needs a BufP the standalone
      entry point never sets up); building YM's own scenario caught a
      genuine bug in THIS PORT's own ym_file_step_registers (was
      wrapping YM5i/6i_Get_Registers in the ym6_cur_tik/YM6_Extra_
      GetRegisters gating MakeBufferYM5/6's inner loop uses for sample-
      rate-to-tick-rate conversion - direct trace of Players.pas:2854-
      2869 proved All_GetRegisters[0] binds to the bare functions alone,
      both fully self-contained). Both bugs fixed, then all three
      formats confirmed byte-identical for BOTH psg_export_write
      (ay_psg_export/ym_psg_export/vtx_psg_export gates) and vtx_export
      (ay_vtx_raw/ym_vtx_raw/vtx_vtx_raw gates, comparing the pre-
      compression register buffer - same policy as stc_vtx_raw).
      SNDH SOURCE - sndh_file_step_registers was written and does not
      crash (see tests/ay_export_smoke's own extended-format round-trip
      test) but its output is NOT byte-identical to the oracle,
      diverging by tick 2 of a 200-tick test with growing, non-
      converging register differences. Root-caused as far as reasonably
      possible: this lives in the exact same atari_emulate_step/
      scheduling subsystem MIG-0054/MIG-0056 already extensively
      characterize as having an unresolved residual (SNDH WAV
      export/playback itself is ALREADY documented there as not byte-
      identical, informational-only) - not a new, separately-chaseable
      defect this entry introduces. Left implemented but explicitly NOT
      wired into run_diff.sh as a hard gate (to avoid persistent,
      already-understood red noise), and explicitly disclosed below
      rather than silently treated as done.

      (2) FT.OUT/FT.EPSG input formats - re-confirmed still genuinely
      out of scope: no loader exists anywhere in this port for either,
      they are obscure raw-register-trace-log formats unrelated to the
      real .ay/.ym/.vtx formats already supported (a naming collision
      this entry's own earlier text had already un-confused - FT.ZXAY is
      NOT the real Sergey Bulba .ay format), and no known real test
      files exist to validate a new loader against even if one were
      built. Building two entirely new file-format loaders is a
      fundamentally different, much larger undertaking than "finish
      exposing existing per-format register-generation logic" (this
      entry's actual scope) - left as disclosed debt, not attempted.

      (3) TSMode dual-file PSG export oracle validation - built a real
      two-GENUINELY-DIFFERENT, different-LENGTH-file oracle scenario
      (RunSTCPairPSGExportTest, AWAY.stc [9600 ticks] + Ninja7_1.stc
      [5632 ticks], new stc_pair_psg_export gate) specifically because
      the earlier same-file-paired-with-itself smoke test could never
      exercise VBL2PSG's own nMax-selection or Force_Loop gating
      (Convs.pas:778-809) - both voices there always reach their own end
      simultaneously. Investigating this surfaced a real, disclosable
      finding: Force_Loop defaults to True in settings.pas, and with it
      True, CheckLoopAndStop (Players.pas:8732-8746) does NOT freeze a
      shorter voice at its own end - it lets register generation
      continue completely normally (for STC, the pattern position
      literally wraps and replays from the start) for the padding
      duration, while only clamping that voice's own Global_Tick_Counter
      so it never re-triggers Do_Loop. This exact mechanism had ALREADY
      been ported for WAV playback pairing by an earlier entry (MIG-
      0114, stc_file_step_registers's own force_loop field) but was
      never wired into ay_export - added `--force-loop=0|1` (default
      true, matching settings.pas) to main.c, calling the pre-existing
      player_pair_set_force_loop. The new oracle gate passed byte-
      identical on both voices on the first attempt once wired, proving
      the already-ported MIG-0114 mechanism carries over correctly to
      the export path, not just playback.

      (4) Per-file metadata/loop-point auto-derivation - investigating
      Convs.pas:1022-1024 directly (`Nam := CurItem.Title; Aut :=
      CurItem.Author; Prg := CurItem.Programm;` and `Trk :=
      GetEditorString(CurFileType)`) found the ORIGINAL disclosure's
      reasoning was wrong: Convs.pas itself does NOT auto-derive title/
      author/programm from the loaded FILE's own content at all - it
      reads them from the PLAYLIST ITEM's own separately-maintained
      metadata (CurItem, a GUI/playlist concept ay_export as a bare-file
      CLI tool has no equivalent of), and the tracker-name string comes
      from GetEditorString, a lookup into an externally-loaded formats
      config resource (filetypes.pas's load_formats) that is not present
      anywhere in this repository checkout to port faithfully. So these
      three were correctly left as caller-supplied CLI arguments, but
      for the corrected reason (this reflects Convs.pas's OWN actual
      source of truth, not a gap in what this port exposes). LoopVBL,
      by contrast, genuinely IS auto-derivable for VTX/YM sources
      specifically: Players.pas's own loaders populate the real LoopVBL
      global directly from the file's embedded native loop point at
      load time (confirmed via OracleHarness.pas's RunYMPSGExportTest/
      RunVTXPSGExportTest, both doing `LoopVBL := ...Loop...; if
      LoopVBL < 0 then LoopVBL := 0;`), and this port's own vtx_file.h/
      ym_file.h already carry that identical value in their own
      loop_vbl field - wired into main.c so `--loop-vbl` now defaults to
      the loaded file's own embedded loop point for VTX/YM sources
      specifically (still overridable, still 0 for every other format,
      matching what a tracker-sourced export - which has no native
      loop-point concept - would produce anyway).
    rationale: >
      Reaches the 14 Turbosound-pairing-eligible tracker formats
      (player_supports_pairing's own list) via player_step_registers -
      already-built, already-validated infrastructure, not a new
      register-generation path - PLUS AY/YM/VTX (validated) and SNDH
      (implemented, not byte-exact - see debt) via the newer, broader
      player_step_registers_any. Genuinely out of scope, disclosed
      rather than silently dropped: FT.OUT/FT.EPSG input formats (no
      loader anywhere in this port, obscure formats with no known real
      test files - a fundamentally different undertaking than this
      entry's actual scope). Genuinely NOT auto-derivable, disclosed
      with the corrected reasoning: title/author/programm/tracker-name
      (Convs.pas itself sources these from playlist-item metadata and an
      external formats-config resource, not from the file's own content
      - matching that exactly, not "completing" past it, is the faithful
      port here).
    verification: >
      tests/oracle_diff/run_diff.sh: 139/139 PASS, 0 FAIL. Gates:
      stc_psg_export, stc_vtx_raw, ay_psg_export, ym_psg_export,
      vtx_psg_export, ay_vtx_raw, ym_vtx_raw, vtx_vtx_raw (all byte-
      identical against dedicated OracleHarness.pas scenarios - VTX-
      format ones compare the pre-compression register buffer only, per
      this entry's own established rationale for why compressed bytes
      have no single correct target), and stc_pair_psg_export (two
      GENUINELY DIFFERENT, different-length files, force_loop=true,
      both voices byte-identical - the first oracle scenario in this
      project to exercise VBL2PSG's nMax-selection/Force_Loop gating at
      all).

      tests/oracle_diff/corpus_wav_md5_sweep.sh: 70 passed, 0 failed,
      unaffected. `cd engine && make clean && make`, `cd gui && make
      clean && make`, `cd tools/ay_export && make clean && make`: all
      zero warnings, zero errors under -Wall -Wextra -Wpedantic.

      Permanent regression tests: tests/engine_smoke/test_psg_export.c
      (header/magic-byte validation, unsupported-format rejection [now
      a zero-initialized player, since every player_load-able format is
      reachable], TS-pair writing two independently-valid files, AY/YM/
      VTX extended-source smoke coverage) and tests/ay_export_smoke/
      test_vtx_export.c (the genuine end-to-end proof - files this
      exporter writes, including from AY/YM/VTX/SNDH sources, load back
      correctly via this port's own already-oracle-validated
      vtx_file_load and produce audible output). All pass.
    debt:
      - "SNDH as a PSG/VTX export SOURCE is implemented
        (sndh_file_step_registers) and does not crash, but its output is
        NOT byte-identical to the Pascal oracle - diverges starting tick
        2 of a 200-tick test with growing, non-converging register
        differences. Attributed to the same already-documented,
        already-accepted atari_emulate_step/scheduling residual MIG-0054
        /MIG-0056 track for SNDH WAV export/playback generally, not a
        new defect this entry introduces - deliberately NOT wired into
        run_diff.sh as a hard gate to avoid persistent already-
        understood red noise. Smoke-tested only (round-trips through
        this port's own vtx_file_load, confirmed non-crashing/audible)."
      - "RESOLVED by MIG-0117: FT.OUT/FT.EPSG now have real loaders
        (out_file.c/epsg_file.c) - PSG_Converter's/VTX_Converter's own
        OUT2PSG/EPSG2PSG branches are ported and oracle-validated. FT.
        ZXAY remains out of scope (a separate, still-more-obscure raw-
        register-trace format with no test data at all, unlike OUT/
        EPSG - see MIG-0117's own scope note)."
      - "Per-file title/author/programm/tracker-name metadata remain
        caller-supplied CLI arguments, not auto-derived - but NOT
        because this port lacks an accessor: Convs.pas itself sources
        Nam/Aut/Prg from the PLAYLIST ITEM's own metadata (a GUI/
        playlist concept ay_export has no equivalent of, being a bare-
        file CLI tool) and Trk from an externally-loaded formats-config
        resource (filetypes.pas's GetEditorString/load_formats) that is
        not present in this repository checkout to port. Matching
        Convs.pas's real source of truth exactly is the faithful choice
        here, not a shortfall."

  - id: MIG-0117
    title: "RESOLVED: FT.OUT/FT.EPSG loader, live-playback player, and PSG/VTX exporter ported - Players.pas's MakeBufferOUT/SynthesizerOUT/OUT_Get_Registers and MakeBufferEPSG/SynthesizerEPSG/EPSG_Get_Registers"
    subsystem: engine/formats/out_file, engine/formats/epsg_file, engine/player
    state: validated
    summary: >
      Per explicit user request, following up on MIG-0010's own
      disclosed FT.OUT/FT.EPSG gap: ported real loader+live-playback-
      player+export-register-stepper support for both formats, "as it
      is implemented in the Pascal source code" - i.e. faithfully
      reproducing BOTH of Players.pas's genuinely separate register-
      generation algorithms per format, not approximating one with the
      other.

      FT.OUT (a headerless raw ZX Spectrum hardware port-write trace -
      5-byte records: ZX_Takt smallint LE, ZX_Port word LE, ZX_Port_Data
      byte, decoded via PortMask=$c002 against $FFFD select/$BFFD
      write): ported as engine/src/formats/out_file.c.
       - out_file_make_buffer: Players.pas:8748-8799's MakeBufferOUT +
         AY.pas:1092-1123's SynthesizerOUT - live playback, reusing the
         SAME Number_Of_Tiks Q32.32 fractional-tick accumulator
         (ay_engine's number_of_tiks/frq_ay_by_frq_z80) SynthesizerAY
         already uses for real .ay files, fed by each record's own
         17472-quantized T-state delta instead of a live Z80 tact
         counter (17472 is the .out format's own fixed wraparound
         constant, independent of MaxTStates).
       - out_file_step_registers: Players.pas:8801-8840's OUT_Get_
         Registers, the simpler, timing-approximate sibling Convs.pas's
         OUT2PSG uses - a whole-integer OUTZXAYConv_TotalTime
         accumulator compared against the live MaxTStates setting,
         genuinely unrelated to SynthesizerOUT's own Number_Of_Tiks/Flg
         state (confirmed by direct trace: OUT_Get_Registers never
         touches either). One call = one output tick, matching every
         other format's X_file_step_registers contract directly.

      FT.EPSG (a 16-byte-header register-write log - "EPSG"+$1A+a
      selector byte choosing the per-frame T-state period [0->70908,
      1->71680, 255->a custom 4-byte value], then 5-byte records: Reg,
      Data, a 3-byte-LE TSt - confirmed via direct trace of Players.
      pas:300-305/8868/8914's own `EPSGRec.All := 0` that TSt's
      nominal 4th byte is always implicitly 0, not stack garbage;
      all-$FF-bytes is a frame-boundary sentinel): ported as engine/
      src/formats/epsg_file.c.
       - epsg_file_make_buffer: Players.pas:8842-8905's MakeBufferEPSG +
         AY.pas:1137-1157's SynthesizerEPSG - simpler than OUT's own
         live-playback path (no 17472-style wraparound; a sentinel
         record instead rebases Previous_AY_Takt by EPSG_TStateMax to
         keep the delta continuous across the frame boundary).
       - epsg_file_step_registers: Players.pas:8907-8922's EPSG_Get_
         Registers, used by Convs.pas's EPSG2PSG - genuinely simpler
         still than OUT_Get_Registers: no timing math at all, just
         applies every non-sentinel record's register write immediately
         and stops at the next sentinel or EOF. Already matches this
         port's one-call-per-tick contract with no adaptation needed.

      Neither format has a native Global_Tick_Counter/Global_Tick_Max
      concept in the original (natural end is simply "ran out of file
      bytes") - both derive one at load time (out_file_load/epsg_file_
      load) the same way Convs.pas's own converters do: replicating
      Players.pas:16929-16941/16942-16965's GetTime duration scan, then
      Convs.pas:728/763's own OUT2PSG/EPSG2PSG ProgrMax formula
