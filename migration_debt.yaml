      Root cause, found by reading OracleHarness.pas directly: its
      RunSNDHWAVExportTest (used by the wav_export_sndh scenario every
      SNDH comparison in this whole investigation has relied on)
      unconditionally hardcodes `Interrupt_Freq := 200000;` with a
      comment reading "TC200 tag" - i.e. it was written once, against
      Temple_of_Asherah.sndh (a TC200 file) specifically, and never
      generalized to read each file's OWN play-frequency tag. This
      means every prior SNDH comparison in this entire investigation
      (all of MIG-0054 and this entry) was implicitly only ever tested
      against a file where the hardcoded 200Hz happened to be correct -
      the harness bug was invisible until a second, differently-tagged
      SNDH file was tested. Confirmed this is NOT a real Pascal/
      Players.pas behavioral difference: Players.pas:7102's actual
      production SNDH loader (`OpenSNDHFile`) computes `Int_Freq :=
      PlayFreq * 1000` from `sndh_ExtractTextInfo`'s real, tag-driven
      result - it is fully tag-driven in real use, matching what this
      port's engine/sndh_file.c already correctly does (already
      confirmed exact for TC200 in earlier sessions). The bug was
      entirely confined to this one test-harness convenience shortcut,
      never real Pascal engine behavior and never a C11 port defect -
      per the request's own priority ordering (documented Atari/chip
      semantics, then Pascal-as-intentionally-defining, then aggregate
      oracle measurements), the REAL Pascal-defining behavior
      (Players.pas's tag-driven Int_Freq) was already what this port
      matched; the oracle *test harness* was the one non-conforming to
      Pascal's own real semantics.

      Fix: ay_emul/OracleHarness.pas's RunSNDHWAVExportTest,
      RunSNDHTraceTest, and RunSNDHSingleStepTest (all three shared the
      identical hardcoded-200000 pattern, confirmed via grep) now call
      `sndh_ExtractTextInfo` on the loaded SNDHBuffer and set
      `Interrupt_Freq := PlayFreq * 1000`, mirroring Players.pas:
      7078-7102 exactly. Required adding `sndh` and `sometypes` to
      OracleHarness.pas's `uses` clause (TPlayGen/TArrayOfInteger/
      TArrayOfString weren't otherwise visible). SNDHBuffer is
      deliberately NOT nilled afterward (unlike Players.pas's own
      OpenSNDHFile does) since Atari_PrepEmu still needs it for
