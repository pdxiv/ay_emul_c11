      single-step both engines through this exact ~8,000-cycle window
      (engine/mfp.c-adjacent scratch tool + OracleHarness.pas's existing
      RunSNDHSingleStepTest/`sndh_singlestep` scenario) to find the
      precise first differing instruction. Both single-step tools share
      a structural limitation neither can currently avoid: they drive
      the engine normally (real interrupts processed) only until cycle_
      count first reaches the requested start point, THEN switch to raw
      single-instruction stepping with no further interrupt processing.
      Within this file's idle/STOP-loop-heavy region, the CPU is often
      still asleep (mid-STOP) at the moment this switch happens, and raw
      stepping cannot process the VBL/MFP interrupt that would normally
      wake it - so the trace simply sits at the STOP instruction
      indefinitely instead of reaching the code of interest. Worse, the
      two engines' own internal scheduling grain differs enough (this
      port's atari_emulate_step can take much larger single jumps than
      the oracle's MakeBufferSNDH loop at some points, and vice versa at
      others) that requesting "start at cycle X" on both sides does NOT
      reliably land both engines at logically-equivalent points relative
      to the next wake-up event - one attempt starting at 55,995,000
      landed the oracle 12,000+ cycles before this port's equivalent
      landing point; another, starting at 56,008,000, overshot to
      56,064,358, past the epoch of interest entirely. A reliable PC-by-
      PC comparison across this boundary would need a THIRD single-step
      mode - one that continues normal interrupt processing while still
      single-stepping and logging - which neither existing scratch tool
      implements. This is a genuine, reusable finding for whoever
      resumes this: the existing single-step tools are only reliable for
      windows KNOWN to be free of intervening interrupts, not for
      windows spanning a sleep/wake transition like this one.

