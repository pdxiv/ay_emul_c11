      0 failed, 3 known-non-identical (all pre-existing, unrelated -
      MIG-0056, MIG-0109 TSMode).

      New pairing mechanism, tests/engine_smoke/test_player_pair.c (new
      file, added to this session): (1) pairs two DIFFERENT real corpus
