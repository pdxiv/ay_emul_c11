      IntegrityCheck-backed formats - a structural match now converts
      the candidate to STC's/STP's on-disk layout and hands it to the
      SAME already-oracle-validated `stc_file_load`/`stp_file_load`
      (MIG-0101/MIG-0103) those other formats use, rather than building
      a second, independent playback/duration path for ST1/ST3/STF.

      Before requesting this work, the user was told explicitly (and
      confirmed proceeding anyway) that no real .st1/.st3/.stf sample
      file exists anywhere in this repo, so unlike MIG-0101/0102/0103/
      0104's ports, none of this could be validated against the real
      Pascal oracle the way every other format in this project has been.

      Done via 2 parallel agents in isolated worktrees (ST12STC+ST32STC
      together given their shared STC output and ST32STC's comparative
      simplicity; STF2STP alone given its size/complexity, ~420 lines of
