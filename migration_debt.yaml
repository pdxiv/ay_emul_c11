      gui/mixer_win.c gained three new GtkFrames (Z80/68000/MFP clock,
      each with a "Current:" read-only label plus preset radios and an
      "Other:" manual-entry GtkEntry), wired into the existing 500ms
      sync-timer (set_z80_frqs/set_mc_frqs/set_mfp_frqs, mirroring
      Mixer.pas's own Set_Z80Frqs/Set_MC68KFrqs/Set_MFPFrqs) so the
      controls re-sync to each freshly-loaded file's own current value,
      matching every other override control in this window.

      This work was done by a background agent (isolated git worktree,
      stale base predating this session's own player_pair/Turbosound-
      Phase-B architecture and the MIG-0088/interrupt-frequency-readout
      work already in the main tree) and then manually re-merged file
      by file: engine/hw/atari_emulate.{h,c} and engine/hw/mfp.{h,c}
