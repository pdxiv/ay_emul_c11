  - id: MIG-0112
    title: "Playlist-level Turbosound pairing (Players.pas's TrModLoaded PlayListItems[Index]^.Next branch, MIG-0007's/MIG-0109's own deferred Phase B) - parser + data model + shared-engine player redesign + playlist display, per explicit user request to fully implement using the original Pascal's own approach. UPDATE (MIG-0113): the real-Pascal-oracle-validation gap this entry's own debt list flagged as its top item is now CLOSED - see MIG-0113, which also found and fixed a genuine, previously-undetected bug in player_pair_make_buffer (the synth tick budget was never set, so paired playback's pacing was badly wrong despite this entry's own unit tests passing). `state` is left as `behaviorally_incomplete` rather than rewritten to `validated` since Force_Loop and full interactive GUI testing remain genuinely open (see this entry's own debt list, unchanged) - MIG-0113 is the authoritative record of what got closed and how."
    subsystem: "engine/player, engine/formats (all 14 tracker formats), gui/playback, gui/playlist, tests/engine_smoke"
    state: behaviorally_incomplete
    summary: >
      Closes MIG-0109's own explicit Phase B follow-up: pairing two
      SEPARATE, independently-loaded playlist items onto AY chip 0/chip
      1 simultaneously (as opposed to PT3's own MIG-0109 self-pairing,
      a single file driving both voices from data already in its own
      struct). Traced end-to-end against the real Pascal source before
      implementing (per the user's own prior finding, confirmed here):
      PlayList.pas's LoadPLItem/SavePLItem show the "ts" `<` pair is NOT
      a second file - `LoadPLItem`'s FIRST statement is `FileName :=
      String1`, and the ts-branch reuses `String1 := PLItemWork.
      FileName` (the item JUST loaded, i.e. the SAME path) before
      calling LoadPLItem again; SaveAYL's own writer confirms this
      symmetrically (`Writeln(m3uf, FileName); SavePLItem(...); if
      ...Next<>nil then SavePLItem(...Next)` - one path line, two
      `<...>` blocks, never a second path). So real .ayl-driven pairing
      is "the same file on both AY chips, each side with its own
      overrides" (e.g. different ChipFrequency/pan per side) - not two
      different tracker files mashed together, despite TrModLoaded
      loading `Next` as a nominally-independent PPlayListItem. The
      engine-level API is more general than this (accepts any second
      file), but this port's own .ayl support only ever exercises the
      real same-file-twice case.

      Engine (engine/include/ay_engine/player.h, engine/src/player.c):
      each of the 14 CaseTrModules-driven tracker formats (PT1/PT2/PT3/
      STC/STP/PSC/FLS/FTC/SQT/GTR/FXM/PSM/ASC/ASC0 - matching MIG-0101's
      own IsAYNativeFileType audit) gained a `<fmt>_file_step_registers
      (f, ay_chip* chip)` entry point: the SAME per-tick register-
      generation logic each format's own X_file_make_buffer already had
      inline, now callable against an EXTERNAL ay_chip target instead of
      always `&f->ay.chip` - mirrors Players.pas's own generalized
      `All_GetRegisters[CNum](CNum)` dispatch (SoundChip[CNum]
      addressing), reimplemented here as an explicit pointer since this
      port has no single shared SoundChip[0..1] array (every format
      struct owns its own private ay_engine instead). PT3 already had
      voice-indexed writes from MIG-0109; refactored pt3_get_registers_
      voice into a thin wrapper over a new pt3_get_registers_into(f,
      voice_idx, chip) core, plus pt3_file_step_registers driving voice
      0 only (self-pairing and playlist pairing are mutually exclusive
      per TrModLoaded's own `TSMode = False` guard).

      player_pair (player.h/player.c): holds `player primary; player
      secondary; bool active;`. player_pair_load_song loads both via the
      existing player_load_song, then activates pairing only if BOTH are
      pairing-eligible AND primary hasn't already self-paired (PT3's own
      ts_mode) - reuses primary's OWN chip2 slot (already present on
      every ay_engine since MIG-0109) as the shared second-chip target,
      exactly like PT3's self-pairing does, just fed by a SECOND
      player's register-generation instead of a second voice within one
      struct. player_pair_make_buffer mirrors MakeBufferTracker
      (Players.pas:12301-12317) exactly: steps both sides unconditionally
      every frame (player_step_registers is an idempotent no-op once a
      side has ended, matching CheckLoopAndStop's own persistent
      Real_End[CNum]), then dispatches ONE synth call via primary's
      already-ts_mode-aware engine (MIG-0109) unless BOTH sides have
      reached their own natural end (Real_End_All = Real_End[0] AND
      Real_End[1] when TSMode - a still-playing secondary keeps the pair
      going even after primary's own file ends, and vice versa).

      Playlist (gui/include/gui/playlist.h, gui/src/playlist.c):
      gui_playlist_entry gained has_ts_pair/ts_pair_overrides.
      gui_playlist_load_ayl now parses a second immediate `<...>` block
      (previously parsed-and-discarded per MIG-0091) into ts_pair_
      overrides instead of attaching it to a new row; gui_playlist_
      save_ayl writes it back the same way (factored the ~40-line
      per-block token writer into write_ayl_block so both the primary
      and ts-pair blocks share it). gui_playlist_entry_refresh_display
      appends a small "[x2]" indicator (matching GetPlayListFileType's
      own 'x2' suffix, relocated to this port's single-column playlist
      view since it has no separate file-type column to append to).

      GUI playback (gui/include/gui/playback.h, gui/src/playback.c,
      gui/src/mainwin.c, gui/src/mixer_win.c, gui/src/dialogs/
      mxhelper.c): gui_playback now holds a `player_pair pair` instead
      of a plain `player p` (every render/query call goes through
      player_pair_* now, a transparent passthrough to `pair.primary`
      alone when `pair.active` is false, so non-paired playback is
      unaffected). gui_playback_load_song gained a `ts_pair` parameter;
      do_load_song (mainwin.c) looks it up from mw->plwin.model.items[
      mw->plwin.model.current].has_ts_pair (the item already being
      loaded, per that function's own pre-existing ticker-text
      invariant) rather than needing a new parameter threaded through
      every caller. do_seek's backward-seek reload path reloads the
      WHOLE pair (both sides), not just primary. No new interactive
      "create a pairing" UI was added - traced and confirmed the
      original itself has none either (TPlayListItem.Next is set ONLY
      by LoadAYL, nowhere else in the whole codebase - no menu item,
      no drag action); pairing is purely a `.ayl`-file-authored feature
      in the original, and this port matches that scope exactly rather
      than inventing UI beyond it.

      A serious incident occurred mid-implementation: three parallel
      subagents applying this same mechanical pattern to different
      tracker formats were run in the SAME shared working directory
      (no worktree isolation). One agent, confused by transient build
      failures caused by the OTHERS' concurrent in-progress edits, ran
      a broad `git checkout` across the tree (excluding only its own
      target files) as a misguided "clean slate" recovery attempt -
      wiping out its own work, the other two agents' completed work,
      AND this session's prior, already-landed MIG-0110/MIG-0111 work,
      all at once. Recovered via `git stash list` (two stashes existed:
      a comprehensive one capturing nearly all of it, and a second,
      smaller one holding one agent's own separate WIP snapshot of
      sqt_file.c) - `git stash apply` restored the bulk of it; sqt_file.c
      itself was still genuinely mid-refactor (some call sites converted
      to the new chip-target pattern, others not) and was finished by
      hand; a small already-landed function (gui_playlist_defaults_init)
      and this session's own most recent playlist.c edit (not yet
      captured in either stash when the incident happened) were re-done
      from memory. Both remaining subagents were stopped immediately
      once the pattern was identified. Full regression suite re-run
      after recovery confirmed zero data loss in the end: engine/gui/
      tools all rebuild with zero warnings, tests/oracle_diff (117/117),
      corpus_wav_md5_sweep.sh (70/0/3-known), and every engine_smoke
      binary including the new test_player_pair pass. Recorded here in
      full per this workspace's own porting-invariants (no silently
      omitted incident) even though the end state is intact - not
      treated as separate migration debt since no code was actually
      lost, only session time.
    rationale: >
      Direct response to the user's explicit "fully implement (parser +
      data model + a shared-engine player redesign + GUI pairing UI)
      using the approach used in the original Pascal code" instruction,
      following a research turn that found the feature genuinely absent
      (not merely mis-documented, unlike MIG-0101/MIG-0111's findings)
      and traced exactly why: the .ayl parser had no representation for
      the "ts" chain, the player dispatch model had no mechanism to
      drive two independently-loaded formats into a shared chip pair,
      and nobody had yet identified what the "ts" chain actually means
      (MIG-0091 explicitly flagged this as "a feature never fully
      traced" when it first parsed-and-discarded the block).
    verification: >
      Standalone (non-paired) playback fidelity: EVERY one of the 13
      newly-refactored tracker formats (all except PT3, which already
      had oracle coverage from MIG-0109) was individually confirmed
      BYTE-IDENTICAL via tests/oracle_diff/run_diff.sh's existing
