    rationale: >
      Not needed for core playback - confirmed by direct trace that both
      are exclusively part of the seek/scrub code path, never the normal
      forward-playback path this milestone's engine/atari_emulate.c
      covers. Deferred to whenever seek/scrub UI is tackled (a GUI-adjacent
      feature, later milestone territory regardless).
    verification: >
      Confirmed via grep: DMASndSkipMC68000Takts's only two call sites
      (atari.pas:1605,1714) are both inside Seeking-guarded code
      (Atari_SeekTo directly, and SynthesizerSNDH's `if Seeking then`
      branch).
