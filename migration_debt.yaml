      display them in). The ONE genuinely still-unported piece is the ICE
      depacker itself (sndh.pas:319-496, ~180 lines of LZ-style
      decompression) - engine/src/sndh_file.c:157-158 detects the "ICE!"
      magic and fails loudly with a dedicated SNDH_FILE_ERR_ICE_COMPRESSED
      error code rather than silently mishandling such a file, per this
      workspace's porting invariants.
    rationale: >
      Kept open, narrowed to just the ICE depacker: test_corpus_76
      contains exactly one .sndh file (More_Short_Demos.sndh) and it is
      NOT ICE-compressed - there is currently no real ICE-compressed SNDH
      file anywhere in this repo to validate a depacker port against.
      Porting sndh_UnpackFile's ICE branch now would be the same kind of
      unvalidatable busywork MIG-0007 already declined for Turbosound -
      better to defer until a real ICE-compressed test file is available
      (or fetch one deliberately, if this gap needs closing sooner).
    verification: >
      Confirmed via direct read of engine/include/ay_engine/sndh_file.h's
      file comment and engine/src/sndh_file.c:155-158: the ICE-compressed
      case is explicitly detected and rejected with
      SNDH_FILE_ERR_ICE_COMPRESSED, not silently mishandled. Confirmed via
      `head -c4` scan of every .sndh file in test_corpus_76/: none carry
      the "ICE!" magic, so this gap is currently unreachable by the test
      corpus (not a live failure), but remains open since it's a real,
      documented capability gap, not just an inert corner case.

