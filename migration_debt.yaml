  - id: MIG-0057
    title: "engine/ay.c, engine/ay_file.c, ay_emul/AY.pas: .ay-file AY-register digidrum investigation - one real bug fixed, one real bug found and deferred, one hypothesis disproven"
    subsystem: engine/ay, engine/ay_file, ay_emul/AY.pas, ay_emul/Z80.pas
    state: behaviorally_incomplete
    summary: >
      Investigated x-agon_of_phantasy-fa-digitune1.ay, ranked among the
      worst .ay divergences in the 36,448-file all_tunes corpus sweep
      (all_tunes_sweep.sh/rank_all_tunes.py, see the PORTING_TO_C11_
      LINUX.md corpus-validation section). Earlier characterization was
      "C11's amplitude consistently ~69-70% of the oracle's, same
      envelope shape" - suggestive of a digidrum scaling bug. This entry
      covers the investigation and its three outcomes.

      Tooling gap closed first: the project's existing AY_EMUL_AY_TRACE/
      AY_ENGINE_AY_TRACE instrumentation (TraceLog.pas / trace_log.c) had
      call sites ONLY on the Atari/SNDH path (atari.pas / atari_emulate.c)
      - the Z80/tracker-format path (Z80.pas / z80_bus.c / ay_file.c) had
      none, a known/documented limitation from earlier in this session.
      Added TraceLogAY calls to every AY-register-write and beeper-toggle
      site in Z80.pas's InitialOutProc/ZXOutProc/CPCOutProc/CPCCheckPIO
      (the LIVE ones - Z80.pas has a second, byte-identical-looking copy
      of these procedures inside `{$ifdef Z80Emu_ASM}`, which is dead
      code: `{ $define Z80Emu_ASM}` at line 19 has a space after `{`,
      making it a plain comment, not a directive, so Z80Emu_ASM is never
      actually defined - confirmed by testing that edits to the ASM-
      branch copy produced zero effect and zero trace hits, then finding
      the live copy in the `{$else Z80Emu_noASM}...{$endif Z80Emu_noASM}`
      block instead), and the matching site in engine/src/ay_file.c's
      on_ay_write/on_beeper_change. This closes the tooling gap for any
      future Z80-path investigation (ASC/PT1/FXM/AY), not just this one.

      Bug 1, FIXED: engine/src/ay_file.c never assigned
      `f->bus.beeper_on_level` (z80_bus.h documents it as "caller-
      supplied" after Calculate_Level_Tables computes BeeperLevel) - it
      sat at its zero-init default forever, silently dropping the 1-bit
      beeper/digidrum channel entirely for every .ay file. Verified the
      constant itself was never the issue: hand-computed Pascal's
      BeeperLevel formula for RunAYWAVExportTest's exact settings
      (Index_AL=255 etc defaults, PreAmp=127, BeeperMax=146,
      NumberOfChannels=2, SampleBit=16) gives -5440, and a standalone
      harness confirms engine/src/ay.c's ay_engine_calculate_level_tables
      computes the identical -5440 independently - the shared constant
      was always correct, only the bridge assignment was missing.

      Bug 2, FOUND, FIX DEFERRED (see "not yet safe to enable" below):
      enabling the Bug-1 fix (uncommenting the beeper_on_level assignment)
      regressed T21.ay in tests/oracle_diff/corpus_wav_md5_sweep.sh (was
      passing, byte-identical). Traced via the
      newly-added Z80 AY trace: C11 fires a beeper_toggle ON at cycle=4517
      and OFF again at cycle=4555 (a 38-T-state phantom pulse); the
      Pascal oracle's AY trace, for the identical file/scenario/frame
      window, shows ZERO beeper_toggle events at all. This is not a
      timing residual (the pulse doesn't exist on the Pascal side at any
      cycle) - it is a genuine Z80-core execution divergence: something
      in superzazu/z80's handling of T21.ay's actual instruction stream
      causes a spurious OUT to the beeper port ($FE, bit0=0) that
      Z80.pas's own core does not produce. Root cause not yet identified
      (would need single-instruction Z80 tracing around cycle 4517,
      not yet built - analogous tooling gap to the already-documented
      68000/Musashi single-step limitation in MIG-0056). Because turning
      on the real, otherwise-correct beeper_on_level fix would surface
      this pre-existing, previously-invisible bug as an audible new
      divergence on a previously-passing file, the beeper_on_level
      assignment in engine/src/ay_file.c is left commented out with a
      comment pointing here, rather than landed - matching this project's
      rule to not close/introduce behavior without evidence it's net-
      correct.

      Hypothesis 3, DISPROVEN: initially hypothesized the amplitude-scale
      mismatch was an out-of-bounds array read - AY.pas's Synthesizer_
      Mixer_Q/_Mono and engine/ay.c's mirror indexed Level_AL/AR (32-entry
      arrays) with `RegisterAY.AmplitudeA * 2 + 1` / `c->reg[8] * 2 + 1`
      using the amplitude register's RAW byte, unmasked - and this file's
      actual digidrum trick writes full bytes (e.g. 163) to register 8
      with tone+noise disabled, which would index far past the array
      (163*2+1=327) if unmasked, into whatever adjacent memory each
      language happens to lay out differently - a plausible-looking
      explanation for "same shape, different scale". Applied a defensive
      `& 0x0F` mask at the point of use in both engines (AY.pas's two
      mixer procedures, engine/ay.c's two mixer functions) before
      testing - and the fix changed NOTHING for digitune1.ay: identical
      output before and after, byte for byte. Root cause: both engines'
      real write path (ay_chip_set_ay_register / SetAYRegister, which is
      what Z80.pas's live OutProc handlers actually call, confirmed via
      the new trace) already masks register 8/9/10 to 5 bits (`and 31`)
      BEFORE storing, and envelope_en_a/b/c is derived from that same
      masked value - so whenever the envelope-disabled/direct-amplitude
      branch is taken (envelope_en_a=true, i.e. bit4=0), the stored value
      is already guaranteed 0-15, and the extra masking is a verified
      no-op via this path. No out-of-bounds ever actually occurred here.

      The `& 0x0F` masking fix was KEPT despite being a no-op for this
      file, because it is not a no-op everywhere: engine/src/*.c's many
      tracker-format loaders (pt1/pt2/pt3/stc/stp/gtr/fls/psm/psc/sqt/
      fxm/asc/ym) call ay_chip_set_ay_register_fast directly, which does
      NOT mask - some of these pass already-bounded values from their own
      per-format decode logic, but this was not exhaustively re-verified
      for every one of the ~13 formats as part of this entry, so the
      mixer-level mask is retained as a correctness backstop rather than
      relying on every caller's own bounds discipline. AY.pas's
      SetAYRegisterFast (used by Players.pas:9021/9045/9087, the real
      88xxx/CPC-clock-detection paths, not oracle-only) is similarly
      unmasked, so the Pascal-side mask is the same kind of backstop.

      Actual root cause of digitune1.ay's amplitude-scale divergence:
      NOT identified. With Hypothesis 3 disproven and AY register write
      content confirmed to match almost exactly between engines (via the
      new trace: same registers, same values, only a small ~12-cycle
      offset per write - the same small-residual signature already
      characterized and accepted elsewhere in this project, e.g.
      MIG-0056's SNDH findings), the leading remaining explanation is
      that this file's digidrum trick rewrites amplitude registers
      roughly every 140 T-states - fast enough that the SAME already-
      accepted small Z80/CPU-timing residual, which is normally
      inaudible, becomes highly visible here because the per-output-
      sample averaging window (Tick_Counter.Hi ticks, Averager16) is
      extremely sensitive to exact cycle alignment at this modulation
      rate. Not confirmed by direct evidence (would require the same
      kind of single-instruction Z80 trace described for Bug 2) - stated
      as the leading hypothesis, not a closed finding.

      Also checked (subsong-selection ruled out earlier in this session
      for a different file, but re-confirmed applicable here too): .ay
      loading is hardcoded to song index 0 on both sides (Players.pas's
      real OpenAYFile behavior confirmed independently: AYFileHeader.
      FirstSong is declared but never read; tools/ay_player/src/
      format.c:86 hardcodes song_index=0 to match) - not a factor here.
    verification: >
      Build: `cd engine && make` clean, `lazbuild --build-mode=release
      ay_emul/Ay_Emul.lpi` clean. tests/oracle_diff/run_diff.sh: 60/60
      pass, 0 fail (both before enabling and after reverting the beeper
      fix). tests/oracle_diff/corpus_wav_md5_sweep.sh: 72 passed, 0
      failed, 1 known-non-identical, 0 skipped, WITH the masking fix
      applied and the beeper fix left disabled (commented out) - this is
      the current, landed state. Confirmed via direct A/B rebuild-and-
      compare (not assumption) that: (a) the masking fix alone changes
      nothing for digitune1.ay or the full corpus sweep; (b) the beeper
      fix alone reproduces the T21.ay regression in isolation (re-tested
      with the masking fix reverted, beeper fix alone active - same
      failure); (c) reverting only the beeper fix restores the full
      72/0/1/0 clean sweep. Level-table constant cross-checked by hand
      (BeeperLevel formula computed independently for RunAYWAVExportTest's
      exact settings, matches engine/ay.c's computed value exactly:
      -5440 both ways).

      FOLLOW-UP CHARACTERIZATION (same investigation, continued after
      PT1/FXM/ASC root-caused via MIG-0058/0059/0060): checked the
      remaining 6 files from the user's original "worst AY files" list
      (digitune2, koledy, follin_tdm, dmdemo_part_6, songinlines5,
      cjs_elephant_antics_titus_intro) using the AY-write tracing this
      entry added. All 6 fall cleanly into the two categories already
      described above, with NO new bug found:
      - digitune2, koledy, dmdemo_part_6, songinlines5: AY-register-
        driven, register content matches the oracle exactly (only the
        same small already-accepted cycle-timing residual, plus a
        couple of extra/missing trailing events right at the 512-sample
        render-window boundary as a direct consequence of that same
        residual - not a distinct bug).
      - follin_tdm, cjs_elephant_antics_titus_intro: BEEPER-driven
        digidrum, like digitune1 - zero AY register writes, C11 output
        currently silent (max abs sample 0), for the exact same reason
        as digitune1 (beeper_on_level fix disabled pending the T21.ay
        followup below). This raises the T21.ay followup's priority: it
        is now confirmed to block at least 3 of the user's originally-
        flagged worst files (digitune1, follin_tdm, cjs_elephant_antics_
        titus_intro), not just 1.
    open_followups:
      - "RESOLVED by MIG-0061: the T21.ay phantom beeper-toggle divergence
        was root-caused to on_ay_read never being wired up in
        engine/src/ay_file.c (IN A,(C) always returned 0xFF instead of
        the real AY register value) - not a Z80-core execution bug, and
        not needing new single-instruction-tracing infrastructure after
        all (both Z80 cores' existing per-instruction step functions were
        sufficient once temporarily instrumented). beeper_on_level is now
        enabled; T21.ay and cjs_elephant_antics_titus_intro.ay are byte-
        identical, follin_tdm.ay dropped to the same accepted residual as
        every other AY-register-driven file. See MIG-0061 for full
        details - kept here only as a pointer, not duplicated."
      - "RESOLVED by MIG-0062: digitune1.ay's amplitude-scale divergence
        is the same accepted OUT (n),A timing quirk (11 T-states in
        superzazu/z80, the standard/correct value, vs 12 in Z80.pas's
        own live core) already documented for a different opcode in
        MIG-0018. Not a new bug, not fixable without deliberately
        making this port's trusted Z80 core non-standard - see MIG-0062
        for the full evidence and the five other .ay files it also
        explains."
      - "The engine/src/*_file.c formats calling ay_chip_set_ay_register_
        fast were not individually audited to confirm their own amplitude
        values are always pre-bounded to 0-31 - the new mixer-level mask
        is believed sufficient as a backstop but this wasn't exhaustively
        checked format-by-format."

  - id: MIG-0062
    title: "digitune1.ay's amplitude-scale mystery (MIG-0057's last open followup) root-caused and closed: OUT (n),A costs 11 T-states in superzazu/z80 (standard) vs Z80.pas's own 12 - the same accepted-quirk category as MIG-0018's interrupt-timing finding, not a new bug"
    subsystem: engine/z80_bus
    state: behaviorally_incomplete
    summary: >
      Took a direct run at MIG-0057's last open item: digitune1.ay's
      amplitude-scale divergence, previously only a hypothesis ("existing
      small CPU-timing residual amplified by ~140-T-state digidrum
      modulation rate", never confirmed by evidence). Used the exact
      methodology MIG-0061 validated for T21.ay: temporary single-
      instruction tracing added to both Z80 cores' own natural per-
      instruction step functions (z80_bus_step's z80_step call,
      Z80.pas's live Z80_Step's Z80_ExecuteCommand call - no new
      infrastructure needed), dumping PC/registers/opcode bytes from
      cold start.

      Unlike T21.ay (a sharp, one-instruction divergence from otherwise-
      identical state), digitune1.ay's two engines track PC-for-PC and
      register-for-register identically from tact=0 all the way through
      instruction #127 - at which point Pascal's tact reaches 1081 while
      C11's reaches 1080: a bare ONE-T-STATE difference, on an
      instruction (opcode bytes D3 FD = `OUT (n),A`) that both engines
      decode, execute, and whose resulting register/memory state is
      otherwise byte-identical. This single T-state then persists as a
      constant offset through the rest of the traced range (every
      subsequent instruction's tact differs by exactly the same 1),
      confirming it's a per-instance timing difference on this specific
      opcode, not a growing drift or a content bug.

      Cross-checked both cores' own declared costs for opcode 0xD3
      directly from source: engine/third_party/z80/z80.c's cyc_00[0xD3]
      = 11 (verified by parsing the actual array, not eyeballing the
      wrapped literal - an early manual transcription mistake gave a
      wrong array length and had to be redone via a real parse).
      Z80.pas's live handler for the same opcode (Z80.pas:13303-13310,
      function m211, reachable via the live Z80_ExecuteCommand's
      Z80_MainTable[OpCode] dispatch at Z80.pas:21020-21026 - confirmed
      NOT the dead {$ifdef Z80Emu_ASM} branch) does `inc(CurrentTact,
      12)` directly inside the handler, unconditionally. 11 T-states for
      OUT (n),A (M1 fetch 4 + immediate-byte read 3 + I/O write 4) is the
      real, documented Zilog Z80 timing, matching every reputable Z80
      reference and superzazu/z80's own table; Z80.pas's 12 is a genuine
      quirk in the original Pascal core - the SAME class of finding as
      MIG-0018 (which found the identical pattern for IM1/IM2 interrupt-
      accept timing: Z80.pas 12/18 vs superzazu's standard 13/19), just
      a different opcode.

      This fully explains, and closes as understood, ALL SIX AY files
      characterized in MIG-0057's follow-up pass as "register-perfect,
      small residual only" (digitune1, digitune2, koledy, dmdemo_part_6,
      songinlines5, follin_tdm) - they are not six separate mysteries,
      they share this ONE root mechanism. All six make heavy use of
      rapid, repeated AY register writes (digidrum/PWM-style amplitude
      bit-banging or otherwise register-write-dense player code), each
      write costing one OUT instruction - so the 1-T-state-per-OUT drift
      compounds far faster in these files than in typical register-
      write-sparse tunes, producing the large-looking diff_fraction
      numbers despite the underlying cause being a single, tiny,
      already-policy-covered timing quirk.
    rationale: >
      Same rationale as MIG-0018, which this entry extends rather than
      duplicates: per explicit user direction, superzazu/z80 is the
      correct reference for raw Z80 CPU timing, not Z80.pas. Replicating
      Z80.pas's non-standard 12-T-state OUT (n),A into engine/third_party/
      musashi-analogous trusted code (here, superzazu/z80's own vendored
      cycle table) would mean deliberately making this port's Z80 timing
      wrong, purely to chase byte-identity with an oracle whose own CPU
      core has the bug. Not fixed, and not intended to be fixed, for the
      same reason MIG-0018's interrupt-timing finding wasn't: it would
      require patching the trusted core's cycle table with a value known
      to be non-standard. If exact byte-identity with the Pascal oracle
      is ever wanted for these six files specifically, the change would
      have to happen in ay_emul/Z80.pas itself (out of scope - this repo
      treats the Pascal submodule as the read-only oracle).
    verification: >
      Build: `cd engine && make` clean (no warnings, confirms temporary
      single-instruction trace instrumentation was fully removed from
      both z80_bus.c and Z80.pas - diffed against pre-instrumentation
      backups to confirm byte-for-byte restoration, not just "looks
      clean"). tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail (no
      behavior change was made, so this is a no-op confirmation, not a
      new-fix regression check). tests/oracle_diff/corpus_wav_md5_sweep.
      sh: 75 passed, 0 failed, 1 known-non-identical, 0 skipped -
      unchanged from before this investigation, as expected (nothing was
      changed). cyc_00[0xD3]=11 verified via an actual Python parse of
      engine/third_party/z80/z80.c's array literal (not manual counting).
      Z80.pas's m211 handler's `inc(CurrentTact,12)` verified by direct
      read of Z80.pas:13303-13310, cross-checked as reachable from the
      live (non-ASM) Z80_ExecuteCommand's dispatch table at Z80.pas:
      21020-21026.

  - id: MIG-0063
    title: "Phase 5 kickoff: player API extended with player_song_count/player_load_song and promoted from tools/ay_player into engine/include/ay_engine/player.h"
    subsystem: engine/player
    state: validated
    summary: >
      The GUI's Open-file/subsong flow needs a per-format subsong-count
      getter that did not exist anywhere before this milestone: .ay
      files carry a song count (TAYFileHeader.NumOfSongs+1, ay_file.c's
      locate_song_data) but nothing surfaced it through the shared
      `player` abstraction. Added `int song_count` to `ay_file`
      (engine/include/ay_engine/ay_file.h), set from `data[16] + 1` in
      ay_file_load (engine/src/ay_file.c), and added
      `player_song_count(const player*)` (returns song_count for
      PLAYER_FORMAT_AY, 1 for every other format - no other format
      has a subsong-selection concept yet) plus
      `player_load_song(player*, path, data, size, sample_rate,
      song_index)` (player_load now forwards to it with song_index=0)
      to player.h/player.c. Both files were then promoted verbatim
      (via `git mv`, include guard renamed PLAYER_FORMAT_H ->
      AY_ENGINE_PLAYER_H) from tools/ay_player/include/player/format.h
      and tools/ay_player/src/format.c into engine/include/ay_engine/
      player.h and engine/src/player.c, since both the CLI tool and the
      new gui/ target depend on this API - it belongs in the shared
      engine layer, not a CLI-tool-specific one.
      Explicitly NOT added to the engine layer (an architectural
      decision recorded in the approved plan, not an oversight):
      pause/resume, playback position, and volume. A GUI needs all
      three, but `player_make_buffer` is a pure pull-based decode call
      with no such concepts, and every already-oracle-validated format
      decoder is reached through it - so pause/position/volume are
      implemented entirely at the GUI layer instead (gui/include/gui/
      playback.h's atomic flags around a background pthread), touching
      zero decoder code. See MIG-0065 for that layer.
    rationale: >
      Mechanical, additive promotion plus one new narrow getter -
      no existing behavior of any of the 18 already-validated format
      decoders was touched. tools/ay_player/src/main.c's #include was
      updated to the new path with no other change.
    verification: >
      Full rebuild (`cd engine && make`, `cd tools/ay_player && make`)
      clean. tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail.
      tests/oracle_diff/corpus_wav_md5_sweep.sh: 75 passed, 0 failed, 1
      known-non-identical (pre-existing, unrelated), 0 skipped.
      tools/ay_player/smoke_test.sh: full pass. Standalone test of
      player_song_count() against koledy.ay (expected 6, got 6),
      MetalMania.ay (expected 12, got 12), NEWDANCE.asc (expected 1,
      got 1) - all correct.

