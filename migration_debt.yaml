  - id: MIG-0082
    title: "Phase 5 continuation: real title/author metadata extraction extended to GTR, FTC, PT1, PT2, PT3, and PSC - all fixed-offset, fixed-width, space-padded fields (unlike STC's compressor-tag detection, deliberately not attempted)"
    subsystem: engine/gtr_file, engine/ftc_file, engine/pt1_file, engine/pt2_file, engine/pt3_file, engine/psc_file, engine/player
    state: validated
    summary: >
      Players.pas's AddTrackerModule (Players.pas:7320-7472, the
      title-extraction section, not to be confused with the differently-
      scoped pointer-relocation function of the same name at 2313-2470)
      has one branch per format; six of them - GTR, FTC, PT1, PT2, PT3,
      PSC - read title/author as a plain fixed-offset, fixed-width,
      space-padded (not NUL-terminated or length-prefixed) field, the
      same shape as this milestone's other metadata work, just without
      a relative-pointer indirection: GTR title@7(32B); FTC title@8
      (42B, within a larger 69-byte FTC_MusicName@0 area); PT1 title@69
      (30B); PT2 title@101(30B); PT3 title@0x1E(32B)+author@0x42(32B);
      PSC title@0x19(20B)+author@0x31(20B) - all offsets absolute
      within the raw input file bytes (Players.pas's PLItem.Offset is
      always 0 for these formats in this port's scope - none of them
      support the multi-file-container loading AY's own Offset concept
      exists for). Each format's own .c file gained a small
      copy_fixed_field() helper (duplicated per this project's existing
      per-file convention, e.g. be16u/be16s) that copies the field and
      trims leading/trailing bytes <= ' ' (Pascal doesn't call Trim()
      in every one of these branches, but every place that actually
      uses the result downstream does - e.g. ASC/PSM's own `Trim(...)
      <> ''` - so trimming here for consistent display, a deliberate,
      documented choice). Wired into player_get_metadata_raw()
      (engine/src/player.c) per format's actual field set (PT3/PSC:
      title+author; GTR/FTC/PT1/PT2: title only, matching Players.pas
      exactly - none of the six ever had a Comment field in this
      section). Zero gui/ changes needed - playback.c/playlist.c
      already call the generic dispatch (same payoff already seen in
      MIG-0075's YM extension).
    rationale: >
      STC also has real title-extraction logic in Players.pas
      (7256-7320) but requires detecting an embedded legacy compressor
      signature block (KSA/STCompressor tags) at a computed, non-fixed
      offset before the title can even be located - a materially larger
      and more speculative unit than the six fixed-offset formats here,
      deliberately not attempted in this entry. FLS and SQT have no
      title/author extraction anywhere in Players.pas at all (confirmed
      by grep across the full title-extraction section) - not a gap,
      the original simply never reads metadata for those two formats.
      ASC/ASC0/STP/PSM also have real extraction logic (a conditional
      header-field check before reading, one tier more complex than
      the six done here but not as involved as STC) - left as a
      possible follow-up, not attempted in this entry either.
    verification: >
      `cd engine && make` clean (zero new warnings) across all six
      modified format files. Standalone test against real corpus files:
      RE-TRIGG.ftc -> title='TEST MODE IS ON... --- ....FULL
      RETRIGGER!'; mus08.pt1 -> title='Composed by CONT of JVC 03.96';
      DEMON.pt1 -> title='PASHA K. FOR REFLECTION'; NOR.MUS..pt2 ->
      title='IR0NMAN: N0RMAL MUSIC!'; ZAGON_07_remixDJ_EchoMAKROSS.pt3
      -> author='DJ Echo/14:25/30.05.2e3/ -+-+-+-' title='ZAGON_07
      (remix)/DJ Echo/MAKROSS'; WannaGS.psc -> author='GROOVE/JS/TNL'
      title='I WANNA A G.SOUND !' - all real, readable, plausible
      values. Files genuinely lacking metadata (L.Boy_broken.gtr,
      Matrix7.pt3, Inbetween_remix.psc) correctly returned empty
      strings rather than garbage, confirming the bounds/absence
      handling is correct, not just the happy path. Caught and fixed a
      real bug during this entry's own verification: the first version
      of copy_fixed_field only trimmed TRAILING padding, leaving
      leading spaces in the output (e.g. "    IR0NMAN: N0RMAL MUSIC!");
      fixed to trim both ends, matching genuine Trim() semantics as the
      code's own comment already claimed. Full regression suite
      re-confirmed clean after the fix: run_diff.sh 60/60; corpus_wav_
      md5_sweep.sh 75/0/1-known/0; tools/ay_player/smoke_test.sh full
      pass. `cd gui && make` clean with zero source changes; 10/10
      repeat full-app runs clean under `timeout`.

  - id: MIG-0083
    title: "Phase 5 continuation: metadata extraction extended to ASC, ASC0, STP, and PSM - each needs one conditional check before reading, one tier past the fixed-offset formats in MIG-0082"
    subsystem: engine/asc_file, engine/stp_file, engine/psm_file, engine/player
    state: validated
    summary: >
      ASC/ASC0 (Players.pas:7436-7473): title/author are 20-byte fields
      at PatternsPointers-44/-20, gated on PatternsPointers-
      NumberOfPositions equalling a magic constant (72 for ASC1, 71 for
      ASC0's own pre-shift numbering). This port's asc_file_load already
      normalizes ASC0 input into ASC1's exact on-disk layout at load
      time (shifting bytes and adding +1 to compensate the three
      pointer fields) - working through the arithmetic shows this makes
      ASC0's own check become `(asc0_ptr_raw+1) - positions = 71+1 = 72`,
      IDENTICAL to ASC1's check - so one shared check/offset pair
      (using the already-parsed, already-normalized f->patterns_pointer/
      f->number_of_positions) correctly covers BOTH formats, no
      is_asc0-specific branching needed for metadata at all. STP
      (7498-7530): a 28-byte exact-match signature check ("KSA SOFTWARE
      COMPILATION OF ", Players.pas:954's KsaId constant) at file offset
      10; only if it matches is there a 25-byte title right after, at
      offset 38 - otherwise no title at all (a real, common case, not
      an error). PSM (7532-7550): a variable-length "remark" field at
      offset 8, length PositionsPointer-8 (only present if
      PositionsPointer>8); if the remark is exactly the 5-byte sentinel
      "psm1\0", title stays empty; if it starts with that same 5-byte
      prefix AND is longer than 5 bytes, the prefix is stripped and the
      rest becomes the title; otherwise the whole remark is the title.
      All four wired into player_get_metadata_raw() per their actual
      field set (ASC/ASC0: title+author; STP/PSM: title only - neither
      ever had an Author field in Players.pas's own branches for them).
      Zero gui/ changes needed - same generic-dispatch payoff as
      MIG-0075/MIG-0082.
    rationale: >
      This completes the format survey for what Players.pas's title-
      extraction section (7132-7570, spanning OpenAYFile/OpenAYMFile/
      OpenSNDHFile plus AddTrackerModule) covers: every format with a
      REAL Title/Author field short of STC (which needs the same KSA/
      "SOUND TRACKER COMPILATION OF " family of signature detection as
      STP but at a computed rather than fixed offset - deliberately
      still not attempted, matching MIG-0082's own scoping) now has it
      ported. FLS/SQT remain confirmed to have none in the original at
      all (not a gap).
    verification: >
      `cd engine && make` clean (zero new warnings) across all four
      modified format files. Standalone test against real corpus/
      all_tunes files: acidrev3.stp -> title='COMPOSED BY ERASER MAY
      97'; imp49.stp -> title='IMP49:FOOLISH GIRL'; Girls_of_Meladze.stp
      and m16.psm both correctly returned empty (no signature match/no
      remark present, not garbage); NEWDANCE.asc -> author="HIMIK'S ZXZ
      OF P.O.S" title="THIS IS NEW DANCE'S"; ze_point.asc -> author=
      'EXALOT ( 09.10.94. )' title='ZENITH POINT'; MISTERS_BOX.as0 ->
      author='F.F.F.' title="MISTER'S BOX" - this last one is the
      strongest confirmation of the ASC0-shares-ASC1's-logic derivation
      above, since it's a real .as0 file exercising the "different
      pre-shift magic constant, same post-normalization result" path
      directly, not just the arithmetic reasoning. Full regression
      suite re-confirmed clean: run_diff.sh 60/60; corpus_wav_md5_
      sweep.sh 75/0/1-known/0; tools/ay_player/smoke_test.sh full pass.
      `cd gui && make` clean with zero source changes; 10/10 repeat
      full-app runs clean under `timeout`.

  - id: MIG-0084
    title: "Phase 5 continuation: mxhelper.pas ported - a 13-preset stereo channel-mode picker for the Mixer window, using MainWin.pas's real CalcModeCoefs arithmetic"
    subsystem: gui/mixer_win, gui/dialogs/mxhelper
    state: validated
    summary: >
      mxhelper.pas itself has no logic at all (a bare form, empty
      implementation) - all real behavior lives in the caller,
      Mixer.pas's TFrmMixer.SBHelperClick (593-627), which this entry
      ports: a 13-way radio group (AY/YM x ABC/ACB/BAC/BCA/CAB/CBA
      Stereo, plus Mono) that, on Set, computes the six channel
      amplitude/pan values via MainWin.pas's CalcModeCoefs (1953-2027)
      - a pure arithmetic function keyed on (Mode 0-6, ChType AY/YM)
      using three base levels (255/170/Echo, Echo=85 for AY_Chip/13 for
      YM_Chip) - and applies them via player_ay_engine() + ay_engine_
      calculate_level_tables(), the exact same primitives gui/src/
      mixer_win.c's own sliders already use (MIG-0078). gui/dialogs/
      mxhelper.c replicates CalcModeCoefs's per-mode table and
      SBHelperClick's own ChansRG.ItemIndex -> (Mode, ChType) mapping
      (item 0-5 -> AY modes 1-6; item 6-11 -> YM modes 1-6; item 12 ->
      Mono) exactly. A new "Presets..." button on the Mixer window
      (matching Mixer.pas's SBHelper) opens it.
    rationale: >
      NOT ported: the TSDMAChG check-group (ZX Turbo-Sound/STe DMA-
      Sound "leave space for additional device" options) and the
      PreAmp-search loop that follows in SBHelperClick (decrementing
      PreAmp and recalculating level tables until no overflow indicator
      would show) - both concern Atari DMA-sound/TurboSound channel
      headroom, a feature category this port's Mixer window doesn't
      have at all, matching MIG-0078's own already-recorded scope
      decision (core AY channels only) rather than reopening it.
    verification: >
      `cd gui && make` clean (zero new warnings). Standalone unit test
      (compiling mxhelper.c's source directly into a test driver to
      reach its static calc_mode_coefs()/apply_preset() functions):
      Mode 1 AY (Echo=85) -> AL=255 AR=85 BL=170 BR=170 CL=85 CR=255,
      exactly matching CalcModeCoefs's own case 1; Mode 6 YM (Echo=13)
      -> AL=13 AR=255 BL=170 BR=170 CL=255 CR=13, exactly matching case
      6; Mode 0 (Mono) -> all six values 255. apply_preset() against a
      real loaded player confirmed the item-index mapping's two trickiest
      cases: item 11 ("YM CBA Stereo") correctly resolved to chip_type=
      YM with Mode 6's own coefficients (not Mode 12 or some other
      off-by-one); item 12 ("Mono") correctly resolved to all-255
      regardless of chip_type. Screenshot of the real dialog (via
