  - id: MIG-0125
    title: "Tools.pas PListOpts tab ('Playlist colors and font') fully implemented - a previously entirely-undocumented gap discovered while researching what remained for a full Mixer/Tools/Playlist implementation"
    subsystem: "gui/playlist_win, gui/tools_win, gui/mainwin"
    state: translated
    summary: >
      Same governing request as MIG-0124. While enumerating what
      remained for a full Tools.pas port, found that PListOpts (Tools.
      pas's 5th tab, "Playlist colors and font" GroupBox2 plus a Font
      picker button) was never mentioned anywhere in gui/include/gui/
      tools_win.h's own itemized ported/not-ported list at all - not
      excluded, not ported, simply never traced. Real Pascal: PLColor/
      PLColorBk (normal row text/back), PLColorSel/PLColorBkSel
      (selected row), PLColorPl/PLColorBkPl (currently-playing row),
      PLColorPlSel (playing AND selected - reuses PLColorBkSel for its
      own background, PlayList.pas:2526-2600's RedrawItemRealy), and
      PLArea.Font (Name/Size/Bold/Italic) - all persisted via SaveDW/
      SaveStr (MainWin.pas:4387-4399/4624-4636), same mechanism as the
      window-position/tray-mode/volume settings MIG-0122 already wired
      up via gui/include/gui/settings.h.

      Not ported: PLColorErr/PLColorErrSel (the two remaining real
      Pascal colors) - this port's gui_playlist_entry has no per-item
      load-error/failure state to key them off of at all (a separate,
      smaller, genuinely different gap from "colors and font" itself -
      see debt below), so implementing just these two would have
      required inventing new playlist-model plumbing outside this
      entry's own scope.

      New gui_playlist_color type (gui/include/gui/playlist_win.h) -
      GdkColor + `set` bool, where `set=false` means "render with the
      GtkTreeView's native theme color", the closest faithful
      equivalent to real Pascal's own GetSysColor(...)-derived defaults
      for PLColorBk/BkSel/Sel/PLColor (a Windows theme value with no
      portable literal equivalent - left unset by default, letting the
      real desktop theme show through, same effective "blends with the
      OS theme until customized" behavior the original has). PLColorPl/
      PLColorPlSel DO have real FIXED literal Pascal defaults
      ($0DA00D/$FF80FF, Delphi TColor's own BGR-hex-literal convention
      converted to RGB #0DA00D/#FF80FF here) and are pre-set `set=true`
      from gui_playlist_win_create. A new playlist_cell_data_func
      (GtkTreeViewColumn's own per-row callback) applies the right
      (foreground, background) pair per row based on selected/playing
      state, matching RedrawItemRealy's exact branching - this is also
      the FIRST time this port's playlist window visually distinguishes
      the currently-playing row at all (gui_playlist_win_next/prev's
      own fire_play helper never queued a redraw after changing
      model.current before this entry, since nothing previously
      depended on that redraw happening).

      gui/src/tools_win.c gained the "Playlist colors and font" frame
      (7 clickable GtkEventBox+GtkLabel preview swatches - Text/Back/
      SelText/SelBack/Play Text/Play Back/Play SelText, matching
      Label1/12/13/14/15/16/17's own captions exactly - opening a
      GtkColorSelectionDialog on click, plus a Font... button opening a
      GtkFontSelectionDialog) operating directly on mw->plwin's new
      fields - matching gui/include/gui/mixer_win.h's file-ownership-
      split precedent (VolumeSheet living in tools_win.c even though
      its real home is Mixer.pas) for the SAME reason: PListOpts is
      part of Tools.pas in the original too, so this is actually the
      MORE faithful location, not a split at all. PLArea.Font's own 4
      separate Name/Size/Bold/Italic fields are consolidated into one
      PangoFontDescription (GTK/Pango's own idiomatic representation),
      matching this session's established "platform-appropriate
      substitution over literal structural mimicry" precedent (see
      gui/include/gui/alsa_mixer.h). Persistence added to gui_mainwin_
      create/gui_mainwin_save_settings under settings.ini's new
      "Playlist" group, keys matching the real Pascal SaveDW/SaveStr
      names 1:1 (PLColor/PLColorBk/.../PLColorPlSel as this port's own
      0xRRGGBB ints, Font as one PangoFontDescription string) - only a
      `.set` color is ever written, so an unset (still-native-theme)
      color doesn't clobber a previous session's own explicit pick with
      an absent value, matching the SETTINGS_INT_ABSENT idiom MIG-0122
      already established for window geometry.
    rationale: >
