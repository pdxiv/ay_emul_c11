      UPSTREAM SCHEDULER/TIMEBASE INVESTIGATION (user-requested
      continuation: move one level up from Timer A specifically and
      determine whether this port's CPU execution is racing ahead of the
      audio timebase itself, per the distinction "recorded cycles =
      cycles actually executed" does NOT prove "cycles executed = cycles
      warranted by rendered audio time"). Tested the leading hypothesis
      (uncarried scheduler debt/instruction-boundary overshoot) directly
      rather than assuming it, then found a materially new, system-wide
      clue that redirects the search.

      SCHEDULER-DEBT HYPOTHESIS - TESTED, NOT THE DOMINANT MECHANISM:
      engine/atari_emulate.c's design recomputes every deadline (`min =
      base_vbl + vbl_period - od`, and each MFP timer's own `t->base +
      t->delay - od`) freshly from LIVE a->cycle_count at the top of
      EVERY atari_emulate_step call - since cycle_count itself already
      includes any prior overshoot (it is simply incremented by the
      honest `used` value every call, never reset or separately
      tracked as a "budget"), any instruction-boundary overshoot is
      automatically absorbed into the next deadline computation for
      free. This architecture has no separate persistent "budget" or
      "debt" variable that COULD lose a remainder - the design is
      structurally different from (and not vulnerable to) the classic
      "budget -= consumed; clamp at 0" pattern that discards debt.
      Measured the actual overshoot distribution from the existing 30s
      AY_ENGINE_STEP_TRACE capture (302,832 steps) to confirm rather than
      assume: 179,708 steps show used>min (positive overshoot, summing to
      2,715,982 cycles, mean +15.1/occurrence - consistent with roughly
      one instruction's cost, as expected since a call can only overrun
      by finishing its in-flight instruction); 4,660 steps show used<<min
      (large early exits when an interrupt cuts a speculative large
      budget short). The positive-overshoot sum (2.7M) is superficially
      close in order of magnitude to the 3.2M gap, but this alone doesn't
      implicate it as the CAUSE: MIG-0056's earlier min=1-dispatch-
      guarantee A/B test (which controls the single largest source of
      small, overshoot-prone calls - 54.8% of all steps request min=1)
      already measured directly that disabling it only changes the final
      total by 70,531 cycles (2.2% of the gap) - if per-call overshoot
      were the dominant mechanism, eliminating the majority of small-
      budget calls should have removed most of the 2.7M, not 2.2% of the
      gap. This measured result, not just the structural argument above,
      is why uncarried debt is assessed as real but non-dominant, not
      ruled out by assumption.

      TIMER A RESTART TRIGGER LOCATED: extended AY_ENGINE_TIMERA_TRACE to
      also record PC/A6/D0 at each Timer A control-register write (engine/
      mfp.c's trace_log_timera, kept as permanent diagnostic
      infrastructure). Found: the STOP write (DM 1->0) executes
      consistently from PC=$004868 (with an alternate stop site,
      PC=$00482C, appearing later in the render - not investigated
      further, a second call site for the same logical action, not
      evidence of a bug); the RESTART write (DM 0->1, reprogramming
      DR=25 for a 325-cycle priming period before settling to DR=51/
      663-cycle steady state) executes consistently from PC=$0048DE. A6
      ($6228) and D0 ($4CE) are IDENTICAL across every observed
      restart, ruling out a per-restart-varying loop/index register as
      the trigger and pointing at fixed player-code logic, not
      per-invocation state. Measuring the actual INTERVALS between
      consecutive restarts (not assuming "roughly once per second" as
      the prior entry's shorthand had it) shows they are NOT evenly
      spaced: consecutive restarts cluster as close as ~960,000 cycles
      (0.12s) apart in bursts, separated by multi-second gaps with none
      at all (e.g. a ~47,000,000-cycle, ~5.9s gap observed directly in
      the trace) - consistent with a MUSIC-PATTERN/NOTE-EVENT-DRIVEN
      digidrum trigger (a real tracker-style player calling this from
      its per-row pattern-advance logic whenever a pattern row schedules
      a digidrum hit), not a fixed periodic clock. This rules out
      "Timer A has its own independent periodic re-trigger bug" as a
      category - the trigger is real player-code responding to musical
      content, and any given individual trigger's own correctness was
      not separately in question; what's in question is how many real
      seconds of content occur before 30 audio-seconds' worth of samples
      have been rendered.

      SYSTEM-WIDE SIGNATURE FOUND (the most significant new finding this
      pass): computed VBL's own assert rate per REAL RENDERED SECOND from
      the existing 30s AY_ENGINE_IRQ_TRACE/AY_EMUL_IRQ_TRACE captures -
      oracle: 5,994 VBL asserts over 1,440,256 rendered frames (30.005s
      at 48kHz) = 199.77 Hz; this port: 6,074 VBL asserts over 1,440,000
      frames (30.000s) = 202.47 Hz. The oracle lands almost exactly on
      the true 200Hz (matching vbl_period's own already-confirmed exact
      40,000-cycle/200Hz arithmetic); this port overshoots by +1.35% -
      essentially IDENTICAL in magnitude to the overall whole-render
      cycle-count excess (+1.353%) and to Timer A's own service-count
      excess (+3.1%, same direction, plausibly compounded rather than
      independent). VBL and MFP Timer A are structurally unrelated
      subsystems (different registers, different trigger logic, VBL
      driven purely by a fixed cycle_count modulus with no program
      involvement at all) - both showing the same-direction, same-order-
      of-magnitude excess proves this is NOT a Timer-A/digidrum-specific
      defect and NOT a per-instruction opcode-cost artifact (which would
      not manifest identically in a pure fixed-modulus counter like VBL
      with zero opcode execution involved in its own periodicity). Per
      the request's own divergence classification: this is a "timing-
      only" signature (the machine reaches equivalent audio output at a
      systematically different, and here MORE, elapsed-cycle cost), not
      a "functional state divergence" (no evidence of differing register/
      memory content driving the difference - VBL's periodicity involves
      no program-visible state at all) and not an "event-count
      divergence" in the sense of one extra spurious event (VBL's
      elevated RATE, not an isolated extra occurrence, is what's
      elevated). This decisively redirects the search: since VBL's own
      cycle-domain period is bit-exact, and Timer A's own formulas are
      bit-exact, and BOTH still fire proportionally more per REAL
      rendered second, the remaining defect must live in whatever
      RELATES cycle_count TO rendered audio-sample count - i.e. the
      audio-generation mechanism itself (ay_synthesizer_ay's tick
      accumulator, or the cadence at which it is invoked), not in any
      individual peripheral's own timing logic.

      NOT YET LOCATED WITHIN THIS PASS: a concrete defect in the audio-
      generation mechanism itself. ay_synthesizer_ay's tick-accumulator
      (Number_Of_Tiks, engine/ay.c) computes `tmp := number_of_tiks +
      (current_tact-previous_tact)*frq_ay_by_frq_z80`, only committing
      previous_tact forward on a successful (non-early-exit) update -
      this is, by construction, a monotonic linear accumulation that
      should be mathematically independent of how often it's called for
      a FIXED total elapsed cycle span (any call-frequency difference
      should only affect how finely the SAME total delta is split across
      calls, not the final accumulated total) - no overflow risk was
      found either (deltas are of order 10^3-10^5 cycles, ratio is
      ~2^27, products stay far below int64 range). frq_ay_by_frq_z80
      itself was already confirmed bit-exact (134,217,728, an exact
      power-of-2 relationship with no rounding ambiguity) in this entry's
      earlier section. Given the accumulator's own math appears sound on
      inspection, and time did not permit building the full dual-domain
      audio/cycle scheduler trace this request specifies (recording
      audio-frame index, cumulative target cycles, and accumulator state
      at every call), the search is narrowed but not concluded: the next
      concrete step is instrumenting ay_synthesizer_ay's OWN call
      frequency and per-call delta distribution against sample output,
      on both engines, to test whether call-cadence-dependent
      quantization in the accumulator (not the ratio, which is exact)
      is the final missing piece - not attempted here due to time.

