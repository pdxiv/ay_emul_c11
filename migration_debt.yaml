  - id: MIG-0093
    title: "Phase 5: .cue playlist support confirmed blocked on missing BASS-streaming-position playback, not a Phase-5 scope gap - traced end-to-end per the standing full-trace-first methodology"
    subsystem: gui
    state: behaviorally_incomplete
    summary: >
      Traced PlayList.pas's LoadCUE (~3898-4090) and its AddTrack/
      playback path end-to-end before attempting an implementation (the
      user's .ayl/.cue/.m3u request named .cue explicitly, so this
      wasn't assumed out of scope without evidence, unlike HeadEdit/
      encoptsedit's confirmed-out-of-scope trace outcomes). Each CUE
      "track" is a PlayListItem with a `Time` field (a start-offset in
      milliseconds into ONE shared underlying decoded audio stream,
      computed from the CUE sheet's INDEX timestamps, PlayList.pas
      ~3990-3998) which is applied at play time via `StreamPlayFrom :=
      FormatSpec` (PlayList.pas:745) - a BASS streaming-decoder seek-to-
      position call. This is a fundamentally different playback model
      than every format this port actually plays (a self-contained
      chiptune file decoded by its own engine from tick 0): CUE
      splitting only makes sense over a single continuous PCM/compressed
      audio stream (a ripped CD image or similar), decoded and
      positioned via BASS - a dependency this entire port has excluded
      since before Phase 5 began (README.md's Scope section).
    rationale: >
      Not a complexity-based deferral or an assumption from the
      dialog's/feature's apparent shape - the trace shows CUE support's
      actual playback mechanism is BASS-streaming-position-seek, an
      already-out-of-scope dependency, not merely "a generic missing
      capability this port could add." This is the same evidence
      standard MIG-0086/MIG-0086b (HeadEdit/encoptsedit) were held to.
    verification: >
      N/A - documents a completed trace and its conclusion (blocked on
      an already-excluded dependency), not a behavior to test. Grep
      evidence: `grep -n "StreamPlayFrom" ay_emul/*.pas` shows the only
      write site is PlayList.pas:745 inside PlayItem, immediately after
      a BASS stream is opened; `grep -n "function LoadCUE" ay_emul/
      PlayList.pas` confirms the CUE-specific parser at line 3898,
      whose only caller (PlayList.pas:1790) is Add_File's `FTS='CUE'`
      branch. If BASS-based streaming playback is ever brought into
      this port's scope in a future milestone (would itself need a
      README.md Scope revision first), this entry's trace - and the
      already-written CUE-sheet TOKEN-parsing logic shape (13 tokens:
      CATALOG/CDTEXTFILE/FILE/FLAGS/INDEX/ISRC/PERFORMER/POSTGAP/
      PREGAP/REM/SONGWRITER/TITLE/TRACK) - is the starting point.

  - id: MIG-0094
    title: "Phase 5: spectrum/amplitude visualizer (SensSpa/SensAmp) - full tick-accurate FillVis/VisPoints sampling ported into the synthesis loop, per the user's explicit \"implement this in the same way as the original PAS code does it\" instruction"
    subsystem: engine/ay, gui/visualizer, gui/mainwin
    state: validated
    summary: >
      Traced end-to-end before implementing (per the user's explicit
      request to build a real FFT/spectrum from scratch): despite the
      name, MainWin.pas's "spectrum analyzer" is NOT a real signal-
      domain FFT for AY-chip playback at all. RedrawVisSpectrum buckets
      each of the 3 AY channels' own TONE-PERIOD register into a
      log-scale bar position (CalculateSpectrumPoints/Spa_points) and
      uses the channel's AMPLITUDE register as that bar's height, with
      an envelope-aware amplitude/tone derivation (AYVisualisation's
      Calc block) applied once per sampled point.
      BASS_DATA_FFT8192 only appears in the separate BASS-decoded-
      stream path this port doesn't have and never will (out of scope).
      Given this finding, the user chose the faithful-port approach
      (no DSP/FFT code needed) over building a real signal-domain FFT
      as an enhancement beyond the original's actual behavior.

      A second scope question followed: the sampling mechanism itself
      (AY.pas: FillVis/VisPoints) is a tick-driven HISTORICAL RING
      BUFFER hooked into the synthesis loop, indexed by output sample
      count so the display time-aligns with the currently-audible
      sample (not a live-register-state read) - reproducing this
      exactly means a new hook in the shared synthesis hot path. The
      user chose full fidelity over the live-state-read alternative
      ("implement this in the same way as the original PAS code does
      it").

      Engine (engine/include/ay_engine/ay.h, engine/src/ay.c):
       - ay_vis_point (AY.pas: TVisPoint, TSMode's R[1] dropped per
         this port's own single-chip scope, MIG-0007) and a fixed
         256-slot ring buffer (AY_VIS_POINTS_CAP) embedded directly in
         ay_engine (no heap alloc/free path needed).
       - ay_engine_init_vis(e, sample_rate, latency_seconds) computes
         VisStep/VisPosMax/VisTickMax (MainWin.pas:1737-1741), with
         this port's own configured ALSA output latency (tools/
         ay_player/src/alsa_output.c's 200ms snd_pcm_set_params
         argument) standing in for the original's BufferLength*
         NumberOfBuffers (a DirectSound multi-buffer concept this
         port's simpler architecture doesn't have an exact analogue
         of - both express the same "how much output latency exists"
         quantity VisPosMax's sizing actually needs).
       - The FillVis hook (AY.pas:679-680: `if NOfTicks = VisPoint then
         FillVis; Inc(NOfTicks)`) is inserted into ay_synthesizer_
         stereo16's inner sample-writing loop (the one function every
         format's stereo16 output already funnels through, confirmed
         by tracing all 4 of AY.pas's Synthesizer_Stereo16/Stereo8/
         Mono16/Mono8 variants share this exact same NOfTicks/FillVis
         pattern - only Stereo16 was hooked, since it's the only one
         any caller in this port ever uses, matching the already-
         recorded MIG-0009 scope boundary for the unused 8-bit/mono
         paths) - gated by `vis_pos_max != 0`, a no-op whenever
         ay_engine_init_vis was never called (ay_engine_init's default
         state), so every existing caller (every oracle-diff/WAV-sweep/
         CLI-tool test) is byte-for-byte unaffected.
       - ay_engine_get_vis_point(e, smp) reproduces AYVisualisation's
         CurVisPos lookup (`smp mod VisTickMax div VisStep`) and its
         lazy, memoized per-slot Calc transform (the envelope-shape-
         aware amplitude/tone derivation, including the sawtooth-
         envelope special-casing for envelope shapes 8/10/12/14 and
         the near-silence high-pitch edge case) - reproduced exactly,
         arithmetic unchanged from the original.

      GUI (gui/include/gui/visualizer.h, gui/src/visualizer.c, wired
      into gui/src/mainwin.c):
       - gui_visualizer_init computes Spa_points once from a fixed
         AY_FreqDef (1773400, settings.pas) rather than each loaded
         file's own actual chip clock - a documented simplification
         affecting only the cosmetic frequency-axis bar positions.
       - gui_visualizer_tick (called from a new separate 30ms timer,
         matching VisTimerPeriod, independent of the existing 200ms
         on_timer so that cadence stays unchanged) reproduces
         RedrawVisSpectrum's bucketing and the subtle bar-vs-peak-
         marker distinction correctly identified from a careful
         re-reading of the original (the BAR tracks the instantaneous
         bucketed value; a separate falling PEAK MARKER dot, decaying
         by (MaxVal+1) div 16 = 2 per frame, only appears when the
         previous frame's decayed peak is still above the current
         value) - easy to get backwards from a surface reading of the
         original's in-place PSpa_Piks/PSpa_Prev pointer-swap reuse,
         called out explicitly in the port's own code comments.
       - gui_visualizer_draw renders both the amplitude bars (columns
         1/8/15 within the amp box) and spectrum bars/peak markers at
         their fixed skin-window coordinates (spa_x=26,y=34,
         width=65,height=20; amp_x=50,y=18,width=17,height=15,
         MainWin.pas:43-54) directly onto the freshly-redrawn base
         skin bitmap each frame (no separate BMP_Sources background-
         restore buffer needed, since this port's on_expose already
         redraws the whole skin fresh every frame).
       - gui_visualizer_handle_click reproduces ButSpaClick/
         ButAmpClick's toggle behavior, wired into mainwin.c's existing
         on_button_press hit-test chain.
       - do_load_song calls ay_engine_init_vis on every song load
         (each load creates a brand-new, vis-disabled-by-default
         ay_engine - gui_playback_load_song builds an entirely new
         player).
    rationale: >
      Per the user's explicit two-part instruction: build a from-
      scratch FFT/spectrum implementation, revised after the trace
      showed the original doesn't actually use one for AY-chip
      playback (confirmed with the user before proceeding, since this
      materially changed the scope of work); then, for the sampling
      mechanism specifically, full tick-accurate fidelity over a
      simpler live-state-read approximation (also confirmed with the
      user before proceeding, since it meant touching the shared
      synthesis hot path rather than just reading engine state from
      the GUI layer).
    verification: >
      `cd engine && make clean && make` and `cd gui && make` both
      clean (zero new warnings). A REAL regression was caught and
      fixed during this entry's own verification: engine/Makefile's
      generic `%.o: %.c` rule has no header-dependency tracking, so
      editing ay.h (embedded in every one of the 18 format structs via
      `ay_engine ay;`) without a full `make clean` left fls_file.o/
      stc_file.o/sqt_file.o stale, compiled against the OLD (smaller)
      ay_engine layout while ay.o itself was rebuilt against the NEW
      layout - an ABI mismatch between translation units that
      corrupted PCM output for exactly those 3 formats (confirmed via
      bisection: reverting the engine loop hook alone did not fix it;
      reverting the ay.h struct addition did; a `make clean && make`
      full rebuild fixed it without any code change - proving the
      actual C11 port logic was correct all along, only the stale-
      build artifact was wrong). Full regression suite re-confirmed
      clean AFTER the full-clean-rebuild fix: run_diff.sh 60/60;
      corpus_wav_md5_sweep.sh 75/0/1-known/0; tools/ay_player/
      smoke_test.sh full pass - zero tolerance held throughout, this
      was caught and fixed before being reported as done, not
      discovered afterward.
      A standalone engine-level driver loaded a real corpus file
      (MetalMania.ay), called ay_engine_init_vis, ran 50 real
      player_make_buffer chunks, and confirmed: vis_step/vis_pos_max/
      vis_tick_max computed to sensible values (480/21/10080 at
      48kHz/200ms), mk_vis_pos advanced past 0 (proving FillVis
      actually fired during real synthesis), and every sampled vis
      point showed real, varying tone-period/amplitude values matching
      actual playback (not zeros or garbage). A second standalone
      driver exercised gui_visualizer_tick/draw/handle_click directly:
      spa_points descended correctly (log-scale bucket table), real
      amplitude bars and spectrum bars/peak-markers lit up with
      nonzero values, and click-toggle correctly toggled spectrum_
      checked only when the click fell inside the spectrum region
      (not outside it). A real single-window screenshot (via xwininfo
      + `import -window <id>`, not a root-window capture) of the
      actual running app playing MetalMania.ay confirms the amplitude
      bars visibly render and change height between two captures a
      couple seconds apart (the spectrum bars are visually subtle at
      screenshot resolution - 1px-wide marks in a 65x20 region against
      dark skin art - but independently confirmed correct via the
      standalone driver above). Full regression suite re-confirmed
      clean one final time after all changes; 10/10 repeat full-app
      runs clean under `timeout`.
    debt:
      - Spa_points' log-scale bucket boundaries use a fixed AY_FreqDef
        (1773400) rather than each loaded file's own actual chip
        clock - affects only the cosmetic frequency-axis bar
        positions, not the underlying sampling/derivation mechanism.
      - The oscilloscope/SensTime time-display-mode toggle (cycling
        elapsed/remaining/total time display) is not ported - tied to
        a separate time-digit-strip rendering feature (BMP_Time) this
        port doesn't have at all yet, unrelated to the spectrum/
        amplitude visualizer itself.
      - Spectrum/amplitude hit-test zones use simple rectangular
        bounding boxes; MoveWin's own drag-zone hit-test in the
        original is checked independently (not mutually exclusive
        with SensZone hits) via separate linked-list walks, so a
        handful of pixels where the two original zones overlap
        (x 84-91, y 18-22) would trigger both a drag AND a toggle in
        the real app - this port's single if/else-if hit-test chain
        (already established before this entry, for every other zone)
        picks one, not both, for that small overlap area.

  - id: MIG-0095
    title: "Phase 5: Tools.pas (TFrmTools) - the genuinely portable subset (default folder, visualizer sample period, runtime skin switching), everything else confirmed out of scope by full trace"
    subsystem: gui/tools_win, gui/mainwin
    state: validated
    summary: >
