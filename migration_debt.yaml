      PACKED-VARIANT-RECORD AUDIT (addressing the request's concern that
      the Number_Of_Tiks bug pattern - a full-value reset where Pascal
      only clears one aliased half - might recur elsewhere): searched
      AY.pas for every packed variant record sharing the same `.Hi`/
      `.Lo`/`.Re` aliasing shape. Found five others: Ton_Counter_A/B/C
      and Noise_Counter (Lo:word/Hi:word aliased as Re:longword),
      Envelope_Counter (Lo/Hi:dword aliased as Re:int64), and Tik
      (Lo/Hi:word aliased as Re:integer, this is AY.pas's Tik.Re = this
      port's e->tik_re, distinct from Number_Of_Tiks). For each, checked
      every access site: Ton_Counter_A/B/C and Noise_Counter are read/
      written EXCLUSIVELY via `.Hi` for steady-state operation (inc/
      compare/reset-to-0, AY.pas:338-360) and exclusively via `.Re` for
      the genuine full chip-reset (AY.pas:923-926) - `.Lo` is NEVER
      separately referenced anywhere, meaning it stays permanently 0 and
      contributes no state; a full-vs-partial-reset distinction is
      therefore immaterial for these four (already effectively safe,
      matching the previously-documented Tick_Counter finding).
      Envelope_Counter: identical pattern (AY.pas:363-366,382 use only
      `.Hi`; AY.pas:922 uses only `.Re` for full reset; `.Lo` never
      separately read). Tik: `.Hi`/`.Lo` are NEVER separately accessed
      anywhere in AY.pas - only `.Re` (this port's tik_re) is ever used,
      so no partial-clear operation exists to translate incorrectly.
      Conclusion: Number_Of_Tiks was the UNIQUE case among this file's
      packed variant records where (a) a partial-field clear operation
      exists in the source AND (b) the other aliased half carries real,
      load-bearing state consumed elsewhere - the audit found no second
      instance of this specific defect pattern. Also checked atari.pas:
      its own local `N_Of_Tiks` variable in SynthesizerSNDH (atari.pas:
      1790-1821) is the same packed shape but writes back into the
      SAME shared global Number_Of_Tiks/calls the SAME Synthesizer_
      Stereo16 already fixed - already covered by this fix, not a
      second site.

