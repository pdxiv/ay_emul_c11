  - id: MIG-0132
    title: "Build-time .lfm-to-C generation for widget CONSTRUCTION (pilot: GBChAmp's 9 amplitude sliders) - tools/lfm_gen/lfm_gen.py's --widgets-only mode, per explicit user request after MIG-0131's orientation bug"
    subsystem: "tools/lfm_gen, gui/mixer_win, gui/Makefile"
    state: translated
    summary: >
      Directly prompted by MIG-0131's own vertical-vs-horizontal-slider
      bug (found by the user, not this session's own verification pass -
      see that entry's own summary): hand-transcribed `.lfm` widget
      properties can silently drift from the real Pascal source with
      nothing to catch it. User's proposal: generate the GTK widget
      *construction* code from `Mixer.lfm` at build time, so this class
      of bug becomes structurally impossible.

      Not a new idea for this codebase - `tools/lfm_gen/lfm_gen.py`
      already existed (a "Phase 5 kickoff" `.lfm`-to-C skeleton
      generator, PORTING_TO_C11_LINUX.md §5.1), and `gui/Makefile`
      already had a proven, working build-time-codegen pattern
      (`tools/gen_bin_c.sh` turning `assets/*.ays`/`assets/*.bmp` into
      `build/generated/*.c`, gitignored, regenerated every build). But
      `Mixer.pas` was explicitly excluded from the original generator's
      scope (§5.1 covers "the standard dialogs...except MainWin.pas/
      PlayList.pas"; PHASE5_GUI_PROGRESS.md separately notes Mixer.lfm's
      own generated skeleton is "1,592 lines - too large to use as a
      hand-completion starting point"), and that generator only handled
      4 widget types with full self-contained GtkFixed-layout + signal-
      stub generation meant to be hand-completed ONCE, not regenerated
      every build - neither fits a window with 13+ real widget types and
      an already-hand-tuned idiomatic GTK2 layout deliberately NOT
      mirroring `.lfm`'s own anchor-based coordinates.

      Key design decision (this entry's own, explored via plan mode with
      the user before implementation): scope the generator to widget
      *construction* only - type, orientation (decided from Width/
      Height for TTrackBar - the exact property MIG-0131's bug got
      wrong), Caption/Text, Min/Max/Position, Checked, Hint→tooltip,
      ReadOnly/ Enabled, and radio-button grouping (Mixer.lfm has no
      explicit GroupIndex anywhere - grouping is purely "consecutive
      TRadioButton siblings under one parent", the exact rule every
      hand-written radio group in mixer_win.c already follows) - never
      parenting (gtk_container_add/gtk_box_pack_start/gtk_table_attach)
      and never signal-wiring (g_signal_connect). Both of those stay
      100% hand-written, for two reasons: (1) this file's own layout is
      deliberately idiomatic GTK2, not a translation of `.lfm`'s anchor
      graph (already flagged in §5.1 as "a real translation problem, not
      a lookup-table job"); (2) this port already CONSOLIDATES many
      near-identical per-widget Pascal handlers into single shared C
      functions (e.g. one on_srate_toggled for all 6 sample-rate
      radios), which has no 1:1 mapping back to `.lfm`'s own one-
      handler-per-widget model.

      Mechanically: `tools/lfm_gen/lfm_gen.py` gained a `--widgets-only
      <input.lfm> <output_basename>` mode (the original mode is
      unchanged, still the default) reusing the same parser this
      session's own tools/lfm_analyze/lfm_analyze.py independently
      re-derives (both read the identical `.lfm` object/property
      grammar, cross-validating each other). It emits `<basename>.h`
      (a flat `struct { GtkWidget* <LfmObjectName>; ... }`, one field
      per named constructible widget, field name = the `.lfm` object's
      own name verbatim - e.g. `TBAmpAL`, `RBSR48k` - for 1:1
      traceability back to the real source) and `<basename>.c` (one
      `<basename>_create(<struct>*)` function). `gui/Makefile` wires
      this in via a new rule mirroring the existing `$(GEN_DIR)/
      default_skin.c` pattern exactly, landing in the same gitignored
      `build/generated/`, plus a new `$(OBJ): | $(GEN_DIR)/
      mixer_win_gen.h` order-only prerequisite (the header is #included
      directly by hand-written code, not just referenced via a .c file
      already in the object list, so its mere existence needs
      guaranteeing before ANY compile, not just its own).

      Migrated `gui/src/mixer_win.c`'s GBChAmp block (the exact 9-slider
      groupbox MIG-0131's bug lived in) as the pilot slice:
      `gui_mixer_win_create` now declares a local `mixer_win_gen gen;`,
      calls `mixer_win_gen_create(&gen)` once, and does thin alias
      assignments (`w->scale_al = gen.TBAmpAL;` etc) instead of calling
      `gtk_hscale_new_with_range(...)` directly - `gen` is NOT stored on
      `w` (no header-coupling issue: gui_mixer_win.h stays completely
      unchanged, only mixer_win.c itself needs the generated header).
      `make_channel_slider` (which used to both construct AND pack/wire
      each slider) is now `wire_channel_row` (packs/wires only, taking
      already-built `scale`/`entry` widgets). Every line of packing,
      signal-connecting, and business logic (apply_and_recalc, on_sync_
      timer) is UNCHANGED - they already referenced `w->scale_al` etc by
      name, never by how it was constructed.

      One real wrinkle found and handled: 3 of the 9 sliders' (Beeper/
      DMA/Preamp) real `.lfm` `Position` values are all `255` - a
      Lazarus form-editor leftover, NOT their real settings.pas runtime
      default (146/146/127, already established by MIG-0106/MIG-0123/
      MIG-0131). `wire_channel_row` gained an `override_initial`
      parameter for exactly this (-1 keeps the generated `.lfm` value,
      used for the other 6 sliders whose Position already matches their
      real default) - the generator itself stays a faithful, un-opinion-
      ated mirror of the `.lfm`; deciding when a `.lfm` design-time
      value isn't the real runtime default is a judgment call that
      correctly stays on the hand-written side.

      Full Mixer.lfm coverage was implemented in the generator itself
      (all 13 real widget types it needs, plus TBevel-skip) even though
      only GBChAmp is migrated to USE it yet - the generated struct has
      ~190 fields, ~9 of them referenced by gui/src/mixer_win.c so far,
      the rest simply unused. This was a deliberate choice: proving the
      generator handles the WHOLE file (not a hand-picked easy subset)
      is a stronger test of its generality than only feeding it
      GBChAmp's own XML/object subtree would have been.
    rationale: >
      state: translated, not validated - this is pure GUI-construction
      plumbing with a real code-behavior change (a build-time dependency
