  - id: MIG-0108
    title: "Phase 5: CheckLoopAndStop (natural end-of-song) ported to the 12 remaining tracker formats (PT1, PT2, GTR, FLS, STC, STP, FXM, PSM, ASC, ASC0, FTC, PSC, SQT), closing the half of MIG-0101's own pilot the other formats never got, per the user's explicit \"fully implement CheckLoopAndStop... using the approach used in the original pascal code\" instruction"
    subsystem: "engine/formats (pt1,pt2,gtr,fls,stc,stp,fxm,psm,asc,ftc,psc,sqt), engine/player, tests/oracle_diff, tools/ay_player"
    state: validated
    summary: >
      Follows PT3's own MIG-0101 pilot template exactly, applied to the
      12 formats that pilot deliberately left as follow-up work (17
      call sites' worth of `ay_synthesizer_stereo16`/`number_of_
      channels=2` boilerplate had already been generalized under
      MIG-0107 for an unrelated reason, but the CheckLoopAndStop gate
      itself - Players.pas:8730-8746 - was never added to any of these
      12 formats' tick loops, only informational Global_Tick_Max/
      Global_Tick_Counter fields from MIG-0103/MIG-0104's separate
      identify_ay_file-focused work).

      Per format: added `bool do_loop;`/`bool real_end_all;` struct
      fields (engine/include/ay_engine/formats/<fmt>_file.h), initialized
      false in <fmt>_file_load right alongside the existing
      <fmt>_get_time call, and inserted the actual check as the first
      statement inside <fmt>_file_make_buffer's tick loop (matching
      pt3_file_make_buffer's own hoisted-into-make_buffer shape, not
      Pascal's literal "top of Get_Registers" placement - functionally
      identical since nothing else touches global_tick_counter between
      one <fmt>_get_registers call ending and the next starting):
      `if (global_tick_max > 0 && global_tick_counter >= global_tick_max)
      { if (do_loop) { counter = max; } else { real_end_all = true;
      break; } }`. Force_Loop (Pascal's TS-pair "continue playback of
      the shorter module" case) and the `CNum` chip-pair index both
      collapse away, same as PT3's own port, since this port is
      single-chip only (MIG-0007) - confirmed no new design questions
      remained once PT3's template existed. Each format's own
      Get_Registers comment (previously "(minus CheckLoopAndStop -
      matches this project's other tracker-format ports' own
      precedent)") was updated to point at the new make_buffer-level
      check instead of claiming the gap still exists.

      player.c: player_real_end_all and player_set_do_loop gained a
      real case for all 12 (previously `return false`/no-op with a "no
      real_end_all concept" comment for 11 of them).

      REAL FINDING for PSM: traced Players.pas:12213-12222 directly and
      confirmed PSM_Get_Registers calls CheckLoopAndStop FIRST, then
      increments Global_Tick_Counter, then separately checks its own
      `if Finished then exit` - i.e. CheckLoopAndStop/Real_End_All and
      Finished are two genuinely independent mechanisms in the real
      Pascal, not one superseding the other. Traced further into
      MakeBufferTracker (Players.pas:12301-12317, the buffer-fill loop
      wrapping every tracker format's Get_Registers) and confirmed it
      ONLY consults Real_End_All (set exclusively by CheckLoopAndStop) -
      never Finished directly. This means this port's PRE-EXISTING PSM
      wiring (player_real_end_all returning p->as.psm.finished, added
      informally with no dedicated ledger entry, before CheckLoopAndStop
      existed for PSM at all) was not fully faithful: Finished alone
      freezes PSM's own pattern-walk state (amplitudes already zeroed
      just before the check) but does NOT by itself end playback in the
      original - the song goes silent but keeps "playing" (from
      MakeBufferTracker's perspective) until Global_Tick_Counter
      separately catches up to Global_Tick_Max. Corrected
      player_real_end_all's PSM case to return p->as.psm.real_end_all
      (matching every other format) instead of p->as.psm.finished,
      documented in both player.c and psm_file.h's own `finished` field
      comment.

      Test-harness fix (the same one PT3's own port needed, confirmed
      necessary in advance by grepping `Global_Tick_Max := MaxInt` in
      OracleHarness.pas - 28 occurrences, one per Run<FMT>FileTest
      including all 12 of these): every one of these 12 formats' real
      Pascal oracle scenarios runs with a sentinel Global_Tick_Max that
      never naturally stops, same as PT3's own RunPT3FileTest did before
      MIG-0101. Added `--ignore-end` to all 12 of tests/oracle_diff/
      corpus_wav_md5_sweep.sh's format lines (matching the pre-existing
      `*.pt3` line's own shape) and `f.do_loop = true;` (with the same
      explanatory comment PT3's own run_pt3_file has) to all 12 new
      run_<fmt>_file functions in tests/oracle_diff/dump_engine_state.c
      - both needed so this port's own regression tests, which now
      genuinely stop early for any corpus file shorter than the fixed
      comparison window, keep matching the oracle's own never-stops
      sentinel behavior rather than producing a new false failure.
      tests/oracle_diff/run_diff.sh's own parallel wav_export gates for
      these 12 formats were checked and left unchanged - like its own
      PT3 gate, they use a small curated set of corpus files whose real
      durations already exceed each test's fixed window, so no bypass
      was needed there (confirmed, not assumed - see verification).
      tools/ay_player/src/main.c's own doc comment (which previously
      only named YM/SNDH/VTX/PT3 as having real_end_all support) was
      corrected to include all 12.
    rationale: >
      Direct continuation of MIG-0101's own pilot, per the user's
      explicit "please fully implement CheckLoopAndStop, and the other
      gaps you mentioned just now using the approach used in the
      original pascal code for this" instruction - PT3's port was
      always framed as a template for the other 13 (MIG-0101's own
