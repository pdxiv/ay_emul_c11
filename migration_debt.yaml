  - id: MIG-0104
    title: "GetTimeSQT and GetTimeFXM ported into engine/, closing the SQT/FXM gap MIG-0103 deferred; SQT now also wired into identify_ay_file's IntegrityCheck (FXM stays unwired, matching PSM's precedent)"
    subsystem: "engine/formats (sqt, fxm), tools/identify_ay_file"
    state: translated
    summary: >
      User explicitly asked to complete the two formats MIG-0103
      deferred. Both ported via a dedicated agent each (isolated
      worktrees, same as MIG-0103's batch), given their size/risk
      relative to the other ten - each got individual, careful
      attention rather than being bundled into a larger batch.

      GetTimeSQT (Players.pas:15889-16679, ~790 lines): three near-
      identical (not code-shared in the Pascal original) per-channel
      opcode-walk blocks, each with genuine cross-iteration carry-over
      state (booleans/word cursors declared once at function scope,
      read on a later outer-loop iteration without being re-set on
      every pass - verified this is real, intentional Pascal behaviour,
      not an uninitialised-read bug, by tracing exactly when each such
      variable is set vs. read) and two non-obvious operator-precedence
      readings (`byte(Index[pptr] * 2)` truncates to 8 bits before use
      as an offset; `X and 15 - 1` parses as `(X and 15) - 1`, since
      Pascal's `and` on integers is multiplicative-tier, binding tighter
      than the additive `-`). Verified the three channel blocks are
      logically identical modulo variable names (including a subtle
      surface difference - channel 1 spells its high-nibble case test
      `Index[cptr] in [$a0..$bf]`, channels 2/3 spell the same
      constraint `not (Index[cptr] in [$80..$9f])` - confirmed
      equivalent given the enclosing `$80..$bf` case) and consolidated
      them into one parameterized helper set rather than tripling the
      code, a deliberate deviation from the literal Pascal structure
      documented inline. Matched the real Pascal oracle EXACTLY on the
      first attempt (global_tick_max=1920, loop_tick=640 for
      MotorAnimation.sqt) - no debugging iterations needed.

      GetTimeFXM (Players.pas:14422-14950, ~528 lines): a nested helper
      function (`FXM_Loop_Found`, cycle-detection in the three channels'
      bytecode-VM state) plus an outer procedure of the same shape,
      both built around Pascal's unbounded `SetLength`-grown per-channel
      call/loop stacks (`fxms1`/`fxms2`/`fxms3`). Rather than inventing
      a new bounded-array convention, reused the EXACT ONE already
      established by this same file's real, oracle-validated playback
      port for the identical problem (`fxm_channel.stek`/`stek_len`,
      `FXM_STEK_MAX`=256, documented there as "a deliberate, documented
      bound... no real corpus file approaches it") - local fixed-size
      stacks scoped to the new duration-precompute functions. Matched
      the real Pascal oracle EXACTLY on the first attempt
      (global_tick_max=3808, loop_tick=0 for The_Last_V8.fxm) - no
      debugging iterations needed; specifically verified loop_tick=0 is
      a genuine "loop found at tick 0 of the replay-from-start scan"
      result (via temporary debug instrumentation confirming the
      loop-detection path is reached and returns found=true), not a
      dead code path that never ran.

      tools/identify_ay_file wiring: SQT is part of Players.pas's real
      Module_Detector chain (FoundSQT is called there, and
      detect_sqt_structural already existed from MIG-0023b), so
      dispatch.c's scan_whole_file_module_detector now wraps it with
      `confirm(..., integrity_check_sqt, ...)` exactly like the other
      11 formats - confidence upgrades to "definite" once confirmed.
      FXM is NOT wired in: Players.pas's Module_Detector never calls
      FoundFXM at all (FXM is Tier-A-only in the real program, already
      documented in dispatch.c's top comment before this entry), so
      there is no structural match for an IntegrityCheck to confirm in
      the first place - the new fxm_get_time port exists purely for
      engine/-side completeness/consistency with the other formats,
      matching PSM's pre-existing precedent (GetTimePSM is ported but
      also unused by identify_ay_file, same reason).

      This closes MIG-0103's SQT/FXM deferral: all 15 structural-tracker
      formats identify_ay_file's Module_Detector fallback handles now
      have their engine/ side of the story as complete as it can be
      (13 with a real GetTimeXXX port; ST1/ST3/STF have no engine/ port
      of any kind, a separate, larger, unrelated gap - see
      engine/include/ay_engine/formats/stc_file.h's file comment), and
      12 of those 13 (all but PSM/FXM, both Tier-A-only) are now wired
      into identify_ay_file's real IntegrityCheck confirmation.
    rationale: >
      Not closed as validated, same bar as MIG-0103: both new ports
      matched the real Pascal oracle exactly on the one real corpus
      sample available per format (SQT, FXM), but broader differential/
      fuzz coverage per format (multiple real files, not just one each)
      hasn't been done - only one `.sqt` and one `.fxm` file exist in
      test_corpus_76/ today, so there was no second sample to
      triangulate against during development, and none to add for
      ongoing regression coverage either. The abandoned
      identify_file_slide oracle gate and the full sliding-scan-plus-
      IntegrityCheck pipeline oracle-diff remain the same open,
      unresolved follow-up work MIG-0023b/MIG-0103 already left open -
      unaffected by this entry either way.
    verification: >
      Builds clean (-std=c11 -Wall -Wextra[-Wpedantic] -O2, zero
      warnings) across engine/ and tools/identify_ay_file/.
      tests/oracle_diff/run_diff.sh: zero [FAIL] lines, 60 [PASS]
      (including byte-identical PCM/WAV playback for sqt_file/fxm_file,
      confirming the new duration-precompute code doesn't disturb
      existing playback behaviour).
      Direct oracle cross-check (AY_EMUL_ORACLE=get_time): SQT and FXM
      both match the real Pascal oracle EXACTLY (MotorAnimation.sqt:
      1920/640; The_Last_V8.fxm: 3808/0) - re-verified together in the
      merged tree via an ad-hoc combined test harness, same exact
      results.
      identify_ay_file corpus cross-check (real corpus files, extension
      stripped, run through the true Module_Detector sliding-scan
