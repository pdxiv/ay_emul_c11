  - id: MIG-0091
    title: "Phase 5: .ayl (native) and .m3u playlist load/save - a real-syntax-compatible SUBSET of PlayList.pas's SaveAYL/LoadAYL, plus the original's own simple M3U writer/reader"
    subsystem: gui/playlist, gui/playlist_win
    state: validated
    summary: >
      Added gui_playlist_save_ayl/load_ayl and gui_playlist_save_m3u/
      load_m3u (gui/include/gui/playlist.h, gui/src/playlist.c), wired
      into gui/src/playlist_win.c: a new "Save..." button (GtkFileChooser
      SAVE with an AYL/M3U filter choice, matching SBSaveClick's own
      FilterIndex 1/2 split) and extension-based dispatch in the
      existing "Add Files"/drag-drop/replace-with-path paths (a .ayl/
      .m3u/.m3u8 path loads its OWN entries rather than being probed as
      a chiptune, matching Add_File's FTS='AYL'/'M3U' branches).

      .m3u is a full, faithful port of the real (very simple) format:
      one file path per line, no header/metadata at all - confirmed
      directly from SBSaveClick's own M3U writer, which is exactly
      `for each item: Writeln(FileName)`. Load skips a leading
      `#EXTM3U` marker and any `#EXTINF:` line (their Title/Time hint
      isn't used - this port's own real per-file metadata extraction,
      MIG-0072/0075/0082/0083, is authoritative).

      .ayl is a real-syntax-compatible SUBSET of SaveAYL/LoadAYL - see
      gui/include/gui/playlist.h's own extensive header comment for the
      itemized list of what's written/read (Name/Author/Program/
      Tracker/Computer/Date/Comment/ChipType/ChannelsAllocation/
      ChipFrequency/PlayerFrequency, exactly the fields gui_playlist_
      overrides already models) vs. recognized-but-ignored (every other
      real token, so a real .ayl file loads without erroring) vs. not
      supported at all (the PLDef global-defaults header block, "ts"
      Next-linked subitem chains, and multi-song `.ay` entries beyond
      song_index 0 - see below).
    rationale: >
      Continuing Phase 5 per the user's explicit request for .ayl/.cue/
      .m3u load/save. Full-trace-first review of SaveAYL/LoadAYL (~560
      combined Pascal lines: a versioned/UTF8-toggling token grammar,
      a PLDef global-defaults header block, ConvCR backslash-escaping,
      and "ts" Next-linked subitem chains for a feature never fully
      identified in this pass) showed a byte-for-byte reimplementation
      would be a substantially larger, separately-scoped effort than
      the rest of this session's work combined - the SUBSET approach
      here covers every field this port's own data model (gui_
      playlist_overrides) actually has, in the real file syntax/token
      names/version-string (so real .ayl files load, and files this
      port writes are inspectable/mostly-compatible), while being
      explicit about the rest rather than guessing at the undocumented
      "ts" mechanism or silently approximating the PLDef block's
      semantics.
    verification: >
      `cd gui && make` clean (-std=c11 -Wall -Wextra -Wpedantic, zero
      new warnings). Full regression suite re-confirmed clean (60/60,
      75/0/1-known/0, full smoke pass); 10/10 repeat full-app runs
      clean under `timeout`. A standalone round-trip driver built a
      playlist from two real corpus files (MetalMania.ay, a 12-subsong
      file, and DEMON.pt1), set a full set of overrides (author,
      multi-line comment, chip-type, channel-mode preset, both
      frequency overrides) on the first entry, saved to both formats,
      and reloaded each: .ayl reload correctly recovered every override
      value on the first entry bit-for-bit (including the embedded
      newline in Comment, confirming the ConvCR-equivalent escape/
      unescape round-trips correctly) and correctly reproduced the
      documented multi-song collapse-to-song-0 behavior (12-subsong file
      -> 1 written line -> reloads as its own full 12-subsong expansion
      again, but only entry 0 carries the saved overrides, entries 1-11
