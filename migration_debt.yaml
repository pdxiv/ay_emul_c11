  - id: MIG-0086
    title: "Phase 5: HeadEdit.pas traced end-to-end (per explicit user request, not deferred on apparent complexity) - it exclusively serves VTX/YM6 file CONVERSION, a feature category already out of this port's scope since before Phase 5 began; nothing to port"
    subsystem: gui
    state: behaviorally_incomplete
    summary: >
      Full trace of every THeaderEditor caller (not assumed from the
      dialog's own field list, which suggested per-playlist-item
      metadata/settings editing - the trace shows this reading was
      wrong): THeaderEditor is `uses`d by exactly one unit in the whole
      codebase, Convs.pas (confirmed via grep across every .pas file,
      not just Convs.pas's own uses clause) - specifically its
      VTX_Header_Editor (183-224) and YM6_Header_Editor (226-262)
      helper procedures. Both are called from exactly one place each:
      VTX_Header_Editor from VTX_Converter (897-1027ish, only when
      Silent=False), YM6_Header_Editor from YM6_Converter (1065-1218ish,
      same condition). Both Converters build a NEW file's header record
      (TVTXFileHeader/TYM5FileHeader) from the CURRENTLY-PLAYING file's
      own already-known properties (ChType, AY_Freq, Interrupt_Freq,
      LoopVBL, CurItem.Title/Author/Programm), show THeaderEditor
      pre-filled with those values purely so the user can tweak the
      OUTPUT file's header before it's written to disk (BlockWrite'd a
      few lines later), then discard the dialog entirely - nothing it
      collects is written back to the currently-playing file, the
      playlist item, or any persistent per-file settings store.
      VTX_Converter/YM6_Converter are themselves reached from exactly
      one place, PlayList.pas:836-837's PlayItem dispatch on
      TPlayWay=pwConvVTX/pwConvYM6 - the playlist's own "Convert to
      VTX"/"Convert to YM6" popup-menu commands.
    rationale: >
      Format conversion beyond WAV (which VTX/YM6 export both are) has
      been explicitly out of this port's scope since README.md's
      original Scope section - "non-WAV export... are all out of
      scope" - written before Phase 5 (or this session) began, not a
      judgment call made here; MIG-0071 already independently
      documented the same exclusion when the playlist's popup-menu
      conversion commands (which is how a user would even reach
      VTX_Converter/YM6_Converter) were scoped out. Confirmed no VTX/
      YM6-writing code exists anywhere in this port already (grep
      across engine/ and tools/ay_player/ found none). Given the trace
      shows HeadEdit has no connection whatsoever to playback engine
      state, persistent playlist metadata (MIG-0071/0072/0075/0082/
      0083's own read-only extracted title/author is a SEPARATE,
      unrelated concept - display-only, never fed back into anything,
      which is why "don't replace editable overrides with read-only
      metadata" doesn't actually arise here: HeadEdit's fields were
      never overrides of THAT metadata to begin with, they're fresh
      values for a not-yet-written export file), or WAV export, there
      is no playback/metadata/engine behavior left to reproduce once
      the already-out-of-scope VTX/YM6-conversion wrapper is excluded -
      not a complexity-based deferral, an evidence-based scope
      exclusion via the SAME boundary this whole port has used from
      the start.
    verification: >
      N/A - documents a completed trace and its conclusion (nothing to
      implement), not a behavior to test. Grep evidence: `grep -rln
      "HeadEdit" ay_emul/*.pas` returns only Convs.pas and HeadEdit.pas
      itself; `grep -n "uses.*HeadEdit" ay_emul/*.pas` returns only
      Convs.pas's own uses clause; `grep -n "VTX_Converter(\|
      YM6_Converter(" ay_emul/*.pas` (excluding the declarations/
      definitions themselves) returns only PlayList.pas:836-837. If
      VTX/YM6 conversion is ever brought into scope in a future
      milestone (would itself need a README.md §Scope revision first),
      this entry's trace is the starting point - HeadEdit would need a
      real GtkDialog with the ~10 fields listed in its summary, plus
      wiring into whatever VTX/YM6 writer that future milestone adds
      (which doesn't exist yet either).

