  - id: MIG-0078
    title: "Phase 5 continuation: Mixer.pas ported, scoped to the audio-affecting controls only - per-channel amplitude/pan (AL/AR/BL/BR/CL/CR) and AY/YM chip-type override, live during playback"
    subsystem: engine/player, gui/mixer_win
    state: validated
    summary: >
      Investigation finding: the engine ALREADY fully supports live
      per-channel pan/level and chip-type changes - every one of the 18
      format structs' embedded ay_engine has index_al/ar/bl/br/cl/cr
      (uint8_t, AY.pas: Index_AL etc.) and chip_type fields, plus an
      existing ay_engine_calculate_level_tables() (ay.h) that rebuilds
      the actual fixed-size mixing-level tables (level_al[32]/etc.) from
      whatever those fields currently hold, INCLUDING re-selecting the
      AY_AMPLITUDES_AY vs AY_AMPLITUDES_YM DAC curve by chip_type - this
      is the exact same "assign fields, then recalculate" shape as
      MainWin.pas's own Set_Mode_Manual. No engine logic needed to be
      written; only a new generic accessor, player_ay_engine(player*)
      (engine/include/ay_engine/player.h / engine/src/player.c, same
      per-format switch-and-return-pointer pattern as MIG-0068's
      player_chip_type), was needed to reach it from gui/.

      gui/include/gui/mixer_win.h + gui/src/mixer_win.c: a Mixer window
      (GtkVScale x6 for channel amplitude, matching TTrackBar's own
      0-255 range/orientation and TBAmpAL/AR/BL/BR/CL/CR default
      values 255/13/170/170/13/255 exactly; GtkRadioButton x2 for AY/
