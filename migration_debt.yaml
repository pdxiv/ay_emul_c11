  - id: MIG-0065
    title: "Phase 5 kickoff: GUI-layer playback control (pause/resume/position/volume/stop) implemented as a background pthread wrapper around player_make_buffer, wired to real ALSA output"
    subsystem: gui/playback
    state: validated
    summary: >
      gui/src/playback.c implements load/play/pause/resume/stop/
      set_volume/position_seconds entirely at the GUI layer (see
      MIG-0063's rationale for why this could not live in engine/player):
      a background pthread (playback_thread_main) pulls fixed
      2048-frame chunks via player_make_buffer, scales samples in-place
      by a volume factor, writes them via tools/ay_player's existing
      alsa_output_write (reused directly, not duplicated or promoted -
      engine/ is deliberately audio-output-agnostic), and tracks
      frames_played. Cross-thread state (paused, stop_requested,
      finished, frames_played) uses C11 stdatomic.h (single-writer-per-
      field, so plain atomics suffice, no mutex needed); `volume` is a
      plain (non-atomic) double, an explicitly accepted benign data race
      (worst case one stale/torn read of a scale factor for one audio
      chunk - inaudible, and re-read every chunk regardless). Wired into
      gui/src/mainwin.c's on_button_press/on_button_release exactly as
      the original MainWin.pas dispatches ButPlay/ButPause/ButStop/
      ButOpen and MoveVol.
    rationale: >
      No existing decoder or engine/ code was touched - this is
      additive GUI-layer infrastructure only, using the exact same pull
      API (player_make_buffer) the already-oracle-validated CLI player
      uses.
    verification: >
      Standalone end-to-end test (bypassing GTK, calling gui_playback_*
      directly - the identical calls mainwin.c's button handlers make)
      against test_corpus_76/NEWDANCE.asc with real ALSA output: load
      succeeds; after 800ms of play, position=0.981s; pause freezes
      position (0.981s -> 1.024s over 400ms, i.e. a small poll-interval
      jitter, not real advancement); resume continues (1.579s); volume
      change to 0.3 applies without crashing (1.877s); stop resets
      position to 0.000s. Separately confirmed by direct code review
      that gui/src/mainwin.c's on_button_press/on_button_release call
      these exact same functions (gui_playback_play/pause/stop/
      set_volume) in response to hit-tested button/slider zones - full
      interactive click-simulation (e.g. via xdotool) was not possible
      in this sandboxed environment (confirmed not installed), so this
      is the strongest available verification of the button-to-backend
      wiring short of a live manual click.

