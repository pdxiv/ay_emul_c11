      ROOT CAUSE FOUND AND FIXED (user-requested continuation: focus
      specifically on ay_synthesizer_ay and its tick-to-sample
      accumulation, having established the excess is system-wide via
      VBL). Built a standalone harness (no CPU/MFP/SNDH involved) that
      feeds ay_synthesizer_ay a FIXED total of 240,000,000 elapsed
      cycles (exactly 30s at 8MHz) through different call partitions -
      one giant call, uniform 1000-cycle steps, uniform 1-cycle steps,
      and a call pattern alternating 1-cycle/700-cycle steps to
      approximate real atari_emulate_step cadence - and compared total
      emitted frames. Result: one_call and step1 (the two extremes)
      both produced 1,440,001 frames (matching the exact expected
      1,440,000 almost exactly); step1000 produced only 1,428,481
      (11,520 FEWER); the production-cadence pattern produced only
      1,380,429 (59,572 FEWER) - conclusively proving the accumulator's
      behavior WAS call-partition-DEPENDENT (non-associative), contrary
      to its intended design, and that realistic call granularity was
      the worst-affected case.

      Root cause: engine/ay.c's ay_synthesizer_stereo16/mono16/stereo8/
      mono8 each end their whole-tick processing loop with
      `e->number_of_tiks = 0;` once `current_tik` reaches
      `number_of_tiks_hi(e)`. Compared directly against ay_emul/AY.pas's
      four equivalent sites (lines 708, 769, 854, 901): every one does
      `Tmp := 0; Number_Of_Tiks.Hi := Tmp;` - NOT `Number_Of_Tiks.Re :=
      Tmp`. Number_Of_Tiks is declared (AY.pas:143-148) as an explicit
      packed variant record - `case boolean of False:(lo,hi:longword);
      True:(re:int64)` - meaning .Hi and .Lo are literally the same
      memory as the upper/lower 32 bits of .Re. `Number_Of_Tiks.Hi := 0`
      therefore clears ONLY the upper 32 bits (the whole-tick count just
      fully consumed), leaving the lower 32 bits (.Lo, the fixed-point
      FRACTIONAL remainder from the last CurrentTact-to-ticks conversion)
      completely intact for the next accumulation. The C11 port's
      `e->number_of_tiks = 0` zeroed the WHOLE 64-bit value every single
      time the tick-processing loop completed normally - which happens
      on nearly every call that doesn't end via the buffer-full early
      return - silently discarding that fractional remainder over and
      over. Each discarded remainder is small, but at real production
      call cadence (atari_emulate_step invokes ay_synthesizer_ay's
      backstop on nearly every one of ~300,000 steps in a 30s render),
      the losses compound into needing measurably MORE elapsed CPU
      cycles to reach any fixed number of emitted audio frames - exactly
      the mechanism behind the system-wide (VBL, Timer A, and overall)
      ~1.35% cycle-vs-audio-duration excess this ledger has been
      chasing since MIG-0054, now fully explained and closed at the
      source rather than downstream in any individual peripheral.

      Fix: changed all four occurrences from `e->number_of_tiks = 0;` to
      `e->number_of_tiks &= 0xFFFFFFFFLL;` (masking to keep only the low
      32 bits, exactly reproducing `Number_Of_Tiks.Hi := 0`'s effect on
      the packed representation). The genuine full-reset at
      ay_engine_reset_chip (`e->number_of_tiks = 0`, matching AY.pas:920's
      `Number_Of_Tiks.Re := 0` - an actual chip-reset, not a batch-
      completion checkpoint) was correctly left unchanged - confirmed by
      checking it is the ONLY other call site for this field and matches
      a REAL Number_Of_Tiks.Re assignment in the Pascal source, not a
      .Hi-only one.

      Result, re-running the synth-only harness after the fix: all four
      partition strategies (one_call, step1000, step1, prod_cadence) now
      produce IDENTICAL results - 1,440,001 frames and identical final
      accumulator state, every time, regardless of how the same total
      elapsed cycles are split across calls. Partition-independence is
      fully restored.

      Result on the real 30s Temple_of_Asherah.sndh render: final cycle
