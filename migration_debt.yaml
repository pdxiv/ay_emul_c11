      before copying); engine/player.{h,c}, gui/mixer_win.{h,c}, and
      gui/mainwin.c's apply_item_overrides/do_load_song were hand-
      merged against the CURRENT main-tree shapes (player_pair's
      `pair.primary` in place of the agent's stale bare `p` field), not
      applied as a raw diff. The agent's own self-assigned MIG-0103 ID
      collided with an already-existing, unrelated MIG-0103 entry in
      the main tree (the agent's worktree branched before that ID was
      taken) - renumbered to MIG-0120 during the merge, and then AGAIN
      from an initially-chosen MIG-0116 once a second collision (this
      time against MIG-0116 through MIG-0119, all real pre-existing
      entries the merge's own stale-base assumption had missed) was
      caught by re-deriving the true next-free ID directly from the
      ledger instead of trusting the earlier estimate.
    rationale: >
      Not validated: engine/ and gui/ both build clean
      (-std=c11 -Wall -Wextra[-Wpedantic], zero warnings), and the full
