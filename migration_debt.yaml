  - id: MIG-0128
    title: "PlayList.pas's non-BASS conversion menu (WAV/VTX/PSG) wired into the GUI playlist window - a real, previously-unwired GUI gap now closed for 3 of the 5 real formats; YM6/ZXAY correctly identified as needing brand-new engine-level writers, not GUI wiring"
    subsystem: "gui/playlist_win, gui/Makefile, tools/ay_export (reused), tools/ay_player (reused), engine/psg_export (reused)"
    state: translated
    summary: >
      Fourth of the four gaps flagged after MIG-0124/MIG-0125. The
      original framing ("tools/ay_export already has the logic as a
