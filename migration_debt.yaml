      here) - guarded by a `syncing` bool rather than GLib's
      g_signal_handlers_block_by_func, which triggers a real
      -Wpedantic warning (casting a function pointer to gpointer is
      non-conforming strict ISO C11, even though GTK2/GLib itself
      relies on it internally - this project's build treats warnings as
      something to fix, not silence, per its existing -Wpedantic use
      throughout gui/). ButMixer (MainWin.pas coordinates (318,21,26,
      26)) now toggles the window, same Is_On pattern as ButList/
      ButLoop; MIG-0069 narrowed to just ButTools.
    rationale: >
      Deliberately narrower than Mixer.pas's real GBChAmp/GBChType tabs
