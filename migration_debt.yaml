  - id: MIG-0105
    title: "ST12STC/ST32STC/STF2STP ported into tools/identify_ay_file, closing the ST1/ST3/STF IntegrityCheck gap by reusing engine/'s STC/STP support (no engine/ port of these three formats themselves exists or is planned) - explicitly NOT oracle-validated, no real sample file exists for any of the three"
    subsystem: "tools/identify_ay_file (st_convert, integrity_check, dispatch, detect_st_family, detect_stf)"
    state: behaviorally_incomplete
    summary: >
      User asked to implement "the approach used in the original Pascal
      code" for identifying ST1/ST3/STF. In the real program these three
      are not separate tracker engines at all - LoadTrackerModule
      (Players.pas:2547-2558) converts them, in place, into an already-
      supported format's own on-disk layout before ever reaching that
      format's Get_Registers/GetTimeXXX: ST1 and ST3 both convert to
      FT.STC's layout (`ST12STC`/`ST32STC`, Players.pas:1766-2049/
      2051-2216), STF depacks (already ported, MIG-0023) then converts
      to FT.STP's layout (`STF2STP`, Players.pas:1346-1764). Ported all
      three converters into `tools/identify_ay_file/src/st_convert.c` +
      `include/identify/st_convert.h`, then wired
      `integrity_check_st1`/`_st3`/`_stf` (new, in `integrity_check.c`)
