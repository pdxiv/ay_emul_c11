      *1000 correction a real 50Hz VTX/YM tick rate computed as
      0.00002s/tick (50000Hz) instead of the correct 0.02s/tick (50Hz),
      caught and fixed during this entry's own verification pass, not a
      separate incident). engine/include/ay_engine/vtx_file.h gained a
      stored interrupt_freq field (vtx_file.c already computed this
      exact value locally to derive ay_tiks_in_interrupt, just never
      saved it - mirrors ym_file.h's own existing field).

      gui/include/gui/playback.h gained gui_playback_duration_seconds()
      and gui_playback_request_seek_seconds() (both thin wrappers over
      MIG-0079's existing fraction-based primitives, using the new
