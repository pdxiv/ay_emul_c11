  - id: MIG-0127
    title: "PlayList.pas playlist-wide play order (Direction: forward/reverse/shuffle) and whole-playlist loop (ListLooped/SBLoop) fully implemented"
    subsystem: "gui/playlist_win, gui/mainwin"
    state: translated
    summary: >
      Third of the four gaps flagged after MIG-0124/MIG-0125. Real
      Pascal: SetDirection/CreatePlayOrder (PlayList.pas:243-531)
      builds a PlayingOrder[] permutation the WHOLE list is walked
      through by PlayNextItem/PlayPreviousItem (863-883), cycling 4
      button-states (0..3) via SBDirectionClick's `(Direction+1) and
      3` - but CreatePlayOrder's own body only distinguishes 3 real
      BEHAVIORS (Direction=0: reverse; 1 or 3: forward; 2: shuffle) -
      collapsed to exactly those 3 real modes here (GUI_PLAYLIST_
      DIRECTION_FORWARD/REVERSE/SHUFFLE), a documented simplification
      of the cosmetic 4th icon state, not a behavioral one. ListLooped
      (SBLoop.Down) wraps Next/Prev at the list boundary instead of
      stopping - a genuinely SEPARATE concept from MainWin.pas's own
      Do_Loop (same-song repeat, already ported, untouched by this
      entry).

      gui_playlist_win gained `direction`/`looped` fields and
      `shuffle_order`/`shuffle_count` (a lazily-rebuilt permutation
      array, ONLY needed for shuffle mode - forward/reverse order is
      computed analytically each time via play_order_position/
      play_order_item, since a plain index-count formula is always
      trivially correct with no staleness concern at all, unlike
      shuffle's own permutation which must stay STABLE across repeated
      Next/Prev calls). Rebuilt lazily (on next use after a direction
      change or list-size change) rather than at CreatePlayOrder's own
      ~10 real call sites (every add/remove/sort site in PlayList.pas)
      - a platform-appropriate simplification: always correct by the
      time it's actually used (never out-of-bounds, never skips/
      repeats an item), just computed on demand instead of eagerly
      kept in sync after every mutation. Shuffle puts the currently-
      playing item first (CreatePlayOrder's own `if PlayingItem >= 0
      then PlayingOrder[0] := PlayingItem` special case) then Fisher-
      Yates over the rest via rand() - this port's own already-
      established shuffle convention (gui/src/playlist.c's
      RandomSortClick port, MIG-0089-era).

      gui_playlist_win_next/prev rewritten to walk the current play
      order (translating model.current to/from an order position) and
      wrap at the boundary when `looped`, instead of the previous
      simple clamped +1/-1. New "Loop playlist" checkbox and "Order:
      Forward/Reverse/Shuffle" cycling button (SBLoop/SBDirection's
      own icon substituted with a text label, same convention this
      port already uses for e.g. Tools' tray-mode radio group) added
      to gui/src/playlist_win.c's own button row. `looped` persisted
      via settings.ini's "PlayListLoop" key (MainWin.pas:4386/4621-
      4622's own real SaveDW/GetDW key name) - `direction` itself is
      session-only, matching real Pascal's own apparent non-
      persistence of Direction (no corresponding SaveDW call found for
      it in MainWin.pas's SaveParams).

      MainWin.pas:1904's `Flg := (Direction = 3) and (not ListLooped)`
      (some OTHER, not-fully-traced interaction keying specifically off
      icon-state 3 vs 1, both "forward" in CreatePlayOrder's own logic)
      is NOT replicated - this port's 3-mode collapse has no
      distinction between those two icon states to key off of. Not
      traced further given this session's own scope/time constraints;
      flagged as a known, deliberate simplification.
    rationale: >
      Not validated: no oracle-diff equivalent for playlist navigation
      order (a GUI-level, not engine-level, concept - OracleHarness.pas
      has no playlist model at all). engine/ untouched; gui/ builds
      clean and the full regression suite shows zero new failures -
      none of which exercise gui_playlist_win_next/prev's own new code
      paths (gui_smoke/test_playlist_ayl never calls them). The
      shuffle/reverse/loop logic itself was reasoned through carefully
      (position<->item mapping verified symmetric by construction,
      Fisher-Yates matches this port's own established convention) but
      not executed at all this session, live or otherwise - see debt.
    verification: >
      engine/ (untouched) and gui/ build clean (zero warnings).
      tests/engine_smoke: all 12 runnable binaries pass. tests/
      gui_smoke/test_playlist_ayl: all 4 tests pass (does not exercise
      this entry's own new code). tools/ay_player/smoke_test.sh: all
      19 corpus files + 2 error paths pass. tests/oracle_diff/corpus_
      wav_md5_sweep.sh: 70 passed, 0 failed, unchanged.
    debt:
      - "No test coverage at all (live-GUI or automated) of gui_
        playlist_win_next/prev's new order-walking logic, the Loop
        checkbox, or the Order-cycling button - only reasoned through
        by code review, never executed. Needs either a working X11
        click-driven session or a dedicated unit test constructing a
        small gui_playlist_win and exercising next/prev across all 3
        direction modes with looped true/false."
      - "MainWin.pas:1904's Direction=3-vs-1 distinction (both 'forward'
        in CreatePlayOrder's own logic, but apparently NOT equivalent
