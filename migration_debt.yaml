      tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail, exit 0 (fresh
      `make clean && make`). tools/ay_player/smoke_test.sh: 21/21 pass.
      Final-cycle drift measurement: oracle reaches cycle 240043106,
      this port reaches 243248236, after both are fed exactly 30.00s
      (1,440,000 48kHz stereo frames) of Temple_of_Asherah.sndh - a
      1.34% cumulative overrun, present identically in the pre-fix
      capture (~243240048), confirming it is unrelated to this fix.

  - id: MIG-0056
    title: "engine/m68k_bus.c: hook-based Starscream-timing override built and working exactly as designed, but reveals the 1.34%/30s drift is NOT primarily an opcode-cost-mismatch effect after all - a policy reversal's result"
    subsystem: engine/m68k_bus, engine/atari_emulate
    state: behaviorally_incomplete
    summary: >
      Policy history: this ledger's MIG-0054 entry and PORTING_TO_C11_
      LINUX.md's section 7.1.1 previously stated, as a standing rule per
      explicit user directive, that Musashi's vendored cycle tables would
      NEVER be patched to chase Starscream's numbers. The user then asked,
      explicitly and in so many words, to implement Starscream's
      instruction timings in Musashi via hooks anyway - a direct,
      acknowledged reversal of that rule. Flagged the conflict once
      (AskUserQuestion); the user chose "formally reverse the policy."
      This entry documents the reversal, the resulting feature, and what
      it revealed.

      What was built: Musashi's own M68K_INSTRUCTION_HOOK (m68kconf.h -
      an integrator config knob, not a change to any of Musashi's actual
      CPU-emulation source files) is enabled, and engine/m68k_bus.c
      registers a callback (timing_instr_hook) that fires once per
      instruction from INSIDE Musashi's normal batched m68k_execute()
      loop (confirmed via direct benchmark: batched-with-hook-registered
      costs ~300-310ms for a 30s Temple_of_Asherah.sndh render, the same
      as the unmodified baseline ~320-336ms - versus ~10s for forced
      unconditional single-instruction stepping, the alternative
      mechanism considered and rejected for cost). The callback decodes
      the raw opcode word at each PC, checks it against a small,
      explicitly-scoped table of 3 already-identified (MIG-0053) opcode+
      addressing-mode patterns, and - using the gap in m68k_cycles_run()
      between consecutive hook firings to measure Musashi's ACTUAL
      charged cost for the previous instruction empirically (not guessed
      from either engine's summary tables, which turned out to disagree
      subtly with directly-measured behavior) - accumulates a correction
      toward Starscream's own declared cost for that exact pattern,
      cross-derived from ay_emul/star027b/star.c's real cost-generator
      formulas (addsuba() for ADDA.L, i_clr() for CLR.W, op_to_dn() for
      ADD.W) rather than from prose summaries. The accumulated correction
      is drained into a->cycle_count once per atari_emulate_step call
      (engine/atari_emulate.c), after m68k_bus_exec returns - Musashi's
      own internal dispatch/timing is completely untouched; only this
      port's separate scheduling-relevant cycle_count ledger is adjusted.
      Off by default; opt-in via atari_emulate_enable_starscream_timing()
      or the AY_ENGINE_STARSCREAM_TIMING env var (mirroring engine/
      trace_log.c's existing env-var-gated pattern).

      Patterns covered (deliberately narrow, NOT a general per-opcode
      cost model - see engine/src/m68k_bus.c's g_timing_patterns table
      for the full derivation of each): ADDA.L Dn,An and ADDA.L An,An
      (register-direct source only; Musashi 6, Starscream 8, delta +2);
      CLR.W (An) (aind memory-indirect mode only; Musashi 8 - which
      matches the real, published Motorola timing exactly, i.e.
      Starscream is the non-standard one here even by its own formula;
      Starscream 10, delta +2); ADD.W #imm,Dn (immediate source only;
      target 8 per Starscream's formula). Other addressing submodes of
      these same 3 opcodes, and every other opcode, are explicitly NOT
      covered.

      Measured on a 30s Temple_of_Asherah.sndh render with a temporary
      debug counter (removed before finalizing): of 2,773,601 total
      instructions executed, the 3 patterns matched only 2,169 + 3 + 0 +
      478 = 2,650 times combined (0.096% of all instructions; the CLR.W
      (An) pattern never occurred at all in this program). The net
      cumulative correction this produced was +9,941 cycles over the
      whole 30s render - moving the final cycle count from 243,248,236
      (override off) to 243,258,177 (override on).

      Critical finding this exposes: comparing both these numbers against
      the PHYSICALLY-correct baseline (exactly 30s * 8,000,000 Hz =
      240,000,000 cycles, since MC68000Freq is a fixed constant) rather
      than only against each other shows the oracle itself lands at
      240,043,106 - only +0.018% over the exact hardware-clock value,
      fully explained by ordinary buffer-boundary rounding. This port,
      WITHOUT the override, already sits at +1.353% over that same exact
      baseline - and turning the override ON moves it to +1.358%, i.e.
      VERSUS THE PHYSICALLY-CORRECT REFERENCE, NOT just versus the
      oracle - it made the overcounting marginally WORSE, not better.
      This means the ~1.34%/30s "drift" this ledger has been chasing
      since MIG-0053/MIG-0054 is NOT primarily an aggregate Musashi-
      cheaper-than-Starscream per-opcode-cost effect after all: the 3
      known mismatched patterns are far too rare in this program's real
      code (0.096% of instructions) to account for more than roughly
      +/-10,000 of the ~3,205,130-cycle gap (about 0.3% of it). Something
      ELSE in this port's own cycle-accounting is causing cycle_count to
      run measurably ahead of real 8MHz elapsed time for a fixed amount
      of generated audio, independent of per-opcode cost accuracy - the
      oracle's own near-exact match to the physical baseline rules out
      "Starscream is just slower across the board" as an alternative
      explanation too. Root cause of THIS mechanism is not yet
      identified; MIG-0053's STOP-padding fix and MIG-0054's stale-IRQ-
      snapshot fix are the two most likely places a residual bug of this
      shape could still hide, but neither has been re-examined
      specifically through this new "versus the physical baseline, not
      just versus the oracle" lens yet.
    rationale: >
      NOT closed as validated - the feature itself works exactly as
      designed and is real, working, opt-in infrastructure (verified via
      tests/oracle_diff/run_diff.sh 60/60 pass and tools/ay_player/
      smoke_test.sh 21/21 pass with the override left at its default-off
      setting, confirming zero behavioral change to any existing gate),
      but it does not close the gap it was built to address, and in the
      process disproved the leading hypothesis for what that gap actually
      is. Kept enabled as an opt-in mechanism (harmless when disabled,
      correctly scoped and documented when enabled) rather than removed,
      since it is a legitimate, working, low-risk piece of infrastructure
      that could matter again if more mismatched opcode patterns are
      ever identified and added to g_timing_patterns - but it should NOT
      be presented as having addressed MIG-0054's residual jitter, and
      the search for that residual's real cause should now look at
      cycle-accounting mechanisms other than per-opcode cost, per this
      entry's own finding.
    verification: >
      engine build clean (make clean && make, engine/). tools/ay_player/
      smoke_test.sh: 21/21 pass. tests/oracle_diff/run_diff.sh: 60/60
      pass, 0 fail - confirmed with the override at its default-off
      state, so none of the existing gates exercise it; this is
      appropriate since the feature is explicitly experimental/opt-in.
      Performance: hook-registered-and-active render of Temple_of_
      Asherah.sndh (30s) takes ~300-424ms depending on whether the 3
      patterns' correction logic actually does meaningful work per
      instruction (a no-op callback measured at ~300-310ms, matching the
      unmodified baseline's ~320-336ms almost exactly; the real,
      pattern-matching-plus-correction callback measured at ~307-424ms) -
      both trivial compared to forced single-instruction stepping's
      ~10s for the same render, confirming the hook mechanism itself adds
      no meaningful overhead regardless of whether it does real work.
      Pattern hit counts (30s render, temporary debug instrumentation,
      removed before finalizing): ADDA.L Dn,An 2169, ADDA.L An,An 3,
      CLR.W (An) 0, ADD.W #imm,Dn 478 - out of 2,773,601 total
      instructions (0.096% combined). Final-cycle comparison against the
      exact physical baseline (240,000,000 = 30s * 8,000,000 Hz): oracle
      240,043,106 (+0.018%); this port, override off, 243,248,236
      (+1.353%); this port, override on, 243,258,177 (+1.358%) - the
      override moved the result marginally AWAY from the physically-
      correct value, not toward it, directly falsifying "aggregate
      opcode-cost bias" as the drift's dominant mechanism.

      FOLLOW-UP INVESTIGATION (user-requested deep dive into the port's
      own cycle-accounting/scheduling logic, treating the Starscream
      override as diagnostic-only per the request's explicit scope):
      systematically traced the full cycle-budget lifecycle in engine/
      atari_emulate.c and adjacent modules, testing concrete hypotheses
      rather than inspecting code alone, per the request's requirement.

      LEDGER RECONCILIATION (first, foundational check): grepped the
      entire engine/ tree for every write to a->cycle_count - exactly
      two exist, both in atari_emulate_step: `a->cycle_count += used;`
      (Musashi's honest, unpadded m68k_bus_exec return value) and
      `a->cycle_count += m68k_bus_take_timing_correction();` (MIG-0056's
      own override, always 0 when disabled). Verified empirically, not
      just by inspection: summing `used` across all 302,832
      AY_ENGINE_STEP_TRACE entries in a fresh 30s Temple_of_Asherah.sndh
      capture gives exactly 243,241,138 - identically matching that same
      run's actual final cycle_count. The invariant `starting budget +
      carried debt = executed cycles + ending remainder`, adapted to this
      port's actual (simpler, non-carrying) semantics as `sum(used across
      all steps) = final cycle_count`, holds EXACTLY with zero
      unaccounted remainder. This rules out double-counting, lost-carry,
      dropped-remainder, or duplicate-charging bugs in the ledger itself
      as a class - every cycle in the final total corresponds to a real,
      honestly-reported Musashi execution result, not a bookkeeping
      artifact. The excess must therefore come from this port actually
      DOING more real CPU work (executing more instructions, or more
      expensive ones, or servicing more interrupts) than the oracle does
      for the equivalent 30 seconds of real content - not from miscounting
      work that didn't happen.

      HYPOTHESES TESTED AND RULED OUT (each verified against source, not
      assumed):
      - VBL period computation: instrumented and confirmed play_freq=200
        (correctly parsed from this file's "TC200" tag - sndh_file.c's
        le16() native-word tag read, already fixed for exactly this
        reason per MIG-0021's own comment) and vbl_period=40000 exactly
        (8,000,000/200) - bit-exact, matches the oracle's own VBLPeriod.
      - DMA sound subsystem (engine/dma_sound.c): instrumented
        dma_sound_next_boundary_cycles's call site directly - `dma_active`
        never becomes true for this entire file (d->play stays false
        throughout - Temple_of_Asherah.sndh's digidrum effects are pure
        MFP-timer/AY-envelope driven, not real STe DMA hardware). The
        whole dma_sound.c subsystem is provably inert for this file and
        cannot be the source.
      - MFP delay-period formula (mfp.c's get_mfp_delay: dr*koef*MC_BY_MFP,
        truncated to int64_t): read atari.pas's GetMFPDelay (atari.pas:
        389-392) side by side - identical formula, identical MFPKoefs
        array values (0,4,10,16,50,64,100,200), identical MCbyMFP
        constant (13/4=3.25, both sides compute this from the same
        MC68000Freq/MFPFreq ratio), and identical truncation convention
        (Pascal's trunc() and C's (int64_t) cast both truncate toward
        zero, not round - checked directly since a truncate-vs-round
        mismatch was the leading hypothesis here and would have
        compounded significantly over millions of reloads; both sides
        truncate identically, hypothesis falsified).
      - MFP timer reconfiguration formulas (mfp.c's calc_timer_cnt and
        set_timer_delay_mode, engine's port of atari.pas's CalcTimerCnt/
        SetTimerDelayMode, atari.pas:394-432): compared line-by-line -
        both the steady-state Cnt recomputation and the mid-flight
        prescaler-change Base rebasing formula (`Base := od - trunc((od-
        Base)*(koef[new]/koef[old]))`) are identical between the two
        engines, including truncation convention. This is the most
        complex, most dynamically-exercised piece of MFP logic (Timer A
        in particular is very likely reconfigured continuously through
        this file for its digidrum sample-rate control) and was the
        strongest suspected location for a subtle divergence; found
        none.
      - min=1 dispatch-guarantee capping (MIG-0053's need_dispatch_
        guarantee, atari_emulate.c): A/B tested directly (temporary env-
        var-gated toggle, removed after measurement) rather than reasoned
        about only - Musashi's own m68ki_check_interrupts() is called
        exactly ONCE per m68k_execute() call, before its dispatch loop,
        never per-instruction inside it (confirmed by reading m68kcpu.c's
        m68k_execute directly) - structurally identical to Starscream's
        own once-per-call exec_checkpoint. This means splitting one large
        exec() burst into many min=1 calls should be near-neutral for
        total charged cycles, in theory. Measured, not just reasoned:
        disabling the cap moved the 30s final cycle count from 243,248,236
        to 243,177,705 - a real but small 70,531-cycle effect (~2.2% of
        the ~3.2M-cycle gap, ~0.03% of the total render). Confirms the
        mechanism is very close to neutral as theory predicts, with a
        small non-zero residual not further chased (not the dominant
        mechanism, and disabling it risks reintroducing the "premature
        register writes" audible artifact it was built to prevent -
        MIG-0053's own documented tradeoff - so left unchanged rather
        than "fixed" for a marginal, unconfirmed net gain).

      STRONGEST REMAINING LEAD, NOT YET ROOT-CAUSED: Timer A (MFP vector
      77) services 113,874 times in this port's 30s render vs the
      oracle's 110,472 - a genuine 3.1% EXCESS in real interrupt
      services, not a coalesce/backlog artifact (assert count now exactly
      equals service count on this port post-MIG-0054, and coalesce for
      this vector is 0 - MIG-0056's earlier capture). Since the ledger
      reconciliation above already proved cycle_count only grows via
      Musashi's own honest, real execution results, 3,402 genuinely EXTRA
      real Timer A interrupt services necessarily consume genuinely extra
      real CPU cycles (ISR entry/exit, register pushes, handler body,
      RTE) - not phantom accounting. This is the most promising specific,
      concrete, falsifiable remaining lead for where the bulk of the
      ~3.2M-cycle gap actually lives, since Timer A dominates this file's
      total interrupt volume by a wide margin over Timers B/D. However,
      WHY Timer A specifically fires 3.1% more often - given its own
      reload-formula and reconfiguration-formula are now confirmed
      bit-identical to atari.pas's - was NOT pinned down within this
      investigation's scope: Timer A's period is very likely being
      dynamically reconfigured by the 68000 program throughout playback
      (typical for digidrum sample-rate control), which defeats a simple
      single "nominal period" comparison and would require substantially
      more granular per-reconfiguration-event tracing than was completed
      here to localize further.

      Still NOT closed as validated - this follow-up investigation
      produced real, evidence-backed progress (the ledger-reconciliation
      proof that no bookkeeping/double-counting bug exists anywhere in
      the cycle-count write path; conclusive rule-outs of VBL period, DMA
      sound, and both MFP timer formulas as sources, each verified
      against source and, where practical, empirically; a precise
      quantification of the min=1-cap mechanism's small real contribution
      ~2.2% of the gap) but did NOT identify and fix a single dominant
      root cause, despite systematic hypothesis testing per the request's
      explicit method. The strongest remaining lead (Timer A's 3.1%
      service-count excess, necessarily real extra CPU work given the
      ledger's proven honesty) is precisely measured but not yet traced
      to a specific, correctable mechanism - further work would need
      instrumentation tracking Timer A's dr/dm register writes and
      computed period against wall-clock/cycle position throughout the
      render (not built here) to determine whether its EFFECTIVE
      reconfigured period runs measurably shorter on this port than the
      oracle at specific points, and if so why, given the underlying
      formulas are now confirmed identical. No speculative fix was
      applied for this - per the request's explicit constraint against
      compensating constants or percentage corrections, and given no
      concrete, source-level defect was found to correct, only a
      symptom (the service-count excess) was measured, not a cause.

      Verification for this follow-up investigation: reconciliation
      check - sum(used) across 302,832 steps (30s render,
      AY_ENGINE_STEP_TRACE) = 243,241,138, exactly equal to that run's
      final cycle_count - zero unaccounted remainder. VBL: play_freq=200,
      vbl_period=40000 (exact, matches oracle). DMA: dma_active never
      true for this file (confirmed via instrumented probe, 5s render).
      MFP formulas: engine/mfp.c's get_mfp_delay/calc_timer_cnt/
      set_timer_delay_mode compared directly against atari.pas:389-432 -
      byte-for-byte identical formulas and truncation convention. min=1
      cap A/B test: cap enabled (default) final cycle 243,248,236; cap
      disabled (diagnostic-only, reverted after measurement) 243,177,705
      - a 70,531-cycle (~2.2% of gap) real, measured, non-dominant effect.
      Timer A (vector 77) service count: this port 113,874 vs oracle
      110,472 (+3.1%), with assert==service (no residual coalesce/
      backlog) - confirmed via fresh AY_ENGINE_IRQ_TRACE capture.
      tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail (fresh `make
      clean && make`, all diagnostic instrumentation removed before this
      final build). tools/ay_player/smoke_test.sh: 21/21 pass. No source
      changes were kept from this investigation (all temporary env-var-
      gated probes were added, measured, and reverted) - this entry
      records findings and rule-outs, not a fix, consistent with not
      having located a concrete, correctable defect to fix.

      TIMER A DEEP-DIVE (user-requested continuation: trace Timer A's full
      lifecycle - reconfiguration, reload, countdown, pending/service -
      event-by-event against the oracle, rather than assuming the excess
      service count is caused by a single large bug). Built matching,
      disabled-by-default (env-var-gated, same pattern as every other
      trace type in this project) instrumentation on BOTH sides, kept as
      permanent diagnostic infrastructure rather than removed:
      AY_ENGINE_TIMERA_TRACE (engine/mfp.c's trace_log_timera, new) and
      AY_EMUL_TIMERA_TRACE (TraceLog.pas's new TraceLogTimerA, same field
      order/event names so the two logs diff directly). Both log, at
      every Timer A control/data-register write and every expiration:
      cycle, event, the written value (writes only), DM, DR, Base, Delay,
      IE, IM - covering register programming, reload-value handling,
      countdown/period tracking, and IE/IM (enable/mask) state at each
      transition. Verified byte-for-byte SOURCE-LEVEL semantic parity
      first (per the request's explicit "establish semantics from source,
      don't infer from names" requirement): compared atari.pas's
      SetTimerDataRegister/SetTimerDelayMode/CalcTimerCnt (atari.pas:
      394-432) against mfp.c's set_timer_data_register/
      set_timer_delay_mode/calc_timer_cnt line-by-line and confirmed
      matching semantics for: (1) writing TAD while DM=0 (stopped)
      immediately reloads DR/Cnt; while DM<>0 (running) it only updates
      the register value used on the NEXT natural reload, the active
      countdown is untouched - confirmed directly in a live trace: a
      TAD write with the timer running left dr/delay completely
      unchanged in that same log line, then the FOLLOWING expire_after
      picked up the new value, on both engines identically; (2) changing
      DM while already running (DM<>0 to a different nonzero DM)
      rebases Base by the exact ratio of old/new prescaler koefficients,
      preserving phase rather than resetting it, identically on both
      sides; (3) DM transitioning to/from 0 (stop/start) does reset
      phase (via CalcTimerCnt's snapshot then a fresh Base computation),
      identically on both sides.

      EPOCH-LEVEL COMPARISON: partitioned a full 30s Temple_of_Asherah.
      sndh render into Timer A "configuration epochs" (a new epoch begins
      whenever a register write or a post-expiration reload changes
      DM/DR) on both sides and compared expiration counts per epoch,
      aligned by SEQUENCE order (not raw cycle, since a small pre-
      existing ~50-1000-cycle boot-time offset already exists and grows
      slowly - not the subject of this entry). Result: within the long,
      steady "digidrum running" epochs (DM=1, DR=51, ~663-cycle period,
      averaging ~1451 expirations each), per-epoch counts between the two
      engines are equal or within +/-1 of each other, and the CUMULATIVE
      difference across ~400+ matched epochs stays small and bounded
      (observed range: -18 to +2) - NOT growing toward the 3,402 total
      gap. This conclusively rules out a steady-state per-expiration
      timing defect: given a fixed Timer A configuration, this port
      generates expirations at the same rate as the oracle, epoch for
      epoch.

      ROOT CAUSE OF THE EXCESS: the 68000 program itself (not this port's
      MFP emulation) periodically STOPS and RESTARTS Timer A - a full
      "off, reprogram DR=25, one 325-cycle priming expiry, reprogram
      DR=51, run steadily at 663 cycles/expiry for ~1 second" cycle,
      repeating roughly every ~0.96-1.0s throughout the file (the
      digidrum sample's own natural loop/re-trigger cadence). This port
      executes 77 complete restart cycles in 30s versus the oracle's 74 -
      3 EXTRA complete cycles. Each restart cycle contributes ~1451
      expirations on average (measured: pas total across restart-cycle
      spans = 107,404 over 74 cycles; c11 = 111,724 over 77 cycles) - so
      3 extra cycles times ~1451 each = ~4354 predicted extra
      expirations, closely matching the measured 4,320-expiration excess
      confined to these spans specifically (a small ~918-expiration
      OFFSETTING difference exists outside/between restart spans,
      unexplored further - secondary and much smaller than the dominant
      effect). This fully and directly explains the previously-reported
      113,874-vs-110,472 (+3,402) total gap as (mostly) 3 extra complete
      digidrum re-trigger cycles, not a rate or accounting defect inside
      Timer A itself.

      This finding is a downstream SYMPTOM, not an independent MFP bug:
      the 68000 program's own logic decides when to restart the digidrum
      loop (almost certainly based on some other counter - a VBL tick
      count, an AY register/counter check, or similar - not traced in
      this pass), and if this port's overall emulated clock reaches that
      trigger condition's threshold measurably sooner than the oracle
      does per unit of real audio time (exactly the still-open, general
      ~1.34%/30s cycle-rate question this same MIG-0056 entry's earlier
      section investigated and did not fully root-cause), the program
      would naturally end up completing a few extra whole loop iterations
      by the end of a fixed-length 30s render - with EVERY expiration
      within each of those extra iterations being completely correct,
      honest, real Timer A behavior, not a miscount. The relative
      magnitude is consistent with this framing: 3 extra of ~75-78 total
      restarts is ~4%, in the same rough range as the previously-measured
      3.1% (Timer A service-count) and 1.34% (whole-render cycle-count)
      excess figures - not identical, but the same order of magnitude and
      direction, as expected for a cascading symptom of one shared
      upstream cause rather than three independent defects.

      Still NOT closed as validated, and still no code change applied -
      per the request's own explicit instruction not to propose a fix
      "based solely on the fact that the final interrupt count is high,"
      and having now traced the excess to its precise mechanism (3 extra
      complete restart cycles, not a rate defect), there is no MFP-level
