  - id: MIG-0113
    title: "MIG-0112 follow-up: real Pascal-oracle validation of playlist-level Turbosound pairing, using a real user-supplied .ayl file - found and fixed two genuine bugs (a Linux path-separator gap, and a missing synth tick-budget assignment that broke paired-playback pacing)"
    subsystem: "engine/player, gui/playlist, tests/oracle_diff, tests/gui_smoke, ay_emul/OracleHarness.pas"
    state: validated
    summary: >
      Direct continuation of MIG-0112, once the user supplied a real
      .ayl file (test_corpus_76/Cmnd.ayl) specifically for testing.
      Loading it immediately surfaced a real gap: it uses Windows-style
      `\`-separated relative paths (`..\..\Authors\Foo\bar.stc`), which
      this port's gui_playlist_load_ayl had no handling for at all -
      traced against PlayList.pas's own CheckPath procedure
      (315-320, `{$IFNDEF Windows}`-guarded - a REAL part of the
      original's own cross-platform Linux build, not a C11-port-
      specific addition) and confirmed its exact semantics: try the
      path as given first (`if FileExists(path) then Exit`), only
      rewrite backslashes to forward slashes if that fails. Ported as
      ayl_check_path (gui/src/playlist.c), replacing resolve_relative
      at all three path-line call sites in gui_playlist_load_ayl.
      Cmnd.ayl's own 19 referenced files don't exist anywhere in this
      repo (an external "Authors\..." tree, not part of test_corpus_76),
      so it loads to 0 items - correct, graceful behavior, matching
      CheckAndAddFromPLFile's own real "file not found -> skip" handling
      - but the file has no "ts" pairing block, so it alone couldn't
      validate MIG-0112's actual pairing mechanism. A second, minimal
      fixture (test_corpus_76/ts_pair_test.ayl) was hand-authored using
      the now-precisely-traced real grammar (AWAY.stc, a real corpus
      file, with two consecutive `<...>` override blocks) to close that
      gap - both fixtures now have permanent regression coverage
      (tests/gui_smoke/test_playlist_ayl.c, a new test directory - the
      first in this project to exercise gui/ code directly rather than
      just engine/).

      Investigated whether MIG-0112's own real-oracle-validation gap
      could be closed by driving the REAL TrModLoaded/PlayListItems
      path (LoadAYL + TrModLoaded, the actual functions a real .ayl
      load exercises) rather than a hand-constructed scenario - found
      that TrModLoaded and its own CaseTrModules dispatch helper are
      both declared in Players.pas's IMPLEMENTATION section (confirmed
      directly: `interface` ends at line 942, TrModLoaded is defined at
      2643), meaning they are NOT visible/callable from OracleHarness.pas
      at all. Exporting them would mean editing the reference Pascal
      source's own public interface - crossing this project's standing
      "the oracle is never edited" line, which every prior harness
      scenario has respected (all of them, including MIG-0109's own
      ts_pair_pt3, drive the same LOWER-LEVEL exported building blocks -
      LoadTrackerModule, All_GetRegisters[CNum] - directly instead,
      manually replicating whatever per-format setup CaseTrModules would
      otherwise do). Followed that exact same established convention
      instead: added RunSTCPairWAVExportTest (OracleHarness.pas),
      mirroring the ALREADY-EXISTING RunSTCWAVExportTest's own per-voice
      setup (confirmed STC_Get_Registers already takes an explicit CNum
      parameter and is registered via All_GetRegisters[CNum], Players.
      pas:9325 - no PT3-specific voice-array trick needed), but
      duplicated for CNum 0 and CNum 1, loading the SAME file into BOTH
      via two genuinely SEPARATE LoadTrackerModule calls - matching
      real playlist pairing's own two-independent-LoadTrackerModule-
      calls shape (Players.pas:2654/2683) more faithfully than PT3's own
      self-pairing scenario does (which reuses one already-loaded
      struct's data for both voices, since PT3 self-pairing genuinely
      works that way).

      Added a matching dump_engine_state.c scenario (run_stc_pair) that
      drives the REAL production entry point - player_pair_load_song/
      player_pair_make_buffer, the exact calls gui/src/playback.c makes
      - loading AWAY.stc as both primary and secondary, and wired both
      into tests/oracle_diff/run_diff.sh as a new permanent 'stc_pair'
      gate.

      First run: byte-mismatch (engine output was ~8KB, oracle's was
      ~1.7MB). Root cause: player_pair_make_buffer (added by MIG-0112)
      never set `ay->number_of_tiks` - every OTHER format's own
      <fmt>_file_make_buffer sets this once per tick
      (`ay_tiks_in_interrupt << 32`) right before calling
      ay_synthesizer_dispatch, but player_pair_make_buffer's own hand-
      written loop skipped it entirely. With number_of_tiks stuck at 0,
      ay_synthesizer_stereo16's outer tick-budget loop exits after
      essentially one iteration per call, so the C-side while loop in
      player_pair_make_buffer just spun through many near-empty
      dispatch calls instead of properly-paced ones - MIG-0112's own
      test_player_pair.c unit tests still passed throughout (their
      assertions - "produces audible output", "differs from primary-
      alone" - are true of badly-mispaced audio too, so they gave false
      confidence; this is exactly why this project's own methodology
      insists on real oracle-diff validation over unit tests alone).
      Fixed by adding a PLAYER_PAIR_AY_TIKS_IN_INTERRUPT constant
      (engine/src/player.c) - safe to hardcode since all 14 pairing-
      eligible tracker formats use byte-identical AY_FREQ_DEF/
      INTERRUPT_FREQ_DEF values (confirmed by grepping every one of
      their headers) and, unlike VTX/YM, none of them have a live,
      player_set_chip_freq-recomputable ay_tiks_in_interrupt field - and
      setting ay->number_of_tiks from it every iteration, mirroring
      every per-format make_buffer's own pattern exactly. Re-ran: BYTE-
      IDENTICAL.
    rationale: >
      Direct response to the user supplying a real .ayl file
      specifically for testing MIG-0112's own remaining validation gap.
      Investigated the most direct path (the real TrModLoaded/LoadAYL
      path) first, found it structurally blocked without editing the
      oracle's own interface, and used the same lower-level-building-
      -blocks approach every other scenario in this codebase already
      established instead - staying within this project's own
      conventions rather than introducing a new one under time pressure.
    verification: >
      tests/oracle_diff/run_diff.sh's new stc_pair gate: oracle
      (RunSTCPairWAVExportTest) vs engine (dump_engine_state's
      run_stc_pair, driving the real player_pair_load_song/
      player_pair_make_buffer production path) - BYTE-IDENTICAL WAV
      output (1,765,420 bytes, cmp exit 0) after the number_of_tiks fix.
      Full regression suite re-run clean after the fix: `cd engine &&
      make`/`cd gui && make`/`cd tools/ay_player && make`/`cd tools/
      identify_ay_file && make` all zero warnings zero errors;
      tests/oracle_diff/run_diff.sh 118/118 PASS (0 FAIL, the new
      stc_pair gate included); corpus_wav_md5_sweep.sh 70 passed/0
      failed/3 known-non-identical (all pre-existing, unrelated)/2
      skipped (the two new non-audio .ayl fixtures, correctly not
      probed as playable files); every tests/engine_smoke binary
      including test_player_pair (re-run, still passes - now with
      CORRECT pacing, not just superficially-passing assertions); the
      new tests/gui_smoke/test_playlist_ayl (both tests pass). Pascal
      oracle itself rebuilt clean via lazbuild (5448 lines compiled, 1
      warning - a benign "Comment level 2 found" notice, 0 errors).
    debt:
      - "RESOLVED (MIG-0114): the stc_pair oracle gate originally covered
        only STC+STC; MIG-0114 extended the same pattern to 10 more of
        the other 12 pairing-eligible formats (PT1, GTR, FLS, STP, PT2,
        PSM, ASC, ASC0, FTC, PSC, SQT), all byte-identical. FXM is
        deliberately, permanently excluded (see MIG-0114's own
        rationale - a real shared-global cross-voice interaction in the
        original Pascal this port's per-instance structs cannot
        reproduce) rather than left as residual risk."
      - "Force_Loop (RESOLVED, MIG-0114) and full interactive GUI testing
        (still open) were tracked under MIG-0112's own debt list; GUI
