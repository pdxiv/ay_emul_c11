  - id: MIG-0106
    title: "gui/: digidrum (beeper) amplitude and resampler-quality filtering brought in-scope and wired up, reversing MIG-0078's deliberate exclusion - the filter's own math turned out to already be fully ported and oracle-validated, just never activated by any caller"
    subsystem: "engine/hw/ay, engine/player, gui/mixer_win, gui/mainwin"
    state: translated
    summary: >
      User asked to research why Mixer's digidrum amplitude/filtering
      were unported (see the research turn immediately preceding this
      entry, not duplicated here), then explicitly asked to implement
      them and bring them in-scope, reversing MIG-0078's own deliberate
      "controls that affect actual audio only" narrowing.

      Research finding that shaped the fix: the two items are in very
      different states at the engine level, despite mixer_win.h's old
      comment grouping them together as equally "not ported":
        - Digidrum/beeper amplitude (Mixer.pas's TBAmpBpr -> BeeperMax):
          engine/ already has `beeper_max` (correct default 146) and
          computes `beeper_level` from it inside
          ay_engine_calculate_level_tables (AY.pas's own
          Calculate_Level_Tables) - fully functional, just never exposed
          as a GUI control.
        - Resampler filtering (Mixer.pas's RBResamAvg/RBResamFIR ->
          FilterQuality/SetFilter/CalcFiltKoefs): engine/ already had a
          COMPLETE, correct, previously-oracle-validated port of the
          whole Hamming-windowed-sinc FIR filter design and application
          (ay_engine_set_filter/ay_apply_filter, actively called from
          6 mixing-loop sites) - it was simply never ACTIVATED, since
          nothing anywhere in engine/, gui/, or tools/ ever called
          ay_engine_set_filter; is_filt stayed at its init-time -1
          (disabled) forever. ay.c's own pre-existing comment already
          said as much ("filtering disabled until the ALSA/mixer
          milestone wires up real Filt_K coefficients") - this entry is
          that milestone.

      Changes:
        1. engine/include/ay_engine/hw/ay.h + src/hw/ay.c: added
           `filter_quality` field to `ay_engine` (settings.pas's
           FilterQuality, default 1 matching MainWin.pas:926's startup
           `SetFilter(1)`) - the user-facing SETTING, distinct from
           `is_filt` (the derived per-call outcome of applying it).
        2. engine/src/player.c's `player_set_chip_freq`: now also calls
           `ay_engine_set_filter(e, e->filter_quality, ay_freq,
           sample_rate)` right after the existing delay_in_tiks/tik_re
           recompute, exactly matching Set_Chip_Frq's own real call
           order (MainWin.pas:1534-1552, `SetFilter(FilterQuality)`
           right after those same fields). Added `player_get_ay_freq`
           (a new small read-side accessor, VTX/YM return their real
           stored per-file clock, every other format returns the shared
           `PLAYER_AY_FREQ_DEF`=1773400 every format's own _file_load
           already defaults to) so callers can re-establish filtering
           with the file's actual current clock right after a load,
           without a blind ay_freq guess overwriting VTX/YM's real
           per-file value.
        3. gui/src/mainwin.c's `do_load_song`: added one unconditional
           `player_set_chip_freq(&mw->playback.p,
           player_get_ay_freq(&mw->playback.p), 48000)` call right after
           `apply_item_overrides` - the ONLY existing call to
           player_set_chip_freq was gated behind a rare per-item AY-freq
           override (apply_item_overrides), so without this, filtering
           would activate for almost no real file. This call is a no-op
           for delay_in_tiks/tik_re/frq_ay_by_frq_z80 (recomputing from
           the value already there); its only observable effect is that
           ay_engine_set_filter actually runs.
        4. gui/include/gui/mixer_win.h + src/mixer_win.c: added the 7th
           "Channel amplitude" slider (Mixer.pas's TBAmpBpr/LAmpBpr,
           caption "Beeper", default 146, same GBChAmp groupbox as the
           six already-ported channel sliders in the real .lfm) and a
           new "Resampler" frame with two radio buttons (RBResamAvg/
           RBResamFIR, captions "averager"/"FIR-filter" verbatim from
           Mixer.lfm) controlling filter_quality via a new
           `apply_filter_quality` (parallel to the existing
           `apply_and_recalc`, since filter_quality needs a real
           ay_engine_set_filter call, not just
           ay_engine_calculate_level_tables). Both new controls are
           included in the existing 500ms sync-timer refresh, matching
           every other control's "resync after a fresh file load resets
           ay_engine to its own defaults" behaviour (mixer_win.h's own
           pre-existing comment on why that timer exists).
        5. mixer_win.h's file comment rewritten to no longer claim
           digidrum/filtering are unported, and to note the Atari-only
           TBAmpDMA trackbar (genuinely still out of scope, unrelated to
           this entry) as the thing that stayed excluded instead.
    rationale: >
      Not closed as validated: engine-level correctness for both new
      fields was already established by prior work (beeper_max/
      beeper_level's formula predates this entry; ay_engine_set_filter/
      ay_apply_filter were already oracle-validated as part of AY.pas's
      original port) - what's new here is purely the activation call
      graph (player_set_chip_freq -> ay_engine_set_filter) and the GUI
      widgets, neither of which has (or can easily have) an oracle-diff
      equivalent, since ay_player/tools/tests never call
      player_set_chip_freq at all (confirmed by grep - zero call sites
      outside gui/) and GTK2 UI interaction isn't something
      OracleHarness.pas's scenario model covers. Verified instead by
      actually running the GUI (see verification below), not just
      building it - this is the strongest available evidence for a GUI-
      only change, but it's manual/visual, not a byte-diff against the
      real Pascal binary the way most of this ledger's engine-level
      entries are.
    verification: >
      Builds clean (engine/ and gui/, -std=c11 -Wall -Wextra[-Wpedantic],
      zero warnings). tests/oracle_diff/run_diff.sh: zero [FAIL] lines,
      60 [PASS] (confirms zero regression - player_set_chip_freq is only
      ever called from gui/src/mainwin.c, so every CLI/engine-level
      oracle-diff gate is provably unaffected by this entry).
      Actually launched the real GUI binary on this machine's live X
      display and drove it end-to-end with synthetic X11 events
      (python-xlib + XTest, screenshots via ImageMagick's `import`,
      since no xdotool/wmctrl was available) rather than only building
      it - confirmed: (1) the main window launches and renders; (2) a
      real corpus file (AWAY.stc) loads via a CLI path argument, the
      title updates, and the spectrum visualizer shows live activity,
      proving the new player_set_chip_freq/ay_engine_set_filter call
      added to do_load_song does not crash or hang; (3) the Mixer window
      opens (via the real ButMixer skin-region click, not a debug
      hook) and shows both new controls with the exact correct Pascal
      defaults (Beeper=146, FIR-filter selected); (4) dragging the
      Beeper slider live-updates its value (146->212) with no crash,
      confirming apply_and_recalc's new beeper_max line executes
      correctly; (5) clicking the "averager" radio live-toggles
      filter_quality with no crash, confirming apply_filter_quality's
      ay_engine_set_filter call executes correctly against a real loaded
      file's real ay_engine; (6) re-opening the Mixer window after
      loading a FRESH file shows both controls correctly reset to their
      defaults again (146/FIR-filter), confirming the sync-timer/
      ay_engine_init "reset to defaults on every load" behaviour
      extends correctly to the two new fields, matching every
      pre-existing slider's same behaviour.

  - id: MIG-0046
    title: "engine/atari_emulate.c: two real cycle-accounting divergences from atari.pas's Atari_Emulate, narrowing MIG-0045's residual gap"
    subsystem: engine/atari_emulate
    state: behaviorally_incomplete
    note: >
      SUPERSEDED by MIG-0048 and MIG-0049: fix #1 below ("synchronous mask
      check" model of s68000interrupt) was a wrong model of what that
      call actually does, discovered by reading Starscream's real
      assembly source - see MIG-0048 for the correction. Fix #2 below
      (STOP early-return padding) was ALSO found to be wrong in general
      (only coincidentally correct for the tiny 38-cycle gap it was
      originally written to fix) and was removed entirely - see MIG-0049.
      Neither fix from this entry survives in its original form; kept for
      historical record of the investigation, per this project's
      append-don't-rewrite discipline.
    summary: >
      Investigated MIG-0045's residual "audio starts ~1889 frames too
      early" gap by diffing PC-instruction-sequence traces between the
      real Pascal/Starscream engine and the C11/Musashi port directly
      (new, uncommitted scratch trace tools) - confirmed the two execute
      the IDENTICAL instruction/branch sequence for at least the first 670
      logged steps (not a control-flow bug), but diverge in CYCLE COUNT
      per step almost immediately. Found and fixed two real, distinct
      causes in atari_emulate_step, both structural differences in the
      scheduling/orchestration code (NOT the CPU cores' own instruction
      timing, confirming the user's hypothesis that Starscream and Musashi
      are each independently precise enough - the bug was in the glue
      code): (1) atari.pas:1466's s68000interrupt(4,-1) is a SYNCHRONOUS
      "try to deliver this interrupt right now" call whose result (via
      Starscream's ask-and-answer interrupt model) feeds BaseVBL's
      advancement BEFORE that same call's cycle budget (`min`) is
      computed from it - Musashi's level-triggered IRQ model instead only
      reveals acceptance during/after m68k_bus_exec, too late to affect
      that step's own budget. Fixed by determining acceptance
      synchronously via a pure, cycle-free interrupt-mask check (SR bits
      8-10) BEFORE computing `min` - valid because the CPU is always at an
      instruction boundary between atari_emulate_step calls, matching
      real 68000 hardware's (and Starscream's) combinational arbitration
      at that same boundary. (2) Musashi's STOP handler (m68k_op_stop,
      m68kops.c) deliberately truncates m68ki_remaining_cycles down to
      just STOP's own instruction cost the moment it executes, forcing
      m68k_execute to return EARLY (used < requested) rather than
      consuming the full requested budget - confirmed via direct
      side-by-side trace that Starscream/the original does NOT do this
      (Pascal's od was exactly 40000 - the full VBLPeriod - after the very
      first VBL wait of a real SNDH file; Musashi's was 39962, a 38-cycle
      shortfall, traced to exactly this call). Fixed by padding
      atari_emulate_step's cycle_count up to the full requested `min`
      whenever Musashi returns early (used < min) - confirmed this alone
      makes step 1's od match the oracle exactly (40000 = 40000).
    rationale: >
      NOT closed as validated - both fixes are real, confirmed correct in
      isolation (exact cycle-count match at the first VBL boundary), and
      zero regressions across the full oracle-diff suite (52/52 pass,
      including the m68k/mfp/dma gates most directly exercising this
      shared scheduling code - this is NOT SNDH-specific code, any future
      Atari-format milestone depends on it too). But MIG-0045's overall
      "audio starts too early" symptom for Temple_of_Asherah.sndh is only
      partially closed: a smaller, CONSTANT +4-cycles-per-iteration drift
      remains in a DBRA-based wait loop at $37F6-$37FC (bytes 14 14 18 F5
      2000 51C9 FFF8 - a 2-byte MOVE.B, a 4-byte MOVE.B with an extended
      addressing mode, and DBRA D1 branching back), compounding over the
      loop's many iterations into enough cycles to still shift exactly
      when audio starts (confirmed: ay_player's WAV output for
      Temple_of_Asherah.sndh still first diverges from
      RunSNDHWAVExportTest's oracle output at the same sample (frame 334)
      as before this entry's fixes - MIG-0045's 480256-frame comparison
      unchanged). Checked Musashi's own DBcc cycle table
      (m68kcpu.h/m68kcpu.c: CYC_DBCC_F_NOEXP=-2, CYC_DBCC_F_EXP=+2 against
      a base of 12, giving 10/14 - the standard, textbook-correct 68000
      DBcc timing) - this matches published real-hardware values, so
      Musashi is not obviously wrong here; Starscream's own cycle-cost
      table isn't available as source in this repo (a precompiled
      dependency of the original build) to compare directly, so whether
      the remaining +4/iteration comes from DBcc, one of the two MOVE.B
      variants, or something else entirely is NOT yet identified.
    verification: >
      Standalone C trace tools (uncommitted scratch diagnostics, same
      approach as MIG-0045) confirmed: before this entry's fixes, C11 od
      was 39962 vs Pascal's 40000 at the first VBL boundary (a 38-cycle
      gap); after fix (1) alone the gap was unchanged (the synchronous-
      interrupt-ordering issue doesn't engage until vbl_due is true, which
      isn't the case for this specific early call); after fix (2), step 1
      matches exactly (od=40000=40000), with a residual +4/step drift from
      step 2 onward. tests/oracle_diff/run_diff.sh re-run in full: 52/52
      pass, 0 fail, zero regressions. tools/ay_player WAV-export vs
      OracleHarness.pas's RunSNDHWAVExportTest for Temple_of_Asherah.sndh
      (480256 frames, matched count): still NOT byte-identical, first
      divergence still at sample 668 (frame 334) - MIG-0045's residual gap
      narrowed in root-cause understanding (from "unknown, could be
      anywhere" to "a specific +4-cycle/iteration drift in one named
      68000 wait loop") but not yet closed.

  - id: MIG-0054
    title: "engine/atari_emulate.c: two real MFP/level-6 scheduling bugs found and fixed (missing timeslice-release; stale pre-timer-loop IRQ-level snapshot) - Timer A/B/D coalesce backlog now eliminated, but a much larger (1.34%/30s), newly-quantified Musashi-vs-Starscream sustained clock-rate drift is now the dominant remaining, still-open cause of residual audio 'jitter'"
    subsystem: engine/mfp, engine/atari_emulate
    state: behaviorally_incomplete
    summary: >
      MIG-0053's fix was confirmed by ear: the user reports Temple_of_
      Asherah.sndh's melody and percussion timing now sounds correct via
      ay_player, matching the real ay_emul, but "a little jittery" by
      comparison. Investigated using the existing AY/IRQ/step trace
      tooling. First tried refining MIG-0053's min=1 cap (which had
      applied whenever ANY interrupt was pending, re-evaluating all four
      MFP timers' icnt-retry logic once per single instruction for a
      handler's ENTIRE body, not just once to guarantee its own dispatch)
      to only cap min=1 for the step that still needs to dispatch
      something (nothing acked last step; engine/include/ay_engine/
      atari_emulate.h's new irq_acked_prev_exec field), letting the step
      right after an acknowledgment run at full budget. This is kept (more
      principled, no regression) but measured NO clear improvement on
      either the specific "premature write" gap signature or the overall
      audible-magnitude WAV diff - ruling out excessive re-check cadence
      as the (or at least the dominant) remaining cause. Broke down
      level-6 coalesce events by vector and found the picture is very
      different from what MIG-0053's aggregate numbers suggested: 92% of
      all remaining coalesce events (113965 of 123843, 30s render) belong
      to Timer A specifically (vector 0x4D/77, V=13) - vectors 68/72
      (Timers D/B, the file's actual digidrum drivers) are comparably
      well-behaved and closely match the oracle's own assert counts.
      Timer A's own assert count (114101) is close to the oracle's
      (110472, +3.3%), but its coalesce count is nearly EQUAL to its
      assert count, and the oracle logs ZERO coalesce for this vector at
      all. Raw trace inspection (AY_ENGINE_IRQ_TRACE) shows a clear
      pattern: after each successful service, a burst of 6-8 coalesce
      events fires for vector 77 at roughly 12-16-cycle intervals (i.e.
      once per atari_emulate_step call, not once per Timer A's own real
      period) before the next one finally succeeds - a real ICnt backlog
      being drained one increment per outer-loop call, exactly matching
      mfp_emulate_timer's "if not while" per-call-single-increment
      structure (ported faithfully from atari.pas's EmulateTimer, which
      has the identical structure). Since Starscream shows literally zero
      coalesce for this timer, it never builds this backlog in the first
      place - meaning the shared level-6 slot is still measurably more
      contested on this port than on the oracle, most likely because
      Timer D/B (which fire far more often) hold the slot fractionally
      longer before it frees up, starving Timer A's own attempts more
      often than real hardware/Starscream would. Root cause NOT yet
      identified at this point in the investigation.

      Directed to investigate Timer D/B handler duration specifically
      (the leading hypothesis at the time), a dedicated single-timer
      diagnostic (temporary raw fprintf tracing in mfp_emulate_timer,
      later removed) was added and a live capture examined directly.
      This DISPROVED the D/B-contention hypothesis outright: during an
      entire ~500-cycle backlog-drain burst, zero vector-68/72 events
      appear at all - vector 77's own "assert" and "coalesce" fire at
      the EXACT SAME cycle, repeating every ~12-16 cycles (one
      atari_emulate_step call) with no other timer involved. The raw
      base/delay/icnt numbers showed why: `base` was found ~22577 cycles
      (~34 delay periods) behind `od`, and mfp_emulate_timer's "if not
      while" per-call structure (faithfully ported from atari.pas's
      EmulateTimer, which has the identical shape) can only advance
      `base` by one delay increment per call - so catching up an
      existing large gap takes one call per period, and EVERY one of
      those calls also re-attempts a (failing) request, incrementing
      icnt further. This explained how an EXISTING gap perpetuates, but
      not how a ~34-period gap could form in the first place, since the
      per-step min computation already takes the minimum across all
      four timers' own next-expiry times and should self-bound any
      single burst to the nearest genuine deadline.

      The user then supplied docs/mfp_reference.md (a from-scratch
      MC68901 hardware reference) and asked for a line-by-line
      compliance check against engine/mfp.c, with instructions to fix
      any genuine C11-specific errors found (cross-checking against
      atari.pas at each finding, since the port's job is to match
      atari.pas's actual behavior, not simulate un-simplified real
      hardware where the two differ). Most of the document's Timer/
      Interrupt-Controller claims checked out (MFP_KOEFS's prescale
      table, VCR vector composition L uses V=13/8/5/4 for A/B/C/D
      exactly matching the doc's §4.1 channel table, IPR/ISR read-clear
      semantics, data-register write timing per §5.3) or turned out to
      be pre-existing atari.pas simplifications already faithfully
      ported (e.g. IER writes not clearing IPR, unlike real hardware -
      confirmed atari.pas's own SetMFPRegister has the identical gap).
      One finding was a genuine, unambiguous C11-only bug: atari.pas's
      SetMFPRegister (atari.pas:434-516) calls s68000releaseTimeslice
      after EVERY write to a scheduling-relevant register - IEA, IEB,
      IMA, IMB, TAC, TBC, TDC, TAD, TBD, TCD, TDD (cases 3,4,9,10,12-18)
      - ending the current exec burst immediately so Atari_Emulate
      re-evaluates all four timers on fresh state right away. This
      port's mfp_region_write had no equivalent at all: a reconfiguring
      write to any timer's control/data register left the CPU running
      on a `min` budget computed BEFORE the reconfiguration, for
      however long that budget happened to be - exactly the mechanism
      that could let `base` fall far behind `od` in one shot, seeding
      the backlog the earlier tracing had found but couldn't explain.
    rationale: >
      NOT closed as validated. The missing-timeslice-release bug is fixed
      by having mfp_write_byte_at (engine/mfp.c) return whether atari.pas
      would have released the timeslice for that register, and having
      the caller call m68k_bus_end_timeslice() when it does - see mfp.h's
      updated doc comment. Result: Timer D and B's assert counts moved
      from 5308/7007 to 5360/7036, now matching the oracle's 5362/7036
      almost exactly. Timer A's coalesce count is barely reduced in raw
      total (113965 to 110453, ~3%), but its CHARACTER changed
      substantially: the pathological 6-8-coalesce bursts-per-service are
      gone, replaced by a much tamer ~0-1-coalesce-per-service pattern -
      a real qualitative improvement even though the aggregate count
      barely moved. AY register write counts remain excellent (reg8
      114550 vs oracle 111107, reg9 6394 vs 6361, reg10 8070 vs 8035) and
      the audible-magnitude WAV diff improved modestly at the low end
      (30-76% vs the prior 34-78%). This is a real, source-verified bug
      fix (not a heuristic), so kept regardless of the modest metric
      movement. The user separately asked for the MFP bus-callback glue
      (previously ad hoc wrapper functions in atari_emulate.c) to be
      modularized into mfp.c/mfp.h for its own sake - done in the same
      pass: mfp.h now exports mfp_bus_context/mfp_bus_read/mfp_bus_write,
      directly registrable via m68k_bus_add_callback_region, so
      atari_emulate.c no longer contains any MFP address-decode or
      scheduling-write logic itself. mfp.c now depends on m68k_bus.h (a
      lower-level sibling module) but NOT on atari_emulate.h, avoiding a
      circular dependency.

      Continued investigation into Timer A's remaining (now much smaller
      and non-bursty) coalesce excess added a fourth trace type
      (trace_log_mfp / AY_ENGINE_MFP_TRACE, engine/mfp.c's mfp_bus_write)
      logging every MFP register write with its cycle timestamp and
      whether it triggered the timeslice release, to correlate against
      Timer A's remaining coalesce events. No MFP writes were found in
      the cycle windows immediately preceding several sampled coalesce
      events, ruling out a second missing-release gap. A dedicated
      diagnostic (temporary scratch tool driving atari_emulate_step
      normally - preserving correct IRQ/min handling, unlike the earlier
      raw single-step tools - and reading Musashi's own SR register via
      m68k_bus_get_reg(M68K_REG_SR) after each step) found the actual
      mechanism directly: immediately before a coalescing assert, the
      CPU's own SR interrupt mask reads 7 (all seven IPL levels blocked)
      - a real, legitimate critical section in the 68000 music-driver
      code itself, not a scheduling defect in this port. During that
      masked stretch (measured at 668 cycles in the clearest instance),
      a SECOND Timer A expiry accumulates before the mask lifts and the
      first is finally serviced, because Timer A's own natural period
      (~663 cycles, from its dm/dr configuration) is only marginally
      shorter than the masked section's duration - just enough for
      exactly one extra expiry to land inside it. The oracle logging
      zero coalesce for this timer means Starscream's equivalent masked-
      section duration never quite reaches Timer A's own period on the
      real engine, while this port's occasionally does. This connects
      directly to the small, already-documented, deliberately-unfixed
      per-opcode cycle-cost mismatches found during MIG-0053's
      investigation (ADDA.L register-source cheaper on Musashi by 2
      cycles, CLR.W-to-memory and ADD.W-immediate pricier by 2 each,
      netting +42 cycles of C11-vs-oracle drift over a clean 60,000-
      instruction, PC-identical comparison from cold reset): a masked-
      section boundary sitting this close to Timer A's own period is
      exactly the kind of narrow margin where a few cycles of
      accumulated per-opcode timing bias can occasionally tip a
      just-under-threshold real duration into just-over, without any
      further scheduling-level bug being involved.

      NOT further fixed in this pass, and NOT recommended for a blind
      attempt: closing this specific, remaining gap fully would mean
      patching engine/third_party/musashi's own vendored per-opcode
      cycle tables (m68k_in.c) for the already-identified mismatched
      opcodes (and likely auditing for others not yet sampled) to match
      Starscream's timing exactly - a delicate change to third-party
      code with real risk of introducing NEW divergences elsewhere if
      not validated against a complete, authoritative 68000 timing
      reference, not just the handful of opcodes this investigation
      happened to sample. Given the dominant, large-magnitude mechanisms
      (MIG-0053's STOP-padding fix, this entry's missing-timeslice-
      release fix) are both resolved and verified, and this remaining
      gap is now precisely characterized (a masked critical section
      marginally exceeding Timer A's own period, driven by a small,
      already-quantified opcode-cost bias) rather than mysterious, this
      is a reasonable point to stop chasing it further without an
      explicit decision to take on the Musashi cycle-table risk. The MFP
      bus-callback modularity refactor and all four trace types remain
      in place and verified working.

      Superseded reasoning update (per this ledger's later §7.1.1 CPU-
      timing policy, decided after explicit user direction: superzazu/z80
      and Musashi are the correct references for raw CPU instruction
      timing, not Z80.pas/Starscream - see PORTING_TO_C11_LINUX.md
      §7.1.1, and MIG-0018/MIG-0053's resolutions): this entry's own
      "don't patch Musashi's cycle tables to match Starscream" conclusion
      turns out to already be the CORRECT call under that policy, not
      merely a risk-averse one - patching Musashi to match Starscream's
      ADDA.L/CLR.W/ADD.W costs would make the C11 core wrong relative to
      real 68000 timing, the same reasoning already applied to MIG-0053.
      This residual is therefore reclassified: it is not an unfixed port
      bug, it is the audible-magnitude consequence of Starscream itself
      having non-standard opcode timing that this port intentionally does
      not replicate (the same category of accepted, documented
      Pascal-original quirk as MIG-0018's Z80 interrupt-accept timing).
      Left open only because the remaining ~3% Timer A coalesce-count gap
      and the WAV audible-diff percentages are real, measured, unresolved
      metrics against the oracle - not because a fix is still being
      sought.
    verification: >
      tests/oracle_diff/run_diff.sh: 52/52 pass, 0 fail, exit 0 (after
      `make clean && make` in engine/, per MIG-0051's stale-object-file
      lesson) - confirmed after the timeslice-release fix, the mfp.c/
      mfp.h modularity refactor, and adding trace_log_mfp/
      AY_ENGINE_MFP_TRACE.
      tools/ay_player/smoke_test.sh: 21/21 pass, all formats audible=yes
      including SNDH.
      Render performance: unchanged, ~0.31s wall-clock for a 30-second
      Temple_of_Asherah.sndh render.
      Level-6 coalesce by vector (30s Temple_of_Asherah.sndh): before
      this fix - vector 68 (Timer D) 4844, vector 72 (Timer B) 5034,
      vector 77 (Timer A) 113965, oracle 0/0/0 for all three (the oracle
      logs zero coalesce for D, B, and A alike). After this fix -
      68=4743, 72=4759, 77=110453. Assert by vector: before - 68=5308
      72=7007 77=114101; oracle 68=5362 72=7036 77=110472; after -
      68=5360 72=7036 77=113915 (D and B now match the oracle almost
      exactly; A remains ~3% high). AY write counts by register (30s,
      write_apply): reg8 c11=114550 oracle=111107; reg9 c11=6394
      oracle=6361; reg10 c11=8070 oracle=8035 - all within ~3.6%,
      unchanged from MIG-0053's already-good state. 30-second WAV
      comparison, audible-magnitude (>500/32768 LSB threshold) diff rate
      per second: 60%,39%,30%,46%,58%,57%,48%,47%,64%,52%,60%,57%,54%,
      56%,66%,76%,76%,59%,54%,53%,55%,51%,42%,52%,67%,74%,66%,62%,69%,
      66%,63%,71% (seconds 0-31) - a modest improvement at the low end
      versus the prior 34-78% range, not a dramatic one. Not yet byte-
      identical; the Timer A residual (now smaller and less bursty)
      remains open, unconfirmed by ear whether the reported "jitter" is
      fully resolved.
      AY_ENGINE_MFP_TRACE cross-referenced against AY_ENGINE_IRQ_TRACE:
      no MFP register writes found in the cycle windows immediately
      preceding several sampled Timer A coalesce events, ruling out a
      second missing-timeslice-release gap as a contributing cause.
      Direct SR-register sampling (scratch diagnostic, not part of the
      shipped trace_log.c set) around cycle 56010072: step ending at
      cycle 56009830 shows mask=7; the assert-then-eventually-coalescing
      request is raised at cycle 56010072 (the very next step boundary);
      the request is not serviced until cycle 56010740 (668 cycles
      later, matching Timer A's own ~663-cycle period), at which point
      both the coalesce and the service are logged at the same cycle -
      directly confirming the masked-critical-section mechanism.

      MAJOR FOLLOW-UP FIX (user-requested re-investigation: "compare the
      timestamps of the ay register writes and the interrupts between the
      c11 and the pas version, compare the generated wav data"): the
      SR-mask=7 mechanism above is real but turned out to be a SECONDARY
      effect. Direct comparison of AY_ENGINE_IRQ_TRACE's level-6
      coalesce/assert counts, broken out by vector, on a fresh 30s
      Temple_of_Asherah.sndh capture showed Timer B (72) and Timer D (68)
      - not just Timer A - coalescing far more than the oracle even
      though their own assert counts already matched almost exactly
      (before this fix: 72 coalesce=4759 vs oracle=130, 68 coalesce=4743
      vs oracle=191 - a 25-37x gap the earlier investigation had
      approximated as "0/0/0" for D/B and never actually broken out
      precisely). A scratch single-instruction-stepping tool (the C11
      counterpart of OracleHarness.pas's RunSNDHSingleStepTest, driving
      sndh_file_make_buffer to a target cycle then calling
      m68k_bus_exec(&bus,1) directly) combined with a full
      AY_ENGINE_STEP_TRACE capture found the actual mechanism: a step at
      cycle=74900538 computed min=18096 and used the FULL budget
      (used=18096, meaning the CPU ran completely uninterrupted for that
      whole span) - yet AY_ENGINE_IRQ_TRACE shows a level-6 "assert" for
      vector 72 logged at that SAME cycle=74900538, not serviced until
      the NEXT atari_emulate_step call 18096 cycles later. Root cause,
      found by reading atari_emulate_step's exact statement order: the
      line `int irq_level = compute_irq_level(a); m68k_bus_set_irq(&a->
      bus, irq_level);` ran BEFORE the `for (i=0;i<4;i++)
      mfp_emulate_timer(...)` loop that is what actually detects a fresh
      MFP expiry and sets m->level6_pending (mfp.c's request_level6).
      atari.pas's EmulateTimer, by contrast, calls s68000interrupt(6,vec)
      SYNCHRONOUSLY at the exact moment it detects an expiry, inside the
      SAME per-timer function that computes `min` - Starscream's pending-
      interrupt state is always current before s68000exec(min) runs.
      This port's C11 translation had reordered that into a single
      snapshot-then-loop structure: mfp.c's OWN m->level6_pending
      bookkeeping was updated correctly and immediately (matching
      Starscream's synchronous update), but the separate call that
      actually informs MUSASHI of the pending IRQ level
      (m68k_bus_set_irq) used a stale pre-loop snapshot and would not
      catch up until the FOLLOWING atari_emulate_step call - meaning any
      timer that first expired partway through a call sat completely
      invisible to Musashi's own interrupt-checking logic for that
      entire call's exec() burst, however large (observed up to ~18000-
      40000 cycles in this capture). Fixed by moving the
      compute_irq_level/m68k_bus_set_irq pair to run AFTER the
      mfp_emulate_timer loop (engine/src/atari_emulate.c).

      This fix is unambiguously correct and unambiguously validated:
      after it, a fresh 30s Temple_of_Asherah.sndh capture shows vector 77
      (Timer A) level-6 coalesce collapsing from 110387 to 0 (completely
      eliminated); vector 72 (Timer B) from 4759 to 7 (BELOW the oracle's
      own 130); vector 68 (Timer D) from 4743 to 10 (below the oracle's
      191). Assert counts (raw expiry counts, which this fix does not
      touch) are unchanged: 77=113874 vs oracle 110472 (+3.1%), 72=7036
      vs oracle 7036 (exact), 68=5361 vs oracle 5362 (near-exact) - so
      the fix's effect is precisely isolated to dispatch LATENCY/backlog,
      not to the underlying timer-expiry rate, exactly as predicted by
      the root cause. tests/oracle_diff/run_diff.sh (60/60) and
      tools/ay_player/smoke_test.sh (21/21) both still pass in full after
      this change - a pure scheduling-order correction, no behavioral
      regression anywhere else. Rationale for keeping this entry open
      rather than moving it to validated: measuring the actual WAV-level
      effect of this fix (MSE
      against the oracle's WAV over a 5-second window, before vs after)
      showed only a ~1.7% improvement (4583095 -> 4505481) - NOT
      proportional to how large the coalesce-count fix was. Investigating
      why led to a second, much bigger finding that this fix does NOT
      touch: comparing the final absolute 68000 cycle count each engine
      reaches after being fed exactly 30.00 real seconds of identical
      song content (1,440,000 stereo frames at 48kHz, both sides) shows
      the oracle's Starscream core reaches cycle 240,043,106 while this
      port's Musashi core reaches cycle 243,248,236 - a drift of
      3,205,130 cycles, i.e. Musashi runs this exact 68000 program
      **1.34% faster** than Starscream, cumulatively, over a real 30-
      second render. This is present identically before AND after this
      entry's fix (the pre-fix capture's final cycle was already
      ~243,240,048), so it is a separate, pre-existing effect, not
      something this fix introduced or influenced. 1.34% over 30 seconds
      is ~400ms of absolute time drift by the end of the clip - a
      best-effort lagged cross-correlation against the oracle WAV (search
      window widened once the initial +/-40-sample search saturated)
      found the actual best-matching lag growing from roughly 97ms at
      t=2s to 125-165ms by t=10-29s, consistent with a steadily
      accumulating clock-rate mismatch rather than a fixed offset. This
      is almost certainly the dominant remaining source of the
      "distorted"/"jittery" perception reported by ear - not the level-6
      backlog this entry's fix addresses (which is now essentially
      eliminated), and not merely the "small, ~0.07%" per-opcode bias
      figure this ledger had previously quantified from a short, cold-
      reset-adjacent 60,000-instruction PC-identical sample (MIG-0053) -
      that figure appears to have significantly understated the real,
      sustained-execution average: whatever mix of opcodes actually
      dominates during real digidrum/timer-driven playback evidently
      costs Musashi meaningfully less, on average, than Starscream, at
      roughly 19x the previously-measured rate.

      EXPLICIT PERMANENT POLICY (user directive, verbatim: "we will never
      patch musashi's cycle tables. they're correct, and they should
      work."): despite this 1.34% figure being far larger than the
      ~0.07% previously measured, engine/third_party/musashi's vendored
      per-opcode cycle tables (m68k_in.c et al.) are NOT to be patched,
      period - not as a risk/reward tradeoff to be re-weighed as new
      measurements come in, but as a standing rule. This supersedes any
      of this entry's or MIG-0053's earlier framing that treated it as a
      "not recommended for a BLIND attempt" judgment call that a future,
      more careful attempt might revisit. Musashi's own timings are taken
      as correct by definition per §7.1.1 - if a real, more precisely
      isolated cause of this 1.34% gap is ever found, the fix (if any)
      must come from this port's own scheduling/timing code, never from
      altering Musashi's opcode costs to move closer to Starscream's.
      This entry is left open only as a measured, accepted, permanent
      characterization of the gap - not as a queued-up TODO to patch
      Musashi. Any future investigation into the 1.34% figure should
      look for a genuine port-side mechanism (in the spirit of this
      entry's own two now-fixed bugs) before concluding "it's just
      opcode cost" again - that conclusion was reached mainly by
      elimination, not by identifying a specific, confirmed instruction.

      Verification for this follow-up fix: level-6 events (30s Temple_
      of_Asherah.sndh, fresh capture after this fix): vector 77
      assert=113874 coalesce=0 (oracle assert=110472
      coalesce=0); vector 72 assert=7036 coalesce=7 (oracle assert=7036
      coalesce=130); vector 68 assert=5361 coalesce=10 (oracle assert=5362
      coalesce=191). AY write counts (write_apply): reg8 c11=114510
      oracle=111107 (+3.06%), reg9 c11=6394 oracle=6361 (+0.52%), reg10
      c11=8069 oracle=8035 (+0.42%) - materially unchanged from pre-fix,
      confirming this fix affects latency/backlog, not net write volume.
      tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail, exit 0 (fresh
      `make clean && make`). tools/ay_player/smoke_test.sh: 21/21 pass.
      Final-cycle drift measurement: oracle reaches cycle 240043106,
      this port reaches 243248236, after both are fed exactly 30.00s
      (1,440,000 48kHz stereo frames) of Temple_of_Asherah.sndh - a
      1.34% cumulative overrun, present identically in the pre-fix
      capture (~243240048), confirming it is unrelated to this fix.

  - id: MIG-0056
    title: "engine/m68k_bus.c: hook-based Starscream-timing override built and working exactly as designed, but reveals the 1.34%/30s drift is NOT primarily an opcode-cost-mismatch effect after all - a policy reversal's result"
    subsystem: engine/m68k_bus, engine/atari_emulate
    state: behaviorally_incomplete
    summary: >
      Policy history: this ledger's MIG-0054 entry and PORTING_TO_C11_
      LINUX.md's section 7.1.1 previously stated, as a standing rule per
      explicit user directive, that Musashi's vendored cycle tables would
      NEVER be patched to chase Starscream's numbers. The user then asked,
      explicitly and in so many words, to implement Starscream's
      instruction timings in Musashi via hooks anyway - a direct,
      acknowledged reversal of that rule. Flagged the conflict once
      (AskUserQuestion); the user chose "formally reverse the policy."
      This entry documents the reversal, the resulting feature, and what
      it revealed.

      What was built: Musashi's own M68K_INSTRUCTION_HOOK (m68kconf.h -
      an integrator config knob, not a change to any of Musashi's actual
      CPU-emulation source files) is enabled, and engine/m68k_bus.c
      registers a callback (timing_instr_hook) that fires once per
      instruction from INSIDE Musashi's normal batched m68k_execute()
      loop (confirmed via direct benchmark: batched-with-hook-registered
      costs ~300-310ms for a 30s Temple_of_Asherah.sndh render, the same
      as the unmodified baseline ~320-336ms - versus ~10s for forced
      unconditional single-instruction stepping, the alternative
      mechanism considered and rejected for cost). The callback decodes
      the raw opcode word at each PC, checks it against a small,
      explicitly-scoped table of 3 already-identified (MIG-0053) opcode+
      addressing-mode patterns, and - using the gap in m68k_cycles_run()
      between consecutive hook firings to measure Musashi's ACTUAL
      charged cost for the previous instruction empirically (not guessed
      from either engine's summary tables, which turned out to disagree
      subtly with directly-measured behavior) - accumulates a correction
      toward Starscream's own declared cost for that exact pattern,
      cross-derived from ay_emul/star027b/star.c's real cost-generator
      formulas (addsuba() for ADDA.L, i_clr() for CLR.W, op_to_dn() for
      ADD.W) rather than from prose summaries. The accumulated correction
      is drained into a->cycle_count once per atari_emulate_step call
      (engine/atari_emulate.c), after m68k_bus_exec returns - Musashi's
      own internal dispatch/timing is completely untouched; only this
      port's separate scheduling-relevant cycle_count ledger is adjusted.
      Off by default; opt-in via atari_emulate_enable_starscream_timing()
      or the AY_ENGINE_STARSCREAM_TIMING env var (mirroring engine/
      trace_log.c's existing env-var-gated pattern).

      Patterns covered (deliberately narrow, NOT a general per-opcode
      cost model - see engine/src/m68k_bus.c's g_timing_patterns table
      for the full derivation of each): ADDA.L Dn,An and ADDA.L An,An
      (register-direct source only; Musashi 6, Starscream 8, delta +2);
      CLR.W (An) (aind memory-indirect mode only; Musashi 8 - which
      matches the real, published Motorola timing exactly, i.e.
      Starscream is the non-standard one here even by its own formula;
      Starscream 10, delta +2); ADD.W #imm,Dn (immediate source only;
      target 8 per Starscream's formula). Other addressing submodes of
      these same 3 opcodes, and every other opcode, are explicitly NOT
      covered.

      Measured on a 30s Temple_of_Asherah.sndh render with a temporary
      debug counter (removed before finalizing): of 2,773,601 total
      instructions executed, the 3 patterns matched only 2,169 + 3 + 0 +
      478 = 2,650 times combined (0.096% of all instructions; the CLR.W
      (An) pattern never occurred at all in this program). The net
      cumulative correction this produced was +9,941 cycles over the
      whole 30s render - moving the final cycle count from 243,248,236
      (override off) to 243,258,177 (override on).

      Critical finding this exposes: comparing both these numbers against
      the PHYSICALLY-correct baseline (exactly 30s * 8,000,000 Hz =
      240,000,000 cycles, since MC68000Freq is a fixed constant) rather
      than only against each other shows the oracle itself lands at
      240,043,106 - only +0.018% over the exact hardware-clock value,
      fully explained by ordinary buffer-boundary rounding. This port,
      WITHOUT the override, already sits at +1.353% over that same exact
      baseline - and turning the override ON moves it to +1.358%, i.e.
      VERSUS THE PHYSICALLY-CORRECT REFERENCE, NOT just versus the
      oracle - it made the overcounting marginally WORSE, not better.
      This means the ~1.34%/30s "drift" this ledger has been chasing
      since MIG-0053/MIG-0054 is NOT primarily an aggregate Musashi-
      cheaper-than-Starscream per-opcode-cost effect after all: the 3
      known mismatched patterns are far too rare in this program's real
      code (0.096% of instructions) to account for more than roughly
      +/-10,000 of the ~3,205,130-cycle gap (about 0.3% of it). Something
      ELSE in this port's own cycle-accounting is causing cycle_count to
      run measurably ahead of real 8MHz elapsed time for a fixed amount
      of generated audio, independent of per-opcode cost accuracy - the
      oracle's own near-exact match to the physical baseline rules out
      "Starscream is just slower across the board" as an alternative
      explanation too. Root cause of THIS mechanism is not yet
      identified; MIG-0053's STOP-padding fix and MIG-0054's stale-IRQ-
      snapshot fix are the two most likely places a residual bug of this
      shape could still hide, but neither has been re-examined
      specifically through this new "versus the physical baseline, not
      just versus the oracle" lens yet.
    rationale: >
      NOT closed as validated - the feature itself works exactly as
      designed and is real, working, opt-in infrastructure (verified via
      tests/oracle_diff/run_diff.sh 60/60 pass and tools/ay_player/
      smoke_test.sh 21/21 pass with the override left at its default-off
      setting, confirming zero behavioral change to any existing gate),
      but it does not close the gap it was built to address, and in the
      process disproved the leading hypothesis for what that gap actually
      is. Kept enabled as an opt-in mechanism (harmless when disabled,
      correctly scoped and documented when enabled) rather than removed,
      since it is a legitimate, working, low-risk piece of infrastructure
      that could matter again if more mismatched opcode patterns are
      ever identified and added to g_timing_patterns - but it should NOT
      be presented as having addressed MIG-0054's residual jitter, and
      the search for that residual's real cause should now look at
      cycle-accounting mechanisms other than per-opcode cost, per this
      entry's own finding.
    verification: >
      engine build clean (make clean && make, engine/). tools/ay_player/
      smoke_test.sh: 21/21 pass. tests/oracle_diff/run_diff.sh: 60/60
      pass, 0 fail - confirmed with the override at its default-off
      state, so none of the existing gates exercise it; this is
      appropriate since the feature is explicitly experimental/opt-in.
      Performance: hook-registered-and-active render of Temple_of_
      Asherah.sndh (30s) takes ~300-424ms depending on whether the 3
      patterns' correction logic actually does meaningful work per
      instruction (a no-op callback measured at ~300-310ms, matching the
      unmodified baseline's ~320-336ms almost exactly; the real,
      pattern-matching-plus-correction callback measured at ~307-424ms) -
      both trivial compared to forced single-instruction stepping's
      ~10s for the same render, confirming the hook mechanism itself adds
      no meaningful overhead regardless of whether it does real work.
      Pattern hit counts (30s render, temporary debug instrumentation,
      removed before finalizing): ADDA.L Dn,An 2169, ADDA.L An,An 3,
      CLR.W (An) 0, ADD.W #imm,Dn 478 - out of 2,773,601 total
      instructions (0.096% combined). Final-cycle comparison against the
      exact physical baseline (240,000,000 = 30s * 8,000,000 Hz): oracle
      240,043,106 (+0.018%); this port, override off, 243,248,236
      (+1.353%); this port, override on, 243,258,177 (+1.358%) - the
      override moved the result marginally AWAY from the physically-
      correct value, not toward it, directly falsifying "aggregate
      opcode-cost bias" as the drift's dominant mechanism.

      FOLLOW-UP INVESTIGATION (user-requested deep dive into the port's
      own cycle-accounting/scheduling logic, treating the Starscream
      override as diagnostic-only per the request's explicit scope):
      systematically traced the full cycle-budget lifecycle in engine/
      atari_emulate.c and adjacent modules, testing concrete hypotheses
      rather than inspecting code alone, per the request's requirement.

      LEDGER RECONCILIATION (first, foundational check): grepped the
      entire engine/ tree for every write to a->cycle_count - exactly
      two exist, both in atari_emulate_step: `a->cycle_count += used;`
      (Musashi's honest, unpadded m68k_bus_exec return value) and
      `a->cycle_count += m68k_bus_take_timing_correction();` (MIG-0056's
      own override, always 0 when disabled). Verified empirically, not
      just by inspection: summing `used` across all 302,832
      AY_ENGINE_STEP_TRACE entries in a fresh 30s Temple_of_Asherah.sndh
      capture gives exactly 243,241,138 - identically matching that same
      run's actual final cycle_count. The invariant `starting budget +
      carried debt = executed cycles + ending remainder`, adapted to this
      port's actual (simpler, non-carrying) semantics as `sum(used across
      all steps) = final cycle_count`, holds EXACTLY with zero
      unaccounted remainder. This rules out double-counting, lost-carry,
      dropped-remainder, or duplicate-charging bugs in the ledger itself
      as a class - every cycle in the final total corresponds to a real,
      honestly-reported Musashi execution result, not a bookkeeping
      artifact. The excess must therefore come from this port actually
      DOING more real CPU work (executing more instructions, or more
      expensive ones, or servicing more interrupts) than the oracle does
      for the equivalent 30 seconds of real content - not from miscounting
      work that didn't happen.

      HYPOTHESES TESTED AND RULED OUT (each verified against source, not
      assumed):
      - VBL period computation: instrumented and confirmed play_freq=200
        (correctly parsed from this file's "TC200" tag - sndh_file.c's
        le16() native-word tag read, already fixed for exactly this
        reason per MIG-0021's own comment) and vbl_period=40000 exactly
        (8,000,000/200) - bit-exact, matches the oracle's own VBLPeriod.
      - DMA sound subsystem (engine/dma_sound.c): instrumented
        dma_sound_next_boundary_cycles's call site directly - `dma_active`
        never becomes true for this entire file (d->play stays false
        throughout - Temple_of_Asherah.sndh's digidrum effects are pure
        MFP-timer/AY-envelope driven, not real STe DMA hardware). The
        whole dma_sound.c subsystem is provably inert for this file and
        cannot be the source.
      - MFP delay-period formula (mfp.c's get_mfp_delay: dr*koef*MC_BY_MFP,
        truncated to int64_t): read atari.pas's GetMFPDelay (atari.pas:
        389-392) side by side - identical formula, identical MFPKoefs
        array values (0,4,10,16,50,64,100,200), identical MCbyMFP
        constant (13/4=3.25, both sides compute this from the same
        MC68000Freq/MFPFreq ratio), and identical truncation convention
        (Pascal's trunc() and C's (int64_t) cast both truncate toward
        zero, not round - checked directly since a truncate-vs-round
        mismatch was the leading hypothesis here and would have
        compounded significantly over millions of reloads; both sides
        truncate identically, hypothesis falsified).
      - MFP timer reconfiguration formulas (mfp.c's calc_timer_cnt and
        set_timer_delay_mode, engine's port of atari.pas's CalcTimerCnt/
        SetTimerDelayMode, atari.pas:394-432): compared line-by-line -
        both the steady-state Cnt recomputation and the mid-flight
        prescaler-change Base rebasing formula (`Base := od - trunc((od-
        Base)*(koef[new]/koef[old]))`) are identical between the two
        engines, including truncation convention. This is the most
        complex, most dynamically-exercised piece of MFP logic (Timer A
        in particular is very likely reconfigured continuously through
        this file for its digidrum sample-rate control) and was the
        strongest suspected location for a subtle divergence; found
        none.
      - min=1 dispatch-guarantee capping (MIG-0053's need_dispatch_
        guarantee, atari_emulate.c): A/B tested directly (temporary env-
        var-gated toggle, removed after measurement) rather than reasoned
        about only - Musashi's own m68ki_check_interrupts() is called
        exactly ONCE per m68k_execute() call, before its dispatch loop,
        never per-instruction inside it (confirmed by reading m68kcpu.c's
        m68k_execute directly) - structurally identical to Starscream's
        own once-per-call exec_checkpoint. This means splitting one large
        exec() burst into many min=1 calls should be near-neutral for
        total charged cycles, in theory. Measured, not just reasoned:
        disabling the cap moved the 30s final cycle count from 243,248,236
        to 243,177,705 - a real but small 70,531-cycle effect (~2.2% of
        the ~3.2M-cycle gap, ~0.03% of the total render). Confirms the
        mechanism is very close to neutral as theory predicts, with a
        small non-zero residual not further chased (not the dominant
        mechanism, and disabling it risks reintroducing the "premature
        register writes" audible artifact it was built to prevent -
        MIG-0053's own documented tradeoff - so left unchanged rather
        than "fixed" for a marginal, unconfirmed net gain).

      STRONGEST REMAINING LEAD, NOT YET ROOT-CAUSED: Timer A (MFP vector
      77) services 113,874 times in this port's 30s render vs the
      oracle's 110,472 - a genuine 3.1% EXCESS in real interrupt
      services, not a coalesce/backlog artifact (assert count now exactly
      equals service count on this port post-MIG-0054, and coalesce for
      this vector is 0 - MIG-0056's earlier capture). Since the ledger
      reconciliation above already proved cycle_count only grows via
      Musashi's own honest, real execution results, 3,402 genuinely EXTRA
      real Timer A interrupt services necessarily consume genuinely extra
      real CPU cycles (ISR entry/exit, register pushes, handler body,
      RTE) - not phantom accounting. This is the most promising specific,
      concrete, falsifiable remaining lead for where the bulk of the
      ~3.2M-cycle gap actually lives, since Timer A dominates this file's
      total interrupt volume by a wide margin over Timers B/D. However,
      WHY Timer A specifically fires 3.1% more often - given its own
      reload-formula and reconfiguration-formula are now confirmed
      bit-identical to atari.pas's - was NOT pinned down within this
      investigation's scope: Timer A's period is very likely being
      dynamically reconfigured by the 68000 program throughout playback
      (typical for digidrum sample-rate control), which defeats a simple
      single "nominal period" comparison and would require substantially
      more granular per-reconfiguration-event tracing than was completed
      here to localize further.

      Still NOT closed as validated - this follow-up investigation
      produced real, evidence-backed progress (the ledger-reconciliation
      proof that no bookkeeping/double-counting bug exists anywhere in
      the cycle-count write path; conclusive rule-outs of VBL period, DMA
      sound, and both MFP timer formulas as sources, each verified
      against source and, where practical, empirically; a precise
      quantification of the min=1-cap mechanism's small real contribution
      ~2.2% of the gap) but did NOT identify and fix a single dominant
      root cause, despite systematic hypothesis testing per the request's
      explicit method. The strongest remaining lead (Timer A's 3.1%
      service-count excess, necessarily real extra CPU work given the
      ledger's proven honesty) is precisely measured but not yet traced
      to a specific, correctable mechanism - further work would need
      instrumentation tracking Timer A's dr/dm register writes and
      computed period against wall-clock/cycle position throughout the
      render (not built here) to determine whether its EFFECTIVE
      reconfigured period runs measurably shorter on this port than the
      oracle at specific points, and if so why, given the underlying
      formulas are now confirmed identical. No speculative fix was
      applied for this - per the request's explicit constraint against
      compensating constants or percentage corrections, and given no
      concrete, source-level defect was found to correct, only a
      symptom (the service-count excess) was measured, not a cause.

      Verification for this follow-up investigation: reconciliation
      check - sum(used) across 302,832 steps (30s render,
      AY_ENGINE_STEP_TRACE) = 243,241,138, exactly equal to that run's
      final cycle_count - zero unaccounted remainder. VBL: play_freq=200,
      vbl_period=40000 (exact, matches oracle). DMA: dma_active never
      true for this file (confirmed via instrumented probe, 5s render).
      MFP formulas: engine/mfp.c's get_mfp_delay/calc_timer_cnt/
      set_timer_delay_mode compared directly against atari.pas:389-432 -
      byte-for-byte identical formulas and truncation convention. min=1
      cap A/B test: cap enabled (default) final cycle 243,248,236; cap
      disabled (diagnostic-only, reverted after measurement) 243,177,705
      - a 70,531-cycle (~2.2% of gap) real, measured, non-dominant effect.
      Timer A (vector 77) service count: this port 113,874 vs oracle
      110,472 (+3.1%), with assert==service (no residual coalesce/
      backlog) - confirmed via fresh AY_ENGINE_IRQ_TRACE capture.
      tests/oracle_diff/run_diff.sh: 60/60 pass, 0 fail (fresh `make
      clean && make`, all diagnostic instrumentation removed before this
      final build). tools/ay_player/smoke_test.sh: 21/21 pass. No source
      changes were kept from this investigation (all temporary env-var-
      gated probes were added, measured, and reverted) - this entry
      records findings and rule-outs, not a fix, consistent with not
      having located a concrete, correctable defect to fix.

      TIMER A DEEP-DIVE (user-requested continuation: trace Timer A's full
      lifecycle - reconfiguration, reload, countdown, pending/service -
      event-by-event against the oracle, rather than assuming the excess
      service count is caused by a single large bug). Built matching,
      disabled-by-default (env-var-gated, same pattern as every other
      trace type in this project) instrumentation on BOTH sides, kept as
      permanent diagnostic infrastructure rather than removed:
      AY_ENGINE_TIMERA_TRACE (engine/mfp.c's trace_log_timera, new) and
      AY_EMUL_TIMERA_TRACE (TraceLog.pas's new TraceLogTimerA, same field
      order/event names so the two logs diff directly). Both log, at
      every Timer A control/data-register write and every expiration:
      cycle, event, the written value (writes only), DM, DR, Base, Delay,
      IE, IM - covering register programming, reload-value handling,
      countdown/period tracking, and IE/IM (enable/mask) state at each
      transition. Verified byte-for-byte SOURCE-LEVEL semantic parity
      first (per the request's explicit "establish semantics from source,
      don't infer from names" requirement): compared atari.pas's
      SetTimerDataRegister/SetTimerDelayMode/CalcTimerCnt (atari.pas:
      394-432) against mfp.c's set_timer_data_register/
      set_timer_delay_mode/calc_timer_cnt line-by-line and confirmed
      matching semantics for: (1) writing TAD while DM=0 (stopped)
      immediately reloads DR/Cnt; while DM<>0 (running) it only updates
      the register value used on the NEXT natural reload, the active
      countdown is untouched - confirmed directly in a live trace: a
      TAD write with the timer running left dr/delay completely
      unchanged in that same log line, then the FOLLOWING expire_after
      picked up the new value, on both engines identically; (2) changing
      DM while already running (DM<>0 to a different nonzero DM)
      rebases Base by the exact ratio of old/new prescaler koefficients,
      preserving phase rather than resetting it, identically on both
      sides; (3) DM transitioning to/from 0 (stop/start) does reset
      phase (via CalcTimerCnt's snapshot then a fresh Base computation),
      identically on both sides.

      EPOCH-LEVEL COMPARISON: partitioned a full 30s Temple_of_Asherah.
      sndh render into Timer A "configuration epochs" (a new epoch begins
      whenever a register write or a post-expiration reload changes
      DM/DR) on both sides and compared expiration counts per epoch,
      aligned by SEQUENCE order (not raw cycle, since a small pre-
      existing ~50-1000-cycle boot-time offset already exists and grows
      slowly - not the subject of this entry). Result: within the long,
      steady "digidrum running" epochs (DM=1, DR=51, ~663-cycle period,
      averaging ~1451 expirations each), per-epoch counts between the two
      engines are equal or within +/-1 of each other, and the CUMULATIVE
      difference across ~400+ matched epochs stays small and bounded
      (observed range: -18 to +2) - NOT growing toward the 3,402 total
      gap. This conclusively rules out a steady-state per-expiration
      timing defect: given a fixed Timer A configuration, this port
      generates expirations at the same rate as the oracle, epoch for
      epoch.

      ROOT CAUSE OF THE EXCESS: the 68000 program itself (not this port's
      MFP emulation) periodically STOPS and RESTARTS Timer A - a full
      "off, reprogram DR=25, one 325-cycle priming expiry, reprogram
      DR=51, run steadily at 663 cycles/expiry for ~1 second" cycle,
      repeating roughly every ~0.96-1.0s throughout the file (the
      digidrum sample's own natural loop/re-trigger cadence). This port
      executes 77 complete restart cycles in 30s versus the oracle's 74 -
      3 EXTRA complete cycles. Each restart cycle contributes ~1451
      expirations on average (measured: pas total across restart-cycle
      spans = 107,404 over 74 cycles; c11 = 111,724 over 77 cycles) - so
      3 extra cycles times ~1451 each = ~4354 predicted extra
      expirations, closely matching the measured 4,320-expiration excess
      confined to these spans specifically (a small ~918-expiration
      OFFSETTING difference exists outside/between restart spans,
      unexplored further - secondary and much smaller than the dominant
      effect). This fully and directly explains the previously-reported
      113,874-vs-110,472 (+3,402) total gap as (mostly) 3 extra complete
      digidrum re-trigger cycles, not a rate or accounting defect inside
      Timer A itself.

      This finding is a downstream SYMPTOM, not an independent MFP bug:
      the 68000 program's own logic decides when to restart the digidrum
      loop (almost certainly based on some other counter - a VBL tick
      count, an AY register/counter check, or similar - not traced in
      this pass), and if this port's overall emulated clock reaches that
      trigger condition's threshold measurably sooner than the oracle
      does per unit of real audio time (exactly the still-open, general
      ~1.34%/30s cycle-rate question this same MIG-0056 entry's earlier
      section investigated and did not fully root-cause), the program
      would naturally end up completing a few extra whole loop iterations
      by the end of a fixed-length 30s render - with EVERY expiration
      within each of those extra iterations being completely correct,
      honest, real Timer A behavior, not a miscount. The relative
      magnitude is consistent with this framing: 3 extra of ~75-78 total
      restarts is ~4%, in the same rough range as the previously-measured
      3.1% (Timer A service-count) and 1.34% (whole-render cycle-count)
      excess figures - not identical, but the same order of magnitude and
      direction, as expected for a cascading symptom of one shared
      upstream cause rather than three independent defects.

      Still NOT closed as validated, and still no code change applied -
      per the request's own explicit instruction not to propose a fix
      "based solely on the fact that the final interrupt count is high,"
      and having now traced the excess to its precise mechanism (3 extra
      complete restart cycles, not a rate defect), there is no MFP-level
      defect to correct: mfp.c's Timer A reconfiguration, reload, and
      countdown semantics are confirmed correct and matching atari.pas
      exactly, source-level and empirically (epoch-by-epoch), for every
      case exercised by this file. The true remaining root cause sits
      one layer up, in whatever causes this port's general cycle-count
      to run measurably ahead of the oracle per unit of real audio time -
      the same still-open question this entry's earlier section (VBL/DMA/
      MFP-formula/opcode-cost/min=1-cap rule-outs) already investigated
      without a conclusive answer. This Timer A deep-dive adds a new,
      concrete, falsifiable data point for that continuing investigation
      (a ~4% excess in a specific, observable software-level trigger
      cadence) but does not itself resolve it. Per the fix constraints
      (no compensating constants, no suppressing interrupts toward an
      expected count, no file-specific behavior, no altering verified-
      correct timer formulas without evidence they're wrong), no change
      was made to mfp.c or atari_emulate.c in this pass - the evidence
      points away from an MFP defect, not toward one.

      Verification for this Timer A deep-dive: trace instrumentation
      added and verified on both engines
      (AY_ENGINE_TIMERA_TRACE / AY_EMUL_TIMERA_TRACE, same schema) -
      kept as permanent, disabled-by-default diagnostic infrastructure,
      consistent with this project's other trace types. Source-level
      semantic comparison: atari.pas:394-432 vs engine/mfp.c's
      set_timer_data_register/set_timer_delay_mode/calc_timer_cnt -
      confirmed identical reload-timing, phase-preservation, and stop/
      start semantics. Epoch-level empirical comparison (30s Temple_of_
      Asherah.sndh, both engines): steady-state per-epoch expiration
      counts match within +/-1, cumulative drift bounded (-18..+2 across
      400+ epochs) - rules out a steady-state rate defect. Restart-cycle
      count: pas 74, c11 77 (+3, ~4%). Restart-cycle expiration totals:
      pas 107,404, c11 111,724 (+4,320, closely matching 3 x ~1,451-
      average-epoch-size = ~4,354 predicted). Overall Timer A service
      count gap (113,874 vs 110,472 = +3,402) is explained by this
      mechanism to within the precision of a small (~918-expiration)
      secondary offsetting effect outside restart-cycle spans, not
      further investigated. tests/oracle_diff/run_diff.sh: 60/60 pass, 0
      fail (fresh `make clean && make`, with the new trace instrumentation
      compiled in but inactive by default). tools/ay_player/smoke_test.sh:
      21/21 pass. No behavioral code change was made; this entry records
      a precise, evidence-backed localization of the remaining discrepancy
      to a downstream/upstream-caused symptom, not a fix.

      UPSTREAM SCHEDULER/TIMEBASE INVESTIGATION (user-requested
      continuation: move one level up from Timer A specifically and
      determine whether this port's CPU execution is racing ahead of the
      audio timebase itself, per the distinction "recorded cycles =
      cycles actually executed" does NOT prove "cycles executed = cycles
      warranted by rendered audio time"). Tested the leading hypothesis
      (uncarried scheduler debt/instruction-boundary overshoot) directly
      rather than assuming it, then found a materially new, system-wide
      clue that redirects the search.

      SCHEDULER-DEBT HYPOTHESIS - TESTED, NOT THE DOMINANT MECHANISM:
      engine/atari_emulate.c's design recomputes every deadline (`min =
      base_vbl + vbl_period - od`, and each MFP timer's own `t->base +
      t->delay - od`) freshly from LIVE a->cycle_count at the top of
      EVERY atari_emulate_step call - since cycle_count itself already
      includes any prior overshoot (it is simply incremented by the
      honest `used` value every call, never reset or separately
      tracked as a "budget"), any instruction-boundary overshoot is
      automatically absorbed into the next deadline computation for
      free. This architecture has no separate persistent "budget" or
      "debt" variable that COULD lose a remainder - the design is
      structurally different from (and not vulnerable to) the classic
      "budget -= consumed; clamp at 0" pattern that discards debt.
      Measured the actual overshoot distribution from the existing 30s
      AY_ENGINE_STEP_TRACE capture (302,832 steps) to confirm rather than
      assume: 179,708 steps show used>min (positive overshoot, summing to
      2,715,982 cycles, mean +15.1/occurrence - consistent with roughly
      one instruction's cost, as expected since a call can only overrun
      by finishing its in-flight instruction); 4,660 steps show used<<min
      (large early exits when an interrupt cuts a speculative large
      budget short). The positive-overshoot sum (2.7M) is superficially
      close in order of magnitude to the 3.2M gap, but this alone doesn't
      implicate it as the CAUSE: MIG-0056's earlier min=1-dispatch-
      guarantee A/B test (which controls the single largest source of
      small, overshoot-prone calls - 54.8% of all steps request min=1)
      already measured directly that disabling it only changes the final
      total by 70,531 cycles (2.2% of the gap) - if per-call overshoot
      were the dominant mechanism, eliminating the majority of small-
      budget calls should have removed most of the 2.7M, not 2.2% of the
      gap. This measured result, not just the structural argument above,
      is why uncarried debt is assessed as real but non-dominant, not
      ruled out by assumption.

      TIMER A RESTART TRIGGER LOCATED: extended AY_ENGINE_TIMERA_TRACE to
      also record PC/A6/D0 at each Timer A control-register write (engine/
      mfp.c's trace_log_timera, kept as permanent diagnostic
      infrastructure). Found: the STOP write (DM 1->0) executes
      consistently from PC=$004868 (with an alternate stop site,
      PC=$00482C, appearing later in the render - not investigated
      further, a second call site for the same logical action, not
      evidence of a bug); the RESTART write (DM 0->1, reprogramming
      DR=25 for a 325-cycle priming period before settling to DR=51/
      663-cycle steady state) executes consistently from PC=$0048DE. A6
      ($6228) and D0 ($4CE) are IDENTICAL across every observed
      restart, ruling out a per-restart-varying loop/index register as
      the trigger and pointing at fixed player-code logic, not
      per-invocation state. Measuring the actual INTERVALS between
      consecutive restarts (not assuming "roughly once per second" as
      the prior entry's shorthand had it) shows they are NOT evenly
      spaced: consecutive restarts cluster as close as ~960,000 cycles
      (0.12s) apart in bursts, separated by multi-second gaps with none
      at all (e.g. a ~47,000,000-cycle, ~5.9s gap observed directly in
      the trace) - consistent with a MUSIC-PATTERN/NOTE-EVENT-DRIVEN
      digidrum trigger (a real tracker-style player calling this from
      its per-row pattern-advance logic whenever a pattern row schedules
      a digidrum hit), not a fixed periodic clock. This rules out
      "Timer A has its own independent periodic re-trigger bug" as a
      category - the trigger is real player-code responding to musical
      content, and any given individual trigger's own correctness was
      not separately in question; what's in question is how many real
      seconds of content occur before 30 audio-seconds' worth of samples
      have been rendered.

      SYSTEM-WIDE SIGNATURE FOUND (the most significant new finding this
      pass): computed VBL's own assert rate per REAL RENDERED SECOND from
      the existing 30s AY_ENGINE_IRQ_TRACE/AY_EMUL_IRQ_TRACE captures -
      oracle: 5,994 VBL asserts over 1,440,256 rendered frames (30.005s
      at 48kHz) = 199.77 Hz; this port: 6,074 VBL asserts over 1,440,000
      frames (30.000s) = 202.47 Hz. The oracle lands almost exactly on
      the true 200Hz (matching vbl_period's own already-confirmed exact
      40,000-cycle/200Hz arithmetic); this port overshoots by +1.35% -
      essentially IDENTICAL in magnitude to the overall whole-render
      cycle-count excess (+1.353%) and to Timer A's own service-count
      excess (+3.1%, same direction, plausibly compounded rather than
      independent). VBL and MFP Timer A are structurally unrelated
      subsystems (different registers, different trigger logic, VBL
      driven purely by a fixed cycle_count modulus with no program
      involvement at all) - both showing the same-direction, same-order-
      of-magnitude excess proves this is NOT a Timer-A/digidrum-specific
      defect and NOT a per-instruction opcode-cost artifact (which would
      not manifest identically in a pure fixed-modulus counter like VBL
      with zero opcode execution involved in its own periodicity). Per
      the request's own divergence classification: this is a "timing-
      only" signature (the machine reaches equivalent audio output at a
      systematically different, and here MORE, elapsed-cycle cost), not
      a "functional state divergence" (no evidence of differing register/
      memory content driving the difference - VBL's periodicity involves
      no program-visible state at all) and not an "event-count
      divergence" in the sense of one extra spurious event (VBL's
      elevated RATE, not an isolated extra occurrence, is what's
      elevated). This decisively redirects the search: since VBL's own
      cycle-domain period is bit-exact, and Timer A's own formulas are
      bit-exact, and BOTH still fire proportionally more per REAL
      rendered second, the remaining defect must live in whatever
      RELATES cycle_count TO rendered audio-sample count - i.e. the
      audio-generation mechanism itself (ay_synthesizer_ay's tick
      accumulator, or the cadence at which it is invoked), not in any
      individual peripheral's own timing logic.

      NOT YET LOCATED WITHIN THIS PASS: a concrete defect in the audio-
      generation mechanism itself. ay_synthesizer_ay's tick-accumulator
      (Number_Of_Tiks, engine/ay.c) computes `tmp := number_of_tiks +
      (current_tact-previous_tact)*frq_ay_by_frq_z80`, only committing
      previous_tact forward on a successful (non-early-exit) update -
      this is, by construction, a monotonic linear accumulation that
      should be mathematically independent of how often it's called for
      a FIXED total elapsed cycle span (any call-frequency difference
      should only affect how finely the SAME total delta is split across
      calls, not the final accumulated total) - no overflow risk was
      found either (deltas are of order 10^3-10^5 cycles, ratio is
      ~2^27, products stay far below int64 range). frq_ay_by_frq_z80
      itself was already confirmed bit-exact (134,217,728, an exact
      power-of-2 relationship with no rounding ambiguity) in this entry's
      earlier section. Given the accumulator's own math appears sound on
      inspection, and time did not permit building the full dual-domain
      audio/cycle scheduler trace this request specifies (recording
      audio-frame index, cumulative target cycles, and accumulator state
      at every call), the search is narrowed but not concluded: the next
      concrete step is instrumenting ay_synthesizer_ay's OWN call
      frequency and per-call delta distribution against sample output,
      on both engines, to test whether call-cadence-dependent
      quantization in the accumulator (not the ratio, which is exact)
      is the final missing piece - not attempted here due to time.

