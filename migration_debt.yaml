      WRITER or a .ay (ZXAY) file WRITER at all. PlayList.pas's own
      MenuYM6/MenuZXAY are genuinely unimplementable as "just wire up
      existing logic" - they need brand-new file-format serializers
      written from scratch, a real engine-level scope, not a GUI-
      wiring task. Implemented the 3 formats that ARE real, existing,
      reusable library logic: WAV, VTX, PSG.

