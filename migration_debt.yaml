      FTypTools/SearchTool/FIDOTools/PListOpts, ~1247 Pascal lines -
      the largest single dialog in the original app, larger even than
      Mixer.lfm) before implementing, per the standing methodology.
      Found the large majority genuinely out of this port's scope:
       - FTypTools (Windows file-type registry association),
         Registration/CheckRegistration, GBMenu (Start Menu
         shortcuts), GBPrior (process priority), FIDOTools (Windows
         .lnk desktop-shortcut generation) - Windows-registry/shell-
         integration features with no Linux equivalent in scope.
       - CBStrPrescan (StreamPrescan) - BASS streaming-duration
         prescan, already out of scope (BASS).
       - CBForceLoop (Force_Loop) - traced to Players.pas:8730-8745's
         CheckLoopAndStop comment ("need for continue playback shorter
         module of TS-pair"): a TSMode/Turbosound-pair-only setting
         with zero effect on single-chip playback, already excluded
         by this port's own established scope boundary (MIG-0007).
       - CBDoubleSz (window Scale 1x/2x) - real, but a substantial
         separate rescaling project on its own (the skin bitmap, every
         button/LED/slider rect, and the window-shape region tables
         would all need to scale) - gui/src/regions.c's file comment
         already flagged "Scale" as its own deferred item; not folded
         into this entry to keep it bounded to what Tools.pas itself
         adds.
       - SearchTool (recursive tracker-file scan with per-format
         checkboxes) - functionally superseded by the playlist's own
         "Add Folder" (MIG-0071/0085), which already scans and adds
         every recognized format; a second scan-only tool would be
         redundant.

      Ported the genuinely portable subset: EMFolder (default_dir,
      the Open dialog's initial directory), EVisPeriod (the MIG-0094
      visualizer's sample-timer interval, 10-100ms range matching
      SetVisTimerPeriod's own guard exactly), and GBSkin's BChSkin/
      BStdSkin (runtime skin loading/reverting - wires up
      gui_skin_load_file, implemented in MIG-0064 but never actually
      called from anywhere until now, closing a gap gui/src/mainwin.c's
      own on_drag_data_received comment had explicitly flagged).

      Also added the ButTools button itself (MainWin.pas:3805-3806
      coordinates, previously never added to mainwin.c at all - see
      MIG-0069) and its 'P' keyboard shortcut, toggling the new Tools
      window the same way ButMixer/ButList toggle theirs.
    rationale: >
      Continuing Phase 5 per the user's explicit request for Tools.pas
      (acknowledging up front it's "mostly out-of-scope settings") and
      "a handful of minor standard dialogs" - the full dialog-status
      table in PHASE5_GUI_PROGRESS.md shows this was in fact the LAST
      unaddressed dialog of all 15 in ay_emul/*.lfm; every other one
      already had a done/superseded/out-of-scope resolution from
      earlier session work, so no further separate "minor dialogs"
      work remained once this entry landed.
    verification: >
      `cd gui && make` clean (-std=c11 -Wall -Wextra -Wpedantic, zero
      new warnings). One real correctness issue was caught and fixed
      during this entry's own review, before being reported as done:
      the initial implementation connected "focus-out-event" using a
      callback with "activate"'s (2-argument) signature - GTK's
      g_signal_connect performs no compile-time signature checking (it
      goes through a generic GCallback cast), so this compiled and
      likely would have "worked" in practice on x86_64, but is
      undefined behavior per the C standard (calling through an
      incompatible function-pointer type) and no other dialog in this
