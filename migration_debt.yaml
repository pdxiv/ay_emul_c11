      - it's a separate runtime fallback PlayItem would consult at PLAY
      time, matching gui_playlist_defaults's own pre-existing role here
      exactly (playback.c not consulting it is a separate, pre-existing,
      unrelated gap this entry doesn't touch). gui/src/playlist_win.c's
      Save button and every Add-file path now thread `&w->defaults`
      through.

      Multi-song .ay entries: traced AddPlaylistItem (PlayList.pas:2695-
      2703, a raw "allocate one slot" primitive with NO subsong-
      expansion) versus CheckAndAddFromPLFile/Add_Songs_From_File (the
      SEPARATE full-expansion path used ONLY for a bare path line with
      no `<...>` block at all) and found the real mechanism: EVERY .ayl
      line that has a block adds EXACTLY ONE entry, using FormatSpec
      (already a real, recognized-on-load token, just never written by
      this port) directly as the subsong index. gui_playlist_save_ayl
      now writes every subsong as its own path line + block (removing
      the earlier `if (song_index != 0) continue` skip), with
      `FormatSpec=<song_index>` for song_index > 0 (SavePLItem:1685-1692's
      own `(FormatSpec > 0) and IsZ80EmuFileType(...)` condition, which
      for this port only ever applies to FT.AY - the only format whose
      song_count exceeds 1 here). gui_playlist_load_ayl gained a new
      add_single_song_entry helper (mirrors gui_playlist_add_file's own
      per-song body without its expansion loop) and now calls it
      UNCONDITIONALLY for every block-having line (song_index = FormatSpec
      if present, else 0) instead of the old gui_playlist_add_file call -
      a real bug was caught and fixed during this entry's own testing:
      calling gui_playlist_add_file for a multi-song file's own song-0
      line (which never carries a FormatSpec, since 0 is never written)
      silently re-expanded ALL subsongs on top of the ones each
      subsequent FormatSpec=N line was already adding individually (12
      lines -> 23 entries, not 12) - caught by this entry's own new
      round-trip test, not by inspection.
    rationale: >
      Direct continuation of MIG-0091's own explicitly disclosed scope
      boundary, closed exactly as the user asked: using the original's
      own real mechanisms (AddPlaylistItem's non-expanding single-add,
      PLDef's own diff-on-save semantics) rather than inventing new
      ones. The version-0 PlayerFrequency*1000 legacy scaling quirk
      (both the pre-existing per-item case and the newly-touched PLDef
      case) remains explicitly out of scope, same reasoning as MIG-0091
      originally gave: version-0 .ayl files are from a long-superseded
      format revision with no known real sample to validate against.
    verification: >
      `cd gui && make` clean (-std=c11 -Wall -Wextra -Wpedantic, zero
      new warnings). tests/oracle_diff/run_diff.sh: 143/143 PASS, 0 FAIL
      (unaffected - this entry touches only gui/playlist, not engine/).
