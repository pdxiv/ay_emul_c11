    verification: >
      Confirmed via direct read of AY.pas:19-33 - alternate tables are
      commented out or unreferenced by any live code path.

  - id: MIG-0005
    title: "Differential validation against original Ay_Emul binary"
    subsystem: engine
    state: validated
    summary: >
      engine/z80_bus.c and engine/ay.c are differentially validated against
      the ORIGINAL Pascal Z80.pas/AY.pas (not just tests/engine_smoke's
      self-consistency checks) via tests/oracle_diff/run_diff.sh, which
      drives synthetic Z80/AY instruction and register sequences through
      both implementations and byte-compares register state and PCM output.
      All 6 scenarios pass: zx, cpc, immediate (register-level), and pcm,
      pcm_filtered, pcm8 (PCM-level, byte-identical output).
    rationale: >
      This closes the CPU/port-decode/mixer-logic scope of differential
      validation this milestone set out to achieve. It does NOT cover real
      chiptune **file** parsing (no format-parser exists in engine/ yet -
      Players.pas is a later milestone) or real-world sample-rate/AY-clock
      calibration end-to-end (the pcm/pcm_filtered/pcm8 scenarios use
      directly-injected register writes and a simplified, deterministic
      tick-rate setup, not Players.pas's MakeBufferAY loop) - that remains
      open for the Players.pas milestone, tracked separately if it surfaces
      new gaps.
    verification: >
      tests/oracle_diff/run_diff.sh (all 6 scenarios PASS). The oracle
      harness itself (ay_emul/OracleHarness.pas) is committed to the
      ay_emul submodule's own local git history (not pushed upstream) as an
      optional, env-var-gated diagnostic entry point that leaves normal use
      of that program unaffected.

  - id: MIG-0006
    title: "superzazu/z80's port_in/port_out only expose the low 8 bits of the port"
    subsystem: engine/z80_bus
    state: validated
    summary: >
      superzazu/z80's port_in/port_out callbacks pass only z->c (for the
      ED-prefixed IN r,(C)/OUT (C),r family) or an immediate operand byte
      (for IN A,(n)/OUT (n),A), never the full 16-bit port real Z80.pas
      decode logic needs (confirmed: PortMask=$c002 distinguishes
      $FFFD/$BFFD by bit 14, which lives in B, not C). Worked around by
      pre-decoding the next opcode at z80_bus_step() time
      (predecode_next_port_op) to know whether the upcoming port op is the
      BC-indirect form (reconstruct high byte from z->b) or the immediate
      form (reconstruct from z->a), since data==z->a coincide for the
      immediate OUT (n),A case.
    rationale: >
      This is architecturally the only way to recover the missing byte
      from superzazu/z80's callback shape without patching the vendored
      library - the z80* struct passed to the callback exposes the full
      register file, so reconstruction is exact, not approximated, for the
      BC-indirect and immediate-A forms. Real AY-chiptune code overwhelmingly
      uses the BC-indirect form (LD BC,port:OUT (C),A) for exactly this
      reason (immediate OUT (n),A cannot address a 16-bit AY port
      meaningfully) - see MIG-0006b below for the one remaining edge case.
    verification: >
      tests/engine_smoke/test_z80_bus.c's test_zx_protocol/
      test_cpc_protocol_explicit exercise the BC-indirect form end-to-end
      through real Z80 OUT (C),A instructions and confirm correct
      register/value pairs reach on_ay_write.

  - id: MIG-0006b
    title: "Immediate OUT (n),A port reconstruction validated; IN A,(n) and real-file usage still open"
    subsystem: engine/z80_bus
    state: behaviorally_incomplete
    summary: >
      reconstruct_port()'s use of z->a as the high byte for the immediate
      form is now differentially validated for OUT (n),A specifically
      (tests/oracle_diff's "immediate" scenario: select register 9 via the
      BC-indirect form, then write it via `LD A,$BF: OUT ($FD),A` hitting
      port $BFFD - oracle and engine agree byte-for-byte, register 9 ends
      up 31 (0x1F) in both, i.e. AY.pas's own SetAmplB 5-bit register mask
      applied to $BF). Writing this test also confirmed by direct
      construction why the immediate form can't select an arbitrary
      register via $FFFD (A supplies both the port high byte and the
      written data simultaneously - $FF is not a valid 0..13 register
      index) - this is a structural property of the hardware/protocol, not
      an engine limitation. Still open: IN A,(n) specifically (no test),
      and confirming no real in-scope chiptune file ever uses the immediate
      form (still needs a real-file corpus - Players.pas milestone).
    rationale: >
      Meaningfully de-risked but not fully closed - the one case that
      matters most (OUT (n),A, since that's the only immediate-form access
      that could plausibly appear in real code) is now verified against the
      original; IN A,(n) and real-file confirmation remain for the
      Players.pas milestone's real-file differential corpus.
    verification: >
      tests/oracle_diff/run_diff.sh's "immediate" scenario passes
      (oracle and engine registers identical).

  - id: MIG-0007
    title: "Turbosound / dual-chip (TSMode) support - redirected to the future tracker-format-player milestone"
    subsystem: engine/ay
    state: behaviorally_incomplete
    summary: >
      AY.pas's SoundChip is a 2-element array and Synthesizer_Stereo16 etc.
      conditionally mix a second chip when TSMode is set (dual-AY
      "Turbosound" hardware support). engine/ay.c ports only SoundChip[0]
      (single chip) - see ay.h. Investigated this milestone to see whether
      it could be closed alongside the other AY.pas gaps; it cannot be, for
      a structural reason, not a scoping choice: TSMode is set ONLY by
      Players.pas's tracker/module-replayer subsystem (PT3 dual-file
      detection, Players.pas:2665-2686) - confirmed zero references to
      TSMode or SoundChip[1] anywhere in Z80.pas. The real hardware/
      Z80-OUT-port path this milestone's engine/ covers never drives a
      second chip, in the original either.
    rationale: >
      Adding a second ay_chip + mixer-loop flag to engine/ay.c now would be
      unvalidatable busywork - nothing in this milestone's scope could ever
      set ts_mode, so there would be no way to test it against the oracle.
      Genuine Turbosound support belongs entirely to the future
      tracker-format-player milestone, alongside the register-feed logic
      (PT3_Get_Registers et al.) it's inseparable from - tracked here so
      that milestone's plan picks it up rather than rediscovering this.
    verification: >
      Confirmed via grep across the whole ay_emul submodule: TSMode and
      SoundChip[1] appear only in AY.pas (mixer-side consumption) and
      Players.pas's tracker-format code (the only place either is ever
      set) - never in Z80.pas.

