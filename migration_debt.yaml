      and the harness are independent transcriptions of the same original
      source lines, so their agreement still meaningfully cross-checks the
      translation, though it is one step short of calling the shipped code
      path verbatim.

  - id: MIG-0012
    title: "Musashi 68000 core integrated and validated against the original's precompiled Starscream core"
    subsystem: engine/m68k_bus
    state: validated
    summary: >
      engine/m68k_bus.c wraps Musashi (engine/third_party/musashi,
      MIT-licensed, replacing the original's precompiled "Starscream"
      object file per PORTING_TO_C11_LINUX.md §3.2/§7.1) with a generic
      address-range memory-region mechanism (flat buffers or read/write
      callbacks, mirroring Starcpu.inc's TSTARSCREAM_DATAREGION/
      PROGRAMREGION) and an interrupt-ack hook matching
      s68000interrupt(level,vector)'s contract. Musashi's core memory
      hooks (m68k_read_memory_8/16/32 etc) are fixed-name, link-time
      functions, not a runtime callback struct - Musashi is a singleton
      core; the adapter holds one process-wide "active bus" pointer
      (acceptable since ay_emul never runs two 68000s concurrently).
    rationale: >
      No ZEXALL-equivalent test suite exists for 68000 cores/Musashi (it
      cites long-term use in MAME as its validation pedigree, and ships
      only an internal test/ harness needing a cross-toolchain to
      regenerate). The oracle-differential technique already built and
      proven for Z80/AY this session filled that gap directly: the
      original's Starcpu64L.o is still linked into the existing app and
      was exercised via a new ay_emul/OracleHarness.pas scenario (m68k),
      driving both it and engine/m68k_bus.c with an identical synthetic
      68000 program (MOVEQ/MOVEQ/ADD.L/MOVE.L/STOP) and comparing register
      state, PC, and a memory write. Building this surfaced and confirmed
      a real Starscream implementation detail: its direct-offset memory
      access (used for instruction fetch, which has no callback
      alternative) requires memory pre-transformed by a 16-bit byte swap
      (atari.pas's IntelizeMemory, a speed optimization) - the oracle
      harness replicates that transform; engine/m68k_bus.c needs no such
      transform since it always composes words from individual big-endian
      byte reads. Per PORTING_TO_C11_LINUX.md §8.1, Starcpu64L.o is used
      here strictly as a local test oracle, never linked into or
      redistributed with the C11 port itself - the port uses Musashi
      exclusively.
    verification: >
      tests/oracle_diff/run_diff.sh's "m68k" scenario passes: identical
      D0, PC, and memory-write results between the real Starscream core
      and engine/m68k_bus.c. tests/engine_smoke/test_m68k_bus.c additionally
      covers flat-memory writes and the callback-region mechanism
      (self-consistency, not yet exercised against the oracle, since no
      real hardware register is wired up this milestone - see MIG-0014).

  - id: MIG-0013
    title: "MFP timer emulation ported and validated"
    subsystem: engine/mfp
    state: validated
    summary: >
      atari.pas's EmulateTimer/MFP_Registers (atari.pas:111-160,356-491)
      emulate the Atari ST's MFP68901's four timers (A-D), which drive
      SNDH's common playback frequencies (sndh.pas's TPlayGen: GenTA..GenTD)
      and gate interrupts into the 68000 core. Ported to engine/mfp.c/.h:
      the 24-byte register file, four mfp_timer structs, mfp_emulate_timer
      (the countdown/reload logic), and register read/write handlers
      matching SetMFPRegister/mfp_readbyte's decode, exposed as an
      m68k_bus callback region at $FFFA00-$FFFA2F.
    rationale: >
      Interrupt DELIVERY intentionally differs from the original - see
      MIG-0013b. The countdown/reload timing and register semantics
      (the actual "MFP emulation" this entry is about) are a faithful,
      validated port.
    verification: >
      tests/oracle_diff's "mfp" scenario: identical countdown-until-fire
      values and IPR-bit-set behavior between atari.pas's real EmulateTimer
      (via ay_emul/OracleHarness.pas's RunMFPTest, driving the new
      Oracle_MFP_* API added to atari.pas for this purpose) and
      engine/mfp.c. tests/engine_smoke/test_atari.c additionally covers
      live-countdown register reads and a full CPU-driven interrupt-firing
      integration test (see MIG-0013b for why that full-delivery path
      isn't oracle-compared).

  - id: MIG-0013b
    title: "MFP/VBL interrupt DELIVERY model deliberately differs from the original (Starscream polling vs Musashi level-triggered)"
    subsystem: engine/mfp
    state: validated
    summary: >
      Discovered while building the "mfp" oracle scenario: atari.pas's real
      EmulateTimer, when a timer's interrupt is both enabled (IE) and
      unmasked (IM), attempts synchronous delivery inline
      (s68000interrupt(6,vector)) and - since Starscream reports success
      against a minimal/degenerate CPU context - immediately auto-clears
      the IPR bit it just set, all within the same EmulateTimer call. This
      is Starscream's own "push this vector now, tell me if taken"
      polling model. engine/mfp.c (and engine/m68k_bus.c/atari_emulate.c
      generally) instead model real level-triggered 68000 interrupt
      hardware: IPL lines asserted via m68k_bus_set_irq, consumed by
      Musashi at its own next eligible instruction boundary via the
      int_ack callback (mfp_ack_interrupt) - there is no "attempt delivery
      inline while computing timer state" step, and none is needed, since
      the CPU services it on its own. The original's per-timer ICnt
      retry counter (for when synchronous delivery fails) is likewise not
      replicated - unnecessary under the level-triggered model.
    rationale: >
      This is the same category of decision as MIG-0001 (Z80 IM0/IM1
      timing): a real, deliberate difference driven by the replacement
      library's architecture, recorded so it's never mistaken for an
      unverified gap. The oracle's "mfp" scenario is deliberately designed
      (IMRA left unmasked=0) to compare only the parts that ARE directly
      comparable between the two models (countdown timing, IPR-bit-set on
      fire) - see RunMFPTest's comment in OracleHarness.pas for the full
      reasoning. Full interrupt-delivery-and-service correctness is
      instead validated via tests/engine_smoke/test_atari.c's
      test_atari_emulate_vbl_scheduling, a real CPU-executed program with
      an interrupt handler, run purely against engine/ - not comparable to
      Starscream's polling model, but a complete demonstration that
      Musashi's level-triggered delivery works end-to-end (99 VBL
      interrupts fired, 99 handler invocations counted).
    verification: >
      tests/engine_smoke/test_atari.c's test_atari_emulate_vbl_scheduling
      (self-consistency, real interrupt delivery via Musashi).
      tests/oracle_diff's "mfp" scenario (register/timing-level agreement
      on the parts common to both models).

  - id: MIG-0014
    title: "DMA sound emulation and YM2149 region wiring ported and validated"
    subsystem: engine/dma_sound
    state: validated
    summary: >
      atari.pas's DMA sound (digital sample playback: start/end/rate/loop/
      mono registers, atari.pas:286,738-891) is ported to
      engine/dma_sound.c/.h: Ctrl_DMASnd's state-machine transition,
      stedac_readbyte/writebyte's register decode (including the live
      position-counter reads), and Atari_MixDMASnd's per-sample fetch/
      scale/hold mixing logic - exposed as an m68k_bus callback region at
      $FF8900-$FF89FF and wired into engine/ay.c's mixer via the new
      on_mix_dma hook (MIG-0008). YM2149 region wiring ($FF8800-$FF88FF,
      engine/src/atari_emulate.c's ym_region_read/write) dispatches
      straight into the already-ported engine/ay.c/ay_chip, confirmed
      (this milestone's oracle work) to match atari.pas's
      soundchip_readbyte/writebyte, which never implements a separate
      YM2149 model either.
    rationale: >
      Closed as planned. STE Microwire ($FF8922-25) is ported as the same
      dummy bit-shifter stub the original uses (confirmed zero audio
      effect in the original too - not a simplification). Not ported:
      DMASndSkipMC68000Takts (confirmed, this milestone, called ONLY when
      Seeking=True - Atari_SeekTo/SynthesizerSNDH's seek branch - never
      during normal forward playback; deferred with the rest of seek/scrub
      support, see MIG-0017) and the original's reentrant SynthesizerSNDH
      flush inside the $FF8901 Ctrl write handler (atari.pas:817-828) -
      render-loop orchestration, out of scope until a real render-loop
      caller exists (MIG-0015).
    verification: >
      tests/oracle_diff's "dma" scenario: byte-identical mixed output
      between atari.pas's real Atari_MixDMASnd (via
      ay_emul/OracleHarness.pas's RunDMATest, driving the new Oracle_DMA_*
      API added to atari.pas) and engine/dma_sound.c. Building this
      scenario caught a real bug before it shipped: dma_sound_mix's
      ay_freq parameter needs atari.pas's OWN AyFreq global (2000000.0,
      Atari_SetDefault) - a completely different value from settings.pas's
      AY_Freq (1773400, the ZX Spectrum's clock) despite the near-identical
      name. tests/engine_smoke/test_atari.c/test_m68k_bus.c's
      test_callback_region additionally cover the mechanism generically.

  - id: MIG-0015
    title: "Atari_Emulate's cycle-budget/interrupt-scheduling loop ported and validated"
    subsystem: engine/atari_emulate
    state: validated
    summary: >
      atari.pas's Atari_Emulate (atari.pas:1436-1523) - the per-tick driver
      analogous to Z80's Z80_Step/MakeBufferAY loop - is ported to
      engine/atari_emulate.c's atari_emulate_step: computes a bounded
      cycle budget per call from the nearest upcoming event across VBL,
      all 4 MFP timers (mfp_emulate_timer), and DMA-sound sample
      boundaries (dma_sound_next_boundary_cycles), executes exactly that
      many 68000 cycles (m68k_bus_exec), injects the VBL interrupt on
      schedule (level 4, autovectored, with the same accept-or-retry-with-
      10%-slack fallback as the original), and flushes the AY mixer
      (ay_synthesizer_ay - the SynthesizerSNDH equivalent) when DMA sound
      is active.
    rationale: >
      Closed for the scheduling logic itself. NOT wired to a real
      render-loop caller (MakeBufferSNDH) or SNDH file loading - that
      needs Players.pas (Phase 2) to exist first, the same reasoning that
      left MakeBufferAY for later in the Z80/AY milestone. The original's
      Starscream-32-bit-odometer renormalization (tripOdometer) is not
      replicated - engine/atari_emulate.c accumulates a plain 64-bit cycle
      counter with no realistic overflow risk, a documented, deliberate
      simplification (see engine/include/ay_engine/atari_emulate.h).
    verification: >
      tests/engine_smoke/test_atari.c's test_atari_emulate_vbl_scheduling:
      a full, real 68000 program (with an interrupt vector table entry and
      handler) driven through 200 atari_emulate_step calls, confirming VBL
      interrupts fire on schedule and are correctly serviced (99/99 fires
      counted). See MIG-0013b for why this integration-level interrupt-
      delivery test is self-consistency-only, not oracle-compared.

  - id: MIG-0016
