          gate - see MIG-0021 for the precise findings.
    rationale: >
      Closed as validated for the 4 formats engine/ay_player fully
      supports (AY/YM/PT3/VTX): byte-for-byte identical WAV output
      (header + exact PCM content) confirmed via `cmp` for a real file in
      each, at frame counts chosen to either exercise the format's full
