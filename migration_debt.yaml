  - id: MIG-0109
    title: "Turbosound / dual-chip (TSMode) support, Phase A: engine mixing + PT3 self-pairing - closes the engine+PT3 half of MIG-0007"
    subsystem: engine/ay, engine/pt3_file
    state: validated
    summary: >
      Ports AY.pas's TSMode dual-chip mixing (engine/ay.h/ay.c: new
      ay_engine.chip2/ts_mode fields, TSMode branches added to
      ay_synthesizer_stereo16/mono16/stereo8/mono8 mirroring AY.pas:
      658-663's `if TSMode then begin SoundChip[1].Synthesizer_Logic_Q;
      SoundChip[1].Synthesizer_Mixer_Q; end`) AND PT3's own self-pairing
      mechanism (a single .pt3 file with Version>=7 and a non-space byte
      at file offset 98 - `Ord(ZRAM.PT3_MusicName[98])`, confirmed via
      Players.pas's ModTypes variant record that PT3_MusicName[N] IS
      file byte N - triggers real 2-chip audio with no second file
      needed, Players.pas's TrModLoaded, 2643-2693).

      engine/pt3_file.c/.h: pt3_file now holds `pt3_voice voice[2]`
      (renamed from flat single-voice fields) - voice[0] is
      Players.pas's PlParams[0].PT3, voice[1] is PlParams[1].PT3, only
      driven when ts_mode. Header-derived config (version, ton_table_id,
      patterns_pointer, samples/ornaments_pointers, number_of_positions,
      loop_position, position_list_offset) stays SHARED (single copy),
      matching Players.pas's own `PLConsts[1] := PLConsts[0]` whole-
      record copy at pairing time - both voices read pattern/sample/
      ornament data from the SAME loaded file bytes, only PLConsts[1].TS
      (this port's ts_byte) genuinely differs.

      pt3_get_registers (renamed pt3_get_registers_voice, taking an
      explicit voice_idx exactly like the original's own CNum parameter
      already did) writes into ay.chip or ay.chip2 depending on
      voice_idx, and voice[1]'s own position-index formula
      (`i := TS*3-3-i`) is applied at both load-time init and per-frame
      position advance. pt3_file_make_buffer now drives BOTH voices'
      pt3_check_loop_and_stop/get_registers_voice each frame when
      ts_mode (mirroring MakeBufferTracker's own `if TSMode then
      All_GetRegisters[1](1)`), and real_end_all is the genuine AND of
      both voices' own natural-end condition (Real_End[0] and Real_End[1]
      when TSMode, matching MakeBufferTracker's own
      `Real_End_All := Real_End_All and Real_End[0]; if TSMode then ...
      and Real_End[1]` exactly) - NOT silently collapsed to voice 0's
      alone.

      pt3_get_time (GetTimePT3, MIG-0101) is now ALSO TS-aware: it walks
      voice 1's own pattern data (`vars[1]`) too when ts_mode, stopping
      each position's row-walk as soon as EITHER voice's channel A hits
      an end-of-pattern marker, matching the original's own
      `if not PatInt(0) then break; if TS<>$20 then if not PatInt(1)
      then break;` exactly - the pre-existing "TSMode's vars[1] half is
      skipped, equivalent to TS=$20" framing (a scope decision made
      before TSMode was reachable at all) is now genuinely stale and has
      been corrected here, not left silently inconsistent with the
      newly-ported dual-chip mixing.

      A genuinely separate, real cross-voice interaction was also found
      and ported: PT3's effect-9 (tempo change) pattern command
      cross-writes BOTH voices' tempo when ts_mode is active
      (Players.pas:12584-12594's `if TSMode and (PLConsts[1].TS <> $20)
      then begin PlParams[0].PT3.Delay := b; PlParams[0].PT3.
      DelayCounter := b; PlParams[1].PT3.Delay := b; end` - note the
      asymmetry, faithfully reproduced: only voice 0's DelayCounter is
      forced, never voice 1's, regardless of which voice's pattern
      triggered the effect). This had previously been flagged inline in
      this port's own source as "TSMode paired-delay sync not ported -
      MIG-0007" - now resolved, not left as silent debt.
    rationale: >
      MIG-0007's own "unvalidatable busywork" rationale for declining
      this milestone assumed TSMode could never be reached from this
      port's own scope (PT3's tracker-format player wasn't ported yet).
      That premise is now stale - PT3 is fully ported (MIG-0020/0040/
      0101) and DOES reach TSMode via its own self-pairing tag, exactly
      like the real Pascal does, with zero playlist/GUI involvement
      needed. This phase (Phase A) closes exactly that reachable slice:
      the engine mixer + PT3's own single-file self-pairing. Explicitly
      NOT attempted here (a deliberate, separate follow-up, Phase B):
      playlist/.ayl Next-chain pairing of two SEPARATE files (Players.pas
      TrModLoaded's `else if (TSMode = False) and
      (PlayListItems[Index]^.Next <> nil) then ...` branch) and any GUI
      pairing UI - both require the playlist subsystem, out of this
      phase's scope per the approved plan.
    verification: >
      Full existing regression suite re-run before AND after this
      change: tests/oracle_diff/run_diff.sh (exit 0, all PASS),
      tests/oracle_diff/corpus_wav_md5_sweep.sh (70 passed / 0 failed /
      1 known-non-identical [MIG-0056, unrelated] / 2 known-non-
      identical [this entry, see below] / 0 skipped), tools/ay_player/
      smoke_test.sh (all PASS). ts_mode defaults to false and every
      pre-existing single-chip PT3 file (every corpus file except the
      2 real TS-tagged ones below) produces BYTE-IDENTICAL output to
      before this change - confirmed via the full sweep re-run, not
      assumed.

      REAL oracle-diff coverage achieved for the dual-chip path itself -
      not formula-derived confidence. A new AY_EMUL_ORACLE scenario,
      `ts_pair_pt3` (ay_emul/OracleHarness.pas's
      RunPT3TSPairWAVExportTest, a near-copy of the pre-existing
      RunPT3WAVExportTest that genuinely activates TSMode/PLConsts[1]
      for a TS-tagged file instead of RunPT3WAVExportTest's own
      hardcoded `TSMode := False`), was added and driven against the
      only 2 real TS-tagged files in test_corpus_76 (found via a byte-98
      scan of all 76 corpus files, cross-checked against version>=7):
      Alone_Coder_-_PARAM_TS.pt3 (byte98=0x30) and
      Shiru_-_kirby_bq_ver.pt3 (byte98=0x30) - both real, not
      synthesized. Result: BYTE-FOR-BYTE IDENTICAL between the real
      Pascal oracle's genuine dual-chip PCM output and this port's own
      ay_player output for BOTH files (md5 9a62190afa86da6ed5be71d486f
      6df71 and 44076b98a951da0e34ab1919a27b7f32 respectively, verified
      via `cmp`, exit 0). This is now a permanent regression gate: added
      to tests/oracle_diff/run_diff.sh (a dedicated ts_pair_pt3 block)
      and tests/oracle_diff/corpus_wav_md5_sweep.sh (special-cased via
      run_one_known_ts_pt3, since the SWEEP's own default wav_export_pt3
      scenario is single-chip-only by its own hardcoded design and can't
      validate these 2 files - see that script's own TSMODE-KNOWN
      comment).

      Audible-difference confirmation (matching MIG-0107's own standalone
      differential-check rigor): rendered Alone_Coder_-_PARAM_TS.pt3
      twice, once with real ts_mode auto-detection active (md5
      9a62190a...) and once with detection forced off via a temporary
      debug hook (md5 83e8c2e6... - which exactly matches the ORIGINAL
      single-chip-only wav_export_pt3 oracle scenario's own md5,
      confirming the single-chip path is byte-for-byte unaffected) -
      `cmp` confirms the two WAV files differ starting at byte 143,
      proving chip 2's contribution is genuinely present and audible in
      the dual-chip output, not silently zero. The debug hook was
      removed after this one-off verification, not shipped.

      `cd engine && make` and `cd gui && make`: both zero warnings, zero
      errors (-std=c11 -Wall -Wextra -Wpedantic).
    debt:
      - "AY.pas's TSMode second visualization slot (TVisPoint.R[1],
        SoundChip[1]'s own register snapshot) was NOT ported in this
        entry - RESOLVED by MIG-0110, which ports it in full."
      - "Phase B (playlist/.ayl Next-chain dual-FILE Turbosound pairing,
        so two SEPARATE files of possibly different tracker formats can
        be paired, not just PT3's own self-tagged single-file case) is a
        deliberate, separate follow-up NOT attempted in this phase - see
        rationale above."
      - "While porting this, found and fixed a genuinely SEPARATE,
        pre-existing bug in engine/src/formats/fxm_file.c (FXM's
        PatternInterpreter-equivalent bytecode VM): opcodes 0x83/0x89/
        0x90 indexed chan->stek[stek_len-2]/[stek_len-1] with no bounds
        check, matching the original Pascal's own equally-unguarded
        `Stek[i-2]`/`Stek[i-1]` (Players.pas:11866-11949) - a call/loop-
        stack underflow that's undefined behavior in C (unlike Pascal,
        which at least has a well-defined, if also incorrect, memory
        layout to read garbage from). This was unmasked (not caused) by
        ay_engine growing (the chip2 field added by this entry, embedded
        in every format struct including fxm_file's own `ay_engine ay`
        field) shifting main()'s huge stack frame layout in tools/
        ay_player just enough to turn a previously-silent OOB read/write
        into an observed stack-canary corruption (`*** stack smashing
        detected ***`) when rendering The_Last_V8.fxm - confirmed via
        gdb disassembly/watchpoints and a minimal padding-only
        reproduction (adding unrelated padding bytes to ay_engine alone,
        with zero TSMode logic, reproduced the exact same crash).
        Guarded with explicit bounds checks (skip the loop-control
        effect / advance past the opcode / leave state unchanged,
        depending on the opcode) rather than only fixing the exposure
        vector - believed unreachable for well-formed FXM pattern data
        (matching the original's own apparent assumption), but no longer
        undefined behavior if it ever is reached. Full regression suite
        (including a dedicated FXM wav_export/PCM gate) confirms
        byte-identical output to before this fix for every real corpus
        file, so this was a pure safety hardening, not an observed
        behavior change for any real file. Not given its own MIG-#### id
        since it's a straightforward bounds-check hardening with zero
        behavioral debt of its own (no incompleteness, no approximation,
        fully validated) - recorded here only because it was discovered
        and fixed as a direct side effect of this entry's own struct
        changes, per this workspace's porting invariants."

  - id: MIG-0110
    title: "Turbosound / dual-chip (TSMode) support, Phase B (visualizer half): GUI spectrum/amplitude visualizer now shows chip 1's contribution too - closes MIG-0109's own visualizer follow-up"
    subsystem: engine/ay, gui/visualizer
    state: validated
    summary: >
      Ports AY.pas's TVisPoint.R[1] slot end-to-end - the piece MIG-0109
      explicitly deferred when it ported TSMode dual-chip audio mixing:
      dual-chip AUDIO was already correct, but the GUI visualizer only
      ever showed chip 0's register state during Turbosound playback,
      never chip 1's, even though the real Pascal visualizer always has.

      engine/include/ay_engine/hw/ay.h, engine/src/hw/ay.c: ay_vis_point
      (AY.pas: TVisPoint) is restructured from a single flat per-chip
      record into `ay_vis_reg r[2]` (AY.pas: TVisPoint.R[0..1]) plus one
      shared `calc` flag, matching the original's own record shape
      exactly (TVisPoint = record R: array[0..1] of ...; Calc: integer;
      end - AY.pas:106-112). ay_engine_fill_vis (FillVis, AY.pas:587-619)
      captures chip's registers into r[0] unconditionally and chip2's
      into r[1] ONLY `if TSMode` at capture time, matching AY.pas:602-603
      exactly (`if TSMode then with VisPoints[MkVisPos].R[1],
      SoundChip[1].RegisterAY do ...`) - r[1] is left untouched (whatever
      it held from a previous point) when ts_mode is off at capture time,
      a real, deliberately-reproduced property of the original, not an
      oversight. ay_vis_calc (AYVisualisation's Calc block, AY.pas:
      5319-5344's `for i := 0 to 1 do ... if not TSMode then break`) now
      takes the engine's CURRENT ts_mode (read by ay_engine_get_vis_point
      at GET time, not whatever it was at capture time - matching the
      original's own live-global-read exactly) and processes r[1] only
      when that's true, so a point captured with TSMode on but read back
      after TSMode was turned off (or vice versa) reproduces the
      original's own real, mutable-global-driven quirk rather than a
      fixed capture-time snapshot.

      gui/include/gui/visualizer.h, gui/src/visualizer.c:
      gui_visualizer_tick now reads engine->ts_mode directly (the field
      was already public) and, when true, folds chip 1's contribution in
      exactly like MainWin.pas does: RedrawVisChannels' amplitude bars
      (MainWin.pas:5402-5410 - `T := R[0].AmpA; if TSMode then if
      R[1].AmpA > T then T := R[1].AmpA` etc, i.e. per-channel MAX across
      both chips) and RedrawVisSpectrum's log-scale bucketing
      (MainWin.pas:832-846's own `for n := 0 to 1 do ... if not TSMode
      then break`, each chip's 3 channels bucketed into the same
      spa_points table, taking the max amplitude per bucket across both
      chips' contributions).
    rationale: >
      MIG-0109 deliberately deferred this as a separate follow-up because
      it required touching the GUI layer (out of that entry's engine-only
      scope) and, at the time, had no obvious validation method (this
      project's whole methodology leans on byte-for-byte oracle-diff
      against Pascal-produced WAV output, which visual/GUI state has no
      equivalent of - extending the visualizer without a way to check it
      would have repeated exactly the "unvalidatable busywork" concern
      MIG-0007 originally used to justify deferring Turbosound support at
      all). Implemented now per explicit user request to finish the
      visualizer's dual-chip support using the original Pascal's own
      approach (TVisPoint.R[0..1], not an approximation), with validation
      shifted to structural/unit-level correctness (see below) rather
      than a visual oracle-diff this project doesn't have.
    verification: >
      No visual oracle-diff harness exists in this project (tests/ only
      covers engine_smoke/oracle_diff/zexall, all PCM/CPU-state
      comparisons) - verified instead via:

      1. Full pre-existing regression suite re-run, unchanged: `cd
      engine && make` / `cd gui && make` both zero warnings, zero errors
      (-std=c11 -Wall -Wextra -Wpedantic); tests/engine_smoke's full
      suite passes (test_atari's one pre-existing, unrelated failure
      confirmed present identically on the unmodified master branch
      before this change, via `git stash`); tests/oracle_diff/run_diff.sh
      - including the ts_pair_pt3 dual-chip WAV-export scenario added by
      MIG-0109 - all 62 checks PASS, 0 FAIL, exit 0, confirming this
      struct/hot-path change has zero effect on audio output fidelity
      (ay_vis_point is embedded in the same ay_engine every format's
      make_buffer function shares, so a layout mistake here would have
      shown up as corruption across the whole suite, not just vis-related
      tests).

      2. Two new targeted unit tests added to tests/engine_smoke/test_ay.c:
      test_vis_dual_chip_capture programs chip and chip2 with distinct,
      recognizable register values and drives a real ay_synthesizer_
      stereo16 pass (the actual production call path, not a mock),
      confirming (a) with ts_mode=true, vis_points[0].r[1] genuinely
      holds chip2's own registers (not chip's, not zero), and (b) with
      ts_mode=false, r[1] stays untouched/zeroed - reproducing FillVis's
      own `if TSMode` capture-time gate exactly.
      test_vis_calc_reads_ts_mode_at_get_time hand-constructs raw vis
      points and calls ay_engine_get_vis_point with ts_mode false then
      true, confirming r[1] is left unprocessed in the first case and
      processed using ITS OWN register values (a distinct EnvP per slot,
      2 vs 5, producing distinguishable post-Calc tn_a values 32 vs 80)
      in the second - proving the ts_mode check genuinely happens at
      GET/display time, not baked in at capture time, matching
      AYVisualisation's own live-global read.

      Both new tests, plus the full existing test_ay.c suite, PASS.

  - id: MIG-0111
    title: "GetTimeXXX oracle validation for the 12 remaining tracker formats (MIG-0103/MIG-0104's own duration precompute, never before checked against the real Pascal output) - found and fixed a real bug in pt3_get_time along the way"
    subsystem: "engine/formats (pt1,pt2,gtr,fls,stc,stp,fxm,psm,asc,ftc,psc,sqt,pt3), tests/oracle_diff"
    state: validated
    summary: >
      MIG-0103/MIG-0104 ported each of 12 tracker formats' own GetTimeXXX
      duration-precompute into engine/, and player_get_tick_position/
      player_real_end_all (see engine/include/ay_engine/player.h) read
      the resulting global_tick_max/loop_tick fields for real seeking
      and natural end-of-song for all 18 formats - but only PT3's own
      GetTimePT3 port (MIG-0101) had ever been cross-checked against the
      real Pascal oracle for an exact tick-count match (one file,
      manually, at the time). The other 12 formats' computed durations
      were only confirmed non-zero (identify_ay_file's IntegrityCheck)
      or indirectly exercised via byte-identical AUDIO (wav_export,
      which drives the SAME tick loop but never calls GetTimeXXX's own
      separate, audio-independent precompute pass at all) - i.e. the
      actual duration NUMBER had never been checked.

      Added a `get_time` scenario to tests/oracle_diff/dump_engine_
      state.c: loads a file through the same format-specific loader the
      file's other run_*_file scenarios already use, then prints
      `time=<global_tick_max>\nloop=<loop_tick>\n` - the exact text
      format ay_emul/OracleHarness.pas's pre-existing (but previously
      unused for this purpose) RunGetTimeTest/`get_time` oracle scenario
      already writes, so the two can be text-diffed directly. Wired into
      run_diff.sh, sweeping EVERY matching file in test_corpus_76 (not
      just one per format) through both sides.

      That full-corpus sweep (55 files across all 14 tracker formats
      including PT3) initially found ONE real mismatch:
      DIABOLIS_IN_MUSICA.pt3 - oracle time=5748, engine time=5562 (a
      single-file sample of 1 file didn't catch it; the sweep across
      all corpus files of each format did). Root-caused against
      Players.pas:15613-15662 (GetTimePT3's own body, not the nested
      PatInt this port's pt3_time_channel_step already faithfully
      mirrors): TWO real, separate divergences found in pt3_get_time
      (engine/src/formats/pt3_file.c):

      1. `a11`/`a22`/`a33` (voice 0's per-channel note-length "step
      size", set by pattern opcode $B1 and otherwise carried forward
      from whichever note most recently set it) were declared/reset to
      1 INSIDE the per-position loop in this port. Players.pas instead
      initializes them exactly ONCE, in a `for i := 0 to 1 do with
      vars[i] do begin a11:=1;a22:=1;a33:=1; end` loop that runs BEFORE
      the position loop even starts, and never touches them again per-
      position (only `with vars[0] do begin a1:=1;a2:=1;a3:=1; end` - a
      DIFFERENT trio, the row countdown, not the step size - resets per
      position). Resetting a11/a22/a33 every position silently discards
      any step-size set by the previous position's last note whenever a
      new position's own first note doesn't immediately re-issue $B1 -
      exactly DIABOLIS_IN_MUSICA.pt3's case. voice 1's own copies
      (a11b/a22b/a33b, used only when ts_mode) already had this right,
      making the asymmetry easy to spot once found.

      2. `DLCatcher` (this port's `dl_catcher`) is a SINGLE scalar in
      Players.pas's own var block, initialized once (also inside that
      same once-only pre-position-loop `for i := 0 to 1` block, which
      only reaches it because Pascal's `with vars[i] do` silently falls
      through to the outer-scope DLCatcher - it isn't a field of
      vars[i]'s record type) and never reset again - a safety budget
      spanning the WHOLE song's total row count, not a per-position
      allowance. This port instead reset it to a fresh 65536 at the
      start of every position, silently granting far more budget than
      the original ever would; a pathological file that should trip
      Players.pas's RaiseBadFileStructure might never trip this port's
      equivalent. Not observed to affect any real corpus file (no file
      is remotely close to 65536 total rows), but a real, disclosed
      divergence from the original's own safety-net behavior, fixed
      alongside bug 1 since both were found in the same code region
      during the same investigation.

      Fix: moved a11/a22/a33's declaration out of the per-position loop
      (now initialized once, alongside dl_catcher and voice 1's already-
      correct a11b/a22b/a33b), and moved dl_catcher's declaration/init
      out of the per-position loop too, matching Players.pas's own
      once-only scope for both. Only a1/a2/a3 (voice 0's row countdown)
      and pat/j1/j2/j3/j1b/j2b/j3b (per-position pattern pointers)
      remain declared inside the position loop, matching Players.pas
      exactly.

      Also fixed two stale doc comments discovered while investigating
      this (engine/include/ay_engine/player.h's player_get_tick_
      position/player_real_end_all, gui/include/gui/playback.h's
      gui_playback_duration_seconds) that still said tick-position/
