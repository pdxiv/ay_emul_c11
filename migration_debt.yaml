    summary: >
      Items 3 and 5 (minus process priority, correctly declined earlier
      as Windows-only in the real Pascal - see this same request's own
      item-5 note) of the 5-item Mixer/Tools/Playlist parity request
      that MIG-0120/MIG-0121 also cover (see their own summaries for
      the shared background). A first background-agent attempt at this
      pair of items hit the session's API usage limit before producing
      any real implementation and was abandoned; this entry is the
      retry, done by a second background agent (isolated git worktree)
      whose actual file output turned out to be substantial, real, and
      well-cited (its own prior self-report during the session had
      wrongly suggested otherwise) - reviewed in full, built and run
      standalone inside its own worktree first to confirm correctness
      against the base commit, THEN manually re-merged file by file
      into the current main tree (which had diverged from that
      worktree's stale base in mainwin.h/.c and tools_win.h/.c - MIG-
      0114's Force_Loop checkbox, MIG-0119's 2x window scaling, and
      MIG-0120/MIG-0121's own same-session work), not applied as a raw
      diff.

      New gui/alsa_mixer.h/.c: a from-scratch wrapper directly over
      ALSA's simple-mixer API (snd_mixer_open/attach/selem_register/
      load/find_selem/get+set_playback_volume) - before this entry,
      zero snd_mixer_* code existed anywhere in this codebase (a
      genuinely different ALSA API family from tools/ay_player/src/
      alsa_output.c's snd_pcm_* PCM-playback code). Implements
      MainWin.pas's SetSysVolume/GetSysVolume's exact two curves
      (linear passthrough, or logarithmic `(exp(v)-1)/(exp(1)-1)`) for
      mapping the skinned slider's [0,1] onto the real hardware
      control's min..max range. Platform substitution, documented not
      silent (same standard as MIG-0073's own tray-icon substitution):
      mixerctl.pas's own Windows-mixerLine-shaped 3-level device/
      subdevice/control picker (BVolCtrlSelect's own dialog) has no
      ALSA equivalent (a simple mixer's controls are just a flat list)
      - replaced with a flat GtkComboBoxText of every control that
      actually has a playback-volume range, plus a "Detect" button
      (BVolCtrlDetectClick's own Master/PCM/first-found preference
      order, closing that function's own `//todo real detect` comment
      in the real Pascal source).

      New gui/settings.h/.c: a minimal, generic settings-persistence
      layer over GLib's own GKeyFile (already available transitively
      via GTK2), replacing options.pas's bespoke `Name=Value` reader/
      writer for JUST the keys this entry's own features need (window
      geometry, tray mode, system-mixer selection/volume) - NOT a full
      port of the original's ~80-key SaveParams surface, which stays
      explicitly out of scope. File lives at $XDG_CONFIG_HOME/
      ay_emul_c11/settings.ini (GLib's own g_get_user_config_dir,
      matching GetAppConfigDirUTF8's Linux branch); the original's
      "next to the executable" fallback branch is not replicated (a
      packaged install's executable directory is typically read-only).

      gui/mainwin.h/.c gained: `sysvol`/`sysvol_linear`/
      `auto_save_volume_pos`/`auto_save_windows_pos`/`tray_mode`
      fields; `gui_mainwin_sysvol_reopen` (Mixer.pas: OpenMixer ->
      GetSysVolume -> RedrawVolume chain), `gui_mainwin_set_sysvol_
      linear` (CBLnScaleClick), `gui_mainwin_set_tray_mode` (Set_
      TrayMode2, MainWin.pas:4985-5012 - narrowed to this port's
      already-shipped MIG-0073 GtkStatusIcon, no separate taskbar-
      button concept to toggle alongside it), and `gui_mainwin_save_
      settings` (SaveParams's window-geometry/tray-mode/volume
      subset, hooked from BOTH the skinned close button - the
      window's only realistic close path, since it's undecorated -
      AND a new "delete-event" handler as a safety net for any other
      WM-initiated close, AND gui/src/main.c's post-gtk_main()
      fallback, so no real close path loses settings). `apply_volume`
      centralizes every vol_slider mutator (press/drag/scroll/keyboard
      up-down) to push to BOTH the pre-existing in-app PCM-scale path
      and, new here, the real ALSA hardware mixer if one is open -
      side by side, neither replacing the other (MoveVol IS the real
      system-mixer control in the original; gui_playback_set_volume's
      own PCM scaling was always a documented scope-narrowing
      substitute for it, not a faithful port of MoveVol's own role).
      A saved TrayMode default of 2 ("always") is used instead of the
      real Pascal default of 0 ("never") - a DELIBERATE deviation
      (not an oversight): this port's own pre-existing tray icon has
      always shown unconditionally, so a literal default-0 port would
      silently regress every existing user's tray icon away on their
      very next launch before they ever visit Tools to notice.

      gui/tools_win.h/.c gained the VolumeSheet tab (current-control
      label, ALSA-flat-list combo + Detect button, linear-scale
