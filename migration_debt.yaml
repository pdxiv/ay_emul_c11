# Machine-checkable migration-debt ledger for the ay_emul -> C11 port.
#
# Per this workspace's global LLM-porting invariants: every stub, TODO,
# omitted branch, or approximated behavior must be recorded here with a
# MIG-#### id, not silently implied. States:
#   translated             - mechanically ported and compiles
#   behaviorally_incomplete - runs, but known behavior is missing/approximated
#   validated               - behavior checked with tests, differential
#                             checks, or documented manual verification
#
# This file should be updated as work proceeds. An item may only move to
# `validated` with a concrete verification method recorded against it.

schema_version: 1

entries:
  - id: MIG-0001
    title: "Z80 IM0/IM1 interrupt-acceptance timing improves on the original"
    subsystem: engine/z80_bus
    state: validated
    summary: >
      The live (actually-compiled) Z80.pas core (Z80.pas:21027-21045;
      the {$ifdef Z80Emu_ASM} copy at Z80.pas:10810-10852 is dead code,
      see tests/zexall/FIDELITY_GATE.md) collapses IM0 and IM1 into a single
      hardcoded 12 T-state RST $38, and never models true IM0
      arbitrary-instruction-from-data-bus execution. superzazu/z80
      implements real IM0 (via z80_gen_int(z, data)) and a real 13 T-state
      IM1. This port uses superzazu/z80's accurate timing rather than
      reproducing the original's simplification.
    rationale: >
      Decided intentional improvement, not a gap: Players.pas only ever
      drives this core in IM1-equivalent mode for the in-scope ZX/CPC AY
      machines (confirmed by exploration of Players.pas's Z80/AY
      orchestration - no in-scope format uses IM0). Recording this so the
      1-T-state timing difference from the original Pascal binary is never
      mistaken for an unverified regression during later differential
      testing against that binary.
    verification: >
      Confirmed by direct source comparison (Z80.pas:21027-21045 vs
      superzazu/z80's z80.c interrupt handling) plus superzazu/z80 passing
      ZEXALL/ZEXDOC (tests/zexall/FIDELITY_GATE.md), which exercise
      interrupt-adjacent timing extensively. No live differential harness
      against a built Ay_Emul binary was required for this specific item.

  - id: MIG-0002
    title: "Fidelity-gate risk re-scoped: PORTING_TO_C11_LINUX.md §3.1's asm-block risk does not apply to the shipping Linux binary"
    subsystem: engine/z80_bus
    state: validated
    summary: >
      PORTING_TO_C11_LINUX.md §3.1 frames Z80.pas's 238 inline x86 asm blocks
      (real-EFLAGS-derived undocumented flags) as the port's single highest
      technical risk. Direct inspection shows this entire code path is gated
      by {$ifdef Z80Emu_ASM}, which is never defined anywhere in this
      checkout (Ay_Emul.lpi, Ay_Emul.lpr, Z80.pas itself) - it is dead code
      in every buildable configuration. The live {$else Z80Emu_noASM} branch
      (Z80.pas:10854-22052) has its own small asm-helper set
      (Z80.pas:10869-10983) additionally gated by {$ifdef debugz80}, also
      never defined - also dead. The actual live undocumented-flag logic is
      plain Pascal bit arithmetic mirroring result bits 3/5 into XF/YF
      (e.g. Z80.pas:11296, :11655), the same standard algorithm
      superzazu/z80 implements.
    rationale: >
      Not a debt to resolve - a correction to the risk assessment recorded
      here so future sessions don't re-derive it or assume the asm needs
      individual hand-verification. See
      tests/zexall/FIDELITY_GATE.md for full detail.
    verification: >
      Direct source read of Z80.pas's conditional-compilation guards and
      grep for both {$define Z80Emu_ASM} and {$define debugz80} across the
      whole ay_emul submodule (zero hits for either). Corroborated by
      superzazu/z80 passing ZEXALL/ZEXDOC with zero cycle-count diff
      (tests/zexall/FIDELITY_GATE.md).

  - id: MIG-0003
    title: "AY port-decode protocols limited to ZX and CPC variants"
    subsystem: engine/z80_bus
    state: validated
    summary: >
      engine/z80_bus.c implements only the two AY port-decode protocols
      Z80.pas's live code implements (ZX-style $FFFD/$BFFD port decode and
      CPC-style PPI/PSG-select protocol via ports $F4/$F6), matching
      Z80.pas:10986-11113 (live noASM copy) exactly - not a narrowing, this
      is the full set the original supports.
    rationale: >
      Confirmed complete and correct against the original, not just
      internally consistent.
    verification: >
      tests/oracle_diff/run_diff.sh drives the SAME synthetic ZX and CPC
      OUT (C),A instruction sequences through both the real Z80.pas/AY.pas
      (via ay_emul/OracleHarness.pas, an optional diagnostic entry point
      added and committed to the submodule's own local git history for
      exactly this purpose) and engine/z80_bus.c + engine/ay.c, and
      byte-compares the resulting AY register state. Both the "zx" and
      "cpc" scenarios pass with identical register values.

