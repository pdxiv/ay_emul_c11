  - id: MIG-0079
    title: "Phase 5 continuation: real seeking, ported using the SAME algorithm as Players.pas's RerollMusic (decode-and-discard forward, reload-and-redecode-from-zero if seeking backward) - scoped to AY/YM/VTX, the only formats with a known fixed duration in this port's model"
    subsystem: engine/player, gui/playback, gui/mainwin
    state: validated
    summary: >
      Per the user's explicit direction to investigate and replicate the
      original's real seek algorithm rather than inventing a new one:
      read Players.pas's RerollMusic (14099-14283) directly. Confirmed
      it works exactly as this entry now ports it - for Z80-emulated/
      VTX/YM formats, seeking means decoding forward tick-by-tick
      (AY_Get_Registers / equivalent) while DISCARDING the audio,
      until Global_Tick_Counter reaches the target
      (`round(newpos/maxpos*Global_Tick_Max)`); if the target is BEHIND
      the current position, the original resets the chip and decodes
      forward from tick 0 instead, since chip/register state is
      inherently sequential and can't be un-advanced. The original also
      temporarily swaps in a lighter register-only "Converter" OutProc
      during the discard loop to skip full audio synthesis for speed -
      this port's player_make_buffer has no such fast-path mode, so the
      discard loop just calls the exact same function normal playback
      uses and throws away its output; end-of-loop chip state is
      identical either way, this is a CPU-optimization the original had
      and this port doesn't, not a correctness difference.

      engine/include/ay_engine/player.h gained player_get_tick_position()
      (the generic Global_Tick_Counter/Global_Tick_Max accessor,
      PlConsts[0] in the original) - investigation found only AY/YM/VTX
      structs actually carry a global_tick_max field; PT1/PT2/PT3/GTR/
      FLS/STC/STP/FXM each have a real declared song length in their own
      file format but computing it (e.g. PT3.pas's GetTimePT3) was
      already a separate, earlier, deliberate scope decision to skip
      ("UI-only, not needed [for audio correctness]" - pt3_file.h's own
      pre-existing comment, not revisited here); PSM/ASC/ASC0/FTC/PSC/
      SQT loop indefinitely via a position-based loop point with no
      fixed length at all; SNDH uses a separate Atari-VBL position model
      (MIG-0017).

      gui/include/gui/playback.h gained seek_requested/seek_target_tick
      (atomics, GTK thread writes/playback thread reads-and-clears - see
      its own comment on why seeking must happen on the playback thread,
      never concurrently with normal decode), gui_playback_request_seek()
      (non-blocking - just sets the atomics) and gui_playback_
      get_progress_fraction() (true+real fraction for AY/YM/VTX, false
      otherwise). gui/src/playback.c's do_seek() is the actual C11 port
      of RerollMusic's algorithm; a new load_player_bytes() helper
      (extracted from gui_playback_load_song, now shared) handles the
      backward-seek reload path without touching the already-open ALSA
      device. gui/src/mainwin.c's progress slider (MoveProgr) is now
      draggable when gui_playback_get_progress_fraction succeeds -
      button-press/motion/release request live seeks during the drag,
      same live-scrub UX as the volume slider; on_timer shows the real
      fraction instead of the old cosmetic sweep for these three formats
      (every other format keeps the pre-existing cosmetic sweep,
      unchanged).
    rationale: >
      The user explicitly asked to replicate the original's real
      algorithm rather than a novel approach, which is why this entry
      exists and reads the way it does - RerollMusic's own logic was
      read directly from source, not inferred or guessed, and the C11
      port mirrors its forward/backward branching exactly, differing
      only in the documented CPU-optimization gap noted above (no
      register-only fast-decode mode). JmpTime.lfm's own dialog
      (minutes:seconds entry) is NOT wired to this in this entry - real
      time-based seeking needs a per-format ticks-to-seconds conversion
      this port doesn't uniformly have yet (AY/YM/VTX each derive actual
      playback speed from format-specific clock/interrupt-frequency
      fields); the fraction-based progress-slider seek implemented here
      doesn't need that conversion at all (it only ever computes
      target_tick = fraction * Global_Tick_Max), which is why it was
      the tractable piece to land first. Left as a clearly separate,
      not-yet-done follow-up, not silently conflated with this entry.
    verification: >
      `cd engine && make` and `cd gui && make` both clean (zero new
      warnings). A real, non-hypothetical bug was caught and fixed
      during testing: the playback thread's seek-request handling
      originally did `if (seek_requested) { do_seek(); store(false); }`
      - if the GTK thread requested a SECOND seek while do_seek() was
      still executing the FIRST (a real scenario: a single full-song
      forward seek measured at ~1.35s wall-clock for a ~123-second
      song, well within one user drag gesture), the unconditional
      `store(false)` after the first seek finished would silently
      discard the second request. Reproduced directly (two seek
      requests 300ms apart landed at unexpected intermediate positions,
      confirming the second was being dropped mid-flight) and fixed by
      switching to `atomic_exchange` to consume the request before
      do_seek runs, so a fresher request arriving during a seek survives
      to the next loop iteration. After the fix, standalone tests
      against test_corpus_76/MetalMania.ay confirmed: forward seek to
      80% landed at 80.9% (small chunked-decode overshoot, expected -
      see do_seek's own comment); backward seek to 10% correctly
      triggered a full reload-from-zero and landed at 11.6%; normal
      playback resumed and continued advancing forward afterward
      (confirmed via a further 500ms of real-time playback moving the
      position further forward, not stuck or reset). Full regression
      suite re-confirmed clean: run_diff.sh 60/60; corpus_wav_md5_
      sweep.sh 75/0/1-known/0; tools/ay_player/smoke_test.sh full pass
      (this entry touches no existing decoder dispatch path - purely
      additive new functions/fields). 10/10 repeat full-app runs clean
      under `timeout`; screenshot confirms the main window (including
      the now-interactive progress slider's unchanged visual
      appearance) renders correctly.

