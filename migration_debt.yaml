  - id: MIG-0087
    title: "Phase 5: player_set_chip_freq/player_set_player_freq - live AY-chip-clock and VBL/interrupt-frequency override plumbing (MainWin.pas's Set_Chip_Frq/Set_Player_Frq), promoted to the shared player API for ItemEdit.pas's per-item frequency overrides (MIG-0088) to use"
    subsystem: engine/player, engine/vtx_file
    state: validated
    summary: >
      Added player_set_chip_freq(player*, int ay_freq, int sample_rate)
      and player_set_player_freq(player*, int freq_hz_x1000) to
      engine/include/ay_engine/player.h + engine/src/player.c,
      generalizing MainWin.pas's Set_Chip_Frq/Set_Player_Frq across
      every format that has the relevant concept - confirmed via the
      same AY/YM/VTX (duration) and YM/VTX (interrupt_freq) scope
      boundary already established by MIG-0079/0080:
       - player_set_chip_freq recomputes ay_engine's universal
         delay_in_tiks/tik_re for every format, plus AY's own
         frq_ay_by_frq_z80 recompute (reusing the same arithmetic
         ay_file_set_chip_freq already used for CPC-protocol
         auto-detect), and VTX/YM's respective ay_tiks_in_interrupt/
         ym6_tiks_on_int recompute (storing the new value in each
         file's own persistent ay_freq field, so a later re-computation
         has the right base value - this required adding a persistent
         `ay_freq` field to vtx_file.h/vtx_file.c, mirroring ym_file.h's
         existing field of the same name, since VTX previously only
         used this value transiently at load time).
       - player_set_player_freq updates YM/VTX's stored interrupt_freq
         (the same InterFrq*1000-scaled convention MIG-0080 already
         fixed once) and recomputes the corresponding "ticks per
         interrupt" derived field; a documented no-op for every other
         format (including AY, which has no interrupt_freq concept at
         all - MaxTStates/FrqZ80 govern its duration instead).
    rationale: >
      ItemEdit.pas's per-item AY-chip-frequency and interrupt/VBL-
      frequency overrides (Tier 2 of the approved "Tiers 1-3, full
      ItemEdit" scope) apply at actual playback time via exactly these
      two Pascal functions - reproducing the override behavior
      correctly requires the same underlying recompute this entry adds,
      not a simplified approximation.
    verification: >
      `cd engine && make` clean (-std=c11 -Wall -Wextra -Wpedantic, zero
      warnings). Full regression suite: tests/oracle_diff/run_diff.sh
      60/60; corpus_wav_md5_sweep.sh 75/0/1-known/0 (zero regressions,
      expected - these are new, unused-by-default functions no existing
      caller invokes). Standalone differential test
      (test_freq_override.c) confirmed real audible PCM output changes
      from player_set_chip_freq on AY/YM/VTX and from
      player_set_player_freq on YM/VTX, and correctly confirmed NO
      change from player_set_player_freq on AY (matching the documented
      no-op for formats without an interrupt_freq concept).

