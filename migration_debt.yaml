    rationale: >
      Closed - the algorithm itself has no GUI dependency even though its
      call sites live in MainWin.pas, confirmed by porting it as a pure
      function and validating against the original.
    verification: >
      tests/oracle_diff/run_diff.sh's "pcm_filtered" scenario passes:
      byte-identical filtered PCM output against ay_emul/OracleHarness.pas's
