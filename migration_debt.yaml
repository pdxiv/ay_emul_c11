      because TSMode/pairing hadn't landed yet at that time - now
      genuinely reachable, so un-excluded here), read on-demand in
      do_load_song (mainwin.c) right after a load, matching
      gui_mixer_win's own use_*_list checkboxes' established read-on-
      demand pattern rather than a live "toggled" push. Unit-tested in
      tests/engine_smoke/test_player_pair.c (2 new tests: direct
      force_loop=true/false behavior on stc_file_step_registers, and
      player_pair_set_force_loop reaching both pair sides) - all 5 tests
      in that file pass.

      Oracle expansion: following MIG-0113's own RunSTCPairWAVExportTest
      template exactly (same ~20-line Synthesizer_Stereo16/AY_Freq/
      Interrupt_Freq preamble, a nested InitVoice(var Module; CNum)
      procedure generalizing each format's existing single-voice
      RunXXXWAVExportTest PlParams[0] setup to PlParams[CNum] using
      Module.-prefixed fields instead of ZRAM., TSMode:=True, InitVoice
      called once per side with the SAME file data loaded into both ZRAM
      and RAM1 - matching this port's own confirmed same-file-twice
      real .ayl 'ts' pairing semantics), added 10 new
      RunXXXPairWAVExportTest procedures to OracleHarness.pas (PT1, GTR,
      FLS, STP, PT2, PSM, ASC, ASC0, FTC, PSC, SQT - ASC/ASC0 share one
      IsASC0-parametrized procedure, wired as two separate dispatch
      scenarios), each dispatched via a new '<fmt>_pair' scenario name.
      On the C side, added a DEFINE_PAIR_RUNNER macro in
      tests/oracle_diff/dump_engine_state.c instantiated once per format
      (run_pt1_pair, run_gtr_pair, ... run_sqt_pair), each driving the
      real production player_pair_load_song/player_pair_make_buffer path
      exactly like run_stc_pair already did, with the target format's own
      <FMT>_FILE_SAMPLE_RATE_DEF. 11 new gates added to
      tests/oracle_diff/run_diff.sh via a small pair_fmt() helper, one
      per format, each loading its existing wav_export_<fmt> gate's own
      corpus file into both pairing sides.
    rationale: >
      Force_Loop's real-world purpose only exists in a Turbosound-paired
      context (a mismatched-length pair's shorter voice going silent vs
      continuing to loop its own pattern audibly) - MIG-0112/MIG-0113
      landing pairing first is what made this checkbox genuinely
      reachable; porting it now (rather than leaving it excluded per
      MIG-0095's original, now-stale rationale) closes a real, requested
      behavioral gap rather than an already-out-of-scope one.

      The oracle expansion reused MIG-0113's own template mechanically
      (not hand-varied per format) specifically because MIG-0113 already
      established that every pairing-eligible format's chip-redirection
      code is generated by the same pattern - the risk MIG-0113's own
      debt list flagged ("a format-specific bug in exactly the external-
      chip-target code path... not zero") is what this entry directly
      retires for 10 of the remaining 12 formats.

      FXM was excluded, not merely deferred by oversight: Players.pas's
      FXM_StekA/B/C (Players.pas:824) are UNIT-LEVEL globals, not indexed
      by CNum - PatternInterpreter(PlParams[CNum].FXM_A, FXM_StekA)
      confirms the stek array itself is shared across whatever CNum is
      currently active, meaning a genuine dual-FXM Turbosound pair in the
      real Pascal has actual cross-voice stack corruption/interaction
      that this port's own per-instance fxm_file structs structurally
      cannot reproduce (each C11 instance owns independent stek storage).
      Bug-for-bug reproducing that shared-global aliasing was judged out
      of proportion to this entry's scope; FXM's own STANDALONE
      (non-paired) playback remains fully oracle-validated and unaffected
      - only FXM+FXM Turbosound pairing specifically has no oracle gate.
    verification: >
      Pascal oracle rebuilt clean via lazbuild (6395 lines compiled, 1
      warning - the same pre-existing benign "Comment level 2 found"
      notice, 0 errors). `cd engine && make clean && make` and `cd gui
      && make clean && make`: both zero warnings, zero errors
      (-std=c11 -Wall -Wextra[-Wpedantic]). dump_engine_state rebuilt
      clean with the same flags run_diff.sh itself uses.

      tests/oracle_diff/run_diff.sh: 129/129 PASS, 0 FAIL - includes all
      11 new gates (pt1_pair, gtr_pair, fls_pair, stp_pair, pt2_pair,
      psm_pair, asc_pair, asc0_pair, ftc_pair, psc_pair, sqt_pair), every
      one byte-identical between the Pascal oracle and
      player_pair_make_buffer on the first run (no bugs found this
      round - expected, since MIG-0113 already found and fixed the one
      shared-path bug, player_pair_make_buffer's missing number_of_tiks
      assignment, that every one of these formats would otherwise have
      hit identically).

      tests/oracle_diff/corpus_wav_md5_sweep.sh: 70 passed, 0 failed (3
      known-non-identical, all pre-existing/unrelated; 2 skipped, the
      pre-existing non-audio .ayl fixtures).

      tests/engine_smoke/test_player_pair: all 5 tests pass, including
      the 2 new Force_Loop-specific tests.

      tests/gui_smoke/test_playlist_ayl: both tests pass unchanged.
    debt:
      - "OUT OF SCOPE (decided after explicit investigation, post-
        MIG-0114): FXM+FXM Turbosound pairing's cross-voice stack
        aliasing has no oracle gate and will not be pursued. Investigated
        in follow-up discussion after this entry landed - findings kept
        here for whoever next touches FXM or Turbosound pairing:

        Mechanism (PatternInterpreter, Players.pas:11800-11958):
        FXM_StekA/B/C is a per-channel push/pop stack used for pattern
        subroutine call/return ($81/$89), loop-counter/loop-end
        ($82/$83), and transposition save/restore ($8F/$90). Because the
        stack is a UNIT-LEVEL global (not indexed by CNum) while
        PlParams[CNum] and the pattern data it points into ARE per-CNum,
        a genuine dual-FXM Turbosound pair has each voice's channel A
        (resp. B, resp. C) push/popping the SAME physical stack. `$83`
        always operates on whatever is on TOP of the stack (`Dec(Stek[i-
        -2])`), trusting it's its own - if the other voice pushed
        in between, one voice corrupts the other's stack frame and vice
        versa. This is a real, unintentional bug in the original (not a
        deliberate mechanism), so there is no clean spec to port - only
        whatever memory-layout accident falls out of the exact
        interleaving.

        Audible effect (for whoever needs to explain or triage a user
        report of this): on the specific channel(s) where both paired
        files' patterns happen to use these opcodes in overlapping
        frames - (1) loop sections repeat the wrong number of times, or
        loop forever; (2) $89-return/loop-exit jumps to a bogus address
        in the SAME voice's own pattern buffer, causing the interpreter
        to read unrelated bytes as opcodes - garbled notes, sudden
        silence, or rapid nonsensical pitch changes; (3) transposition
        gets swapped between voices on push/pop, causing abrupt wrong-
        octave/pitch jumps. Entirely data-dependent - many real FXM
        pattern pairs may never trigger it at all (patterns that don't
        use call/loop/transposit-push in an overlapping window sound
        completely normal), so this is not audible on most content.

        Effort/impact assessment for a future revisit: medium
        implementation effort (fxm_channel's stek/stek_len would need to
        become pointer-based instead of owned, with player_pair detecting
        the both-sides-FXM case specifically and injecting one shared
        stek-triple - the only format needing this special case;
        call-order already matches Pascal's CNum-0-then-1 sequencing, no
        change needed there) but disproportionately high verification
        risk (unlike the other 10 pairing formats, which passed their new
        oracle gates byte-identical on the FIRST attempt because they had
        no shared mutable state to get subtly wrong, this one is
        reproducing an actual bug with no clean spec, so genuine debug
        iteration should be expected) and low practical payoff (a real
        dual-FXM Turbosound pair is a narrow corner case of an already-
        narrow format; no real test_corpus_76 file exercising it is known
        to exist - a synthetic fixture, similar to ts_pair_test.ayl,
        would need to be hand-authored first even to begin verifying it).
        Decision: not pursued. FXM's own STANDALONE (non-paired)
        playback remains fully oracle-validated and completely
        unaffected by this - only FXM+FXM Turbosound pairing specifically
        has no oracle gate."
      - "Force_Loop's GUI checkbox was verified by direct code
        inspection and the engine-level unit tests above, not by
        interactive testing in a running ay_emul_gui with a real
        mismatched-length paired file and audible confirmation - no
        display server was available in this session's environment
        (same pre-existing limitation MIG-0112/MIG-0113 already
        recorded for GUI-level pairing testing generally)."

  - id: MIG-0115
    title: "MIG-0057's last open followup, closed: audited all 13 tracker-format loaders' amplitude values against ay_chip_set_ay_register_fast's lack of masking - every one provably bounded to 0-31, mixer-level mask confirmed a pure backstop"
    subsystem: "engine/src/formats/*"
    state: validated
    summary: >
      MIG-0057's digidrum investigation found that ay_chip_set_ay_
      register_fast (the hot-path write function all 13 tracker-format
      loaders call directly for registers 8/9/10) does NOT mask its
      input to 5 bits, unlike ay_chip_set_ay_register (the "safe" path).
      A defensive `& 0x0F` mask was added at the mixer's actual
      level-table array-index read sites (engine/src/hw/ay.c) as a
      backstop, confirmed to change nothing for the one file under
      investigation at the time - but whether each format's OWN
      amplitude values are actually always pre-bounded was explicitly
      left as an open followup, not exhaustively checked format-by-
      format. This entry closes it via direct source trace of all 13:
      PT1, PT2, PT3, STC, STP, GTR, FLS, PSM, PSC, SQT, FTC, ASC, FXM
      (VTX and YM were not in scope - both already mask inline at every
      call site with literal `& 15`/`& 31`, confirmed by inspection,
      not part of the original open item since it named "the tracker-
      format loaders" specifically).

      Per-format finding (register 8/9/10 write value, always via
      `chan->amplitude`, traced back to its full derivation):
      - PT1, PT2, FTC: `round_div256((volume*17 + adj) * factor)` with
        volume clamped to the opcode's own bounded range (e.g. PT1/PT2:
        `op - 0x10`-style branches restricted to a 16-value opcode
        window) and factor always a nibble (`& 15` or `>>4` of a byte).
        Proved round_div256 itself cannot round the max product (3840)
        up past 15 - the only way to reach quotient+1 requires numerator
        > 4088. Optional `|16` envelope bit after -> 0-31.
      - PT3: volume indexes into PT3_VOL_33_34/PT3_VOL_35 (both `[16][16]`
        tables, every entry visually confirmed <= 0x0F), with both the
        volume index (opcode-bounded, `op - 0xC0` in a 15-value window)
        and the amplitude index (explicitly clamped to 0-15 by an
        int8_t-sign check + `> 15` clamp before the lookup) bounded.
        Optional `|16` after -> 0-31.
      - STC, FLS: amplitude assigned directly as `sample_byte & 15`
        (unconditionally masked at the point of assignment), optional
        `|16` after -> 0-31.
      - GTR, STP: `amp = (sample_byte_nibble - volume)`, clamped to 0 if
        the subtraction goes negative (`(int8_t)amp < 0` check), THEN
        explicitly `& 0xF`-masked (GTR) or already bounded by the
        subtraction's own small range (STP, volume provably <= 14 from
        its opcode window) - either way 0-15 before the optional `|16`.
      - PSC: `((volume+1) * sample_nibble) >> 4` with volume explicitly
        clamped to [0,15] by the format's own volume-slide logic just
        above - max (16*15)>>4=15. Optional `|16` after -> 0-31.
      - PSM: `(sample_byte & 15)`, optional `|16`, THEN a further
        `+ vol_cnt - 15` adjustment (vol_cnt explicitly clamped to
        [0,15] elsewhere in the same file) - traced the full arithmetic
        range: minimum -15 (caught by the subsequent `(int8_t)amplitude
        < 0` clamp to 0), maximum exactly 31 (16+15-15+... only reachable
        when the envelope-bit-set branch's max 31 combines with vol_cnt
        =15, netting +0) - never exceeds 31.
      - SQT: `amplitude = sample_nibble`, then optionally `- volume`
        (clamped to 0 if negative) OR set to exactly 16 in a separate
        branch - always 0-16, well within 0-31.
      - ASC: a sliding `addition_to_amplitude` accumulator explicitly
        clamped to [0,15] before being scaled by `(volume+1)>>4` (volume
        itself opcode-bounded to [0,15]) - max (15*16)>>4=15. Optional
        `|0x10` after -> 0-31.
      - FXM: `chan->volume & 15` - unconditionally masked at the point
        of assignment, 0-15, no envelope bit ever ORed in for this
        format (confirmed: no `|16`/`|0x10` site touches FXM's
        amplitude anywhere in the file).
      Every one of the 13 either masks/clamps explicitly at the write
      site, or is provably bounded by an arithmetic argument traced back
      to an opcode-restricted source value - none rely on the mixer-
      level mask to stay in range during correct operation.
    rationale: >
      Closes MIG-0057's own explicitly-flagged gap rather than leaving
      it open indefinitely - the audit was mechanical and low-risk (pure
      read-only source tracing, no behavior changed), and directly
      answers the question the original entry raised: yes, the
      mixer-level `& 0x0F` mask genuinely is "just" a backstop for
      these 13 formats as they exist today, not silently compensating
      for a live bug. This also matches the same conclusion MIG-0057
      independently reached for the one path it DID trace by hand
      (register 8 via ay_chip_set_ay_register, for digitune1.ay) -
      this entry generalizes that same finding to all 13 formats'
      fast-path writes.
    verification: >
      Read-only source audit, no code changed - engine/ build and full
      regression suite unaffected (nothing to re-run; this entry adds no
      new code path). Each format's bound is either a direct masking
      operation (grep-confirmed at the exact write site) or a traced
      arithmetic chain terminating at an opcode-window-restricted source
      value, cited by file and line above. PT3's volume tables were
      visually inspected in full (32 rows total across both tables, 16
      entries each) to confirm no entry exceeds 0x0F.
    debt: []

  - id: MIG-0120
    title: "Mixer.pas: live Atari MFP/Z80/68000 clock-override UI (GBZ80Frq/GBMCFrq/GBMFPFrq) wired to new player_set/get_frq_z80/mc68000_freq/mfp_freq engine accessors"
    subsystem: "engine/player, engine/hw/atari_emulate, engine/hw/mfp, gui/mixer_win, gui/mainwin"
    state: translated
    summary: >
      User asked for the 5 items identified by the earlier Mixer/Tools/
      Playlist GUI parity research pass to be implemented "just as they
      were implemented in the pascal version of the codebase". This
      entry covers item 1: Mixer.pas's GBZ80Frq/GBMCFrq/GBMFPFrq
      GroupBoxes (RBZ80FrqZX/RBZ80FrqPnt/RBZ80FrqOther/EZ80FrqOther,
      RBMCFrqST/RBMCFrqOther/EMCFrqOther, RBMFPFrq1613/RBMFPFrqST/
      RBMFPFrqOther/EMFPFrqOther, plus each GroupBox's own EXxxFrqCur
      read-only current-value label), a load-time-only Z80 clock
      override (AY-only, MainWin.pas's Set_Z80Frqs family), a
      load-time-only 68000 clock override (SNDH-only,
      atari_emulate_set_mc68000_freq/MainWin.pas:1636-1650), and a
      load-time-only MFP timer frequency override (SNDH-only, mode 0
      "Auto"=16/13 formula or mode 1 "Manual" with the real
      [1000000,4365292] range validation, atari_emulate_set_mfp_freq/
      MainWin.pas:1563-1585).

      New engine surface: player_set_frq_z80/player_get_frq_z80 (AY-
      only, no-op/0 for every other format), player_set_mc68000_freq/
      player_get_mc68000_freq and player_set_mfp_freq/
      player_get_mfp_freq (SNDH-only, no-op/0.0 for every other
      format) in engine/player.h/.c, dispatching to the new
      atari_emulate_set_mc68000_freq/atari_emulate_set_mfp_freq
      (engine/hw/atari_emulate.h/.c) - both load-time-only, matching
