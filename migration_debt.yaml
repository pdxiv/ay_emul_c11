      amplitude sliders were built with gtk_vscale_new_with_range
      (vertical, "max at the top") even though real Mixer.lfm's
      TBAmpAL/etc are genuine HORIZONTAL TTrackBars (Width=146 Height=21,
      no Orientation override - trHorizontal is TTrackBar's own
      default). This predates MIG-0131 (the vertical-slider code and its
      own "TTrackBar-like" comment were already there before this entry
      touched GBChAmp) - this entry's own verification pass checked
      captions/values/live-reactivity but never checked orientation
      against the .lfm directly, so it didn't catch a mistake that
      predated it. Fixed: make_channel_slider rewritten to build one
      horizontal row per channel ([label][hscale, expands][entry]) via
      gtk_hscale_new_with_range, and GBChAmp's own container changed
